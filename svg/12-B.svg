<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Winter Night -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#12182b"/>
      <stop offset="100%" stop-color="#1e1830"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients for Hippo and Magic -->
    <linearGradient id="hippoBody" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#8471a3"/>
      <stop offset="60%" stop-color="#5d4c78"/>
      <stop offset="100%" stop-color="#3d2e54"/>
    </linearGradient>

    <linearGradient id="hippoBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5db"/>
      <stop offset="100%" stop-color="#8471a3"/>
    </linearGradient>

    <linearGradient id="iceFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e294b"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Dynamic Party Neon Aurora Beams -->
  <path d="M0 60 Q150 10 300 70 T512 40 L512 0 L0 0 Z" fill="#00ffff" opacity="0.14"/>
  <path d="M0 110 Q180 140 360 80 T512 120 L512 0 L0 0 Z" fill="#ff00ff" opacity="0.12"/>

  <!-- Falling Snowflakes & Sparkles (Polished depth) -->
  <g fill="#ffffff">
    <circle cx="50" cy="70" r="3" opacity="0.9"/>
    <circle cx="110" cy="30" r="2" opacity="0.7"/>
    <circle cx="190" cy="100" r="4" opacity="0.9"/>
    <circle cx="280" cy="50" r="2.5" opacity="0.8"/>
    <circle cx="390" cy="40" r="3.5" opacity="0.9"/>
    <circle cx="460" cy="110" r="2" opacity="0.6"/>
    <circle cx="70" cy="170" r="2.5" opacity="0.8"/>
    <circle cx="140" cy="210" r="3" opacity="0.9"/>
    <circle cx="370" cy="180" r="3.5" opacity="0.8"/>
    <circle cx="440" cy="230" r="2.5" opacity="0.7"/>
    <circle cx="90" cy="320" r="2" opacity="0.7"/>
    <circle cx="430" cy="350" r="3" opacity="0.8"/>
  </g>

  <!-- Winter Stage / Ice Floor -->
  <path d="M0 390 L512 360 L512 512 L0 512 Z" fill="url(#iceFloor)"/>
  <!-- Stage Neon Rim Lights -->
  <path d="M0 390 L512 360" stroke="#00ffff" stroke-width="3.5" filter="url(#neonGlow)" opacity="0.95"/>
  <path d="M0 394 L512 364" stroke="#ff00ff" stroke-width="2" opacity="0.8"/>

  <!-- Thick Layered Snowdrifts -->
  <path d="M-10 415 Q70 385 170 410 T390 400 Q460 390 520 405 L520 512 L-10 512 Z" fill="#f1f5f9" opacity="0.22"/>
  <path d="M-10 440 Q100 420 220 440 T440 430 Q480 425 520 435 L520 512 L-10 512 Z" fill="#ffffff" opacity="0.28"/>

  <!-- BACKDROP NEON MAGIC PORTAL / RINGS -->
  <ellipse cx="270" cy="255" rx="140" ry="140" fill="none" stroke="#ff00aa" stroke-width="4" stroke-dasharray="14 8" filter="url(#neonGlow)" opacity="0.8"/>
  <ellipse cx="270" cy="255" rx="165" ry="165" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#neonGlow)" opacity="0.6"/>

  <!-- HIPPO CHARACTER (Hero Subject - >40% frame) -->
  <g transform="translate(40, 35)">
    <!-- Deep Cast Shadow on Ice -->
    <ellipse cx="230" cy="360" rx="115" ry="26" fill="#03050a" opacity="0.85"/>

    <!-- Hippo Body -->
    <path d="M140 220 C110 220 90 250 95 300 C100 350 140 375 230 375 C320 375 360 350 365 300 C370 250 350 220 320 220 Z" fill="url(#hippoBody)" stroke="#1a1226" stroke-width="4"/>
    <!-- Belly Patch -->
    <ellipse cx="230" cy="315" rx="88" ry="52" fill="url(#hippoBelly)" opacity="0.9"/>

    <!-- Magician Cape / Coat with Neon Trim -->
    <path d="M110 245 L155 370 L95 375 Z" fill="#0f172a" stroke="#ff00ff" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <path d="M350 245 L305 370 L365 375 Z" fill="#0f172a" stroke="#00ffff" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <path d="M140 235 L320 235 L305 275 L155 275 Z" fill="#dc2626" stroke="#fef08a" stroke-width="2"/> <!-- Red cape collar -->

    <!-- Hippo Head -->
    <g transform="translate(230, 185)">
      <!-- Ears -->
      <ellipse cx="-65" cy="-35" rx="16" ry="22" fill="#5d4c78" stroke="#1a1226" stroke-width="3" transform="rotate(-20 -65 -35)"/>
      <ellipse cx="65" cy="-35" rx="16" ry="22" fill="#5d4c78" stroke="#1a1226" stroke-width="3" transform="rotate(20 65 -35)"/>
      <ellipse cx="-65" cy="-35" rx="8" ry="12" fill="#fbcfe8" transform="rotate(-20 -65 -35)"/>
      <ellipse cx="65" cy="-35" rx="8" ry="12" fill="#fbcfe8" transform="rotate(20 65 -35)"/>

      <!-- Head Base / Snout -->
      <rect x="-85" y="-45" width="170" height="95" rx="45" fill="url(#hippoBody)" stroke="#1a1226" stroke-width="4"/>
      <!-- Massive Snout -->
      <path d="M-75 -5 C-75 35 -40 55 0 55 C40 55 75 35 75 -5 C75 25 40 45 0 45 C-40 45 -75 25 -75 -5 Z" fill="#8471a3" stroke="#1a1226" stroke-width="3"/>

      <!-- Nostrils -->
      <ellipse cx="-25" cy="15" rx="8" ry="5" fill="#2b1f3d"/>
      <ellipse cx="25" cy="15" rx="8" ry="5" fill="#2b1f3d"/>

      <!-- Cheeks & Cute Sparkle Eyes -->
      <circle cx="-45" cy="-15" r="7.5" fill="#0f172a"/>
      <circle cx="45" cy="-15" r="7.5" fill="#0f172a"/>
      <circle cx="-43" cy="-17" r="3" fill="#ffffff"/>
      <circle cx="47" cy="-17" r="3" fill="#ffffff"/>

      <!-- Rosy Cheeks -->
      <ellipse cx="-52" cy="0" rx="10" ry="6" fill="#f472b6" opacity="0.75"/>
      <ellipse cx="52" cy="0" rx="10" ry="6" fill="#f472b6" opacity="0.75"/>

      <!-- Festive Winter Scarf with Patterns -->
      <path d="M-88 35 Q0 55 88 35 L85 68 Q0 88 -85 68 Z" fill="#ef4444" stroke="#fef08a" stroke-width="2.5"/>
      <path d="M30 55 L45 130 L75 125 L60 50 Z" fill="#ef4444" stroke="#fef08a" stroke-width="2.5"/> <!-- Scarf tail hanging -->
      <path d="M38 72 L68 67" stroke="#ffffff" stroke-width="3.5"/>
      <path d="M43 100 L73 95" stroke="#ffffff" stroke-width="3.5"/>
    </g>

    <!-- Magician Top Hat (Sitting on head) -->
    <g transform="translate(230, 110)">
      <!-- Brim -->
      <ellipse cx="0" cy="10" rx="88" ry="18" fill="#1e293b" stroke="#00ffff" stroke-width="2.5" filter="url(#subtleGlow)"/>
      <!-- Hat Cylinder -->
      <path d="M-58 10 L-48 -70 L48 -70 L58 10 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>
      <!-- Neon Hat Band -->
      <path d="M-53 -10 L53 -10 L51 3 L-51 3 Z" fill="#ff00ff" filter="url(#neonGlow)"/>
      <!-- Snowcap on Top Hat -->
      <path d="M-48 -70 Q0 -82 48 -70 Q30 -58 0 -63 Q-30 -58 -48 -70 Z" fill="#ffffff" filter="url(#subtleGlow)"/>
    </g>

    <!-- ARMS & MAGIC TRICK -->
    <!-- Left Arm holding Magic Wand -->
    <g transform="translate(130, 275)">
      <path d="M0 0 C-40 20 -50 60 -30 85 C-15 95 0 75 15 50 Z" fill="#5d4c78" stroke="#1a1226" stroke-width="3" transform="rotate(-30)"/>
      <!-- Magic Wand -->
      <line x1="-35" y1="70" x2="-95" y2="15" stroke="#fef08a" stroke-width="6.5" stroke-linecap="round" filter="url(#neonGlow)"/>
      <!-- Wand Tip Star / Neon Burst -->
      <g transform="translate(-100, 10)">
        <circle cx="0" cy="0" r="20" fill="#00ffff" opacity="0.45" filter="url(#neonGlow)"/>
        <path d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#ffff00" filter="url(#neonGlow)"/>
      </g>
    </g>

    <!-- Right Arm pointing / gesturing with Floating Cards -->
    <g transform="translate(330, 275)">
      <path d="M0 0 C40 20 50 60 30 85 C15 95 0 75 -15 50 Z" fill="#5d4c78" stroke="#1a1226" stroke-width="3" transform="rotate(30)"/>
    </g>
  </g>

  <!-- ENHANCED MAGIC EFFECTS: Summoning Glowing Winter Snowbunny & Sparkling Magic Cards -->
  <g transform="translate(115, 155)" filter="url(#neonGlow)">
    <!-- Floating Neon Magic Orbit Rings -->
    <ellipse cx="0" cy="0" rx="40" ry="16" fill="none" stroke="#00ffff" stroke-width="3.5" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="28" ry="12" fill="none" stroke="#ff00ff" stroke-width="3" transform="rotate(45)"/>

    <!-- Glowing Magical Snowbunny appearing -->
    <g transform="translate(0, -32)">
      <!-- Bunny Head -->
      <ellipse cx="0" cy="0" rx="24" ry="19" fill="#e0f2fe" stroke="#00ffff" stroke-width="2.5"/>
      <!-- Bunny Ears -->
      <ellipse cx="-11" cy="-35" rx="7" ry="20" fill="#e0f2fe" stroke="#ff00ff" stroke-width="2.5" transform="rotate(-15 -11 -35)"/>
      <ellipse cx="11" cy="-35" rx="7" ry="20" fill="#e0f2fe" stroke="#ff00ff" stroke-width="2.5" transform="rotate(15 11 -35)"/>
      <!-- Bunny Eyes & Smile -->
      <circle cx="-8" cy="-3" r="3.5" fill="#ff00aa"/>
      <circle cx="8" cy="-3" r="3.5" fill="#ff00aa"/>
      <path d="M-3 6 Q0 10 3 6" fill="none" stroke="#ff00aa" stroke-width="2" stroke-linecap="round"/>
      <!-- Magic Magician Bowtie -->
      <polygon points="0,14 -10,20 0,26 10,20" fill="#ec4899"/>
    </g>
  </g>

  <!-- Floating Sparkle Stars & Magic Cards on Right -->
  <g filter="url(#neonGlow)">
    <!-- Star 1 -->
    <path d="M390 110 L395 128 L413 133 L395 138 L390 156 L385 138 L367 133 L385 128 Z" fill="#00ffff"/>
    <!-- Star 2 -->
    <path d="M110 330 L114 342 L126 346 L114 350 L110 362 L106 350 L94 346 L106 342 Z" fill="#ff00ff"/>
    <!-- Star 3 -->
    <path d="M430 290 L433 299 L442 302 L433 305 L430 314 L427 305 L418 302 L427 299 Z" fill="#ffff00"/>
    
    <!-- Floating Magical Playing Cards -->
    <g transform="translate(390, 200) rotate(20)">
      <rect x="-15" y="-22" width="30" height="44" rx="4" fill="#ffffff" stroke="#ff00ff" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#ef4444"/>
    </g>
    <g transform="translate(360, 230) rotate(-15)">
      <rect x="-15" y="-22" width="30" height="44" rx="4" fill="#ffffff" stroke="#00ffff" stroke-width="2"/>
      <text x="0" y="6" font-family="sans-serif" font-weight="bold" font-size="16" fill="#00f0ff" text-anchor="middle">♠</text>
    </g>
  </g>

  <!-- Foreground Large Snow Flakes for Depth -->
  <circle cx="90" cy="450" r="5" fill="#ffffff" opacity="0.95" filter="url(#subtleGlow)"/>
  <circle cx="220" cy="480" r="6" fill="#ffffff" opacity="0.95" filter="url(#subtleGlow)"/>
  <circle cx="380" cy="440" r="5" fill="#ffffff" opacity="0.95" filter="url(#subtleGlow)"/>

  <!-- Live Show Watermark / DJ Sparkle Neon Vibe Tag -->
  <text x="256" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ff00ff" text-anchor="middle" filter="url(#neonGlow)" letter-spacing="4">DJ SPARKLE STAGE</text>
</svg>
