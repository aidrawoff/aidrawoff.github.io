<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background atmospheric multi-stop gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0520"/>
      <stop offset="40%" stop-color="#1b103f"/>
      <stop offset="75%" stop-color="#3b1443"/>
      <stop offset="100%" stop-color="#5a183b"/>
    </linearGradient>

    <!-- Drop shadow filter for crisp depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Circle gradients for volumetric lighting -->
    <radialGradient id="circleGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffcc66"/>
      <stop offset="45%" stop-color="#ff66b2"/>
      <stop offset="85%" stop-color="#9933ff"/>
      <stop offset="100%" stop-color="#4a0e4e"/>
    </radialGradient>

    <radialGradient id="circleGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#66ffff"/>
      <stop offset="45%" stop-color="#3399ff"/>
      <stop offset="85%" stop-color="#3333cc"/>
      <stop offset="100%" stop-color="#111144"/>
    </radialGradient>

    <radialGradient id="circleGrad3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#99ff66"/>
      <stop offset="45%" stop-color="#33cc66"/>
      <stop offset="85%" stop-color="#006633"/>
      <stop offset="100%" stop-color="#002211"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Atmospheric background silhouettes (hills/spires) -->
  <path d="M0 512 L0 420 Q 120 380 250 430 Q 380 480 512 400 L512 512 Z" fill="#140824" opacity="0.8"/>
  <path d="M0 512 L0 460 Q 150 430 300 470 Q 420 500 512 450 L512 512 Z" fill="#0c0418" opacity="0.9"/>

  <!-- Background star particles -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="80" cy="100" r="1.5"/>
    <circle cx="150" cy="60" r="1"/>
    <circle cx="390" cy="90" r="2"/>
    <circle cx="440" cy="180" r="1"/>
    <circle cx="120" cy="220" r="1.5"/>
    <circle cx="420" cy="320" r="1.5"/>
    <circle cx="100" cy="400" r="1"/>
    <circle cx="400" cy="80" r="1.5"/>
  </g>

  <!-- RECURSIVE CIRCLES STACK (Base to Top with enhanced rings) -->
  <!-- Base anchor platform / glowing aura -->
  <ellipse cx="256" cy="460" rx="120" ry="25" fill="#9933ff" opacity="0.4" filter="url(#glow)"/>

  <!-- Recursive Circle 1 (Largest, bottom) -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="420" r="70" fill="url(#circleGrad1)" stroke="#ffccff" stroke-width="3" stroke-opacity="0.8"/>
    <!-- Specular highlight -->
    <ellipse cx="236" cy="395" rx="20" ry="10" fill="#ffffff" opacity="0.5" transform="rotate(-25 236 395)"/>
  </g>
  <!-- Recursive spawn ring overlay -->
  <circle cx="256" cy="420" r="82" fill="none" stroke="#ff99ff" stroke-width="1" opacity="0.4" stroke-dasharray="6,4"/>

  <!-- Recursive Circle 2 (Stacked directly above) -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="320" r="56" fill="url(#circleGrad2)" stroke="#ccffff" stroke-width="2.5" stroke-opacity="0.8"/>
    <ellipse cx="240" cy="300" rx="16" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-25 240 300)"/>
  </g>
  <circle cx="256" cy="320" r="66" fill="none" stroke="#99ffff" stroke-width="1" opacity="0.4" stroke-dasharray="6,4"/>

  <!-- Recursive Circle 3 -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="240" r="44" fill="url(#circleGrad3)" stroke="#ddffdd" stroke-width="2" stroke-opacity="0.8"/>
    <ellipse cx="244" cy="224" rx="12" ry="6" fill="#ffffff" opacity="0.5" transform="rotate(-25 244 224)"/>
  </g>
  <circle cx="256" cy="240" r="53" fill="none" stroke="#99ff99" stroke-width="1" opacity="0.4" stroke-dasharray="5,3"/>

  <!-- Recursive Circle 4 -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="176" r="34" fill="url(#circleGrad1)" stroke="#ffccff" stroke-width="2" stroke-opacity="0.8"/>
    <ellipse cx="247" cy="164" rx="9" ry="4.5" fill="#ffffff" opacity="0.6" transform="rotate(-25 247 164)"/>
  </g>

  <!-- Recursive Circle 5 -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="124" r="26" fill="url(#circleGrad2)" stroke="#ccffff" stroke-width="1.5" stroke-opacity="0.8"/>
    <ellipse cx="249" cy="115" rx="7" ry="3.5" fill="#ffffff" opacity="0.6" transform="rotate(-25 249 115)"/>
  </g>

  <!-- Recursive Circle 6 -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="82" r="18" fill="url(#circleGrad3)" stroke="#ddffdd" stroke-width="1.5" stroke-opacity="0.8"/>
    <ellipse cx="251" cy="75" rx="5" ry="2.5" fill="#ffffff" opacity="0.7" transform="rotate(-25 251 75)"/>
  </g>

  <!-- Recursive Circle 7 (Top pinnacle micro-circle testing limits) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="50" r="12" fill="#ffffff" stroke="#ffccff" stroke-width="1.5"/>
  </g>

  <!-- Connecting energy threads / spiral arcs showing recursion flow -->
  <path d="M256 350 Q 280 280 256 284" fill="none" stroke="#ff99ff" stroke-width="1.5" opacity="0.7" stroke-dasharray="4,4"/>
  <path d="M256 284 Q 230 210 256 210" fill="none" stroke="#99ffff" stroke-width="1.5" opacity="0.7" stroke-dasharray="4,4"/>
  <path d="M256 210 Q 275 150 256 150" fill="none" stroke="#99ff99" stroke-width="1.5" opacity="0.7" stroke-dasharray="3,3"/>

  <!-- Floating magical sparkles / recursive glyphs -->
  <g fill="#ffcc66" filter="url(#glow)">
    <circle cx="180" cy="360" r="4.5"/>
    <circle cx="330" cy="280" r="3.5"/>
    <circle cx="190" cy="200" r="4"/>
    <circle cx="320" cy="140" r="3.5"/>
    <circle cx="256" cy="15" r="2.5"/>
    <circle cx="160" cy="120" r="2"/>
    <circle cx="350" cy="200" r="2"/>
  </g>
</svg>