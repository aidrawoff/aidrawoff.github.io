  <line x1="390" y1="252" x2="410" y2="252" stroke="#3d2b1f" stroke-width="2"/>
  <!-- Door -->
  <rect x="395" y="290" width="18" height="50" rx="2" fill="#2d1b0f"/>
  <circle cx="408" cy="315" r="2" fill="#d4a843"/>
  
  <!-- Broom -->
  <line x1="425" y1="210" x2="475" y2="455" stroke="#8b6914" stroke-width="6" stroke-linecap="round"/>
  <!-- Broom bristles -->
  <polygon points="470,450 495,465 485,475 460,460" fill="#d4a843"/>
  <polygon points="472,452 497,467 487,477 462,462" fill="none" stroke="#b8953a" stroke-width="1.5"/>
  <line x1="475" y1="455" x2="490" y2="470" stroke="#b8953a" stroke-width="1"/>
  <line x1="472" y1="458" x2="485" y2="472" stroke="#b8953a" stroke-width="1"/>
  
  <!-- Broom glow (magic still on it) -->
  <circle cx="480" cy="465" r="12" fill="url(#glow)" opacity="0.4"/>
  
  <!-- Small cauldron near house -->
  <ellipse cx="350" cy="450" rx="18" ry="8" fill="#1a1a3e"/>
  <ellipse cx="350" cy="440" rx="14" ry="6" fill="#2d2d5e"/>
  <ellipse cx="350" cy="438" rx="10" ry="4" fill="#00d4aa" opacity="0.5"/>
