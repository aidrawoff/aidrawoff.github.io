  <circle cx="120" cy="300" r="3" fill="#ff6b9d"/>
  <circle cx="90" cy="275" r="4" fill="#00d4aa"/>
  <circle cx="65" cy="295" r="3" fill="#ffd700"/>
  <circle cx="105" cy="255" r="4" fill="#ff6b9d"/>
  <circle cx="70" cy="260" r="2.5" fill="#00d4aa"/>
  <circle cx="50" cy="280" r="3" fill="#ffd700"/>
  
  <!-- Magic trail lines -->
