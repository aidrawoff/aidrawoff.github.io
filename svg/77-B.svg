  <path d="M130,305 Q100,270 70,265" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>
  
  <!-- "OOPS!" speech bubble -->
  <ellipse cx="285" cy="195" rx="50" ry="28" fill="#fff" opacity="0.95"/>
  <polygon points="260,218 235,250 270,223" fill="#fff" opacity="0.95"/>
  <ellipse cx="285" cy="195" rx="46" ry="24" fill="none" stroke="#1a0f2e" stroke-width="2"/>
  <text x="285" y="203" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a0f2e">OOPS!</text>
  
  <!-- Forgotten broom leaning on house -->
  <!-- House body -->
  <rect x="370" y="210" width="70" height="130" rx="4" fill="#3d2b1f"/>
  <rect x="375" y="215" width="60" height="120" rx="2" fill="#4a3525"/>
