<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sky gradient -->
  <defs>
    <radialGradient id="skyg" cx="0.3" cy="0.2">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#0d0518"/>
    </radialGradient>
    <radialGradient id="moong" cx="0.4" cy="0.4">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6b9d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="512" height="512" fill="url(#skyg)"/>
  
  <!-- Moon -->
  <circle cx="400" cy="80" r="50" fill="url(#moong)" opacity="0.95"/>
  <circle cx="375" cy="65" r="10" fill="#c4b8a0" opacity="0.4"/>
  <circle cx="420" cy="85" r="8" fill="#c4b8a0" opacity="0.3"/>
  <circle cx="395" cy="105" r="9" fill="#c4b8a0" opacity="0.35"/>
  <circle cx="430" cy="60" r="6" fill="#c4b8a0" opacity="0.25"/>
  
  <!-- Stars -->
  <circle cx="50" cy="50" r="2" fill="#fff" opacity="0.8"/>
