<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb8e0"/>
      <stop offset="1" stop-color="#f3efd6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c58a50"/>
      <stop offset="1" stop-color="#9a6234"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb46a"/>
      <stop offset="1" stop-color="#4f8a4a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- distant hills and trees -->
  <path d="M0 330 Q90 280 180 318 T380 310 T512 300 L512 512 L0 512Z" fill="#6b9f79"/>
  <g fill="#3f6e47">
    <path d="M40 320 L60 270 L80 320Z"/>
    <path d="M70 320 L92 262 L114 320Z"/>
    <path d="M430 300 L452 252 L474 300Z"/>
    <path d="M458 300 L480 262 L502 300Z"/>
  </g>
  <path d="M0 370 Q128 322 256 352 T512 345 L512 512 L0 512Z" fill="url(#grass)"/>
  <!-- contact shadow and puddle ring -->
  <ellipse cx="256" cy="470" rx="130" ry="16" fill="#2f5a34" opacity="0.45"/>
  <!-- legs with tapered shape and hooves -->
  <path d="M188 326 L180 440 L198 440 L208 330Z" fill="#8f5a2e"/>
  <path d="M304 326 L310 440 L328 440 L318 330Z" fill="#8f5a2e"/>
  <path d="M176 436 L200 436 L200 448 L176 448Z" fill="#2b1d12"/>
  <path d="M308 436 L332 436 L332 448 L308 448Z" fill="#2b1d12"/>
  <!-- tail -->
  <ellipse cx="164" cy="292" rx="12" ry="9" fill="#f4efe6"/>
  <!-- body -->
  <ellipse cx="256" cy="300" rx="92" ry="46" fill="url(#body)"/>
  <path d="M190 268 Q256 250 320 270" fill="none" stroke="#e0a870" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- neck and head -->
  <path d="M316 272 Q344 214 346 182 L378 182 Q382 226 362 282Z" fill="url(#body)"/>
  <ellipse cx="368" cy="178" rx="46" ry="34" fill="url(#body)"/>
  <!-- ears -->
  <path d="M340 164 L316 130 L336 154Z" fill="#b87c46"/>
  <path d="M396 154 L422 120 L406 150Z" fill="#b87c46"/>
  <!-- antlers -->
  <path d="M352 152 L340 110 M340 122 L326 116 M356 142 L370 100 M368 108 L382 102" stroke="#5b3b20" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- muzzle -->
  <ellipse cx="404" cy="190" rx="18" ry="13" fill="#e6c49a"/>
  <ellipse cx="416" cy="186" rx="5" ry="4" fill="#2e2016"/>
  <!-- glasses: round lenses with glints -->
  <g fill="#e9f7ff" fill-opacity="0.35" stroke="#2b2b2b" stroke-width="5">
    <circle cx="352" cy="174" r="15"/>
    <circle cx="386" cy="174" r="15"/>
  </g>
  <path d="M367 172 Q369 166 371 172" fill="none" stroke="#2b2b2b" stroke-width="4"/>
  <path d="M337 170 L326 166" stroke="#2b2b2b" stroke-width="4"/>
  <path d="M401 170 L412 166" stroke="#2b2b2b" stroke-width="4"/>
  <!-- eyes: round with highlights -->
  <circle cx="354" cy="176" r="5" fill="#1d140c"/>
  <circle cx="388" cy="176" r="5" fill="#1d140c"/>
  <circle cx="356" cy="174" r="1.8" fill="#fff"/>
  <circle cx="390" cy="174" r="1.8" fill="#fff"/>
  <path d="M338 166 L366 166" stroke="#fff" stroke-width="0" opacity="0"/>
  <path d="M342 160 Q352 152 362 160" fill="none" stroke="#2b2b2b" stroke-width="3" opacity="0"/>
  <!-- glasses glint -->
  <path d="M342 166 L348 162" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <path d="M376 166 L382 162" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <!-- rim light on the back -->
  <path d="M140 300 Q150 262 200 258" fill="none" stroke="#fff3c4" stroke-width="4" opacity="0.6"/>
  <!-- open book held at the chest -->
  <path d="M210 318 Q240 306 256 316 Q272 306 302 318 L302 360 Q272 350 256 360 Q240 350 210 360Z" fill="#f7f1e1" stroke="#7a5a3a" stroke-width="3"/>
  <path d="M256 316 L256 360" stroke="#7a5a3a" stroke-width="2"/>
  <g stroke="#9aa4b0" stroke-width="2" opacity="0.8">
    <path d="M222 330 Q238 326 248 332"/><path d="M222 342 Q238 338 248 344"/>
    <path d="M264 332 Q280 326 292 330"/><path d="M264 344 Q280 338 292 342"/>
  </g>
  <!-- ground reflections -->
  <path d="M240 478 L272 478" stroke="#2f5a34" stroke-width="3" opacity="0.4"/>
</svg>
