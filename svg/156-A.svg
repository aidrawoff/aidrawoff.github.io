<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark gothic room -->
  <rect width="512" height="512" fill="#1a0f1a"/>
  <rect x="0" y="0" width="512" height="300" fill="#2a1a2a"/>
  
  <!-- Window with moon -->
  <circle cx="420" cy="80" r="35" fill="#f0e6c8" opacity="0.9"/>
  <rect x="380" y="40" width="80" height="80" fill="none" stroke="#4a3a4a" stroke-width="6"/>
  <line x1="420" y1="40" x2="420" y2="120" stroke="#4a3a4a" stroke-width="4"/>
  <line x1="380" y1="80" x2="460" y2="80" stroke="#4a3a4a" stroke-width="4"/>
  
  <!-- Table -->
  <rect x="80" y="320" width="280" height="20" fill="#5a3a1a"/>
  <rect x="100" y="340" width="20" height="120" fill="#4a2a0a"/>
  <rect x="320" y="340" width="20" height="120" fill="#4a2a0a"/>
  
  <!-- Vampire body -->
  <ellipse cx="220" cy="240" rx="55" ry="70" fill="#2a2a3a"/>
  <path d="M 165 240 Q 150 320 160 360 L 280 360 Q 290 320 275 240" fill="#1a1a2a"/>
  
  <!-- Vampire head -->
  <ellipse cx="220" cy="170" rx="40" ry="45" fill="#e8d5c4"/>
  
  <!-- Hair -->
  <path d="M 180 150 Q 170 100 220 90 Q 270 100 260 150 Q 265 170 255 180 L 185 180 Q 175 170 180 150" fill="#0a0a0a"/>
  
  <!-- Fangs -->
  <polygon points="205,195 208,208 211,195" fill="#fff"/>
  <polygon points="229,195 232,208 235,195" fill="#fff"/>
  
  <!-- Eyes: annoyed/suffering -->
  <ellipse cx="208" cy="175" rx="8" ry="5" fill="#fff"/>
  <ellipse cx="232" cy="175" rx="8" ry="5" fill="#fff"/>
  <circle cx="208" cy="175" r="3" fill="#a00"/>
  <circle cx="232" cy="175" r="3" fill="#a00"/>
  <path d="M 200 168 Q 208 165 216 168" stroke="#0a0a0a" stroke-width="2" fill="none"/>
  <path d="M 224 168 Q 232 165 240 168" stroke="#0a0a0a" stroke-width="2" fill="none"/>
  
  <!-- Mouth: grimace -->
  <path d="M 205 195 Q 220 190 235 195" stroke="#8a4a4a" stroke-width="2" fill="none"/>
  
  <!-- Hand holding fork -->
  <ellipse cx="280" cy="280" rx="15" ry="12" fill="#e8d5c4"/>
  <line x1="280" y1="280" x2="310" y2="260" stroke="#aaa" stroke-width="3"/>
  <line x1="310" y1="260" x2="315" y2="250" stroke="#aaa" stroke-width="2"/>
  <line x1="310" y1="260" x2="320" y2="255" stroke="#aaa" stroke-width="2"/>
  
  <!-- Salad bowl -->
  <ellipse cx="220" cy="330" rx="60" ry="20" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <ellipse cx="220" cy="325" rx="55" ry="15" fill="#4a8a3a"/>
  
  <!-- Lettuce leaves -->
  <path d="M 190 320 Q 200 300 210 320" fill="#6aba4a"/>
  <path d="M 210 318 Q 220 295 230 318" fill="#5aaa3a"/>
  <path d="M 230 320 Q 240 300 250 320" fill="#6aba4a"/>
  <path d="M 200 325 Q 215 305 225 325" fill="#7aca5a"/>
  <path d="M 225 325 Q 235 305 245 325" fill="#5aaa3a"/>
  
  <!-- Tomato -->
  <circle cx="215" cy="318" r="6" fill="#c44"/>
  
  <!-- Cape collar -->
  <path d="M 175 210 Q 150 250 160 300 L 180 280" fill="#1a0a1a"/>
  <path d="M 265 210 Q 290 250 280 300 L 260 280" fill="#1a0a1a"/>
</svg>