<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#0f0c1b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="100%" stop-color="#24130a"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c3a21"/>
      <stop offset="50%" stop-color="#704729"/>
      <stop offset="100%" stop-color="#4a2e18"/>
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#b2ebf2"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Room Background -->
  <rect width="512" height="380" fill="url(#wallGrad)"/>
  <rect y="380" width="512" height="132" fill="url(#floorGrad)"/>

  <!-- Wallpaper stripes / pattern -->
  <g stroke="#26223b" stroke-width="2" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
  </g>

  <!-- Floorboards perspective lines -->
  <g stroke="#190e07" stroke-width="2">
    <line x1="0" y1="420" x2="512" y2="420"/>
    <line x1="0" y1="460" x2="512" y2="460"/>
    <line x1="0" y1="495" x2="512" y2="495"/>
    <line x1="150" y1="380" x2="50" y2="512"/>
    <line x1="380" y1="380" x2="460" y2="512"/>
  </g>

  <!-- Door Frame -->
  <rect x="140" y="40" width="232" height="460" fill="#2a180c" rx="4"/>
  <rect x="152" y="52" width="208" height="448" fill="url(#doorGrad)"/>

  <!-- Door Panels & Planks -->
  <g stroke="#3c2413" stroke-width="3" fill="none">
    <line x1="152" y1="140" x2="360" y2="140"/>
    <line x1="152" y1="280" x2="360" y2="280"/>
    <line x1="152" y1="400" x2="360" y2="400"/>
    <!-- Panel 1 -->
    <rect x="175" y="70" width="162" height="55" rx="4" fill="#52321c"/>
    <!-- Panel 2 (Broken/Squeezed middle) -->
    <rect x="175" y="160" width="162" height="100" rx="4" fill="#422714"/>
    <!-- Panel 3 -->
    <rect x="175" y="300" width="162" height="80" rx="4" fill="#52321c"/>
  </g>

  <!-- Door Handle -->
  <circle cx="330" cy="225" r="10" fill="#ffd54f"/>
  <circle cx="330" cy="225" r="6" fill="#ffa000"/>

  <!-- Ghost Stuck in Door (Back part protruding right) -->
  <g filter="url(#glow)">
    <!-- Right side squished tail/body -->
    <path d="M 330 180 Q 420 180 440 220 Q 450 260 410 280 Q 370 260 330 240 Z" fill="url(#ghostGrad)" opacity="0.9"/>
  </g>

  <!-- Main Ghost Body (Front squished through the middle panel) -->
  <g filter="url(#glow)">
    <path d="M 120 150 Q 200 130 250 170 Q 280 200 250 250 Q 220 280 250 310 Q 200 330 140 280 Q 100 240 120 150 Z" fill="url(#ghostGrad)"/>
  </g>

  <!-- Ghost Face (Scared / Stuck Expression) -->
  <g>
    <!-- Eyes -->
    <ellipse cx="190" cy="205" rx="14" ry="18" fill="#1a1a1a"/>
    <ellipse cx="194" cy="200" rx="4" ry="6" fill="#ffffff"/>

    <ellipse cx="230" cy="215" rx="12" ry="16" fill="#1a1a1a"/>
    <ellipse cx="233" cy="211" rx="3" ry="5" fill="#ffffff"/>

    <!-- Open O-shaped mouth (shocked/stuck) -->
    <ellipse cx="210" cy="250" rx="14" ry="20" fill="#1a1a1a"/>
    <ellipse cx="210" cy="255" rx="8" ry="10" fill="#e57373"/>

    <!-- Sweat drops / motion lines -->
    <path d="M 165 170 Q 155 160 160 150" stroke="#80deea" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 265 185 Q 280 180 275 170" stroke="#80deea" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Splinter / Crack Effects on Door -->
  <g stroke="#211208" stroke-width="3" fill="none">
    <path d="M 230 160 L 250 200 L 220 230 L 260 280"/>
    <path d="M 330 200 L 360 220 L 340 250"/>
  </g>

  <!-- Extra Magic Sparkles, Floating Dust & Ethereal Wisps -->
  <g fill="#ffffff">
    <circle cx="150" cy="190" r="4" opacity="0.8"/>
    <circle cx="280" cy="230" r="3" opacity="0.8"/>
    <circle cx="390" cy="210" r="5" opacity="0.7"/>
    <circle cx="105" cy="130" r="2.5" opacity="0.9"/>
    <circle cx="445" cy="285" r="3" opacity="0.9"/>
    <circle cx="210" cy="115" r="2" opacity="0.6"/>
    <circle cx="330" cy="130" r="2" opacity="0.8"/>
    <circle cx="170" cy="340" r="2.5" opacity="0.7"/>
    <circle cx="250" cy="90" r="1.5" opacity="0.9"/>
    <circle cx="120" cy="360" r="2" opacity="0.8"/>
  </g>

  <!-- Floating Spooky Key dropping from tail -->
  <g transform="translate(400, 240) rotate(25)" fill="#ffd54f">
    <circle cx="0" cy="0" r="6" stroke="#c79100" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#2a180c"/>
    <rect x="-2" y="6" width="4" height="14"/>
    <rect x="2" y="12" width="4" height="3"/>
    <rect x="2" y="17" width="4" height="3"/>
  </g>

  <!-- Additional glowing spectral wisp ring -->
  <ellipse cx="205" cy="215" rx="75" ry="85" fill="none" stroke="#80deea" stroke-width="2" opacity="0.4" stroke-dasharray="6 6"/>

  <!-- Floor Shadow -->
  <ellipse cx="200" cy="380" rx="70" ry="15" fill="#000000" opacity="0.6"/>
</svg>
