<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d84315"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" fill="#81d4fa"/>
  <circle cx="400" cy="80" r="45" fill="url(#sun)"/>

  <!-- Ground -->
  <ellipse cx="256" cy="420" rx="300" ry="100" fill="url(#grass)"/>

  <!-- Zombie body -->
  <ellipse cx="200" cy="320" rx="55" ry="70" fill="#689f38"/>
  <ellipse cx="200" cy="320" rx="45" ry="55" fill="url(#skin)"/>

  <!-- Zombie head -->
  <ellipse cx="200" cy="220" rx="40" ry="48" fill="url(#skin)"/>
  <ellipse cx="200" cy="220" rx="35" ry="42" fill="#81c784"/>

  <!-- Face -->
  <circle cx="185" cy="210" r="5" fill="#1b5e20"/>
  <circle cx="215" cy="210" r="5" fill="#1b5e20"/>
  <ellipse cx="200" cy="235" rx="12" ry="8" fill="#1b5e20"/>
  <path d="M 190 235 Q 200 245 210 235" stroke="#1b5e20" stroke-width="2" fill="none"/>
  <!-- Stitch marks -->
  <path d="M 170 200 L 175 205 M 172 205 L 177 200" stroke="#33691e" stroke-width="1.5"/>
  <path d="M 225 200 L 230 205 M 227 205 L 232 200" stroke="#33691e" stroke-width="1.5"/>

  <!-- Arm holding watering can -->
  <path d="M 240 280 Q 280 260 320 240" stroke="#66bb6a" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 160 280 Q 120 320 100 360" stroke="#66bb6a" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Watering can -->
  <path d="M 310 220 L 350 220 L 360 260 L 300 260 Z" fill="#78909c"/>
  <rect x="340" y="200" width="8" height="30" fill="#78909c" transform="rotate(-30 344 215)"/>
  <ellipse cx="310" cy="240" rx="25" ry="20" fill="#90a4ae"/>
  <path d="M 300 220 Q 280 210 270 230" stroke="#78909c" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Water drops -->
  <ellipse cx="335" cy="270" rx="4" ry="6" fill="#4fc3f7"/>
  <ellipse cx="345" cy="280" rx="3" ry="5" fill="#4fc3f7"/>
  <ellipse cx="325" cy="285" rx="3" ry="5" fill="#4fc3f7"/>

  <!-- Big flower pot -->
  <path d="M 360 380 L 440 380 L 420 460 L 380 460 Z" fill="url(#pot)"/>
  <ellipse cx="400" cy="380" rx="40" ry="12" fill="#bf360c"/>

  <!-- Flower -->
  <path d="M 400 380 Q 400 320 400 280" stroke="#4caf50" stroke-width="6" fill="none"/>
  <ellipse cx="400" cy="275" rx="18" ry="10" fill="#e91e63" transform="rotate(0 400 275)"/>
  <ellipse cx="400" cy="275" rx="18" ry="10" fill="#e91e63" transform="rotate(72 400 275)"/>
  <ellipse cx="400" cy="275" rx="18" ry="10" fill="#e91e63" transform="rotate(144 400 275)"/>
  <ellipse cx="400" cy="275" rx="18" ry="10" fill="#e91e63" transform="rotate(216 400 275)"/>
  <ellipse cx="400" cy="275" rx="18" ry="10" fill="#e91e63" transform="rotate(288 400 275)"/>
  <circle cx="400" cy="275" r="8" fill="#ffeb3b"/>

  <!-- Small sprouts -->
  <path d="M 150 410 Q 150 390 140 380" stroke="#4caf50" stroke-width="3" fill="none"/>
  <ellipse cx="140" cy="378" rx="5" ry="3" fill="#66bb6a"/>
  <path d="M 170 415 Q 170 395 180 385" stroke="#4caf50" stroke-width="3" fill="none"/>
  <ellipse cx="180" cy="383" rx="5" ry="3" fill="#66bb6a"/>

  <!-- Brain on head -->
  <ellipse cx="200" cy="175" rx="15" ry="10" fill="#f48fb1"/>
  <path d="M 190 175 Q 195 170 200 175 Q 205 170 210 175" stroke="#ec407a" stroke-width="1.5" fill="none"/>
</svg>
