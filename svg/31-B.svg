<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="100%" stop-color="#fff9c4"/>
    </radialGradient>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Sun with sunglasses -->
  <g transform="translate(120,80)">
    <circle cx="0" cy="0" r="40" fill="#ffeb3b" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="32" fill="#ffc107" filter="url(#glow)"/>
    <!-- Sunglasses -->
    <rect x="-24" y="-12" width="48" height="24" rx="12" fill="#263238" stroke="#000" stroke-width="1.5"/>
    <circle cx="-12" cy="-6" r="4" fill="#00bcd4"/>
    <circle cx="12" cy="-6" r="4" fill="#00bcd4"/>
  </g>

  <!-- Tiny dragon lifting weights -->
  <g transform="translate(256,300)">
    <!-- Body and head (more muscular) -->
    <path d="M -25,-45 C -35,-35 -45,-15 -45,15 C -45,45 -25,65 -5,65 C 15,65 35,45 35,15 C 35,-15 25,-35 15,-45 C 5,-55 -5,-55 -15,-45 C -20,-40 -20,-30 -15,-25 C -10,-20 -5,-15 -5,-10 Z" fill="url(#dragonGrad)" stroke="#1a237e" stroke-width="1.5"/>
    <!-- Eye -->
    <circle cx="-5" cy="-25" r="3" fill="#ff5722"/>
    <!-- Horns -->
    <path d="M -18,-52 L -23,-72 L -18,-67 Z" fill="#795548"/>
    <path d="M 2,-52 L -3,-72 L 2,-67 Z" fill="#795548"/>

    <!-- Wings (more detailed) -->
    <path d="M -25,15 C -55,5 -75,35 -65,55 C -55,75 -35,65 -25,55 C -15,45 -5,35 5,35 C 15,35 25,45 35,55 C 45,65 65,75 55,55 C 45,35 25,5 35,15 Z" fill="url(#dragonGrad)" opacity="0.85" stroke="#1a237e" stroke-width="1.2"/>
    <!-- Wing claws -->
    <path d="M -55,45 L -60,40 L -55,35 L -50,40 Z" fill="#795548"/>
    <path d="M 45,45 L 50,40 L 45,35 L 40,40 Z" fill="#795548"/>

    <!-- Legs and tail (more defined) -->
    <path d="M -22,65 L -27,85 L -22,90 L -17,85 Z" fill="#4fc3f7" stroke="#1a237e" stroke-width="0.5"/>
    <path d="M 13,65 L 18,85 L 13,90 L 8,85 Z" fill="#4fc3f7" stroke="#1a237e" stroke-width="0.5"/>
    <path d="M 22,55 C 42,45 62,55 72,65 C 82,75 92,85 97,90" stroke="#1a237e" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Detailed barbell -->
    <g transform="translate(-15,50)">
      <rect x="-30" y="-5" width="60" height="10" rx="5" fill="#78909c"/>
      <circle cx="-40" cy="0" r="8" fill="#78909c"/>
      <circle cx="20" cy="0" r="8" fill="#78909c"/>
      <!-- Weight plates -->
      <rect x="-45" y="-12" width="10" height="24" rx="5" fill="#546e7a"/>
      <rect x="15" y="-12" width="10" height="24" rx="5" fill="#546e7a"/>
      <!-- Bar ends -->
      <circle cx="-40" cy="0" r="3" fill="#263238"/>
      <circle cx="20" cy="0" r="3" fill="#263238"/>
    </g>

    <!-- Forelegs gripping bar (more expressive) -->
    <path d="M -33,50 L -38,45 L -33,40 L -28,45 Z" fill="#4fc3f7" stroke="#1a237e" stroke-width="1"/>
    <path d="M 7,50 L 12,45 L 7,40 L 2,45 Z" fill="#4fc3f7" stroke="#1a237e" stroke-width="1"/>
    <!-- Claws -->
    <path d="M -38,45 L -40,42 L -38,39 L -36,42 Z" fill="#795548"/>
    <path d="M 12,45 L 14,42 L 12,39 L 10,42 Z" fill="#795548"/>
  </g>

  <!-- Subtle stars -->
  <circle cx="80" cy="120" r="1" fill="#263238" opacity="0.7"/>
  <circle cx="400" cy="90" r="1.2" fill="#263238" opacity="0.7"/>
  <circle cx="150" cy="380" r="1" fill="#263238" opacity="0.7"/>
  <circle cx="320" cy="200" r="1.3" fill="#263238" opacity="0.7"/>
  <circle cx="450" cy="350" r="1" fill="#263238" opacity="0.7"/>
</svg>
