<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: cozy cottage and moonlit garden -->
  <rect width="512" height="512" fill="#0a1a2a"/>
  <!-- Sky gradient -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="512">
    <stop offset="0%" stop-color="#0a1a2a"/>
    <stop offset="100%" stop-color="#1a2a3a"/>
  </linearGradient>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Cottage: dark silhouette -->
  <path d="M60 380 L60 440 L120 440 L120 380 Z M120 380 L120 410 L180 410 L180 380 Z M180 380 L180 440 L240 440 L240 380 Z" fill="#3a2212"/>
  <!-- Roof -->
  <path d="M40 380 L150 320 L260 380 Z" fill="#5a3222"/>
  <!-- Window glow -->
  <rect x="90" y="390" width="20" height="20" fill="#ffe87c" rx="2"/>

  <!-- Ground: soft grass -->
  <path d="M0 440 Q128 460 256 440 T512 440 L512 512 L0 512 Z" fill="#1a3a1a"/>

  <!-- Werewolf: bold outline, warm body, shaggy fur -->
  <g id="werewolf">
    <!-- Head and snout -->
    <path d="M240 260 L260 240 L280 260 L290 280 L280 300 L260 320 L240 300 L230 280 Z" fill="#d4a76a" stroke="#2a1a0a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Ears -->
    <path d="M230 260 L220 230 L235 240 Z" fill="#d4a76a" stroke="#2a1a0a" stroke-width="2"/>
    <path d="M270 260 L280 230 L265 240 Z" fill="#d4a76a" stroke="#2a1a0a" stroke-width="2"/>
    <!-- Eyes and nose -->
    <circle cx="250" cy="270" r="6" fill="#2a1a0a"/>
    <circle cx="260" cy="270" r="6" fill="#2a1a0a"/>
    <circle cx="255" cy="280" r="3" fill="#2a1a0a"/>
    <!-- Mouth/teeth -->
    <path d="M250 290 L260 290" stroke="#2a1a0a" stroke-width="2"/>
    <!-- Body -->
    <path d="M220 320 L210 340 L220 360 L230 380 L240 380 L250 380 L260 360 L270 340 L260 320 L250 300 Z" fill="#d4a76a" stroke="#2a1a0a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Arms/hands -->
    <path d="M200 340 L180 320 L190 310 Z" fill="#d4a76a" stroke="#2a1a0a" stroke-width="3"/>
    <path d="M280 340 L300 320 L290 310 Z" fill="#d4a76a" stroke="#2a1a0a" stroke-width="3"/>
    <!-- Legs -->
    <path d="M230 380 L220 420 L235 420 Z" fill="#d4a76a" stroke="#2a1a0a" stroke-width="4"/>
    <path d="M250 380 L260 420 L245 420 Z" fill="#d4a76a" stroke="#2a1a0a" stroke-width="4"/>
    <!-- Tail -->
    <path d="M260 320 Q280 300 300 320 Q320 340 300 360 Q280 380 260 360" stroke="#d4a76a" stroke-width="12" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
  </g>
  <!-- Shadow under werewolf -->
  <ellipse cx="240" cy="400" rx="40" ry="12" fill="#000000" opacity="0.2"/>

  <!-- Tea table: small, wobbly -->
  <g id="table">
    <rect x="200" y="360" width="60" height="8" fill="#8a5a2a" rx="2"/>
    <rect x="210" y="368" width="40" height="20" fill="#a47442" rx="2"/>
  </g>

  <!-- Teacup: spilling tea with soft glow -->
  <g id="cup">
    <path d="M230 370 Q235 365 240 365 Q245 365 250 370 L250 380 Q245 385 240 385 Q235 385 230 380 Z" fill="#f8f8f8" stroke="#2a1a0a" stroke-width="2"/>
    <circle cx="240" cy="372" r="12" fill="#ffe87c" opacity="0.6"/>
  </g>

  <!-- Spilled tea: splashes with gradient -->
  <path d="M220 380 Q230 390 240 385 Q250 390 260 380 Q250 370 240 375 Q230 370 220 380 Z" fill="#ffe87c" opacity="0.7"/>
  <path d="M225 385 Q235 395 245 390 Q255 395 265 385" stroke="#ffc84c" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Moon: soft glow -->
  <circle cx="420" cy="100" r="30" fill="#f0f0f0" opacity="0.8"/>
  <circle cx="420" cy="100" r="40" fill="none" stroke="#f0f0f0" stroke-width="2" opacity="0.3"/>
</svg>
