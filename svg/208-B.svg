<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spot" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b2a5c"/>
      <stop offset="100%" stop-color="#140e25"/>
    </radialGradient>
    <linearGradient id="pumpkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa53a"/>
      <stop offset="100%" stop-color="#e0661a"/>
    </linearGradient>
  </defs>
  <!-- backdrop -->
  <rect width="512" height="512" fill="url(#spot)"/>
  <!-- stage curtains -->
  <path d="M0 0 H120 Q90 200 130 512 H0 Z" fill="#7a1420"/>
  <path d="M512 0 H392 Q422 200 382 512 H512 Z" fill="#7a1420"/>
  <!-- stage floor -->
  <rect x="0" y="400" width="512" height="112" fill="#4a2a18"/>
  <!-- spotlight cone -->
  <path d="M220 0 H292 L380 420 H132 Z" fill="#fff6c8" opacity="0.18"/>
  <!-- pumpkin body -->
  <ellipse cx="256" cy="318" rx="128" ry="110" fill="url(#pumpkin)"/>
  <!-- pumpkin stem -->
  <path d="M244 214 Q250 176 268 170 L272 186 Q258 196 252 216 Z" fill="#3c7a2a"/>
  <!-- ribs -->
  <path d="M200 226 Q176 318 200 410" stroke="#c4501a" stroke-width="6" fill="none"/>
  <path d="M312 226 Q336 318 312 410" stroke="#c4501a" stroke-width="6" fill="none"/>
  <!-- spotlight highlight on the pumpkin -->
  <ellipse cx="200" cy="262" rx="22" ry="12" fill="#ffe6b0" opacity="0.6" transform="rotate(-25 200 262)"/>
  <!-- wide frightened eyes -->
  <ellipse cx="212" cy="284" rx="24" ry="28" fill="#fffdf4" stroke="#2a1606" stroke-width="5"/>
  <ellipse cx="300" cy="284" rx="24" ry="28" fill="#fffdf4" stroke="#2a1606" stroke-width="5"/>
  <circle cx="206" cy="292" r="9" fill="#2a1606"/>
  <circle cx="294" cy="292" r="9" fill="#2a1606"/>
  <!-- brows raised in fright -->
  <path d="M184 240 Q210 226 236 238" stroke="#2a1606" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M276 238 Q302 226 328 240" stroke="#2a1606" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- gaping wobbly mouth -->
  <path d="M212 346 Q256 318 300 346 Q290 382 256 384 Q222 382 212 346 Z" fill="#2a1606"/>
  <path d="M232 362 Q256 352 280 362" stroke="#d9457a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- microphone stand -->
  <rect x="396" y="250" width="8" height="160" fill="#8a8a96"/>
  <rect x="380" y="402" width="40" height="10" rx="4" fill="#5c5c68"/>
  <rect x="384" y="216" width="32" height="46" rx="16" fill="#b9b9c6" stroke="#5c5c68" stroke-width="4"/>
  <!-- footlight glow on stage edge -->
  <rect x="0" y="400" width="512" height="6" fill="#ffd27a" opacity="0.6"/>
  <!-- shaking lines -->
  <path d="M112 300 L92 296 M112 318 L88 318 M112 336 L94 340" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M400 300 L420 296 M400 318 L424 318 M400 336 L418 340" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- sweat drops -->
  <path d="M142 240 Q134 262 142 272 Q152 262 142 240 Z" fill="#9fe3ff"/>
  <path d="M370 250 Q362 272 370 282 Q380 272 370 250 Z" fill="#9fe3ff"/>
</svg>
