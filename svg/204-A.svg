<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#382b47"/>
      <stop offset="60%" stop-color="#1d1524"/>
      <stop offset="100%" stop-color="#0b0710"/>
    </radialGradient>
    
    <!-- Pumpkin Gradient -->
    <radialGradient id="pumpkinGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffbe52"/>
      <stop offset="40%" stop-color="#e86c44"/>
      <stop offset="80%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#8c1c04"/>
    </radialGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69963c"/>
      <stop offset="50%" stop-color="#446426"/>
      <stop offset="100%" stop-color="#1e2c10"/>
    </linearGradient>

    <!-- Coffee Mug Gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#dfe4ea"/>
      <stop offset="100%" stop-color="#a4b0be"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Office Blinds in Background with Warm Window Glow -->
  <rect x="30" y="40" width="200" height="150" fill="#f39c12" opacity="0.08" rx="4"/>
  <g stroke="#261f30" stroke-width="2" opacity="0.7">
    <line x1="30" y1="65" x2="230" y2="65"/>
    <line x1="30" y1="100" x2="230" y2="100"/>
    <line x1="30" y1="135" x2="230" y2="135"/>
    <line x1="30" y1="170" x2="230" y2="170"/>
  </g>

  <!-- Wall Clock Showing 8:59 AM (Monday Dread) -->
  <g transform="translate(415, 85)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="48" fill="#1e1b24" stroke="#524363" stroke-width="5"/>
    <circle cx="0" cy="0" r="42" fill="#f8f9fa"/>
    <!-- Clock Hands: 8:59 -->
    <line x1="0" y1="0" x2="-16" y2="-16" stroke="#2f3640" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="20" y2="-8" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" stroke="#2f3640" fill="#f8f9fa" stroke-width="1.5"/>
    <!-- Tick marks -->
    <line x1="0" y1="-39" x2="0" y2="-34" stroke="#2f3640" stroke-width="2"/>
    <line x1="39" y1="0" x2="34" y2="0" stroke="#2f3640" stroke-width="2"/>
    <line x1="0" y1="39" x2="0" y2="34" stroke="#2f3640" stroke-width="2"/>
    <line x1="-39" y1="0" x2="-34" y2="0" stroke="#2f3640" stroke-width="2"/>
  </g>
  <text x="415" y="150" font-family="sans-serif" font-weight="900" font-size="11" fill="#ff6b6b" text-anchor="middle" letter-spacing="1">MON 8:59</text>

  <!-- Desk Surface & Shadow -->
  <ellipse cx="256" cy="460" rx="245" ry="50" fill="#020103" opacity="0.95"/>
  <path d="M0 435 L512 435 L512 512 L0 512 Z" fill="#1b1422"/>
  <line x1="0" y1="435" x2="512" y2="435" stroke="#463659" stroke-width="4"/>

  <!-- Main Pumpkin Group with Drop Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Pumpkin Back Lobes -->
    <ellipse cx="256" cy="285" rx="160" ry="128" fill="#9c2710"/>
    <ellipse cx="204" cy="290" rx="108" ry="122" fill="#bd3b17"/>
    <ellipse cx="308" cy="290" rx="108" ry="122" fill="#bd3b17"/>
    
    <!-- Central Pumpkin Body -->
    <ellipse cx="256" cy="285" rx="138" ry="134" fill="url(#pumpkinGrad)"/>

    <!-- Pumpkin Rib Curves & Highlights -->
    <path d="M256 151 C223 210, 223 360, 256 418" fill="none" stroke="#ffe082" stroke-width="10" opacity="0.45"/>
    <path d="M193 168 C163 220, 163 350, 193 402" fill="none" stroke="#f39c12" stroke-width="8" opacity="0.55"/>
    <path d="M319 168 C349 220, 349 350, 319 402" fill="none" stroke="#f39c12" stroke-width="8" opacity="0.55"/>
    <path d="M142 198 C112 250, 112 330, 142 382" fill="none" stroke="#d35400" stroke-width="6" opacity="0.65"/>
    <path d="M370 198 C400 250, 400 330, 370 382" fill="none" stroke="#d35400" stroke-width="6" opacity="0.65"/>

    <!-- Stem (Curved, Grumpy Slump) -->
    <path d="M246 158 Q240 102, 208 88 Q228 78, 252 98 Q268 113, 266 158 Z" fill="url(#stemGrad)" filter="url(#softShadow)"/>

    <!-- Dark Circles / Bags Under Eyes (Maximum Monday Mood) -->
    <ellipse cx="193" cy="298" rx="38" ry="20" fill="#4a1207" opacity="0.85"/>
    <ellipse cx="319" cy="298" rx="38" ry="20" fill="#4a1207" opacity="0.85"/>

    <!-- Grumpy Face -->
    <!-- Angry Eyebrows (Asymmetric, Heavy, Dynamic) -->
    <path d="M156 212 L230 255 L218 274 L156 238 Z" fill="#1b0a05" filter="url(#softShadow)"/>
    <path d="M356 212 L282 255 L294 274 L356 238 Z" fill="#1b0a05" filter="url(#softShadow)"/>

    <!-- Eyes (Squinting & Grumpy) -->
    <polygon points="168,252 220,266 200,305 168,288" fill="#090302"/>
    <polygon points="344,252 292,266 312,305 344,288" fill="#090302"/>
    <!-- Eye highlights -->
    <circle cx="183" cy="271" r="5" fill="#f1c40f"/>
    <circle cx="329" cy="271" r="5" fill="#f1c40f"/>

    <!-- Nose (Drooping & Tired) -->
    <polygon points="250,295 264,295 257,324" fill="#090302"/>

    <!-- Sweat Drop of Despair -->
    <path d="M285 228 C285 228, 297 244, 297 253 A 6 6 0 0 1 285 253 C285 244, 285 228, 285 228 Z" fill="#74b9ff" opacity="0.9" filter="url(#softShadow)"/>
    <circle cx="289" cy="242" r="1.5" fill="#ffffff" opacity="0.8"/>

    <!-- Grumpy Frowning Mouth (Deep Slump) -->
    <path d="M183 358 Q220 332, 256 345 Q292 332, 329 358 L316 382 Q256 358, 196 382 Z" fill="#090302"/>
    <!-- Teeth (Protruding Bottom Lip/Tooth) -->
    <rect x="235" y="352" width="14" height="15" fill="#f8f9fa"/>
    <rect x="263" y="352" width="14" height="15" fill="#f8f9fa"/>
  </g>

  <!-- Coffee Mug ("Monday Fuel") -->
  <g transform="translate(90, 330)" filter="url(#dropShadow)">
    <!-- Mug Body -->
    <rect x="0" y="0" width="78" height="95" rx="10" fill="url(#mugGrad)"/>
    <!-- Mug Rim -->
    <ellipse cx="39" cy="0" rx="39" ry="9.5" fill="#ffffff"/>
    <!-- Coffee Surface -->
    <ellipse cx="39" cy="3" rx="34" ry="7.5" fill="#331c0a"/>
    <!-- Coffee Ripples -->
    <path d="M26 3 Q39 7.5, 52 3" fill="none" stroke="#1f1005" stroke-width="1.5" opacity="0.7"/>
    <!-- Handle -->
    <path d="M78 18 C106 18, 106 75, 78 75" fill="none" stroke="#a4b0be" stroke-width="12" stroke-linecap="round"/>
    <!-- Steam / Zzz (Multiple wisps) -->
    <path d="M28 -15 Q36 -34, 24 -52 Q12 -70, 30 -92" fill="none" stroke="#dfe6e9" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M50 -20 Q58 -40, 46 -58 Q34 -76, 50 -95" fill="none" stroke="#dfe6e9" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <!-- Text on Mug -->
    <text x="39" y="47" font-family="sans-serif" font-weight="900" font-size="14" fill="#c0392b" text-anchor="middle">NEED</text>
    <text x="39" y="67" font-family="sans-serif" font-weight="900" font-size="14" fill="#c0392b" text-anchor="middle">COFFEE</text>
  </g>

  <!-- Atmospheric Text / Mood -->
  <text x="70" y="145" font-family="sans-serif" font-weight="900" font-size="32" fill="#718093" opacity="0.35" transform="rotate(-12 70 145)">Ugh...</text>
  <text x="330" y="385" font-family="sans-serif" font-weight="900" font-size="36" fill="#718093" opacity="0.3" transform="rotate(10 330 385)">Monday.</text>

  <!-- Foreground Vignette for Dramatic Mood -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
    <stop offset="65%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#vignette)" pointer-events="none"/>
</svg>
