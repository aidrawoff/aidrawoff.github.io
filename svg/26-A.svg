<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- backdrop: beach sky -->
  <rect x="0" y="0" width="512" height="512" fill="#7fd3f7"/>
  <circle cx="420" cy="90" r="40" fill="#ffd54a"/>
  <!-- sand -->
  <rect x="0" y="350" width="512" height="162" fill="#f4d58d"/>
  <!-- sea -->
  <rect x="0" y="330" width="512" height="30" fill="#2aa8d8"/>
  <path d="M0 330 Q32 318 64 330 T128 330 T192 330 T256 330 T320 330 T384 330 T448 330 T512 330 V340 H0 Z" fill="#ffffff" opacity="0.8"/>
  <!-- palm tree -->
  <path d="M90 350 Q100 260 120 200" stroke="#8b5a2b" stroke-width="10" fill="none"/>
  <path d="M120 200 Q90 170 60 185 Q95 180 120 200 Z" fill="#2f9e44"/>
  <path d="M120 200 Q140 165 175 175 Q145 185 120 200 Z" fill="#2f9e44"/>
  <path d="M120 200 Q110 160 130 140 Q128 170 120 200 Z" fill="#37b24d"/>
  <!-- fishbowl glass -->
  <circle cx="256" cy="250" r="190" fill="#bfeaff" opacity="0.35"/>
  <circle cx="256" cy="250" r="190" fill="none" stroke="#1c7ed6" stroke-width="10"/>
  <path d="M120 150 Q135 120 165 105" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- bubbles -->
  <circle cx="110" cy="330" r="7" fill="none" stroke="#1c7ed6" stroke-width="3"/>
  <circle cx="400" cy="300" r="10" fill="none" stroke="#1c7ed6" stroke-width="3"/>
  <circle cx="380" cy="180" r="5" fill="none" stroke="#1c7ed6" stroke-width="3"/>
  <!-- bowl base -->
  <rect x="200" y="436" width="112" height="22" rx="6" fill="#1c7ed6"/>
  <!-- DJ table -->
  <rect x="150" y="318" width="212" height="18" rx="4" fill="#495057"/>
  <rect x="165" y="336" width="20" height="100" fill="#343a40"/>
  <rect x="327" y="336" width="20" height="100" fill="#343a40"/>
  <!-- turntables -->
  <circle cx="200" cy="306" r="26" fill="#212529"/>
  <circle cx="200" cy="306" r="8" fill="#f03e3e"/>
  <circle cx="312" cy="306" r="26" fill="#212529"/>
  <circle cx="312" cy="306" r="8" fill="#f03e3e"/>
  <!-- penguin body -->
  <ellipse cx="256" cy="250" rx="62" ry="78" fill="#212529"/>
  <ellipse cx="256" cy="268" rx="40" ry="56" fill="#ffffff"/>
  <!-- wings reaching to turntables -->
  <path d="M200 240 Q170 270 186 300" stroke="#212529" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M312 240 Q342 270 326 300" stroke="#212529" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="256" cy="180" r="48" fill="#212529"/>
  <!-- headphones -->
  <path d="M206 178 Q206 128 256 128 Q306 128 306 178" stroke="#e8590c" stroke-width="10" fill="none"/>
  <rect x="198" y="170" width="16" height="30" rx="6" fill="#e8590c"/>
  <rect x="298" y="170" width="16" height="30" rx="6" fill="#e8590c"/>
  <!-- sunglasses -->
  <rect x="222" y="168" width="28" height="18" rx="6" fill="#111"/>
  <rect x="262" y="168" width="28" height="18" rx="6" fill="#111"/>
  <line x1="250" y1="175" x2="262" y2="175" stroke="#111" stroke-width="4"/>
  <!-- beak and smile -->
  <path d="M248 196 L264 196 L256 210 Z" fill="#ff922b"/>
  <path d="M240 212 Q256 224 272 212" stroke="#ffffff" stroke-width="3" fill="none"/>
  <!-- feet -->
  <ellipse cx="236" cy="330" rx="16" ry="6" fill="#ff922b"/>
  <ellipse cx="276" cy="330" rx="16" ry="6" fill="#ff922b"/>
  <!-- party flag bunting -->
  <path d="M90 118 Q256 158 422 118" stroke="#343a40" stroke-width="3" fill="none"/>
  <polygon points="122,128 138,128 130,150" fill="#f03e3e"/>
  <polygon points="186,140 202,140 194,162" fill="#fcc419"/>
  <!-- wave lines in the fishbowl water -->
  <path d="M120 372 Q150 360 180 372 T240 372 T300 372 T360 372 T400 372" stroke="#1c7ed6" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M130 396 Q160 384 190 396 T250 396 T310 396 T370 396" stroke="#1c7ed6" stroke-width="4" fill="none" opacity="0.5"/>
  <!-- speakers on the sand -->
  <rect x="90" y="300" width="36" height="50" rx="4" fill="#343a40"/>
  <circle cx="108" cy="318" r="8" fill="#868e96"/>
  <circle cx="108" cy="338" r="11" fill="#868e96"/>
  <rect x="386" y="300" width="36" height="50" rx="4" fill="#343a40"/>
  <circle cx="404" cy="318" r="8" fill="#868e96"/>
  <circle cx="404" cy="338" r="11" fill="#868e96"/>
  <polygon points="314,140 330,140 322,162" fill="#be4bdb"/>
  <polygon points="378,128 394,128 386,150" fill="#1c7ed6"/>
  <!-- water-tinted lower bowl -->
  <path d="M90 300 Q256 330 422 300 Q400 420 256 438 Q112 420 90 300 Z" fill="#74c0fc" opacity="0.3"/>
  <!-- music notes -->
  <text x="330" y="160" font-size="34" fill="#be4bdb" font-family="sans-serif">♪</text>
  <text x="160" y="200" font-size="28" fill="#f03e3e" font-family="sans-serif">♫</text>
</svg>
