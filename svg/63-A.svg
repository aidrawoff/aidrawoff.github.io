<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
 <defs>
  <radialGradient id="lamp" cx="72%" cy="26%" r="85%">
   <stop offset="0" stop-color="#ffd98a"/>
   <stop offset=".45" stop-color="#8b4a2f"/>
   <stop offset="1" stop-color="#2a1220"/>
  </radialGradient>
  <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#4d2c86"/>
   <stop offset="1" stop-color="#1e0f38"/>
  </linearGradient>
  <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
