<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e32"/>
      <stop offset="50%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <radialGradient id="catGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </radialGradient>
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e06c75"/>
      <stop offset="100%" stop-color="#b04046"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Rain streaks -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.2" stroke-linecap="round">
    <line x1="90" y1="30" x2="60" y2="120"/>
    <line x1="170" y1="10" x2="140" y2="100"/>
    <line x1="430" y1="200" x2="400" y2="290"/>
    <line x1="470" y1="70" x2="440" y2="160"/>
    <line x1="50" y1="240" x2="20" y2="330"/>
    <line x1="250" y1="15" x2="230" y2="75"/>
  </g>

  <!-- Calendar on wall -->
  <g filter="url(#shadow)">
    <rect x="330" y="50" width="130" height="140" rx="10" fill="#f8f9fa"/>
    <rect x="330" y="50" width="130" height="40" rx="10" fill="#e06c75"/>
    <text x="395" y="76" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MONDAY</text>
    <text x="395" y="150" fill="#222" font-family="sans-serif" font-size="46" font-weight="bold" text-anchor="middle">01</text>
    <line x1="355" y1="42" x2="355" y2="60" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <line x1="435" y1="42" x2="435" y2="60" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(75, 355)" filter="url(#shadow)">
    <ellipse cx="40" cy="55" rx="38" ry="16" fill="#3b4252" opacity="0.6"/>
    <path d="M 15 10 L 65 10 L 60 72 C 60 80 50 85 40 85 C 30 85 20 80 20 72 Z" fill="url(#mugGrad)"/>
    <path d="M 60 25 C 78 25 78 55 60 55" fill="none" stroke="#b04046" stroke-width="8" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 30 -5 Q 38 -18 28 -30" fill="none" stroke="#fff" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <path d="M 50 -10 Q 42 -22 52 -35" fill="none" stroke="#fff" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Cat Base Group -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <polygon points="155,200 185,95 240,170" fill="#121216"/>
    <polygon points="170,180 190,115 222,165" fill="#e06c75" opacity="0.25"/>
    
    <polygon points="357,200 327,95 272,170" fill="#121216"/>
    <polygon points="342,180 322,115 290,165" fill="#e06c75" opacity="0.25"/>

    <!-- Head Body -->
    <circle cx="256" cy="265" r="135" fill="url(#catGlow)" stroke="#4c566a" stroke-width="3"/>
    
    <!-- Face Highlights -->
    <circle cx="256" cy="205" r="95" fill="#ffffff" opacity="0.05"/>

    <!-- Grumpy Eyebrows -->
    <path d="M 170 230 L 235 252" stroke="#e06c75" stroke-width="11" stroke-linecap="round"/>
    <path d="M 342 230 L 277 252" stroke="#e06c75" stroke-width="11" stroke-linecap="round"/>

    <!-- Eyes (Squinted, bright gold) -->
    <polygon points="175,260 225,272 175,282" fill="#ffd700"/>
    <polygon points="337,260 287,272 337,282" fill="#ffd700"/>
    <circle cx="202" cy="271" r="5" fill="#08080c"/>
    <circle cx="310" cy="271" r="5" fill="#08080c"/>

    <!-- Nose & Frown -->
    <polygon points="250,292 262,292 256,303" fill="#e06c75"/>
    <path d="M 205 332 Q 256 300 307 332" fill="none" stroke="#e06c75" stroke-width="9" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="120" y1="305" x2="185" y2="312" stroke="#7b88a1" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="328" x2="185" y2="322" stroke="#7b88a1" stroke-width="3" stroke-linecap="round"/>
    <line x1="392" y1="305" x2="327" y2="312" stroke="#7b88a1" stroke-width="3" stroke-linecap="round"/>
    <line x1="397" y1="328" x2="327" y2="322" stroke="#7b88a1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Subtitle Banner -->
  <g filter="url(#shadow)">
    <rect x="146" y="435" width="220" height="42" rx="21" fill="#2e3440" opacity="0.95"/>
    <text x="256" y="462" fill="#eceff4" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="1" text-anchor="middle">NOPE. NOT TODAY.</text>
  </g>
</svg>
