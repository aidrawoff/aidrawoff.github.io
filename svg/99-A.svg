<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#fffee0"/>
    <stop offset="100%" stop-color="#d4c86a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2a1a3a"/>
    <stop offset="100%" stop-color="#0d0514"/>
  </linearGradient>
  <radialGradient id="ghostglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#c4f0ff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#c4f0ff" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- sky/room -->
<rect width="512" height="512" fill="#130a1f"/>

<!-- moon window glow -->
<circle cx="400" cy="120" r="120" fill="url(#moon)" opacity="0.35"/>
<circle cx="400" cy="120" r="45" fill="#fffee0" opacity="0.9"/>

<!-- window frame -->
<rect x="340" y="60" width="120" height="120" fill="none" stroke="#1a0b2e" stroke-width="6"/>
<line x1="400" y1="60" x2="400" y2="180" stroke="#1a0b2e" stroke-width="4"/>
<line x1="340" y1="120" x2="460" y2="120" stroke="#1a0b2e" stroke-width="4"/>

<!-- floor -->
<rect x="0" y="380" width="512" height="132" fill="url(#floor)"/>

<!-- ghost glow behind -->
<ellipse cx="200" cy="240" rx="90" ry="110" fill="url(#ghostglow)"/>

<!-- ghost body (forgot his sheet - translucent blue spirit) -->
<ellipse cx="200" cy="240" rx="60" ry="75" fill="#8ecae6" opacity="0.5"/>
<ellipse cx="200" cy="240" rx="48" ry="62" fill="#a8d8ea" opacity="0.55"/>
<ellipse cx="200" cy="240" rx="35" ry="48" fill="#c4f0ff" opacity="0.4"/>

<!-- ghost tail wisps -->
<path d="M155 290 Q140 330 165 350 Q175 330 170 300" fill="#8ecae6" opacity="0.4"/>
<path d="M245 290 Q260 330 235 350 Q225 330 230 300" fill="#8ecae6" opacity="0.4"/>
<path d="M175 305 Q165 340 185 360 Q195 340 190 315" fill="#a8d8ea" opacity="0.35"/>
<path d="M225 305 Q235 340 215 360 Q205 340 210 315" fill="#a8d8ea" opacity="0.35"/>

<!-- ghost arms -->
<path d="M150 250 Q120 270 130 295" stroke="#8ecae6" stroke-width="9" fill="none" opacity="0.55" stroke-linecap="round"/>
<path d="M250 250 Q280 270 270 295" stroke="#8ecae6" stroke-width="9" fill="none" opacity="0.55" stroke-linecap="round"/>

<!-- ghost face - big, expressive, embarrassed -->
<ellipse cx="182" cy="220" rx="9" ry="11" fill="#1a0b2e"/>
<ellipse cx="218" cy="220" rx="9" ry="11" fill="#1a0b2e"/>
<ellipse cx="184" cy="218" rx="3" ry="4" fill="#fff" opacity="0.6"/>
<ellipse cx="220" cy="218" rx="3" ry="4" fill="#fff" opacity="0.6"/>

<!-- worried eyebrows -->
<path d="M172 205 Q182 200 192 208" stroke="#1a0b2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M208 208 Q218 200 228 205" stroke="#1a0b2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>

<!-- small embarrassed mouth -->
<ellipse cx="200" cy="248" rx="4" ry="5" fill="#1a0b2e"/>

<!-- blush marks -->
<ellipse cx="165" cy="235" rx="8" ry="5" fill="#ff8fa3" opacity="0.35"/>
<ellipse cx="235" cy="235" rx="8" ry="5" fill="#ff8fa3" opacity="0.35"/>

<!-- sweat drop -->
<path d="M235 200 Q240 190 245 200 Q245 210 235 200" fill="#a8d8ea" opacity="0.7"/>

<!-- the forgotten sheet on floor -->
<path d="M290 405 Q330 395 370 410 Q385 425 365 435 Q320 445 285 435 Q275 420 290 405" fill="#e8e8e8"/>
<path d="M295 410 Q315 405 335 415" stroke="#bbb" stroke-width="2" fill="none"/>
<path d="M305 420 Q325 425 345 420" stroke="#bbb" stroke-width="1.5" fill="none"/>

<!-- eye holes in sheet -->
<ellipse cx="320" cy="415" rx="6" ry="7" fill="#1a0b2e"/>
<ellipse cx="340" cy="415" rx="6" ry="7" fill="#1a0b2e"/>

<!-- sheet shadow -->
<ellipse cx="330" cy="438" rx="45" ry="8" fill="#0d0514" opacity="0.5"/>

<!-- floor boards -->
<line x1="0" y1="400" x2="512" y2="400" stroke="#1a0b2e" stroke-width="1.5" opacity="0.5"/>
<line x1="0" y1="430" x2="512" y2="430" stroke="#1a0b2e" stroke-width="1.5" opacity="0.5"/>
<line x1="0" y1="460" x2="512" y2="460" stroke="#1a0b2e" stroke-width="1.5" opacity="0.5"/>
<line x1="100" y1="380" x2="80" y2="512" stroke="#1a0b2e" stroke-width="1" opacity="0.3"/>
<line x1="300" y1="380" x2="280" y2="512" stroke="#1a0b2e" stroke-width="1" opacity="0.3"/>
<line x1="450" y1="380" x2="430" y2="512" stroke="#1a0b2e" stroke-width="1" opacity="0.3"/>

<!-- dust motes / atmosphere -->
<circle cx="120" cy="150" r="1.5" fill="#fff" opacity="0.4"/>
<circle cx="350" cy="280" r="1.2" fill="#fff" opacity="0.35"/>
<circle cx="80" cy="320" r="2" fill="#fff" opacity="0.3"/>
<circle cx="280" cy="100" r="1" fill="#fff" opacity="0.5"/>
<circle cx="150" cy="350" r="1.5" fill="#fff" opacity="0.25"/>
</svg>