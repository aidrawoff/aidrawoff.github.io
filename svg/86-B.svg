<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background sky -->
  <rect width="512" height="512" fill="#e0f7fa"/>

  <!-- Road and horizon -->
  <rect x="0" y="384" width="512" height="128" fill="#333"/>
  <rect x="0" y="416" width="512" height="16" fill="#555"/>

  <!-- Bus cabin (silhouette) -->
  <path d="M 64 256 L 320 256 L 320 224 L 384 224 L 384 288 L 64 288 Z" fill="#222"/>
  <!-- Driver window -->
  <rect x="288" y="240" width="32" height="24" fill="#a0d8f3" rx="2"/>
  <!-- Driver (pig) -->
  <circle cx="304" cy="252" r="12" fill="#ffb6c1"/>
  <path d="M 304 240 L 304 232" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Wheels -->
  <circle cx="128" cy="368" r="24" fill="#333"/>
  <circle cx="320" cy="368" r="24" fill="#333"/>
  <circle cx="128" cy="368" r="16" fill="#777"/>
  <circle cx="320" cy="368" r="16" fill="#777"/>

  <!-- Road lines -->
  <rect x="0" y="416" width="64" height="8" fill="#fff" opacity="0.6"/>
  <rect x="128" y="416" width="64" height="8" fill="#fff" opacity="0.6"/>
  <rect x="256" y="416" width="64" height="8" fill="#fff" opacity="0.6"/>
  <rect x="384" y="416" width="64" height="8" fill="#fff" opacity="0.6"/>
</svg>