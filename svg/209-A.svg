<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich atmospheric background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="50%" stop-color="#2d1b36"/>
      <stop offset="100%" stop-color="#4a2545"/>
    </linearGradient>

    <!-- Warm counter gradient -->
    <linearGradient id="counterWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c68b59"/>
      <stop offset="30%" stop-color="#b07243"/>
      <stop offset="100%" stop-color="#7a4622"/>
    </linearGradient>

    <!-- Display case shelf gradient -->
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9d8a6"/>
      <stop offset="50%" stop-color="#faedcd"/>
      <stop offset="100%" stop-color="#e9d8a6"/>
    </linearGradient>

    <!-- Ghost glow and lighting filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background wall -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Wallpaper pattern / chalk menu board in background -->
  <rect x="64" y="40" width="384" height="210" rx="16" fill="#1e1424" stroke="#5c3a51" stroke-width="3" filter="url(#dropShadow)"/>
  
  <!-- Chalkboard Menu text lines -->
  <text x="90" y="80" fill="#f4a261" font-family="serif" font-size="16" font-weight="bold">MIDNIGHT BAKERY MENU</text>
  <line x1="90" y1="92" x2="240" y2="92" stroke="#e9d8a6" stroke-width="2" stroke-dasharray="4,4"/>
  
  <circle cx="95" cy="120" r="4" fill="#e76f51"/>
  <text x="110" y="125" fill="#fefae0" font-family="sans-serif" font-size="13">Ecto-Eclairs .............. 5G</text>
  
  <circle cx="95" cy="150" r="4" fill="#e76f51"/>
  <text x="110" y="155" fill="#fefae0" font-family="sans-serif" font-size="13">Phantom Pies ............. 8G</text>
  
  <circle cx="95" cy="180" r="4" fill="#e76f51"/>
  <text x="110" y="185" fill="#fefae0" font-family="sans-serif" font-size="13">Spirit Sourdough ....... 6G</text>

  <!-- Warm Pendant Light Fixtures -->
  <path d="M256,0 L256,50" stroke="#b07243" stroke-width="4"/>
  <path d="M128,0 L128,70" stroke="#b07243" stroke-width="3"/>
  
  <polygon points="230,50 282,50 296,75 216,75" fill="#dda15e"/>
  <circle cx="256" cy="80" r="18" fill="#fffaa0" filter="url(#softGlow)"/>

  <polygon points="108,70 148,70 156,90 100,90" fill="#dda15e"/>
  <circle cx="128" cy="94" r="12" fill="#fffaa0" filter="url(#softGlow)"/>

  <!-- Display Case Shelves -->
  <rect x="64" y="220" width="384" height="12" rx="4" fill="url(#shelfGrad)" filter="url(#dropShadow)"/>
  
  <!-- Pastries on upper shelf -->
  <!-- Croissant -->
  <path d="M100,210 q15,-15 30,0 q10,10 -5,15 q-15,5 -25,-15 z" fill="#f4a261" filter="url(#dropShadow)"/>
  <!-- Layer Cake -->
  <rect x="180" y="190" width="50" height="30" rx="4" fill="#e76f51"/>
  <rect x="175" y="185" width="60" height="10" rx="3" fill="#fefae0"/>
  <circle cx="205" cy="182" r="6" fill="#e63946"/>
  <!-- Cupcakes -->
  <path d="M290,220 L300,195 L320,195 L330,220 Z" fill="#dda15e"/>
  <circle cx="310" cy="192" r="14" fill="#ffb7b2"/>
  <circle cx="310" cy="185" r="5" fill="#ffffff"/>

  <!-- Main Bakery Counter -->
  <rect x="0" y="320" width="512" height="192" fill="url(#counterWood)" filter="url(#dropShadow)"/>
  <rect x="0" y="320" width="512" height="16" fill="#f4a261" opacity="0.4"/>
  <line x1="0" y1="336" x2="512" y2="336" stroke="#5a3114" stroke-width="4"/>
  
  <!-- Glass display case shield on counter -->
  <rect x="64" y="240" width="384" height="80" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-width="2" rx="4"/>
  
  <!-- Pastries inside counter display -->
  <ellipse cx="130" cy="290" rx="22" ry="12" fill="#e9c46a" filter="url(#dropShadow)"/>
  <ellipse cx="210" cy="285" rx="16" ry="14" fill="#f4a261" filter="url(#dropShadow)"/>
  <path d="M290,300 q15,-25 35,0 z" fill="#e76f51" filter="url(#dropShadow)"/>
  <rect x="360" y="275" width="45" height="35" rx="6" fill="#2a9d8f" filter="url(#dropShadow)"/>

  <!-- Cash Register / Tip Jar -->
  <rect x="425" y="265" width="60" height="55" rx="8" fill="#e9d8a6" filter="url(#dropShadow)"/>
  <rect x="435" y="245" width="40" height="22" rx="4" fill="#264653"/>
  <rect x="442" y="280" width="26" height="14" rx="2" fill="#2b2d42"/>
  <circle cx="455" cy="305" r="8" fill="#e76f51"/>
  <text x="452" y="309" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold">TIPS</text>

  <!-- GHOST AT THE COUNTER (Dynamic, expressive, glowing) -->
  <g filter="url(#softGlow)">
    <!-- Ghost Body with flowing trailing tail -->
    <path d="M200,210 
             c-45,0 -75,35 -75,80 
             l0,120 
             q12,-12 24,0 
             q12,-12 24,0 
             q12,-12 24,0 
             q12,-12 24,0 
             l0,-120 
             c0,-45 -30,-80 -30,-80 z" 
          fill="#ffffff" opacity="0.95" filter="url(#dropShadow)"/>
          
    <!-- Floating Sparkles / Magical Dust -->
    <circle cx="160" cy="250" r="3" fill="#fffaa0"/>
    <circle cx="280" cy="230" r="4" fill="#fffaa0"/>
    <circle cx="295" cy="260" r="2" fill="#fffaa0"/>
    <polygon points="270,210 273,218 281,220 273,222 270,230 267,222 259,220 267,218" fill="#fffaa0"/>

    <!-- Ghost Expression & Face (Asymmetric, lively, curious) -->
    <!-- Left Eye (Winking/Happy arch or large expressive oval) -->
    <ellipse cx="182" cy="265" rx="7" ry="10" fill="#1e1424"/>
    <circle cx="185" cy="261" r="3" fill="#ffffff"/> <!-- eye specular highlight -->
    
    <!-- Right Eye (Curious raised look) -->
    <ellipse cx="218" cy="263" rx="7" ry="10" fill="#1e1424"/>
    <circle cx="221" cy="259" r="3" fill="#ffffff"/> <!-- eye specular highlight -->

    <!-- Eyebrows for attitude -->
    <path d="M175,250 q7,-4 14,2" stroke="#1e1424" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M211,248 q7,4 14,-2" stroke="#1e1424" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Happy Open O-mouth pointing at pastry -->
    <ellipse cx="200" cy="285" rx="8" ry="11" fill="#1e1424"/>
    <path d="M194,280 q6,4 12,0" stroke="#ff8fa3" stroke-width="2" fill="none"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="168" cy="278" rx="6" ry="4" fill="#ffb7b2" opacity="0.7"/>
    <ellipse cx="232" cy="276" rx="6" ry="4" fill="#ffb7b2" opacity="0.7"/>

    <!-- Ghost Arms pointing eagerly at the pastry case -->
    <path d="M135,290 q-25,-10 -45,5" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M265,290 q25,-5 40,15" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Glowing pastry being pointed at -->
  <circle cx="310" cy="305" r="8" fill="#fffaa0" filter="url(#softGlow)"/>
</svg>
