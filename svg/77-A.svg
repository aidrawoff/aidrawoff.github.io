  <circle cx="120" cy="80" r="2" fill="#ffc107" opacity="0.6"/>
  <circle cx="480" cy="60" r="2" fill="#ff9800" opacity="0.5"/>
  <circle cx="450" cy="90" r="2" fill="#ff5722" opacity="0.6"/>
  <circle cx="100" cy="440" r="3" fill="#00bcd4" opacity="0.5"/>
  <circle cx="400" cy="360" r="3" fill="#9c27b0" opacity="0.6"/>
