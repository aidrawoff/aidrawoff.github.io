  <circle cx="256" cy="256" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="180" cy="120" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="340" cy="160" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="300" cy="400" r="1.5" fill="#fff" opacity="0.7"/>
  <!-- Main subject: witch silhouette with party twist -->
