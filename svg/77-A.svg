  <path id="head" d="M256 180c20 0 36 16 36 36 0 20-16 36-36 36s-36-16-36-36c0-20 16-36 36-36zm0 10c8 0 15 7 15 15s-7 15-15 15-15-7-15-15 7-15 15-15z" fill="#f5f5f5"/>
