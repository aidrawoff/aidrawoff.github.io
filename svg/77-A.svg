  <!-- Soft glow around head -->
  <ellipse cx="256" cy="200" rx="28" ry="18" fill="#fff" opacity="0.1"/>
  <path id="hat" d="M240 160c-12-10-28-10-40 0-1-1-2-1-3 0-12 10-28 10-40 0-1 1-2 1-3 0-12 10-28 10-40 0 1 1 2 1 3 0 12-10 28-10 40 0 1-1 2-1 3 12 10 28 10 40 0 1-1 2-1 3 0 12 10 28 10 40 0 1 1 2 1 3 12-10 28-10 40 0" fill="#ff5722"/>
  <!-- Body -->
  <path id="body" d="M256 252c-30 0-54 24-54 54h108v-54z" fill="#f5f5f5"/>
