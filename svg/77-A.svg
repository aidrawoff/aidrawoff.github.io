  <circle cx="270" cy="400" r="5" fill="#fff" opacity="0.2"/>
  <!-- Cake candles -->
  <rect x="248" y="340" width="2" height="12" fill="#ff5722"/>
  <rect x="256" y="340" width="2" height="12" fill="#ff5722"/>
  <rect x="264" y="340" width="2" height="12" fill="#ff5722"/>
