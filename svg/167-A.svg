  <path d="M40 430 L120 430 M300 470 L400 470 M150 495 L230 495" stroke="#3d3158" stroke-width="4" stroke-linecap="round"/>
  <!-- hero group, enlarged -->
  <g transform="translate(256 300) scale(1.3) translate(-256 -330)">
    <ellipse cx="256" cy="446" rx="170" ry="16" fill="#120c1c" opacity="0.5"/>
    <!-- bike wheels -->
    <circle cx="170" cy="380" r="62" fill="none" stroke="#120c1c" stroke-width="12"/>
    <circle cx="352" cy="380" r="62" fill="none" stroke="#120c1c" stroke-width="12"/>
    <circle cx="170" cy="380" r="6" fill="#120c1c"/>
    <circle cx="352" cy="380" r="6" fill="#120c1c"/>
    <!-- frame -->
    <path d="M170 380 L240 300 L352 380 M240 300 L300 300 L352 380 M240 300 L225 265" fill="none" stroke="#120c1c" stroke-width="12" stroke-linejoin="round"/>
    <!-- basket with cat peeking -->
    <path d="M300 250 L360 250 L352 300 L308 300 Z" fill="#b5773a" stroke="#120c1c" stroke-width="6"/>
    <path d="M308 262 L352 262 M304 276 L356 276 M308 290 L352 290" stroke="#6b4220" stroke-width="3"/>
    <path d="M316 252 L318 232 L326 246 L334 230 L340 252 Z" fill="#120c1c"/>
    <circle cx="326" cy="258" r="2" fill="#ffd98a"/>
    <circle cx="338" cy="258" r="2" fill="#ffd98a"/>
    <!-- cape flowing behind -->
    <path d="M232 230 Q190 270 176 300 Q200 296 214 290 Q208 310 196 326 Q226 312 240 296 Z" fill="#2a1f3d" stroke="#0a0712" stroke-width="4"/>
    <!-- witch body -->
    <path d="M205 290 Q225 200 255 215 Q280 230 270 300 Z" fill="#1a1426" stroke="#0a0712" stroke-width="6"/>
    <!-- rim light on shoulder -->
    <path d="M250 218 Q268 228 266 250" fill="none" stroke="#ffb36b" stroke-width="3" opacity="0.8"/>
    <!-- hair -->
    <path d="M220 200 Q214 232 226 240 M258 200 Q266 228 254 238" fill="none" stroke="#c9a0ff" stroke-width="3"/>
    <!-- head -->
    <circle cx="240" cy="200" r="24" fill="#7fd36b" stroke="#0a0712" stroke-width="5"/>
    <!-- hat -->
    <path d="M206 186 L274 186 L240 110 Z" fill="#1a1426" stroke="#0a0712" stroke-width="5" stroke-linejoin="round"/>
    <path d="M240 112 L262 184" fill="none" stroke="#ffb36b" stroke-width="2" opacity="0.7"/>
    <ellipse cx="240" cy="188" rx="46" ry="8" fill="#1a1426" stroke="#0a0712" stroke-width="4"/>
    <!-- sly eyes -->
    <circle cx="232" cy="201" r="4" fill="#fff6a0"/>
    <circle cx="249" cy="201" r="4" fill="#fff6a0"/>
    <path d="M226 192 L238 195 M244 195 L254 192" stroke="#0a0712" stroke-width="3"/>
    <!-- grin -->
    <path d="M228 212 Q240 224 254 212" fill="#0a0712" stroke="#0a0712" stroke-width="2"/>
    <!-- arm on handlebar -->
    <path d="M262 250 L290 282" stroke="#1a1426" stroke-width="12" stroke-linecap="round"/>
  </g>
