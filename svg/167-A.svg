<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="0.6" stop-color="#6a3a7a"/>
      <stop offset="1" stop-color="#f08a5d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb36b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
  <circle cx="390" cy="110" r="46" fill="#ffd98a" opacity="0.9"/>
  <circle cx="256" cy="260" r="200" fill="url(#glow)"/>
  <g fill="#fff6d6" opacity="0.8">
    <circle cx="60" cy="70" r="2"/><circle cx="130" cy="150" r="1.5"/><circle cx="200" cy="50" r="2"/>
    <circle cx="470" cy="60" r="1.5"/><circle cx="30" cy="200" r="1.5"/><circle cx="480" cy="210" r="2"/>
  </g>
  <!-- distant trees -->
  <path d="M0 380 L0 330 Q20 300 40 330 L40 380 Z M460 380 L460 318 Q485 285 512 318 L512 380 Z" fill="#2a1e3c"/>
  <path d="M60 380 L70 300 L82 380 Z M95 380 L104 320 L114 380 Z M430 380 L440 310 L452 380 Z" fill="#241a36"/>
  <!-- ground -->
  <rect x="0" y="380" width="512" height="132" fill="#2d2440"/>
