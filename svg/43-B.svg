<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: upside-down jungle floor gradient -->
  <defs>
    <linearGradient id="floorGrad" x1="0" y1="512" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a5c3d"/>
      <stop offset="1" stop-color="#0f3a1a"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#3a6b4a"/>
    </linearGradient>
  </defs>

  <!-- Upside-down jungle floor -->
  <rect x="0" y="0" width="512" height="512" fill="url(#floorGrad)"/>

  <!-- Upside-down canopy (top of image) -->
  <rect x="0" y="0" width="512" height="256" fill="url(#canopyGrad)"/>

  <!-- Upside-down pumpkin with carved face -->
  <path d="M 256 256 c -30 -20 -60 -40 -90 -60 c -20 -15 -40 -30 -60 -45 c -25 -20 -50 -40 -75 -60 c -30 -25 -60 -50 -90 -75 c -25 -20 -50 -40 -75 -60 c -30 -25 -60 -50 -90 -75 c -30 -25 -60 -50 -90 -75 l 0 150 c 0 20 10 40 30 50 c 15 7 30 14 45 20 c 20 8 40 16 60 24 c 25 10 50 20 75 30 c 30 12 60 24 90 36 c 25 10 50 20 75 30 c 30 12 60 24 90 36 c 30 12 60 24 90 36 l 0 -150 c 0 -20 -10 -40 -30 -50 c -15 -7 -30 -14 -45 -20 c -20 -8 -40 -16 -60 -24 c -25 -10 -50 -20 -75 -30 c -30 -12 -60 -24 -90 -36 z" fill="#f4a442" transform="rotate(180 256 256)"/>
  <!-- Carved face details -->
  <path d="M 256 260 L 240 280 M 256 260 L 272 280 M 240 290 L 272 290 M 256 300 L 240 320 M 256 300 L 272 320" stroke="#2a1e18" stroke-width="4" stroke-linecap="round" transform="rotate(180 256 256)"/>

  <!-- Upside-down broom (tilted) -->
  <path d="M 256 320 c 0 -40 10 -80 30 -110 c 15 -20 30 -40 45 -60 c 10 -15 20 -30 30 -45 l 0 -60 c 0 -10 -5 -20 -10 -25 l -2 -5 c -3 -5 -6 -10 -9 -15 l -10 -20 c -5 -10 -10 -20 -15 -30 l -5 -10 c -3 -5 -6 -10 -9 -15 l -15 -30 c -5 -10 -10 -20 -15 -30 l -5 -10 c -3 -5 -6 -10 -9 -15 l -20 -40 c -5 -10 -10 -20 -15 -30 z" fill="#8b4513" transform="rotate(180 256 256)"/>

  <!-- Upside-down dust pile (tilted) -->
  <path d="M 200 380 c 20 -10 40 -20 60 -30 c 15 -7 30 -14 45 -20 c 10 -5 20 -10 30 -15 l 0 30 c 0 5 -2 10 -5 15 l -5 10 c -3 5 -6 10 -9 15 l -10 20 c -5 10 -10 20 -15 30 l -5 10 c -3 5 -6 10 -9 15 l -15 30 c -5 10 -10 20 -15 30 z" fill="#d2b48c" transform="rotate(180 256 256)"/>

  <!-- Upside-down vines/foliage accents -->
  <path d="M 120 120 c 10 -5 20 -10 30 -15 c 5 -3 10 -6 15 -9 l 0 30 c 0 5 -2 10 -5 15 l -5 10 c -3 5 -6 10 -9 15 l -10 20 c -5 10 -10 20 -15 30 l -5 10 c -3 5 -6 10 -9 15 l -15 30 c -5 10 -10 20 -15 30" fill="#2e8b57" transform="rotate(180 256 256)"/>
  <path d="M 380 140 c -10 -5 -20 -10 -30 -15 c -5 -3  -10 -6 -15 -9 l 0 30 c 0 5 2 10 5 15 l 5 10 c 3 5 6 10 9 15 l 10 20 c 5 10 10 20 15 30 l 5 10 c 3 5 6 10 9 15 l 15 30 c 5 10 10 20 15 30" fill="#2e8b57" transform="rotate(180 256 256)"/>

  <!-- Upside-down jungle clutter: leaves, roots, and debris -->
  <path d="M 80 360 c 15 -8 30 -16 45 -24 c 10 -6 20 -12 30 -18 l 0 25 c 0 5 -2 10 -5 15 l -5 10 c -3 5 -6 10 -9 15 l -8 16 c -4 8 -8 16 -12 24 l -4 8 c -2 4 -4 8 -6 12 l -12 24 c -4 8 -8 16 -12 24" fill="#3a5f3a" transform="rotate(180 256 256)"/>
  <path d="M 420 380 c -15 -8 -30 -16 -45 -24 c -10 -6 -20 -12 -30 -18 l 0 25 c 0 5 2 10 5 15 l 5 10 c 3 5 6 10 9 15 l 8 16 c 4 8 8 16 12 24 l 4 8 c 2 4 4 8 6 12 l 12 24 c 4 8 8 16 12 24" fill="#3a5f3a" transform="rotate(180 256 256)"/>
  <circle cx="180" cy="180" r="12" fill="#8b4513" transform="rotate(180 256 256)"/>
  <circle cx="320" cy="200" r="10" fill="#228b22" transform="rotate(180 256 256)"/>
  <circle cx="100" cy="280" r="8" fill="#2e8b57" transform="rotate(180 256 256)"/>
  <circle cx="400" cy="300" r="9" fill="#3a5f3a" transform="rotate(180 256 256)"/>
  <!-- Extra jungle debris for depth -->
  <path d="M 120 340 c 10 -5 20 -10 30 -15 c 5 -3 10 -6 15 -9 l 0 20 c 0 3 -1 6 -3 8 l -3 6 c -2 3 -4 6 -6 9 l -6 12 c -3 6 -6 12 -9 18 l -3 6 c -2 3 -4 6 -6 9 l -9 18 c -3 6 -6 12 -9 18" fill="#556b2f" transform="rotate(180 256 256)"/>
  <path d="M 380 360 c -10 -5 -20 -10 -30 -15 c -5 -3 -10 -6 -15 -9 l 0 20 c 0 3 1 6 3 8 l 3 6 c 2 3 4 6 6 9 l 6 12 c 3 6 6 12 9 18 l 3 6 c 2 3 4 6 6 9 l 9 18 c 3 6 6 12 9 18" fill="#556b2f" transform="rotate(180 256 256)"/>

  <!-- Upside-down subtle light rays -->
  <path d="M 256 0 L 220 120 M 256 0 L 292 120 M 256 0 L 180 140 M 256 0 L 332 140 M 256 0 L 140 160 M 256 0 L 372 160" stroke="#a0d8a0" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round" transform="rotate(180 256 256)"/>

  <!-- Title text for preview recognition -->
  <text x="256" y="256" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" transform="rotate(180 256 256)">PUMPKIN IN THE JUNGLE</text>
  <!-- Subtle jungle glow accents -->
  <circle cx="256" cy="120" r="40" fill="#a0d8a0" fill-opacity="0.1" transform="rotate(180 256 256)"/>
</svg>