<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Warm kitchen background -->
  <rect width="512" height="512" fill="#f5e7d3"/>

  <!-- Floor shadow gradient -->
  <rect x="0" y="320" width="512" height="192" fill="url(#floorShadow)"/>
  <defs>
    <linearGradient id="floorShadow" x1="0" y1="320" x2="0" y2="512">
      <stop offset="0" stop-color="#d4b896" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a8875c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Back wall and shelves -->
  <rect x="0" y="0" width="512" height="320" fill="#e8d5b7"/>
  <rect x="60" y="60" width="40" height="200" fill="#c4a882"/>
  <rect x="120" y="80" width="35" height="180" fill="#b8996f"/>
  <rect x="180" y="50" width="45" height="210" fill="#c4a882"/>

  <!-- Ghost-bat silhouette (centered) -->
  <g transform="translate(256,220)">
    <!-- Head/hat (chef hat) -->
    <path d="M0,-60 L40,-60 L20,-120 Z" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <!-- Hat crease and band -->
    <path d="M10,-70 L30,-70 M10,-70 L10,-80 M30,-70 L30,-80" stroke="#552a00" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="20" cy="-90" r="3" fill="#552a00"/>
    <!-- Body (bat torso) -->
    <path d="M20,-120 C40,-140 80,-140 100,-120 C120,-100 120,-60 100,-40 C80,-20 40,-20 20,-40 C0,-60 -20,-60 -40,-40 C-60,-20 -60,20 -40,40 C-20,60 20,60 40,40 C60,20 60,-20 40,-40 C20,-60 0,-60 0,-40 Z" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <!-- Eyes and mouth -->
    <circle cx="15" cy="-75" r="4" fill="#333"/>
    <circle cx="30" cy="-75" r="4" fill="#333"/>
    <path d="M15,-65 Q22.5,-60 30,-65" stroke="#333" stroke-width="1.5" fill="none"/>
    <!-- Cheek blush -->
    <circle cx="10" cy="-85" r="3" fill="#ff9d9d" opacity="0.6"/>
    <!-- Tuba (held by "hand" at bottom-left of body) -->
    <path d="M-20,20 L-40,40 L-60,20 L-40,0 Z" fill="#ff6b6b" stroke="#333" stroke-width="1"/>
    <path d="M-60,20 Q-70,25 -80,20" stroke="#333" stroke-width="1" fill="none"/>
    <path d="M-40,40 Q-50,50 -60,40" stroke="#333" stroke-width="1" fill="none"/>
    <path d="M-20,20 L-20,0" stroke="#333" stroke-width="1" fill="none"/>
    <!-- Whisk as bat wing/arm -->
    <path d="M40,-80 C60,-90 80,-85 90,-70 C100,-55 95,-40 85,-30 C75,-20 60,-25 50,-40 C40,-55 35,-70 40,-80 Z" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <!-- Whisk curls (chef tool) -->
    <path d="M85,-30 C100,-10 120,10 130,30 C140,50 135,70 120,80 C105,90 85,85 75,70 C65,55 70,35 85,-30 Z" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <path d="M120,80 C140,95 160,90 170,80 C180,70 175,60 165,55 C155,50 145,55 135,60 C125,65 120,75 120,80 Z" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  </g>

  <!-- Soft light highlights -->
  <circle cx="100" cy="100" r="30" fill="#f9e7c9" opacity="0.6"/>
  <circle cx="400" cy="80" r="25" fill="#f9e7c9" opacity="0.5"/>

  <!-- Steam from tuba (thicker, more character) -->
  <path d="M220,110 Q240,85 260,110 Q280,135 300,110 Q320,85 340,110" stroke="#f0f0f0" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M240,95 Q250,80 260,95" stroke="#f0f0f0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>