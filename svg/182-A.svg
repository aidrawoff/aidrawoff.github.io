<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1f3d"/>
      <stop offset="100%" stop-color="#0d0a12"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="100%" stop-color="#e6dcc3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Moon -->
  <circle cx="420" cy="100" r="55" fill="url(#moon)" opacity="0.9"/>
  <circle cx="400" cy="85" r="10" fill="#d4cbb0" opacity="0.4"/>
  <circle cx="435" cy="110" r="7" fill="#d4cbb0" opacity="0.3"/>

  <!-- Stars -->
  <circle cx="80" cy="70" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="50" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="250" cy="90" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="320" cy="60" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="480" cy="180" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="60" cy="200" r="1" fill="#fff" opacity="0.5"/>

  <!-- Floor / rug -->
  <ellipse cx="256" cy="420" rx="180" ry="40" fill="#4a3b2a"/>
  <ellipse cx="256" cy="420" rx="160" ry="32" fill="#5c4a35"/>

  <!-- Mummy body (sleepy, slumped) -->
  <!-- Bandage-wrapped body, leaning left -->
  <ellipse cx="256" cy="300" rx="70" ry="90" fill="#c9b99a" transform="rotate(-8 256 300)"/>
  <ellipse cx="256" cy="300" rx="60" ry="80" fill="#d4c4a8" transform="rotate(-8 256 300)"/>

  <!-- Bandage wraps -->
  <path d="M200 240 Q256 260 312 240" stroke="#b8a888" stroke-width="4" fill="none" transform="rotate(-8 256 300)"/>
  <path d="M195 270 Q256 290 317 270" stroke="#b8a888" stroke-width="4" fill="none" transform="rotate(-8 256 300)"/>
  <path d="M190 300 Q256 320 322 300" stroke="#b8a888" stroke-width="4" fill="none" transform="rotate(-8 256 300)"/>
  <path d="M195 330 Q256 350 317 330" stroke="#b8a888" stroke-width="4" fill="none" transform="rotate(-8 256 300)"/>
  <path d="M205 360 Q256 380 307 360" stroke="#b8a888" stroke-width="4" fill="none" transform="rotate(-8 256 300)"/>

  <!-- Pajama stripes on body -->
  <path d="M210 255 Q256 275 302 255" stroke="#6b8e9f" stroke-width="5" fill="none" opacity="0.6" transform="rotate(-8 256 300)"/>
  <path d="M205 285 Q256 305 307 285" stroke="#6b8e9f" stroke-width="5" fill="none" opacity="0.6" transform="rotate(-8 256 300)"/>
  <path d="M200 315 Q256 335 312 315" stroke="#6b8e9f" stroke-width="5" fill="none" opacity="0.6" transform="rotate(-8 256 300)"/>

  <!-- Head -->
  <ellipse cx="230" cy="200" rx="45" ry="42" fill="#c9b99a" transform="rotate(-12 230 200)"/>
  <ellipse cx="230" cy="200" rx="38" ry="35" fill="#d4c4a8" transform="rotate(-12 230 200)"/>

  <!-- Head bandages -->
  <path d="M195 175 Q230 185 265 170" stroke="#b8a888" stroke-width="3" fill="none" transform="rotate(-12 230 200)"/>
  <path d="M190 195 Q230 205 270 190" stroke="#b8a888" stroke-width="3" fill="none" transform="rotate(-12 230 200)"/>
  <path d="M192 215 Q230 225 268 210" stroke="#b8a888" stroke-width="3" fill="none" transform="rotate(-12 230 200)"/>

  <!-- Pajama cap -->
  <path d="M195 165 Q230 130 265 160" fill="#7a9ab0" transform="rotate(-12 230 200)"/>
  <circle cx="195" cy="165" r="10" fill="#7a9ab0" transform="rotate(-12 230 200)"/>
  <circle cx="185" cy="155" r="6" fill="#fff" opacity="0.8" transform="rotate(-12 230 200)"/>

  <!-- Sleepy eyes (closed, curved lines) -->
  <path d="M210 200 Q220 208 230 200" stroke="#5a4a3a" stroke-width="2.5" fill="none" transform="rotate(-12 230 200)"/>
  <path d="M235 195 Q245 203 255 195" stroke="#5a4a3a" stroke-width="2.5" fill="none" transform="rotate(-12 230 200)"/>

  <!-- Little zzzs -->
  <text x="170" y="160" font-family="sans-serif" font-size="18" fill="#a8c4d9" opacity="0.8">z</text>
  <text x="155" y="140" font-family="sans-serif" font-size="14" fill="#a8c4d9" opacity="0.7">z</text>
  <text x="145" y="125" font-family="sans-serif" font-size="10" fill="#a8c4d9" opacity="0.6">z</text>

  <!-- Drool -->
  <path d="M225 225 Q228 235 225 242 Q222 235 225 225" fill="#a8d8ea" opacity="0.7" transform="rotate(-12 230 200)"/>

  <!-- Arms (slumped) -->
  <ellipse cx="310" cy="280" rx="22" ry="45" fill="#c9b99a" transform="rotate(-25 310 280)"/>
  <ellipse cx="310" cy="280" rx="16" ry="38" fill="#d4c4a8" transform="rotate(-25 310 280)"/>
  <path d="M295 250 Q310 280 325 310" stroke="#b8a888" stroke-width="3" fill="none" transform="rotate(-25 310 280)"/>

  <ellipse cx="200" cy="310" rx="20" ry="40" fill="#c9b99a" transform="rotate(15 200 310)"/>
  <ellipse cx="200" cy="310" rx="14" ry="34" fill="#d4c4a8" transform="rotate(15 200 310)"/>
  <path d="M188 285 Q200 310 212 335" stroke="#b8a888" stroke-width="3" fill="none" transform="rotate(15 200 310)"/>

  <!-- Teddy bear (loose bandages) -->
  <ellipse cx="340" cy="380" rx="18" ry="22" fill="#c9b99a"/>
  <circle cx="340" cy="365" r="12" fill="#c9b99a"/>
  <circle cx="336" cy="362" r="2" fill="#5a4a3a"/>
  <circle cx="344" cy="362" r="2" fill="#5a4a3a"/>
  <ellipse cx="340" cy="368" rx="3" ry="2" fill="#5a4a3a"/>
  <ellipse cx="325" cy="375" rx="7" ry="5" fill="#c9b99a"/>
  <ellipse cx="355" cy="375" rx="7" ry="5" fill="#c9b99a"/>
  <path d="M332 380 Q340 385 348 380" stroke="#b8a888" stroke-width="2" fill="none"/>

  <!-- Shadow -->
  <ellipse cx="256" cy="410" rx="90" ry="15" fill="#000" opacity="0.3"/>
</svg>