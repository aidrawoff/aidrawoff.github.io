<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a2a"/>
      <stop offset="1" stop-color="#000814"/>
    </linearGradient>
    <radialGradient id="shellGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2a9d8f" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Turtle shell (main silhouette) -->
  <g id="turtle" filter="url(#shadow)">
    <path d="M256 320c-40 0-72 32-72 72 0 12-3 24-8 34-5 10-12 18-20 24-8 6-18 10-28 12-10 2-20 2-30 0-10-2-20-6-28-12-8-6-15-14-20-24-5-10-8-22-8-34 0-40-32-72-72-72s-72 32-72 72c0 12 3 24 8 34 5 10 12 18 20 24 8 6 18 10 28 12 10 2 20 2 30 0 10-2 20-6 28-12 8-6 15-14 20-24 5-10 8-22 8-34 0-40-32-72-72-72s-72 32-72 72c0 40 32 72 72 72h144z" fill="url(#shellGlow)"/>
  </g>

  <!-- City on shell -->
  <g id="city">
    <!-- Towers -->
    <rect x="220" y="280" width="8" height="40" fill="#e63946"/>
    <rect x="240" y="260" width="8" height="60" fill="#e63946"/>
    <rect x="260" y="270" width="8" height="50" fill="#e63946"/>
    <rect x="280" y="250" width="8" height="70" fill="#e63946"/>
    <rect x="300" y="280" width="8" height="40" fill="#e63946"/>
    <!-- Rooftops -->
    <circle cx="224" cy="280" r="4" fill="#f77f00"/>
    <circle cx="244" cy="260" r="4" fill="#f77f00"/>
    <circle cx="264" cy="270" r="4" fill="#f77f00"/>
    <circle cx="284" cy="250" r="4" fill="#f77f00"/>
    <circle cx="304" cy="280" r="4" fill="#f77f00"/>
    <!-- Windows -->
    <rect x="222" y="285" width="2" height="2" fill="#ffd166"/>
    <rect x="242" y="265" width="2" height="2" fill="#ffd166"/>
    <rect x="262" y="275" width="2" height="2" fill="#ffd166"/>
    <rect x="282" y="255" width="2" height="2" fill="#ffd166"/>
    <rect x="302" y="285" width="2" height="2" fill="#ffd166"/>
  </g>

  <!-- Head and legs -->
  <path d="M200 380c-10-10-10-25 0-35 10-10 25-10 35 0 10 10 10 25 0 35-10 10-25 10-35 0z" fill="#2a9d8f"/>
  <path d="M312 380c10-10 10-25 0-35-10-10-25-10-35 0 10 10 10 25 0 35 10 10 25 10 35 0z" fill="#2a9d8f"/>
  <path d="M256 420c-10 0-18-8-18-18h36c0 10-8 18-18 18z" fill="#2a9d8f"/>

  <!-- Tail -->
  <path d="M180 400c-15 0-28-13-28-28 0-15 13-28 28-28s28 13 28 28c0 15-13 28-28 28z" fill="#2a9d8f"/>

  <!-- Strand 1 (wrapping left) -->
  <path d="M120 200c20-40 60-60 100-40s80 60 100 40" stroke="#ff9f1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M120 200c20-20 60-30 100-10s80 30 100 10" stroke="#ffbf00" stroke-width="3" fill="none" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Strand 2 (wrapping right) -->
  <path d="M392 200c-20-40-60-60-100-40s-80 60-100 40" stroke="#ff9f1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M392 200c-20-20-60-30-100-10s-80 30-100 10" stroke="#ffbf00" stroke-width="3" fill="none" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Strand 3 (looping over shell) -->
  <path d="M200 120c40-20 80 0 100 20s40 40 60 20" stroke="#ff5500" stroke-width="5" fill="none" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M200 120c40-10 80 10 100 0s40 20 60 10" stroke="#ff9f1c" stroke-width="3" fill="none" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- Strand 4 (looping under shell) -->
  <path d="M200 480c40 20 80 0 100-20s40-40 60-20" stroke="#ff5500" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 480c40 10 80-10 100 0s40-20 60-10" stroke="#ff9f1c" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>