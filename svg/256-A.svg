<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2f63"/>
      <stop offset="0.6" stop-color="#e0716a"/>
      <stop offset="1" stop-color="#ffc472"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#b8243a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="400" cy="90" r="50" fill="#fff1c9" opacity="0.25"/>
  <circle cx="400" cy="90" r="34" fill="#fff1c9" opacity="0.9"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="60" cy="50" r="1.5"/><circle cx="150" cy="90" r="1"/><circle cx="230" cy="40" r="1.5"/><circle cx="300" cy="110" r="1"/><circle cx="470" cy="50" r="1.5"/>
  </g>
  <!-- distant hills -->
  <path d="M0 330 Q90 270 180 320 T380 300 T512 310 V512 H0Z" fill="#5b4a7a"/>
  <path d="M0 370 Q140 320 260 360 T512 350 V512 H0Z" fill="#2f5a4a"/>
  <!-- supports -->
  <g stroke="#55606e" stroke-width="5">
    <line x1="120" y1="232" x2="120" y2="500"/>
    <line x1="300" y1="210" x2="300" y2="500"/>
    <line x1="420" y1="140" x2="420" y2="500"/>
  </g>
  <g stroke="#6b7685" stroke-width="3">
    <line x1="120" y1="300" x2="300" y2="250"/>
    <line x1="300" y1="250" x2="420" y2="190"/>
  </g>
  <!-- track -->
  <path d="M30 380 Q120 180 210 260 T400 150 Q460 110 500 170" fill="none" stroke="#e8edf4" stroke-width="8" stroke-linecap="round"/>
  <path d="M30 392 Q120 192 210 272 T400 162 Q460 122 500 182" fill="none" stroke="#7d8898" stroke-width="3"/>
  <!-- car moving along the track -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 54,-44; 238,-26; 316,-135; 0,0" keyTimes="0;0.25;0.6;0.9;1" dur="6s" repeatCount="indefinite"/>
    <rect x="60" y="300" width="70" height="24" rx="6" fill="url(#car)"/>
    <rect x="72" y="282" width="46" height="20" rx="5" fill="#ffd166"/>
    <circle cx="84" cy="272" r="9" fill="#ffd9b0"/>
    <path d="M75 268 Q84 258 93 268 Z" fill="#2b2d42"/>
    <rect x="60" y="300" width="70" height="3" fill="#fff" opacity="0.5"/>
    <rect x="60" y="300" width="70" height="24" rx="6" fill="none" stroke="#ffe08a" stroke-width="2" opacity="0.6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 78 330" to="360 78 330" dur="0.8s" repeatCount="indefinite"/>
      <circle cx="78" cy="330" r="9" fill="#222"/>
      <line x1="69" y1="330" x2="87" y2="330" stroke="#ddd" stroke-width="2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 118 330" to="360 118 330" dur="0.8s" repeatCount="indefinite"/>
      <circle cx="118" cy="330" r="9" fill="#222"/>
      <line x1="109" y1="330" x2="127" y2="330" stroke="#ddd" stroke-width="2"/>
    </g>
  </g>
  <!-- ground -->
  <rect x="0" y="470" width="512" height="42" fill="#243a2c"/>
  <title>Animated roller coaster</title>
</svg>
