<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="40%" stop-color="#a0aec0"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f7fafc" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a365d"/>
      <stop offset="40%" stop-color="#2b6cb0"/>
      <stop offset="80%" stop-color="#4299e1"/>
      <stop offset="100%" stop-color="#63b3ed"/>
    </linearGradient>
    <linearGradient id="featherGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22543d"/>
      <stop offset="50%" stop-color="#2f855a"/>
      <stop offset="100%" stop-color="#48bb78"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <radialGradient id="eyeSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6e05e"/>
      <stop offset="40%" stop-color="#ed8936"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Distant city silhouette in fog -->
  <rect x="20" y="320" width="60" height="120" fill="#718096" opacity="0.4"/>
  <rect x="90" y="280" width="50" height="160" fill="#718096" opacity="0.35"/>
  <rect x="380" y="300" width="70" height="140" fill="#718096" opacity="0.4"/>
  <rect x="450" y="340" width="40" height="100" fill="#718096" opacity="0.35"/>

  <!-- Main skyscraper roof -->
  <rect x="160" y="380" width="192" height="132" fill="#2d3748"/>
  <rect x="150" y="370" width="212" height="15" fill="#4a5568"/>
  <rect x="145" y="365" width="222" height="8" fill="#718096"/>
  <!-- Antenna on roof -->
  <line x1="200" y1="365" x2="200" y2="330" stroke="#4a5568" stroke-width="2"/>
  <line x1="312" y1="365" x2="312" y2="340" stroke="#4a5568" stroke-width="2"/>
  <circle cx="200" cy="330" r="2" fill="#a0aec0"/>
  <circle cx="312" cy="340" r="2" fill="#a0aec0"/>

  <!-- Peacock body -->
  <ellipse cx="256" cy="300" rx="28" ry="38" fill="url(#bodyGrad)"/>
  <circle cx="256" cy="265" r="14" fill="url(#bodyGrad)"/>
  <rect x="252" y="250" width="8" height="12" fill="url(#bodyGrad)"/>
  <polygon points="256,250 264,240 268,248" fill="url(#bodyGrad)"/>
  <!-- Crown -->
  <line x1="256" y1="251" x2="248" y2="238" stroke="#1a202c" stroke-width="2"/>
  <line x1="256" y1="251" x2="256" y2="235" stroke="#1a202c" stroke-width="2"/>
  <line x1="256" y1="251" x2="264" y2="238" stroke="#1a202c" stroke-width="2"/>
  <circle cx="248" cy="238" r="2.5" fill="#2b6cb0"/>
  <circle cx="256" cy="235" r="2.5" fill="#2b6cb0"/>
  <circle cx="264" cy="238" r="2.5" fill="#2b6cb0"/>

  <!-- Tail feathers fan -->
  <g opacity="0.9">
    <ellipse cx="200" cy="240" rx="12" ry="55" fill="url(#featherGrad)" transform="rotate(-50 200 240)"/>
    <ellipse cx="220" cy="210" rx="12" ry="60" fill="url(#featherGrad2)" transform="rotate(-35 220 210)"/>
    <ellipse cx="250" cy="195" rx="12" ry="65" fill="url(#featherGrad)" transform="rotate(-10 250 195)"/>
    <ellipse cx="280" cy="200" rx="12" ry="60" fill="url(#featherGrad2)" transform="rotate(15 280 200)"/>
    <ellipse cx="305" cy="220" rx="12" ry="55" fill="url(#featherGrad)" transform="rotate(35 305 220)"/>
    <ellipse cx="315" cy="250" rx="12" ry="50" fill="url(#featherGrad2)" transform="rotate(50 315 250)"/>
  </g>

  <!-- Eye spots on feathers -->
  <circle cx="195" cy="230" r="5.5" fill="url(#eyeSpot)" opacity="0.9"/>
  <circle cx="218" cy="205" r="5.5" fill="url(#eyeSpot)" opacity="0.9"/>
  <circle cx="248" cy="192" r="6" fill="url(#eyeSpot)" opacity="0.9"/>
  <circle cx="278" cy="198" r="5.5" fill="url(#eyeSpot)" opacity="0.9"/>
  <circle cx="302" cy="218" r="5.5" fill="url(#eyeSpot)" opacity="0.9"/>
  <circle cx="312" cy="248" r="5" fill="url(#eyeSpot)" opacity="0.9"/>

  <!-- Fog layers -->
  <rect x="0" y="350" width="512" height="80" fill="url(#fog)"/>
  <rect x="0" y="420" width="512" height="60" fill="url(#fog)" opacity="0.7"/>
  <rect x="0" y="480" width="512" height="32" fill="url(#fog)" opacity="0.5"/>

  <!-- Wing detail -->
  <path d="M 235 285 Q 220 300 235 315" stroke="#4a5568" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 240 290 Q 228 302 240 312" stroke="#4a5568" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Peacock legs -->
  <line x1="245" y1="335" x2="245" y2="370" stroke="#1a202c" stroke-width="3"/>
  <line x1="267" y1="335" x2="267" y2="370" stroke="#1a202c" stroke-width="3"/>
  <!-- Feet -->
  <line x1="245" y1="370" x2="238" y2="375" stroke="#1a202c" stroke-width="2"/>
  <line x1="245" y1="370" x2="252" y2="375" stroke="#1a202c" stroke-width="2"/>
  <line x1="267" y1="370" x2="260" y2="375" stroke="#1a202c" stroke-width="2"/>
  <line x1="267" y1="370" x2="274" y2="375" stroke="#1a202c" stroke-width="2"/>

  <!-- Fog wisps -->
  <ellipse cx="100" cy="400" rx="80" ry="20" fill="#f7fafc" opacity="0.4"/>
  <ellipse cx="400" cy="380" rx="100" ry="25" fill="#f7fafc" opacity="0.35"/>
  <ellipse cx="256" cy="450" rx="120" ry="30" fill="#f7fafc" opacity="0.3"/>
  <ellipse cx="50" cy="360" rx="60" ry="15" fill="#f7fafc" opacity="0.25"/>
  <ellipse cx="460" cy="420" rx="70" ry="18" fill="#f7fafc" opacity="0.2"/>

  <!-- Soft sun glow through fog -->
  <circle cx="400" cy="120" r="60" fill="#f7fafc" opacity="0.15"/>
</svg>