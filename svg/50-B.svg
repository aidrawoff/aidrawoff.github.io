<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a4d"/>
      <stop offset="0.35" stop-color="#8e3b6b"/>
      <stop offset="0.62" stop-color="#e8794a"/>
      <stop offset="0.85" stop-color="#ffc861"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.5" stop-color="#ffcf5c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffcf5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a2a"/>
      <stop offset="1" stop-color="#2e2415"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="330" cy="330" r="150" fill="url(#sunGlow)"/>
  <circle cx="330" cy="332" r="52" fill="#ffe08a"/>
  <!-- distant hills -->
  <path d="M0 340 Q120 300 250 336 T512 322 V512 H0 Z" fill="#4a2f45" opacity="0.9"/>
  <!-- barn silhouette -->
  <g fill="#3a2033">
    <path d="M60 340 L60 250 L110 215 L160 250 L160 340 Z"/>
    <path d="M96 250 h28 v34 h-28 z" fill="#ffb85c" opacity="0.85"/>
    <path d="M160 300 l40 -22 v62 h-40 z"/>
  </g>
  <!-- fence -->
  <g stroke="#2e1a26" stroke-width="6" fill="none" opacity="0.95">
    <path d="M0 372 H512"/>
    <path d="M0 392 H512"/>
    <path d="M40 358 V404 M110 358 V404 M180 358 V404 M330 358 V404 M400 358 V404 M470 358 V404"/>
  </g>
  <!-- ground -->
  <rect x="0" y="400" width="512" height="112" fill="url(#ground)"/>
  <!-- contact shadow -->
  <ellipse cx="270" cy="506" rx="150" ry="18" fill="#1a130c" opacity="0.45"/>
  <!-- raccoon body -->
  <ellipse cx="256" cy="470" rx="120" ry="70" fill="#6b6f76"/>
  <!-- tail with rings, curling up behind -->
  <g transform="translate(368 430) rotate(-58)">
    <ellipse cx="0" cy="0" rx="86" ry="27" fill="#7a7e85"/>
    <ellipse cx="34" cy="0" rx="14" ry="26" fill="#2f3237"/>
    <ellipse cx="66" cy="0" rx="13" ry="24" fill="#2f3237"/>
    <ellipse cx="84" cy="0" rx="9" ry="20" fill="#2f3237"/>
  </g>
  <!-- head -->
  <circle cx="230" cy="380" r="72" fill="#7d8188"/>
  <!-- ears -->
  <path d="M172 328 q-16 -34 8 -40 q22 -6 30 24 z" fill="#6b6f76"/>
  <path d="M288 328 q16 -34 -8 -40 q-22 -6 -30 24 z" fill="#6b6f76"/>
  <!-- face mask -->
  <ellipse cx="230" cy="388" rx="66" ry="46" fill="#e8e3d8"/>
  <path d="M164 380 q30 -30 66 -6 q36 -24 66 6 q-30 34 -66 12 q-36 22 -66 -12z" fill="#33363b"/>
  <circle cx="204" cy="380" r="9" fill="#12141a"/>
  <circle cx="256" cy="380" r="9" fill="#12141a"/>
  <circle cx="207" cy="377" r="3" fill="#fff"/>
  <circle cx="259" cy="377" r="3" fill="#fff"/>
  <ellipse cx="230" cy="410" rx="12" ry="9" fill="#2a2d32"/>
  <path d="M230 419 q-14 12 -26 4 M230 419 q14 12 26 4" stroke="#2a2d32" stroke-width="3" fill="none"/>
  <!-- sunset rim light on head/back -->
  <path d="M278 328 a72 72 0 0 1 22 66" stroke="#ffcf7a" stroke-width="6" fill="none" opacity="0.75" stroke-linecap="round"/>
  <path d="M300 420 a120 70 0 0 1 76 44" stroke="#ffbe6b" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round"/>
  <!-- front paws holding an ear of corn -->
  <ellipse cx="196" cy="470" rx="26" ry="20" fill="#5c6067"/>
  <ellipse cx="266" cy="474" rx="26" ry="20" fill="#5c6067"/>
  <g transform="translate(230 462) rotate(-14)">
    <ellipse cx="0" cy="0" rx="13" ry="30" fill="#f5c542"/>
    <path d="M-13 6 q-16 -22 -6 -40 q10 16 6 40z" fill="#4f7a3a"/>
    <path d="M13 6 q16 -22 6 -40 q-10 16 -6 40z" fill="#5f8f45"/>
    <g stroke="#d9a520" stroke-width="2">
      <path d="M-8 -18 H8 M-10 -8 H10 M-10 2 H10 M-8 12 H8"/>
    </g>
  </g>
  <!-- grass tufts -->
  <g stroke="#3f5a2c" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M60 470 q-4 -18 -10 -24 M60 470 q2 -18 10 -26 M60 470 q8 -12 16 -16"/>
    <path d="M450 486 q-4 -18 -10 -24 M450 486 q2 -18 10 -26"/>
    <path d="M130 500 q-4 -16 -10 -22 M130 500 q3 -16 10 -22"/>
  </g>
  <!-- birds -->
  <g stroke="#2e1a26" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M380 150 q10 -8 20 0 q10 -8 20 0"/>
    <path d="M420 110 q8 -6 16 0 q8 -6 16 0"/>
  </g>
  <!-- sunset clouds -->
  <g fill="#ff9e6b" opacity="0.55">
    <ellipse cx="120" cy="120" rx="70" ry="12"/>
    <ellipse cx="180" cy="145" rx="50" ry="9"/>
    <ellipse cx="330" cy="80" rx="60" ry="10"/>
    <ellipse cx="440" cy="200" rx="55" ry="9"/>
  </g>
  <!-- pumpkin by the fence -->
  <g transform="translate(440 452)">
    <ellipse cx="0" cy="0" rx="34" ry="28" fill="#d96a26"/>
    <ellipse cx="-14" cy="0" rx="14" ry="27" fill="#c25a1e"/>
    <ellipse cx="14" cy="0" rx="14" ry="27" fill="#e87a33"/>
    <path d="M0 -26 q-2 -14 8 -18" stroke="#4f7a3a" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- fireflies -->
  <g fill="#ffe98a">
    <circle cx="90" cy="330" r="4" opacity="0.9"/>
    <circle cx="330" cy="270" r="3" opacity="0.8"/>
    <circle cx="400" cy="360" r="4" opacity="0.9"/>
    <circle cx="150" cy="420" r="3" opacity="0.8"/>
    <circle cx="480" cy="300" r="3" opacity="0.8"/>
    <circle cx="60" cy="280" r="3" opacity="0.7"/>
  </g>
  <!-- warm sun haze over the scene -->
  <rect width="512" height="512" fill="#ff9a4d" opacity="0.07"/>
</svg>
