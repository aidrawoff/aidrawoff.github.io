<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1e"/>
      <stop offset="1" stop-color="#241a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- drive-in screen -->
  <rect x="150" y="60" width="212" height="120" rx="4" fill="#cfe9ff"/>
  <rect x="158" y="68" width="196" height="104" fill="#1a2f52"/>
  <circle cx="256" cy="120" r="26" fill="#ffd76b"/>
  <rect x="150" y="60" width="212" height="120" rx="4" fill="none" stroke="#0a0f22" stroke-width="6"/>
  <rect x="210" y="180" width="8" height="60" fill="#0a0f22"/>
  <rect x="294" y="180" width="8" height="60" fill="#0a0f22"/>
  <ellipse cx="256" cy="150" rx="200" ry="130" fill="url(#glow)"/>
  <!-- ground + cars silhouettes -->
  <rect x="0" y="240" width="512" height="272" fill="#120d20"/>
  <path d="M40 250 h60 l14 -14 h40 l14 14 h40 v22 H40 Z" fill="#0a0713"/>
  <path d="M330 252 h70 l12 -16 h34 l12 16 h22 v20 H330 Z" fill="#0a0713"/>
  <circle cx="70" cy="272" r="9" fill="#ff5a3c"/>
  <circle cx="430" cy="272" r="9" fill="#ffea7a"/>
  <!-- WANTED POSTER (aged paper, tilted) -->
  <g transform="translate(256 342) rotate(-3)">
    <rect x="-150" y="-158" width="300" height="316" fill="#e8d5a3" stroke="#3b2a12" stroke-width="5"/>
    <rect x="-136" y="-144" width="272" height="288" fill="none" stroke="#7a5a2a" stroke-width="3"/>
    <text x="0" y="-98" font-size="52" font-weight="bold" text-anchor="middle" fill="#2b1a08" font-family="Georgia,serif" letter-spacing="3">WANTED</text>
    <text x="0" y="-74" font-size="14" text-anchor="middle" fill="#5a3a12" font-family="Georgia,serif">BY ORDER OF THE DRIVE-IN SHERIFF</text>
    <rect x="-84" y="-64" width="168" height="142" fill="#f6ecd0" stroke="#3b2a12" stroke-width="4"/>
    <!-- CUPCAKE MUGSHOT -->
    <g transform="translate(0 8)">
      <path d="M-46 14 L-34 62 H34 L46 14 Z" fill="#b0552e" stroke="#4a2410" stroke-width="4"/>
      <path d="M-30 16 L-24 60 M-8 16 L-6 60 M14 16 L12 60 M34 16 L26 60" stroke="#7d3a1c" stroke-width="4" fill="none"/>
      <path d="M-52 14 q-6 -26 16 -30 q4 -22 28 -20 q24 -6 30 16 q22 6 14 30 q-4 10 -14 8 h-60 q-12 2 -14 -4 Z" fill="#ffd9e8" stroke="#5a2a3a" stroke-width="4"/>
      <path d="M-40 -6 q10 -18 26 -14 q8 -16 26 -10 q18 -6 24 12" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.7"/>
      <circle cx="0" cy="-44" r="10" fill="#e0322f" stroke="#5a2a3a" stroke-width="3"/>
      <path d="M0 -54 q6 -10 12 -8" fill="none" stroke="#2f6b2f" stroke-width="4"/>
      <circle cx="-16" cy="-2" r="4" fill="#3a2a1a"/>
      <circle cx="16" cy="-2" r="4" fill="#3a2a1a"/>
      <path d="M-12 12 q12 10 24 0" fill="none" stroke="#3a2a1a" stroke-width="3"/>
    </g>
    <!-- wanted banner across face -->
    <text x="0" y="96" font-size="24" font-weight="bold" text-anchor="middle" fill="#2b1a08" font-family="Georgia,serif" letter-spacing="5">REWARD $5,000</text>
    <text x="0" y="120" font-size="13" text-anchor="middle" fill="#5a3a12" font-family="Georgia,serif">WANTED FOR CRIMES AGAINST DESSERT</text>
    <text x="0" y="140" font-size="11" text-anchor="middle" fill="#7a5a2a" font-family="Georgia,serif">DO NOT APPROACH — IT IS WELL FROSTED</text>
    <!-- staples + thumbtack -->
    <path d="M-100 -158 v10 M-100 -148 h8 M92 -158 v10 M92 -148 h8" stroke="#8a8f9c" stroke-width="3" fill="none"/>
    <circle cx="0" cy="-150" r="6" fill="#c23b2e" stroke="#5a1a12" stroke-width="2"/>
    <!-- screen beam streaks -->
    <path d="M180 180 L120 250 M332 180 L392 250" stroke="#8fd8ff" stroke-width="3" opacity="0.25" fill="none"/>
  </g>
</svg>
