<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="25%" stop-color="#141235"/>
      <stop offset="65%" stop-color="#5c1d18"/>
      <stop offset="100%" stop-color="#b9380a"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Glowing Sunset Sun & Atmospheric Halo -->
  <circle cx="400" cy="100" r="60" fill="url(#sun)" opacity="0.98"/>
  <circle cx="400" cy="100" r="85" fill="#fde047" opacity="0.22"/>
  <circle cx="400" cy="100" r="125" fill="#f97316" opacity="0.1"/>

  <!-- Bright Twinkling Stars -->
  <g fill="#fff">
    <circle cx="55" cy="35" r="1.8" opacity="0.95"/>
    <circle cx="120" cy="65" r="1.2" opacity="0.85"/>
    <circle cx="200" cy="25" r="2.2" opacity="0.95"/>
    <circle cx="80" cy="110" r="1.4" opacity="0.75"/>
    <circle cx="290" cy="40" r="1.8" opacity="0.9"/>
    <circle cx="450" cy="60" r="1.2" opacity="0.8"/>
  </g>

  <!-- High-Altitude Wispy Clouds -->
  <path d="M5,200 Q40,180 85,205 Q125,185 165,210 Q205,190 245,215 L5,225 Z" fill="#ffffff" opacity="0.15"/>
  <path d="M270,255 Q320,235 365,260 Q410,240 470,265 L270,280 Z" fill="#ffffff" opacity="0.22"/>

  <!-- Distant Mountain Ranges (Atmospheric Depth) -->
  <polygon points="0,380 120,240 260,380" fill="#1e293b" opacity="0.78"/>
  <polygon points="160,380 340,190 512,360" fill="#0f172a" opacity="0.9"/>

  <!-- Majestic Main Summit Peak -->
  <polygon points="20,512 256,110 492,512" fill="url(#mountain)"/>
  
  <!-- Crisp Snow Cap & Crevasses -->
  <path d="M256,110 L315,200 L300,225 L340,290 L275,275 L255,310 L220,250 L245,205 Z" fill="url(#snow)"/>
  <path d="M256,110 L245,205 L260,185 Z" fill="#ffffff"/>
  <path d="M300,225 L340,290 L315,270 Z" fill="#94a3b8" opacity="0.65"/>

  <!-- Ridge Lines & Rock Textures -->
  <path d="M256,110 L256,370 L300,512" stroke="#05070e" stroke-width="5" opacity="0.7" fill="none"/>
  <path d="M256,215 L185,320 L205,355" stroke="#05070e" stroke-width="3.5" opacity="0.55" fill="none"/>
  <path d="M256,260 L335,360 L315,410" stroke="#05070e" stroke-width="3.5" opacity="0.55" fill="none"/>

  <!-- Snowy Peak Foreground Base -->
  <path d="M0,455 Q120,425 256,455 Q395,425 512,460 L512,512 L0,512 Z" fill="#f8fafc"/>

  <!-- Sparkling Snow Crystals on Foreground -->
  <circle cx="140" cy="475" r="1.8" fill="#ffffff"/>
  <circle cx="200" cy="490" r="2.2" fill="#ffffff"/>
  <circle cx="320" cy="480" r="1.8" fill="#ffffff"/>
  <circle cx="400" cy="485" r="2.2" fill="#ffffff"/>
  <circle cx="470" cy="495" r="1.5" fill="#ffffff"/>

  <!-- Llama Character (Grounded, Sturdy, Proud Silhouette) -->
  <!-- Legs with Hooves and Highlights -->
  <g id="llama-legs">
    <rect x="210" y="365" width="17" height="90" rx="5" fill="#fdf8f5"/>
    <rect x="210" y="443" width="17" height="14" rx="2" fill="#78350f"/>
    
    <rect x="238" y="375" width="17" height="85" rx="5" fill="#f4ece1"/>
    <rect x="238" y="448" width="17" height="14" rx="2" fill="#78350f"/>

    <rect x="278" y="370" width="17" height="87" rx="5" fill="#e8ded1"/>
    <rect x="278" y="445" width="17" height="14" rx="2" fill="#78350f"/>

    <rect x="306" y="360" width="17" height="95" rx="5" fill="#f4ece1"/>
    <rect x="306" y="443" width="17" height="14" rx="2" fill="#78350f"/>
  </g>

  <!-- Fluffy Wool Body (Layered Puffs) -->
  <ellipse cx="264" cy="335" rx="72" ry="50" fill="#fdf8f5"/>
  <circle cx="210" cy="335" r="26" fill="#fdf8f5"/>
  <circle cx="318" cy="325" r="28" fill="#fdf8f5"/>
  <circle cx="284" cy="305" r="26" fill="#fdf8f5"/>
  <circle cx="240" cy="310" r="24" fill="#fdf8f5"/>

  <!-- Vibrant Andean Pack & Saddle Blanket (Folk Art Details) -->
  <path d="M238,305 Q270,290 302,305 L310,362 Q270,377 230,362 Z" fill="#dc2626"/>
  <path d="M248,313 L292,313 L289,355 L251,355 Z" fill="#fbbf24"/>
  <path d="M260,323 L282,323 L280,347 L262,347 Z" fill="#1d4ed8"/>
  <path d="M269,330 L273,330 L273,338 L269,338 Z" fill="#ffffff"/>
  <!-- Stuffed Saddlebags -->
  <ellipse cx="230" cy="362" rx="15" ry="19" fill="#9a3412"/>
  <ellipse cx="310" cy="357" rx="15" ry="19" fill="#9a3412"/>
  <path d="M230,352 L230,372 M310,347 L310,367" stroke="#ea580c" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Long Elegant Curved Neck -->
  <path d="M238,320 Q218,245 213,188 Q208,158 226,153 Q244,148 249,178 Q259,248 278,320 Z" fill="#fdf8f5"/>

  <!-- Head, Expressive Ears & Halter -->
  <!-- Ears -->
  <polygon points="211,140 203,112 218,132" fill="#e8ded1"/>
  <polygon points="211,140 205,117 215,132" fill="#fbcfe8"/>
  
  <polygon points="232,138 243,112 239,132" fill="#e8ded1"/>
  <polygon points="232,138 241,117 237,132" fill="#fbcfe8"/>

  <!-- Head Shape -->
  <ellipse cx="222" cy="150" rx="20" ry="15" fill="#fdf8f5"/>
  <path d="M208,148 Q193,153 200,162 Q208,166 218,159 Z" fill="#fdf8f5"/>

  <!-- Colorful Bridle / Halter Straps -->
  <path d="M209,153 L222,160 L226,151" stroke="#2563eb" stroke-width="3.5" fill="none"/>
  <path d="M216,145 L216,162" stroke="#dc2626" stroke-width="3" fill="none"/>
  <circle cx="212" cy="154" r="2.5" fill="#fbbf24"/>

  <!-- Gentle, Alert Eye -->
  <circle cx="218" cy="148" r="2.8" fill="#0f172a"/>
  <circle cx="219.5" cy="147" r="1" fill="#ffffff"/>
  <path d="M201,160 Q206,165 211,160" stroke="#a89f91" stroke-width="1.8" fill="none"/>

  <!-- Foreground Alpine Rocks & Summit Cairn with Fluttering Red Ribbon -->
  <polygon points="65,512 100,465 130,512" fill="#64748b"/>
  <polygon points="80,512 108,480 122,512" fill="#94a3b8"/>
  
  <polygon points="375,512 410,460 455,512" fill="#475569"/>
  <polygon points="390,512 418,475 435,512" fill="#64748b"/>

  <!-- Stone Cairn (Summit Marker) -->
  <rect x="350" y="425" width="12" height="50" fill="#475569" rx="2"/>
  <polygon points="356,412 378,425 334,425" fill="#94a3b8"/>
  <!-- Fluttering Red Prayer Ribbon -->
  <path d="M356,428 Q395,435 388,455 Q372,450 356,440 Z" fill="#ef4444"/>
  <path d="M356,440 Q378,463 368,480" stroke="#ef4444" stroke-width="2.5" fill="none"/>
</svg>
