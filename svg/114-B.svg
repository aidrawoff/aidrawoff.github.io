<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sky -->
  <rect width="512" height="512" fill="#87CEEB"/>
  <rect y="300" width="512" height="212" fill="#E6C288"/>
  <!-- Sun -->
  <circle cx="420" cy="80" r="35" fill="#FFD700"/>
  <!-- Ocean -->
  <rect y="340" width="512" height="172" fill="#1E90FF"/>
  <!-- Sand dune -->
  <path d="M0,380 Q128,340 256,380 T512,360 L512,512 L0,512 Z" fill="#F4A460"/>
  <!-- Skeleton body -->
  <ellipse cx="220" cy="310" rx="35" ry="55" fill="#F5F5DC"/>
  <!-- Skeleton head -->
  <circle cx="220" cy="230" r="30" fill="#F5F5DC"/>
  <!-- Eye sockets -->
  <ellipse cx="210" cy="225" rx="8" ry="10" fill="#1a1a1a"/>
  <ellipse cx="230" cy="225" rx="8" ry="10" fill="#1a1a1a"/>
  <!-- Nose -->
  <path d="M220,232 L216,242 L224,242 Z" fill="#1a1a1a"/>
  <!-- Grin -->
  <path d="M205,250 Q220,265 235,250" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="208" y1="252" x2="208" y2="258" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="214" y1="255" x2="214" y2="262" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="220" y1="256" x2="220" y2="264" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="226" y1="255" x2="226" y2="262" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="232" y1="252" x2="232" y2="258" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Ribs -->
  <line x1="200" y1="290" x2="240" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="198" y1="300" x2="242" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="196" y1="310" x2="244" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="198" y1="320" x2="242" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="200" y1="330" x2="240" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Spine -->
  <line x1="220" y1="260" x2="220" y2="360" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Arms -->
  <line x1="185" y1="280" x2="150" y2="320" stroke="#F5F5DC" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="320" x2="130" y2="360" stroke="#F5F5DC" stroke-width="6" stroke-linecap="round"/>
  <line x1="255" y1="280" x2="290" y2="320" stroke="#F5F5DC" stroke-width="8" stroke-linecap="round"/>
  <line x1="290" y1="320" x2="310" y2="360" stroke="#F5F5DC" stroke-width="6" stroke-linecap="round"/>
  <!-- Arm bones detail -->
  <line x1="185" y1="280" x2="150" y2="320" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="320" x2="130" y2="360" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="255" y1="280" x2="290" y2="320" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="320" x2="310" y2="360" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="205" y1="360" x2="195" y2="430" stroke="#F5F5DC" stroke-width="10" stroke-linecap="round"/>
  <line x1="195" y1="430" x2="190" y2="480" stroke="#F5F5DC" stroke-width="8" stroke-linecap="round"/>
  <line x1="235" y1="360" x2="245" y2="430" stroke="#F5F5DC" stroke-width="10" stroke-linecap="round"/>
  <line x1="245" y1="430" x2="250" y2="480" stroke="#F5F5DC" stroke-width="8" stroke-linecap="round"/>
  <!-- Leg bones detail -->
  <line x1="205" y1="360" x2="195" y2="430" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="195" y1="430" x2="190" y2="480" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="235" y1="360" x2="245" y2="430" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="245" y1="430" x2="250" y2="480" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Feet in sand -->
  <ellipse cx="190" cy="485" rx="12" ry="6" fill="#F5F5DC"/>
  <ellipse cx="250" cy="485" rx="12" ry="6" fill="#F5F5DC"/>
  <!-- Beach ball -->
  <circle cx="320" cy="420" r="25" fill="#FF4500"/>
  <path d="M320,395 A25,25 0 0,1 345,420" fill="#FFFFFF"/>
  <path d="M320,445 A25,25 0 0,1 295,420" fill="#FFFFFF"/>
  <path d="M320,395 A25,25 0 0,0 295,420" fill="#FFD700"/>
  <path d="M320,445 A25,25 0 0,0 345,420" fill="#FFD700"/>
  <!-- Umbrella -->
  <line x1="380" y1="480" x2="380" y2="380" stroke="#8B4513" stroke-width="4"/>
  <path d="M330,380 Q380,340 430,380 Z" fill="#FF6347"/>
  <path d="M345,380 Q380,350 415,380 Z" fill="#FFFFFF"/>
  <!-- Seagull -->
  <path d="M100,120 Q110,110 120,120 Q130,110 140,120" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Shadow -->
  <ellipse cx="220" cy="490" rx="50" ry="10" fill="#000000" opacity="0.2"/>
  <!-- Sunglasses on skeleton -->
  <rect x="200" y="220" width="40" height="10" rx="3" fill="#111"/>
  <line x1="200" y1="225" x2="190" y2="222" stroke="#111" stroke-width="2"/>
  <line x1="240" y1="225" x2="250" y2="222" stroke="#111" stroke-width="2"/>
  <!-- Sun glint on glasses -->
  <line x1="205" y1="222" x2="215" y2="222" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="225" y1="222" x2="235" y2="222" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Shells on sand -->
  <ellipse cx="360" cy="460" rx="8" ry="5" fill="#FFB6C1"/>
  <ellipse cx="370" cy="465" rx="6" ry="4" fill="#FFF0F5"/>
  <ellipse cx="100" cy="450" rx="7" ry="4" fill="#FFB6C1"/>
  <!-- Starfish -->
  <polygon points="140,470 145,460 155,460 148,452 152,442 140,448 128,442 132,452 125,460 135,460" fill="#FF7F50"/>
  <!-- Palm tree trunk -->
  <path d="M460,512 Q470,450 480,380" stroke="#8B4513" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Palm fronds -->
  <path d="M480,380 Q450,340 420,360" stroke="#228B22" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M480,380 Q500,330 520,350" stroke="#228B22" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M480,380 Q470,330 460,340" stroke="#32CD32" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M480,380 Q490,330 500,340" stroke="#32CD32" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M480,380 Q480,320 480,330" stroke="#228B22" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Ocean waves detail -->
  <path d="M0,360 Q64,350 128,360 T256,360 T384,360 T512,360" fill="none" stroke="#87CEFA" stroke-width="2" opacity="0.6"/>
  <path d="M0,370 Q64,360 128,370 T256,370 T384,370 T512,370" fill="none" stroke="#87CEFA" stroke-width="2" opacity="0.4"/>
  <!-- Sun rays -->
  <line x1="420" y1="40" x2="420" y2="20" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="420" y1="120" x2="420" y2="140" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="380" y1="80" x2="360" y2="80" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="460" y1="80" x2="480" y2="80" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="392" y1="52" x2="378" y2="38" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="448" y1="52" x2="462" y2="38" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="392" y1="108" x2="378" y2="122" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="448" y1="108" x2="462" y2="122" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <!-- More seagulls -->
  <path d="M60,100 Q68,92 76,100 Q84,92 92,100" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M160,90 Q168,82 176,90 Q184,82 192,90" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>