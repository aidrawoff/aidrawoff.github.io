<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sky gradient -->
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4e4ba" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f4e4ba" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#1a0b2e"/>
  <!-- Moon -->
  <circle cx="420" cy="80" r="70" fill="url(#moonGlow)"/>
  <circle cx="420" cy="80" r="42" fill="#f4e4ba"/>
  <circle cx="410" cy="70" r="8" fill="#e0d0a0" opacity="0.5"/>
  <circle cx="430" cy="85" r="5" fill="#e0d0a0" opacity="0.4"/>
  <!-- Ground hill -->
  <path d="M0 390 Q 180 340 320 370 T 512 380 L 512 512 L 0 512 Z" fill="#0f3d2e"/>
  <path d="M0 400 Q 200 360 350 390 T 512 400 L 512 512 L 0 512 Z" fill="#0a2e22"/>
  <!-- Bike shadow -->
  <ellipse cx="250" cy="395" rx="130" ry="12" fill="#000" opacity="0.3"/>
  <!-- Bike wheels -->
  <circle cx="160" cy="360" r="52" fill="none" stroke="#c49a6c" stroke-width="5"/>
  <circle cx="340" cy="360" r="52" fill="none" stroke="#c49a6c" stroke-width="5"/>
  <circle cx="160" cy="360" r="45" fill="none" stroke="#2a1a0a" stroke-width="3"/>
  <circle cx="340" cy="360" r="45" fill="none" stroke="#2a1a0a" stroke-width="3"/>
  <!-- Spokes -->
  <g stroke="#c49a6c" stroke-width="1.5" opacity="0.7">
    <line x1="160" y1="308" x2="160" y2="412"/>
    <line x1="108" y1="360" x2="212" y2="360"/>
    <line x1="123" y1="323" x2="197" y2="397"/>
    <line x1="123" y1="397" x2="197" y2="323"/>
  </g>
  <g stroke="#c49a6c" stroke-width="1.5" opacity="0.7">
    <line x1="340" y1="308" x2="340" y2="412"/>
    <line x1="288" y1="360" x2="392" y2="360"/>
    <line x1="303" y1="323" x2="377" y2="397"/>
    <line x1="303" y1="397" x2="377" y2="323"/>
  </g>
  <!-- Bike frame -->
  <path d="M160 360 L 230 280 L 320 280 L 340 360" fill="none" stroke="#8b4513" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="230" y1="280" x2="210" y2="240" stroke="#8b4513" stroke-width="7" stroke-linecap="round"/>
  <line x1="320" y1="280" x2="310" y2="220" stroke="#8b4513" stroke-width="7" stroke-linecap="round"/>
  <line x1="230" y1="280" x2="320" y2="280" stroke="#8b4513" stroke-width="5" stroke-linecap="round"/>
  <!-- Pedals -->
  <circle cx="230" cy="280" r="8" fill="#5c3a1e"/>
  <line x1="230" y1="280" x2="245" y2="295" stroke="#c49a6c" stroke-width="4" stroke-linecap="round"/>
  <rect x="240" y="292" width="12" height="6" rx="2" fill="#2a1a0a"/>
  <!-- Seat -->
  <ellipse cx="195" cy="235" rx="18" ry="6" fill="#2a1a0a"/>
  <line x1="200" y1="240" x2="210" y2="240" stroke="#5c3a1e" stroke-width="4" stroke-linecap="round"/>
  <!-- Handlebars -->
  <path d="M310 220 Q 325 210 335 215" fill="none" stroke="#c49a6c" stroke-width="4" stroke-linecap="round"/>
  <!-- Basket -->
  <rect x="305" y="195" width="65" height="40" rx="3" fill="#c49a6c" stroke="#5c3a1e" stroke-width="3"/>
  <line x1="310" y1="205" x2="365" y2="205" stroke="#5c3a1e" stroke-width="2"/>
  <line x1="310" y1="215" x2="365" y2="215" stroke="#5c3a1e" stroke-width="2"/>
  <line x1="310" y1="225" x2="365" y2="225" stroke="#5c3a1e" stroke-width="2"/>
  <!-- Cat in basket -->
  <ellipse cx="337" cy="188" rx="20" ry="14" fill="#1a1a1a"/>
  <polygon points="320,180 324,168 330,178" fill="#1a1a1a"/>
  <polygon points="342,178 348,168 352,180" fill="#1a1a1a"/>
  <circle cx="330" cy="185" r="2.5" fill="#f4e4ba"/>
  <circle cx="343" cy="185" r="2.5" fill="#f4e4ba"/>
  <ellipse cx="337" cy="192" rx="3" ry="2" fill="#f4e4ba" opacity="0.6"/>
  <!-- Witch body/dress -->
  <path d="M210 240 Q 185 210 195 170 Q 205 150 235 160 Q 255 175 245 210 L 225 280" fill="#2d1b4e" stroke="#1a0b2e" stroke-width="2"/>
  <!-- Witch head -->
  <circle cx="218" cy="150" r="20" fill="#e8c8a0"/>
  <!-- Hair -->
  <path d="M198 150 Q 175 165 180 200 Q 185 220 200 235" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
  <path d="M238 150 Q 255 165 250 195 Q 245 215 235 225" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
  <path d="M210 132 Q 205 120 215 115" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Hat -->
  <polygon points="195,140 242,140 218,75" fill="#1a1a1a"/>
  <ellipse cx="218" cy="140" rx="32" ry="7" fill="#1a1a1a"/>
  <ellipse cx="218" cy="140" rx="32" ry="7" fill="none" stroke="#3a2a5e" stroke-width="2"/>
  <!-- Face -->
  <circle cx="211" cy="147" r="2.5" fill="#1a1a1a"/>
  <circle cx="225" cy="147" r="2.5" fill="#1a1a1a"/>
  <path d="M212 157 Q 218 162 224 157" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="208" cy="154" r="3" fill="#d46a6a" opacity="0.4"/>
  <circle cx="228" cy="154" r="3" fill="#d46a6a" opacity="0.4"/>
  <!-- Arm reaching to basket -->
  <path d="M235 185 Q 265 175 305 205" fill="none" stroke="#2d1b4e" stroke-width="7" stroke-linecap="round"/>
  <!-- Hand on handlebar -->
  <circle cx="335" cy="215" r="6" fill="#e8c8a0"/>
  <!-- Cape flowing back dramatically -->
  <path d="M205 175 Q 140 185 95 225 Q 70 265 100 310 Q 145 290 190 245" fill="#4a306d" opacity="0.95"/>
  <path d="M195 180 Q 150 200 120 240 Q 110 270 130 290" fill="none" stroke="#6b4c9a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Stars -->
  <circle cx="80" cy="60" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="120" cy="100" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="60" cy="140" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="150" cy="50" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="360" cy="120" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="480" cy="90" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="460" cy="180" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="40" cy="200" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="280" cy="40" r="2" fill="#fff" opacity="0.8"/>
  <!-- Magic sparkles near basket -->
  <circle cx="365" cy="175" r="3" fill="#7df9ff" opacity="0.9"/>
  <circle cx="380" cy="190" r="2" fill="#7df9ff" opacity="0.6"/>
  <circle cx="360" cy="200" r="2.5" fill="#7df9ff" opacity="0.7"/>
  <circle cx="375" cy="210" r="2" fill="#7df9ff" opacity="0.5"/>
  <!-- Tiny fireflies -->
  <circle cx="100" cy="320" r="2" fill="#aaffaa" opacity="0.6"/>
  <circle cx="130" cy="300" r="1.5" fill="#aaffaa" opacity="0.4"/>
  <circle cx="450" cy="350" r="2" fill="#aaffaa" opacity="0.5"/>
</svg>