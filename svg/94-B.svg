<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Night sky -->
  <rect width="512" height="512" fill="#1a0a2e"/>
  <circle cx="420" cy="80" r="45" fill="#f4e4bc" opacity="0.9"/>
  <circle cx="400" cy="70" r="40" fill="#1a0a2e"/>

  <!-- Ground -->
  <ellipse cx="256" cy="460" rx="300" ry="60" fill="#2d1b0e"/>

  <!-- Werewolf body -->
  <ellipse cx="220" cy="300" rx="70" ry="90" fill="#4a3728"/>
  <ellipse cx="220" cy="300" rx="55" ry="75" fill="#5c4533"/>

  <!-- Head -->
  <ellipse cx="220" cy="190" rx="45" ry="50" fill="#5c4533"/>
  <ellipse cx="220" cy="190" rx="35" ry="40" fill="#6b5344"/>

  <!-- Ears -->
  <polygon points="185,160 175,110 205,150" fill="#4a3728"/>
  <polygon points="255,160 265,110 235,150" fill="#4a3728"/>

  <!-- Snout -->
  <ellipse cx="220" cy="210" rx="22" ry="18" fill="#6b5344"/>
  <ellipse cx="220" cy="205" rx="10" ry="8" fill="#2a1a10"/>

  <!-- Eye glow -->
  <ellipse cx="205" cy="180" rx="14" ry="16" fill="#ffdd00" opacity="0.3"/>
  <ellipse cx="235" cy="180" rx="14" ry="16" fill="#ffdd00" opacity="0.3"/>
  <!-- Eyes -->
  <ellipse cx="205" cy="180" rx="10" ry="12" fill="#ffdd00"/>
  <ellipse cx="235" cy="180" rx="10" ry="12" fill="#ffdd00"/>
  <ellipse cx="208" cy="182" rx="4" ry="6" fill="#000"/>
  <ellipse cx="238" cy="182" rx="4" ry="6" fill="#000"/>

  <!-- Mouth/teeth -->
  <path d="M 205 225 Q 220 240 235 225" stroke="#2a1a10" stroke-width="3" fill="none"/>
  <polygon points="210,228 215,238 220,228" fill="#fff"/>
  <polygon points="230,228 225,238 220,228" fill="#fff"/>

  <!-- Arms -->
  <ellipse cx="150" cy="280" rx="25" ry="50" fill="#4a3728" transform="rotate(30 150 280)"/>
  <ellipse cx="290" cy="280" rx="25" ry="50" fill="#4a3728" transform="rotate(-30 290 280)"/>

  <!-- Hands/paws -->
  <ellipse cx="130" cy="330" rx="18" ry="22" fill="#5c4533"/>
  <ellipse cx="310" cy="330" rx="18" ry="22" fill="#5c4533"/>

  <!-- Legs -->
  <ellipse cx="190" cy="390" rx="22" ry="45" fill="#4a3728"/>
  <ellipse cx="250" cy="390" rx="22" ry="45" fill="#4a3728"/>

  <!-- Feet -->
  <ellipse cx="185" cy="435" rx="25" ry="12" fill="#5c4533"/>
  <ellipse cx="255" cy="435" rx="25" ry="12" fill="#5c4533"/>

  <!-- Tail -->
  <path d="M 280 350 Q 340 380 360 320 Q 370 300 350 290" stroke="#4a3728" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Pumpkin 1 glow -->
  <ellipse cx="340" cy="420" rx="48" ry="42" fill="#e85d04" opacity="0.3"/>
  <!-- Pumpkin 1 -->
  <ellipse cx="340" cy="420" rx="40" ry="35" fill="#e85d04"/>
  <ellipse cx="340" cy="420" rx="30" ry="28" fill="#f48c06"/>
  <rect x="335" y="380" width="10" height="15" fill="#2d6a4f"/>

  <!-- Pumpkin 2 glow -->
  <ellipse cx="400" cy="400" rx="36" ry="30" fill="#e85d04" opacity="0.25"/>
  <!-- Pumpkin 2 -->
  <ellipse cx="400" cy="400" rx="30" ry="25" fill="#e85d04"/>
  <ellipse cx="400" cy="400" rx="22" ry="20" fill="#f48c06"/>
  <rect x="396" y="370" width="8" height="12" fill="#2d6a4f"/>

  <!-- Pumpkin 3 glow -->
  <ellipse cx="100" cy="430" rx="42" ry="36" fill="#e85d04" opacity="0.3"/>
  <!-- Pumpkin 3 -->
  <ellipse cx="100" cy="430" rx="35" ry="30" fill="#e85d04"/>
  <ellipse cx="100" cy="430" rx="26" ry="24" fill="#f48c06"/>
  <rect x="96" y="395" width="8" height="12" fill="#2d6a4f"/>

  <!-- Pumpkin face on big one -->
  <polygon points="340,405 330,425 350,425" fill="#2a0a0a"/>
  <polygon points="325,410 315,420 325,420" fill="#2a0a0a"/>
  <polygon points="355,410 365,420 355,420" fill="#2a0a0a"/>
  <path d="M 325 435 Q 340 445 355 435" stroke="#2a0a0a" stroke-width="4" fill="none"/>

  <!-- Party hat -->
  <polygon points="200,150 220,80 240,150" fill="#ff006e"/>
  <polygon points="205,145 220,90 235,145" fill="#ff4d9e" opacity="0.5"/>
  <circle cx="220" cy="80" r="6" fill="#ffbe0b"/>
  <circle cx="210" cy="120" r="4" fill="#ffbe0b"/>
  <circle cx="230" cy="130" r="4" fill="#ffbe0b"/>
  <circle cx="220" cy="110" r="4" fill="#ffbe0b"/>
  <!-- Hat brim -->
  <ellipse cx="220" cy="150" rx="25" ry="6" fill="#ff006e"/>

  <!-- Confetti -->
  <rect x="80" y="100" width="8" height="4" fill="#ff006e" transform="rotate(20 80 100)"/>
  <rect x="450" y="150" width="6" height="6" fill="#3a86ff" transform="rotate(45 450 150)"/>
  <rect x="120" y="60" width="10" height="4" fill="#ffbe0b" transform="rotate(-15 120 60)"/>
  <rect x="380" y="120" width="8" height="5" fill="#8338ec" transform="rotate(30 380 120)"/>
  <rect x="60" y="200" width="7" height="7" fill="#fb5607" transform="rotate(60 60 200)"/>
  <rect x="460" y="250" width="9" height="4" fill="#ff006e" transform="rotate(-25 460 250)"/>
  <circle cx="150" cy="80" r="3" fill="#3a86ff"/>
  <circle cx="430" cy="200" r="4" fill="#ffbe0b"/>
  <circle cx="90" cy="280" r="3" fill="#8338ec"/>

  <!-- Stars -->
  <circle cx="50" cy="50" r="2" fill="#fff"/>
  <circle cx="120" cy="30" r="1.5" fill="#fff"/>
  <circle cx="300" cy="40" r="2" fill="#fff"/>
  <circle cx="480" cy="60" r="1.5" fill="#fff"/>
  <circle cx="480" cy="300" r="2" fill="#fff"/>
  <circle cx="30" cy="350" r="1.5" fill="#fff"/>
</svg>