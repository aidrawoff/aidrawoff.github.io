<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#4e2a1b"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="100%" stop-color="#5c3a21"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a46833"/>
      <stop offset="100%" stop-color="#6d421d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Wall warm glow & lighting highlights -->
  <circle cx="256" cy="256" r="220" fill="#ffb366" opacity="0.14"/>
  <ellipse cx="256" cy="150" rx="180" ry="40" fill="#ffdf91" opacity="0.08"/>
  
  <!-- Wooden Shelves -->
  <rect x="40" y="140" width="432" height="20" rx="4" fill="url(#shelf)"/>
  <rect x="40" y="320" width="432" height="20" rx="4" fill="url(#shelf)"/>
  <rect x="36" y="156" width="440" height="5" fill="#382210" opacity="0.4"/>
  <rect x="36" y="336" width="440" height="5" fill="#382210" opacity="0.4"/>
  
  <!-- Bakery Counter at bottom -->
  <rect x="0" y="430" width="512" height="82" fill="url(#counter)"/>
  <rect x="0" y="420" width="512" height="12" fill="#d49253"/>
  <rect x="0" y="430" width="512" height="4" fill="#3a2212" opacity="0.5"/>

  <!-- Pastries on bottom shelf (y=320) -->
  <!-- Bread loaf -->
  <ellipse cx="100" cy="310" rx="35" ry="16" fill="#d29034"/>
  <path d="M75 305 Q100 295 125 305" stroke="#b37020" stroke-width="4" fill="none"/>
  
  <!-- Croissant 1 -->
  <path d="M170 315 C170 290 200 290 210 310 C220 290 250 290 250 315 C230 325 190 325 170 315 Z" fill="#e8a842"/>
  
  <!-- Cupcakes -->
  <path d="M340 320 L350 295 L370 295 L380 320 Z" fill="#c28e46"/>
  <circle cx="360" cy="290" r="16" fill="#e85d75"/>
  <circle cx="355" cy="285" r="4" fill="#fff" opacity="0.7"/>
  
  <path d="M400 320 L410 295 L430 295 L440 320 Z" fill="#c28e46"/>
  <circle cx="420" cy="290" r="16" fill="#52b788"/>
  <circle cx="415" cy="285" r="4" fill="#fff" opacity="0.7"/>

  <!-- Pastries on top shelf (y=140) -->
  <circle cx="110" cy="128" r="16" fill="#e09f3e"/>
  <circle cx="150" cy="122" r="20" fill="#d48c32"/>
  
  <!-- Glass jar on top shelf right -->
  <rect x="360" y="90" width="45" height="50" rx="6" fill="#f4c47b" opacity="0.9"/>
  <rect x="367" y="82" width="30" height="10" rx="2" fill="#c28e46"/>
  <!-- Cookies inside jar -->
  <circle cx="375" cy="115" r="5" fill="#8a4f21"/>
  <circle cx="390" cy="120" r="5" fill="#8a4f21"/>
  <circle cx="382" cy="105" r="5" fill="#8a4f21"/>

  <!-- Bat hanging upside down from top shelf -->
  <!-- Feet hanging onto bottom of top shelf (y=160) -->
  <ellipse cx="246" cy="153" rx="5" ry="4" fill="#3a2e2b"/>
  <ellipse cx="266" cy="153" rx="5" ry="4" fill="#3a2e2b"/>
  <path d="M242 153 C240 145 250 145 248 153 Z" fill="#1f1816"/>
  <path d="M262 153 C260 145 270 145 268 153 Z" fill="#1f1816"/>
  
  <!-- Legs -->
  <line x1="246" y1="155" x2="252" y2="175" stroke="#2c2220" stroke-width="6" stroke-linecap="round"/>
  <line x1="266" y1="155" x2="260" y2="175" stroke="#2c2220" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Bat Body -->
  <path d="M226 180 Q256 160 286 180 Q306 240 256 270 Q206 240 226 180 Z" fill="#362924"/>
  <path d="M246 175 Q256 168 266 175 Q275 220 256 250 Q236 220 246 175 Z" fill="#42332c" opacity="0.6"/>
  
  <!-- Wings wrapped around body -->
  <path d="M228 190 Q180 225 215 260 Q235 235 230 200 Z" fill="#251a16"/>
  <path d="M284 190 Q332 225 297 260 Q277 235 282 200 Z" fill="#251a16"/>
  
  <!-- Bat Head -->
  <ellipse cx="256" cy="285" rx="32" ry="28" fill="#3a2e2b"/>
  
  <!-- Ears -->
  <polygon points="230,270 213,235 240,258" fill="#3a2e2b"/>
  <polygon points="282,270 299,235 272,258" fill="#3a2e2b"/>
  <!-- Inner ears -->
  <polygon points="230,266 219,242 238,258" fill="#e89282"/>
  <polygon points="282,266 293,242 274,258" fill="#e89282"/>
  
  <!-- Eyes -->
  <ellipse cx="243" cy="282" rx="7" ry="8" fill="#ffea79"/>
  <ellipse cx="269" cy="282" rx="7" ry="8" fill="#ffea79"/>
  <circle cx="245" cy="281" r="3" fill="#111"/>
  <circle cx="267" cy="281" r="3" fill="#111"/>
  <circle cx="247" cy="279" r="1.5" fill="#fff"/>
  <circle cx="269" cy="279" r="1.5" fill="#fff"/>
  <circle cx="243" cy="284" r="0.8" fill="#fff"/>
  <circle cx="265" cy="284" r="0.8" fill="#fff"/>
  
  <!-- Cute nose & happy expression -->
  <polygon points="256,290 252,295 260,295" fill="#1a1210"/>
  <path d="M250 300 Q256 306 262 300" stroke="#1a1210" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Rosy cheeks -->
  <circle cx="236" cy="292" r="5" fill="#ff8fa3" opacity="0.5"/>
  <circle cx="276" cy="292" r="5" fill="#ff8fa3" opacity="0.5"/>
  
  <!-- Stolen pastry held in wing -->
  <path d="M200 245 C200 235 215 235 220 247 C225 235 240 235 240 247 C230 253 210 253 200 245 Z" fill="#f3bc64" transform="rotate(-20 220 245)"/>
  <path d="M210 241 Q220 237 230 243" stroke="#d49237" stroke-width="2" fill="none" transform="rotate(-20 220 245)"/>
  
  <!-- Sparkles / magical bakery atmosphere -->
  <circle cx="290" cy="210" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="220" cy="190" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="270" cy="130" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="310" cy="260" r="1.5" fill="#fff" opacity="0.7"/>
