<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#f0f8ff"/>
  <!-- Sky gradient -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="512">
    <stop offset="0" stop-color="#87ceeb"/>
    <stop offset="1" stop-color="#e0f7ff"/>
  </linearGradient>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- Sand strip -->
  <rect x="0" y="384" width="512" height="128" fill="#f4e4c1"/>
  <!-- Ocean waves -->
  <path d="M0,420 Q128,400 256,420 T512,420 L512,512 L0,512 Z" fill="#1e88e5" opacity="0.7"/>
  <!-- Skeleton base pose: standing on sand -->
  <g id="skeleton">
    <!-- Head -->
    <circle cx="256" cy="200" r="16" fill="#f5f5f5"/>
    <circle cx="256" cy="200" r="12" fill="#ffffff" opacity="0.3"/>
    <!-- Torso -->
    <path d="M256,216 L256,280" stroke="#f5f5f5" stroke-width="8" stroke-linecap="round"/>
    <path d="M256,216 L256,240" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.2"/>
    <!-- Arms -->
    <path d="M256,240 L200,220" stroke="#f5f5f5" stroke-width="6" stroke-linecap="round"/>
    <path d="M256,240 L312,220" stroke="#f5f5f5" stroke-width="6" stroke-linecap="round"/>
    <path d="M256,240 L200,220" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.15"/>
    <path d="M256,240 L312,220" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.15"/>
    <!-- Legs -->
    <path d="M256,280 L220,380" stroke="#f5f5f5" stroke-width="7" stroke-linecap="round"/>
    <path d="M256,280 L292,380" stroke="#f5f5f5" stroke-width="7" stroke-linecap="round"/>
    <path d="M256,280 L220,380" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.12"/>
    <path d="M256,280 L292,380" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.12"/>
    <!-- Pelvis -->
    <ellipse cx="256" cy="280" rx="12" ry="8" fill="#f5f5f5"/>
    <ellipse cx="256" cy="280" rx="10" ry="6" fill="#ffffff" opacity="0.1"/>
  </g>
  <!-- Twist: skeleton holding a bucket -->
  <g id="bucket">
    <!-- Bucket body -->
    <path d="M200,220 L200,260 L240,260 L240,220 Z" fill="#ff6b6b"/>
    <path d="M204,224 L204,256 L236,256 L236,224 Z" fill="#ffffff" opacity="0.15"/>
    <!-- Bucket handle -->
    <path d="M200,220 Q220,200 240,220" stroke="#333" stroke-width="4" fill="none"/>
    <path d="M202,218 Q220,198 238,218" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.2"/>
    <!-- Bucket bottom highlight -->
    <path d="M200,260 L240,260" stroke="#ffd93d" stroke-width="2"/>
    <!-- Tiny splash under bucket -->
    <path d="M210,262 Q220,268 230,262" fill="#1e88e5" opacity="0.6"/>
  </g>
  <!-- Skeleton grip on bucket handle -->
  <path d="M200,220 L190,210" stroke="#f5f5f5" stroke-width="4" stroke-linecap="round"/>
  <path d="M200,220 L190,210" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.18"/>
  <!-- Sand shadow under skeleton and bucket -->
  <ellipse cx="256" cy="380" rx="40" ry="12" fill="#e2c094" opacity="0.4"/>
  <ellipse cx="220" cy="370" rx="16" ry="6" fill="#e2c094" opacity="0.3"/>
  <!-- Bucket shadow on sand -->
  <ellipse cx="220" cy="370" rx="20" ry="8" fill="#e2c094" opacity="0.2"/>
  <!-- Skeleton cast shadow on sand -->
  <path d="M220,380 Q256,390 292,380" stroke="#e2c094" stroke-width="12" fill="none" opacity="0.2"/>
</svg>