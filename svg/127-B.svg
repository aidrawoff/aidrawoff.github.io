<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a3b4c"/>
      <stop offset="60%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#090c10"/>
    </radialGradient>
    <linearGradient id="lilyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b7a57"/>
      <stop offset="50%" stop-color="#2d5e44"/>
      <stop offset="100%" stop-color="#1b4d3e"/>
    </linearGradient>
    <linearGradient id="frogGrad" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="50%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5c4b8a"/>
      <stop offset="50%" stop-color="#312252"/>
      <stop offset="100%" stop-color="#150d24"/>
    </linearGradient>
    <radialGradient id="glowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7ffeb" stop-opacity="1"/>
      <stop offset="50%" stop-color="#64ffda" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00b0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Mystic moon & atmosphere -->
  <circle cx="380" cy="110" r="50" fill="#fef08a" opacity="0.12"/>
  <circle cx="380" cy="110" r="32" fill="#fffef0" opacity="0.18"/>

  <!-- Swamp background reeds -->
  <path d="M 50 512 Q 62 410 70 512 M 85 512 Q 95 430 105 512 M 415 512 Q 428 420 440 512 M 455 512 Q 465 390 480 512" stroke="#162b21" stroke-width="7" fill="none" opacity="0.7"/>
  <path d="M 30 512 Q 40 450 48 512 M 470 512 Q 485 440 495 512" stroke="#1b3829" stroke-width="5" fill="none" opacity="0.5"/>

  <!-- Giant Lily Pad Stage -->
  <ellipse cx="256" cy="405" rx="195" ry="92" fill="url(#lilyGrad)" stroke="#14362b" stroke-width="3"/>
  <path d="M 256 405 L 330 490" stroke="#14362b" stroke-width="9" stroke-linecap="round"/>
  <!-- Lily pad notch -->
  <polygon points="256,405 310,345 256,305" fill="url(#bgGrad)"/>

  <!-- Water ripple rings -->
  <ellipse cx="256" cy="425" rx="215" ry="98" fill="none" stroke="#26a69a" stroke-width="2" opacity="0.35"/>
  <ellipse cx="256" cy="442" rx="238" ry="104" fill="none" stroke="#00897b" stroke-width="1.5" opacity="0.2"/>

  <!-- Water Lily Flower on the left -->
  <g transform="translate(100, 410)">
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#f8bbd0" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#f48fb1" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#f8bbd0" transform="rotate(90)"/>
    <circle cx="0" cy="0" rx="8" ry="8" fill="#ffeb3b"/>
  </g>

  <!-- Fireflies & Magical Orbs -->
  <circle cx="140" cy="180" r="5" fill="url(#glowOrb)"/>
  <circle cx="370" cy="260" r="6" fill="url(#glowOrb)"/>
  <circle cx="110" cy="340" r="4" fill="url(#glowOrb)"/>
  <circle cx="400" cy="160" r="5" fill="url(#glowOrb)"/>
  <circle cx="256" cy="15" r="7" fill="url(#glowOrb)"/>

  <!-- Frog Body & Limbs -->
  <!-- Back legs -->
  <ellipse cx="155" cy="385" rx="48" ry="32" fill="#2e7d32" transform="rotate(-15 155 385)"/>
  <ellipse cx="357" cy="385" rx="48" ry="32" fill="#2e7d32" transform="rotate(15 357 385)"/>
  <!-- Front feet with toes -->
  <ellipse cx="185" cy="425" rx="24" ry="13" fill="#4caf50"/>
  <circle cx="168" cy="428" r="6" fill="#4caf50"/>
  <circle cx="202" cy="428" r="6" fill="#4caf50"/>

  <ellipse cx="327" cy="425" rx="24" ry="13" fill="#4caf50"/>
  <circle cx="310" cy="428" r="6" fill="#4caf50"/>
  <circle cx="344" cy="428" r="6" fill="#4caf50"/>

  <!-- Main Torso -->
  <ellipse cx="256" cy="355" rx="115" ry="88" fill="url(#frogGrad)"/>
  <!-- Belly (lighter creamy green) -->
  <ellipse cx="256" cy="370" rx="78" ry="58" fill="#c8e6c9" opacity="0.9"/>
  <!-- Belly texture dots -->
  <circle cx="230" cy="360" r="3" fill="#a5d6a7" opacity="0.6"/>
  <circle cx="282" cy="360" r="3" fill="#a5d6a7" opacity="0.6"/>
  <circle cx="256" cy="385" r="3.5" fill="#a5d6a7" opacity="0.6"/>

  <!-- Frog Head -->
  <ellipse cx="256" cy="260" rx="104" ry="78" fill="url(#frogGrad)"/>

  <!-- Big Frog Eyes (Protruding) -->
  <circle cx="180" cy="190" r="34" fill="url(#frogGrad)"/>
  <circle cx="332" cy="190" r="34" fill="url(#frogGrad)"/>
  <!-- Pupils & Iris -->
  <circle cx="180" cy="190" r="22" fill="#ffeb3b" opacity="0.3"/>
  <ellipse cx="180" cy="190" rx="14" ry="21" fill="#0d1117"/>
  <circle cx="175" cy="182" r="5" fill="#ffffff"/>
  <circle cx="185" cy="198" r="2" fill="#ffffff" opacity="0.7"/>

  <circle cx="332" cy="190" r="22" fill="#ffeb3b" opacity="0.3"/>
  <ellipse cx="332" cy="190" rx="14" ry="21" fill="#0d1117"/>
  <circle cx="327" cy="182" r="5" fill="#ffffff"/>
  <circle cx="337" cy="198" r="2" fill="#ffffff" opacity="0.7"/>

  <!-- Rosy Cheeks & Smile -->
  <circle cx="205" cy="275" r="14" fill="#a5d6a7" opacity="0.7"/>
  <circle cx="307" cy="275" r="14" fill="#a5d6a7" opacity="0.7"/>
  <path d="M 205 285 Q 256 320 307 285" stroke="#1b5e20" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="256" cy="295" r="6" fill="#1b5e20"/>

  <!-- Witch Hat -->
  <!-- Hat Brim -->
  <ellipse cx="256" cy="182" rx="125" ry="27" fill="url(#hatGrad)" stroke="#9c27b0" stroke-width="2.5"/>
  <!-- Hat Cone with dramatic curve -->
  <path d="M 155 178 Q 225 45 256 25 Q 305 75 357 178 Z" fill="url(#hatGrad)"/>
  <!-- Hat Tip Bend -->
  <path d="M 256 25 Q 272 8 295 12 Q 280 20 256 25 Z" fill="#312252"/>
  <!-- Hat Ribbon / Band -->
  <path d="M 182 172 Q 256 155 330 172 L 327 190 Q 256 172 185 190 Z" fill="#ab47bc"/>
  <!-- Golden Buckle -->
  <rect x="238" y="159" width="36" height="26" rx="5" fill="none" stroke="#ffd700" stroke-width="4"/>
  <rect x="246" y="167" width="20" height="10" rx="2" fill="#ffd700" opacity="0.3"/>

  <!-- Magic Sparkles & Stars -->
  <g fill="#ffd700" filter="drop-shadow(0 0 8px #ffeb3b)">
    <path d="M 130 115 L 136 132 L 153 138 L 136 144 L 130 161 L 124 144 L 107 138 L 124 132 Z"/>
    <path d="M 380 95 L 384 105 L 394 109 L 384 113 L 380 123 L 376 113 L 366 109 L 376 105 Z" fill="#64ffda"/>
    <path d="M 220 70 L 223 78 L 231 81 L 223 84 L 220 92 L 217 84 L 209 81 L 217 78 Z"/>
  </g>

  <!-- Glowing Potion Flask held by frog's right hand -->
  <g transform="translate(370, 340)">
    <circle cx="0" cy="0" r="25" fill="#00e5ff" opacity="0.6" filter="drop-shadow(0 0 12px #00bcd4)"/>
    <circle cx="0" cy="0" r="22" fill="#18ffff" opacity="0.4"/>
    <rect x="-6" y="-32" width="12" height="10" rx="2" fill="#37474f"/>
    <path d="M -15 -10 Q 0 15 15 -10" stroke="#fff" stroke-width="3" fill="none" opacity="0.8"/>
    <!-- Bubbles inside flask -->
    <circle cx="-5" cy="5" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="8" cy="-2" r="2" fill="#fff" opacity="0.9"/>
  </g>
  <path d="M 320 375 Q 350 360 370 340" stroke="#4caf50" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Little floating magic runes / sparkles near base -->
  <circle cx="170" cy="300" r="3" fill="#ff80ab" filter="drop-shadow(0 0 5px #ff4081)"/>
  <circle cx="340" cy="300" r="3" fill="#b388ff" filter="drop-shadow(0 0 5px #7c4dff)"/>
</svg>