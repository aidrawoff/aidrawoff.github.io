<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22304a"/>
      <stop offset="1" stop-color="#5d7088"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf3e4"/>
      <stop offset="1" stop-color="#e9dcc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- rainy window backdrop -->
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
  <!-- blurred cafe lights outside -->
  <circle cx="90" cy="80" r="60" fill="url(#glow)"/>
  <circle cx="440" cy="100" r="50" fill="url(#glow)"/>
  <circle cx="90" cy="80" r="22" fill="#ffd27a" opacity="0.6"/>
  <circle cx="440" cy="100" r="18" fill="#ffb55a" opacity="0.6"/>
  <!-- rain streaks -->
  <g stroke="#cfe3f5" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="40" y1="170" x2="32" y2="200"/>
    <line x1="150" y1="60" x2="142" y2="90"/>
    <line x1="260" y1="150" x2="252" y2="180"/>
    <line x1="380" y1="40" x2="372" y2="70"/>
    <line x1="470" y1="230" x2="462" y2="260"/>
    <line x1="200" y1="300" x2="192" y2="330"/>
    <line x1="300" y1="20" x2="292" y2="50"/>
    <line x1="500" y1="330" x2="492" y2="360"/>
  </g>
  <!-- window frame mullion -->
  <rect x="250" y="0" width="12" height="512" fill="#3b2a1e" opacity="0.7"/>
  <!-- rain drips running down the glass -->
  <g stroke="#dbeaf7" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <line x1="300" y1="122" x2="300" y2="150"/>
    <line x1="470" y1="182" x2="470" y2="215"/>
    <line x1="20" y1="262" x2="20" y2="290"/>
    <line x1="420" y1="20" x2="420" y2="60"/>
  </g>
  <!-- condensation beads on the glass -->
  <g fill="#dbeaf7" opacity="0.6">
    <circle cx="300" cy="120" r="3"/>
    <circle cx="318" cy="140" r="2"/>
    <circle cx="470" cy="180" r="3"/>
    <circle cx="490" cy="205" r="2"/>
    <circle cx="275" cy="260" r="2.5"/>
    <circle cx="20" cy="260" r="3"/>
  </g>
  <!-- giant mug, zoomed in: fills most of the frame -->
  <rect x="40" y="200" width="330" height="312" rx="40" fill="url(#mug)"/>
  <rect x="40" y="200" width="330" height="312" rx="40" fill="none" stroke="#5a3e2b" stroke-width="8"/>
  <!-- coffee surface -->
  <ellipse cx="205" cy="240" rx="150" ry="28" fill="#5a3320"/>
  <ellipse cx="205" cy="238" rx="120" ry="18" fill="#7a4a2c"/>
  <!-- latte heart -->
  <path d="M205 252 C180 226 166 244 186 258 L205 272 L224 258 C244 244 230 226 205 252 Z" fill="#f4e6cf"/>
  <!-- painted band with dots, and warm window reflection -->
  <rect x="40" y="330" width="330" height="20" fill="#c8553d"/>
  <g fill="#fbf3e4">
    <circle cx="70" cy="340" r="4"/><circle cx="110" cy="340" r="4"/><circle cx="150" cy="340" r="4"/>
    <circle cx="190" cy="340" r="4"/><circle cx="230" cy="340" r="4"/><circle cx="270" cy="340" r="4"/>
    <circle cx="310" cy="340" r="4"/><circle cx="350" cy="340" r="4"/>
  </g>
  <rect x="70" y="270" width="26" height="120" rx="12" fill="#ffffff" opacity="0.35"/>
  <!-- table shadow under the mug -->
  <ellipse cx="215" cy="478" rx="210" ry="10" fill="#3b2415" opacity="0.5"/>
  <!-- handle -->
  <path d="M370 280 Q460 300 455 380 Q450 440 370 430" fill="none" stroke="#5a3e2b" stroke-width="22" stroke-linecap="round"/>
  <!-- steam -->
  <path d="M150 200 Q130 160 160 130 Q185 100 160 60" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path d="M230 200 Q210 165 240 140" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <!-- saucer under the mug -->
  <ellipse cx="210" cy="508" rx="200" ry="22" fill="#d9c8ae"/>
  <!-- ground: wooden table -->
  <rect x="0" y="470" width="512" height="42" fill="#7a4e2d"/>
  <rect x="0" y="470" width="512" height="6" fill="#9a6639"/>
  <!-- warm light pooling on the table from the window -->
  <ellipse cx="420" cy="480" rx="90" ry="8" fill="#ffd27a" opacity="0.35"/>
  <g stroke="#5e3b22" stroke-width="2" opacity="0.6">
    <line x1="0" y1="490" x2="512" y2="490"/>
    <line x1="60" y1="500" x2="200" y2="500"/>
    <line x1="300" y1="496" x2="470" y2="496"/>
  </g>
</svg>
