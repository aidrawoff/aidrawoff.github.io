<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- background -->
  <rect width="512" height="512" fill="#1a1a2e"/>
  <!-- ground -->
  <ellipse cx="256" cy="460" rx="220" ry="30" fill="#16213e"/>
  <!-- ghost sheet body -->
  <path d="M160 420 Q140 280 180 180 Q220 120 256 120 Q292 120 332 180 Q372 280 352 420 Q330 450 306 420 Q280 450 256 420 Q232 450 206 420 Q182 450 160 420Z" fill="#e8e8e8"/>
  <!-- ghost eye holes -->
  <ellipse cx="226" cy="230" rx="16" ry="22" fill="#1a1a2e"/>
  <ellipse cx="286" cy="230" rx="16" ry="22" fill="#1a1a2e"/>
  <!-- ghost mouth hole (small o) -->
  <ellipse cx="256" cy="270" rx="10" ry="12" fill="#1a1a2e"/>
  <!-- snail shell peeking out bottom -->
  <ellipse cx="256" cy="405" rx="55" ry="40" fill="#c49a6c"/>
  <ellipse cx="256" cy="405" rx="35" ry="25" fill="#8b5e3c"/>
  <!-- spiral on shell -->
  <path d="M256 405 Q270 395 275 410 Q280 425 260 425 Q240 425 240 405 Q240 385 265 385" fill="none" stroke="#5c3a21" stroke-width="4" stroke-linecap="round"/>
  <!-- snail head poking out -->
  <ellipse cx="256" cy="375" rx="28" ry="22" fill="#d4a574"/>
  <!-- snail eyes on stalks -->
  <line x1="244" y1="360" x2="236" y2="335" stroke="#d4a574" stroke-width="5" stroke-linecap="round"/>
  <line x1="268" y1="360" x2="276" y2="335" stroke="#d4a574" stroke-width="5" stroke-linecap="round"/>
  <circle cx="236" cy="335" r="7" fill="#d4a574"/>
  <circle cx="276" cy="335" r="7" fill="#d4a574"/>
  <!-- eye pupils -->
  <circle cx="236" cy="335" r="3" fill="#1a1a2e"/>
  <circle cx="276" cy="335" r="3" fill="#1a1a2e"/>
  <!-- snail feelers (small) -->
  <line x1="250" y1="360" x2="248" y2="345" stroke="#d4a574" stroke-width="3" stroke-linecap="round"/>
  <line x1="262" y1="360" x2="264" y2="345" stroke="#d4a574" stroke-width="3" stroke-linecap="round"/>
  <!-- snail smile -->
  <path d="M248 382 Q256 388 264 382" fill="none" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round"/>
  <!-- snail blush -->
  <ellipse cx="238" cy="375" rx="5" ry="3" fill="#e07a7a" opacity="0.5"/>
  <ellipse cx="274" cy="375" rx="5" ry="3" fill="#e07a7a" opacity="0.5"/>
  <!-- ghost sheet folds -->
  <path d="M200 280 Q220 320 210 380" fill="none" stroke="#d0d0d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M312 280 Q292 320 302 380" fill="none" stroke="#d0d0d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M256 180 Q256 240 256 300" fill="none" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>
  <!-- ghost sheet shadow under folds -->
  <path d="M190 300 Q210 340 200 390" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M322 300 Q302 340 312 390" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- moon glow behind -->
  <circle cx="400" cy="100" r="60" fill="#f0e6d2" opacity="0.08"/>
  <circle cx="400" cy="100" r="45" fill="#f0e6d2" opacity="0.15"/>
  <circle cx="400" cy="100" r="30" fill="#f0e6d2" opacity="0.35"/>
  <circle cx="400" cy="100" r="18" fill="#f0e6d2" opacity="0.8"/>
  <!-- stars -->
  <circle cx="80" cy="80" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="120" cy="140" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="60" cy="200" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="450" cy="180" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="380" cy="240" r="2" fill="#fff" opacity="0.6"/>
  <!-- snail trail shimmer -->
  <ellipse cx="256" cy="455" rx="80" ry="6" fill="#a8c8ec" opacity="0.25"/>
</svg>