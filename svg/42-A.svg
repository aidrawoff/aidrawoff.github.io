<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="water" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2f8f9d"/>
      <stop offset="70%" stop-color="#1b5e6e"/>
      <stop offset="100%" stop-color="#0b2e3a"/>
    </radialGradient>
    <radialGradient id="pad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6cc46f"/>
      <stop offset="100%" stop-color="#2a7a36"/>
    </radialGradient>
    <radialGradient id="koiO" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff9a4d"/>
      <stop offset="100%" stop-color="#d4441a"/>
    </radialGradient>
    <clipPath id="bodyA"><ellipse cx="0" cy="0" rx="82" ry="32"/></clipPath>
    <clipPath id="bodyB"><ellipse cx="0" cy="0" rx="72" ry="28"/></clipPath>
    <clipPath id="bodyC"><ellipse cx="0" cy="0" rx="54" ry="21"/></clipPath>
  </defs>
  <!-- dark ground with round bushes -->
  <rect width="512" height="512" fill="#0e1d0c"/>
  <g fill="#1d3a1c">
    <circle cx="70" cy="70" r="56"/>
    <circle cx="450" cy="60" r="50"/>
    <circle cx="60" cy="440" r="60"/>
    <circle cx="455" cy="450" r="52"/>
  </g>
  <!-- stone rim -->
  <circle cx="256" cy="256" r="236" fill="#6f6758" stroke="#3d3628" stroke-width="6"/>
  <g fill="#8f8572" stroke="#4a4234" stroke-width="3">
    <circle cx="256" cy="26" r="15"/>
    <circle cx="256" cy="486" r="16"/>
    <circle cx="26" cy="256" r="14"/>
    <circle cx="486" cy="256" r="14"/>
    <circle cx="90" cy="90" r="14"/>
    <circle cx="422" cy="422" r="15"/>
  </g>
  <!-- pond -->
  <circle cx="256" cy="256" r="216" fill="url(#water)" stroke="#2a2519" stroke-width="8"/>
  <!-- ripples -->
  <g fill="none" stroke="#9fe3ea" stroke-opacity="0.35" stroke-width="2">
    <circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="185"/>
    <circle cx="150" cy="170" r="18"/>
    <circle cx="150" cy="170" r="30"/>
    <circle cx="370" cy="330" r="16"/>
    <circle cx="370" cy="330" r="27"/>
    <circle cx="340" cy="110" r="12"/>
    <circle cx="340" cy="110" r="21"/>
  </g>
  <!-- lily pads with a little notch-free round shape and lighter rim -->
  <g stroke="#1b5222" stroke-width="3">
    <circle cx="120" cy="290" r="44" fill="url(#pad)"/>
    <circle cx="395" cy="200" r="38" fill="url(#pad)"/>
    <circle cx="300" cy="420" r="32" fill="url(#pad)"/>
    <circle cx="170" cy="90" r="30" fill="url(#pad)"/>
    <circle cx="430" cy="380" r="22" fill="url(#pad)"/>
  </g>
  <g fill="#8fd98f" opacity="0.5">
    <circle cx="112" cy="282" r="14"/>
    <circle cx="388" cy="194" r="10"/>
  </g>
  <g fill="#ffd0e0" stroke="#c2456f" stroke-width="2">
    <circle cx="120" cy="290" r="7"/>
    <circle cx="395" cy="200" r="6"/>
    <circle cx="300" cy="420" r="5"/>
  </g>
  <!-- koi shadows -->
  <g fill="#06202a" opacity="0.4" transform="translate(8 10)">
    <ellipse cx="230" cy="230" rx="82" ry="32" transform="rotate(-25 230 230)"/>
    <ellipse cx="340" cy="300" rx="72" ry="28" transform="rotate(140 340 300)"/>
    <ellipse cx="170" cy="360" rx="54" ry="21" transform="rotate(60 170 360)"/>
  </g>
  <!-- koi A: orange and white -->
  <g id="koi1" transform="translate(230 230) rotate(-25)">
    <circle cx="-74" cy="0" r="16" fill="#e0501c" stroke="#7a2a0c" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="82" ry="32" fill="url(#koiO)" stroke="#7a2a0c" stroke-width="3"/>
    <g clip-path="url(#bodyA)">
      <ellipse cx="-30" cy="-6" rx="22" ry="16" fill="#fff4e0"/>
      <ellipse cx="6" cy="10" rx="16" ry="12" fill="#fff4e0"/>
      <ellipse cx="-56" cy="8" rx="12" ry="9" fill="#fff4e0"/>
      <ellipse cx="34" cy="-16" rx="10" ry="7" fill="#fff4e0"/>
    </g>
    <circle cx="66" cy="0" r="28" fill="#ff7a33" stroke="#7a2a0c" stroke-width="3"/>
    <circle cx="20" cy="-30" r="10" fill="#e0501c" stroke="#7a2a0c" stroke-width="2"/>
    <circle cx="20" cy="30" r="10" fill="#e0501c" stroke="#7a2a0c" stroke-width="2"/>
    <circle cx="76" cy="-9" r="4.5" fill="#1a1a1a"/>
    <circle cx="76" cy="11" r="4.5" fill="#1a1a1a"/>
    <circle cx="78" cy="-10" r="1.5" fill="#fff"/>
  </g>
  <!-- koi B: white with red and black -->
  <g id="koi2" transform="translate(340 300) rotate(140)">
    <circle cx="-62" cy="0" r="14" fill="#f2f2ea" stroke="#6b6b66" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="72" ry="28" fill="#fbfbf6" stroke="#6b6b66" stroke-width="3"/>
    <g clip-path="url(#bodyB)">
      <circle cx="-14" cy="-6" r="22" fill="#e8301c"/>
      <circle cx="30" cy="10" r="12" fill="#e8301c"/>
      <circle cx="-40" cy="10" r="8" fill="#1a1a1a"/>
    </g>
    <circle cx="58" cy="0" r="22" fill="#fbfbf6" stroke="#6b6b66" stroke-width="3"/>
    <circle cx="-62" cy="-8" r="3.5" fill="#222"/>
    <circle cx="-62" cy="8" r="3.5" fill="#222"/>
    <circle cx="66" cy="-6" r="3.5" fill="#222"/>
    <circle cx="66" cy="6" r="3.5" fill="#222"/>
  </g>
  <!-- koi C: golden -->
  <g id="koi3" transform="translate(170 360) rotate(60)">
    <circle cx="-44" cy="0" r="12" fill="#ffc94d" stroke="#8a5a0c" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="54" ry="21" fill="#ffd166" stroke="#8a5a0c" stroke-width="3"/>
    <g clip-path="url(#bodyC)">
      <circle cx="-10" cy="-4" r="12" fill="#fff1c2"/>
      <circle cx="18" cy="6" r="8" fill="#fff1c2"/>
    </g>
    <circle cx="48" cy="0" r="17" fill="#ffd166" stroke="#8a5a0c" stroke-width="3"/>
    <circle cx="52" cy="-5" r="2.8" fill="#222"/>
    <circle cx="52" cy="5" r="2.8" fill="#222"/>
  </g>
  <!-- ripples trailing the koi -->
  <g fill="none" stroke="#c8f4f8" stroke-opacity="0.4" stroke-width="2">
    <circle cx="290" cy="200" r="22"/>
    <circle cx="290" cy="200" r="34"/>
    <circle cx="352" cy="352" r="16"/>
    <circle cx="352" cy="352" r="28"/>
    <circle cx="190" cy="398" r="14"/>
    <circle cx="190" cy="398" r="24"/>
  </g>
  <!-- surface shine -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="200" cy="120" r="30"/>
    <circle cx="120" cy="200" r="10"/>
  </g>
</svg>
