<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- night wall and floor -->
  <rect x="0" y="0" width="512" height="512" fill="#2b2a4a"/>
  <rect x="0" y="430" width="512" height="82" fill="#5a3f2e"/>
  <rect x="0" y="428" width="512" height="6" fill="#3a2a1e"/>
  <!-- stars -->
  <circle cx="60" cy="60" r="2.5" fill="#fff8d6"/>
  <circle cx="120" cy="110" r="2" fill="#fff8d6"/>
  <circle cx="30" cy="170" r="2" fill="#fff8d6"/>
  <circle cx="200" cy="50" r="2.5" fill="#fff8d6"/>
  <circle cx="330" cy="40" r="2" fill="#fff8d6"/>
  <!-- moon -->
  <circle cx="440" cy="70" r="40" fill="#f6e7a1"/>
  <circle cx="455" cy="60" r="8" fill="#e2cf7e"/>
  <!-- door frame -->
  <rect x="160" y="100" width="190" height="330" fill="#6b4226" stroke="#1e130b" stroke-width="6"/>
  <rect x="180" y="120" width="150" height="290" fill="#8a5a34" stroke="#1e130b" stroke-width="4"/>
  <rect x="195" y="140" width="120" height="110" fill="none" stroke="#6b4226" stroke-width="5"/>
  <rect x="195" y="270" width="120" height="120" fill="none" stroke="#6b4226" stroke-width="5"/>
  <!-- ghost body -->
  <path d="M200 300 L200 200 Q200 140 260 140 Q320 140 320 200 L320 300 Q305 285 290 300 Q275 315 260 300 Q245 285 230 300 Q215 315 200 300 Z" fill="#f4f7ff" stroke="#1a1a2e" stroke-width="5"/>
  <!-- stuck arms, both pinned by the frame -->
  <path d="M202 230 Q186 236 180 250" fill="none" stroke="#1a1a2e" stroke-width="10" stroke-linecap="round"/>
  <path d="M202 230 Q186 236 180 250" fill="none" stroke="#f4f7ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M318 235 Q334 240 340 254" fill="none" stroke="#1a1a2e" stroke-width="10" stroke-linecap="round"/>
  <path d="M318 235 Q334 240 340 254" fill="none" stroke="#f4f7ff" stroke-width="5" stroke-linecap="round"/>
  <!-- worried face -->
  <ellipse cx="238" cy="200" rx="7" ry="10" fill="#1a1a2e"/>
  <ellipse cx="280" cy="200" rx="7" ry="10" fill="#1a1a2e"/>
  <path d="M226 184 Q238 178 248 186" fill="none" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 186 Q282 178 292 184" fill="none" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="260" cy="236" rx="12" ry="9" fill="#1a1a2e"/>
  <!-- door leaf pinching the ghost -->
  <rect x="300" y="120" width="30" height="290" fill="#a06b3f" stroke="#1e130b" stroke-width="4"/>
  <line x1="300" y1="250" x2="330" y2="250" stroke="#1e130b" stroke-width="3"/>
  <circle cx="318" cy="290" r="5" fill="#f2c94c" stroke="#1e130b" stroke-width="2"/>
  <!-- sweat drop, in front -->
  <path d="M312 160 Q306 172 312 178 Q318 172 312 160 Z" fill="#8fd3ff" stroke="#1a1a2e" stroke-width="2"/>
  <!-- pinch shadow where the leaf meets the ghost -->
  <line x1="300" y1="140" x2="300" y2="300" stroke="#1a1a2e" stroke-width="3" opacity="0.5"/>
  <!-- contact shadow -->
  <ellipse cx="255" cy="432" rx="95" ry="8" fill="#3a2a1e" opacity="0.6"/>
  <!-- dust puffs on floor -->
  <circle cx="200" cy="440" r="5" fill="#7a5a44" opacity="0.6"/>
  <circle cx="312" cy="442" r="4" fill="#7a5a44" opacity="0.6"/>
</svg>
