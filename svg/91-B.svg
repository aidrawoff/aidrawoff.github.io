<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2b6f8f"/>
      <stop offset="55%" stop-color="#122a3d"/>
      <stop offset="100%" stop-color="#06090f"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2e3"/>
      <stop offset="100%" stop-color="#c8bda0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- halo ring behind figure -->
  <circle cx="256" cy="250" r="176" fill="none" stroke="#3fd0c9" stroke-width="3" opacity="0.5"/>
  <!-- mat -->
  <ellipse cx="256" cy="440" rx="190" ry="26" fill="#0d1b26"/>
  <ellipse cx="256" cy="436" rx="180" ry="20" fill="#16303f"/>

  <!-- SKELETON: warrior II pose, facing right -->
  <g stroke="#0a0f16" stroke-width="2" stroke-linejoin="round">
    <!-- back leg (straight, to the left) -->
    <path d="M212 300 L150 400 L136 424" fill="none" stroke="url(#bone)" stroke-width="20" stroke-linecap="round"/>
    <!-- front leg (bent, to the right) -->
    <path d="M280 300 L340 350 L346 420" fill="none" stroke="url(#bone)" stroke-width="20" stroke-linecap="round"/>
    <!-- feet -->
    <path d="M136 424 L104 432" fill="none" stroke="url(#bone)" stroke-width="14" stroke-linecap="round"/>
    <path d="M346 420 L386 428" fill="none" stroke="url(#bone)" stroke-width="14" stroke-linecap="round"/>
    <!-- pelvis -->
    <path d="M212 296 Q256 320 300 296" fill="none" stroke="url(#bone)" stroke-width="22" stroke-linecap="round"/>
    <!-- spine -->
    <path d="M256 292 L256 200" fill="none" stroke="url(#bone)" stroke-width="16" stroke-linecap="round"/>
    <!-- ribcage -->
    <path d="M256 210 Q218 224 222 258 M256 210 Q294 224 290 258" fill="none" stroke="url(#bone)" stroke-width="9"/>
    <path d="M256 226 Q224 238 228 266 M256 226 Q288 238 284 266" fill="none" stroke="url(#bone)" stroke-width="8"/>
    <path d="M256 242 Q230 252 234 274 M256 242 Q282 252 278 274" fill="none" stroke="url(#bone)" stroke-width="7"/>
    <!-- arms stretched out horizontally -->
    <path d="M252 206 L140 196 L96 194" fill="none" stroke="url(#bone)" stroke-width="15" stroke-linecap="round"/>
    <path d="M260 206 L372 196 L416 194" fill="none" stroke="url(#bone)" stroke-width="15" stroke-linecap="round"/>
    <!-- hands -->
    <path d="M96 194 L74 188 M96 196 L76 202" fill="none" stroke="url(#bone)" stroke-width="7" stroke-linecap="round"/>
    <path d="M416 194 L438 188 M416 196 L436 202" fill="none" stroke="url(#bone)" stroke-width="7" stroke-linecap="round"/>
    <!-- skull -->
    <circle cx="256" cy="160" r="42" fill="url(#bone)"/>
    <path d="M226 190 Q256 206 286 190" fill="url(#bone)"/>
  </g>

  <!-- FACE: eye sockets, nose, teeth grin -->
  <ellipse cx="238" cy="156" rx="12" ry="14" fill="#0a0f16"/>
  <ellipse cx="274" cy="156" rx="12" ry="14" fill="#0a0f16"/>
  <path d="M256 172 L250 184 L262 184 Z" fill="#0a0f16"/>
  <g stroke="#0a0f16" stroke-width="2">
    <rect x="236" y="192" width="40" height="12" rx="4" fill="#1a222e"/>
  </g>
  <g stroke="#efe7d2" stroke-width="2">
    <line x1="246" y1="192" x2="246" y2="204"/>
    <line x1="256" y1="192" x2="256" y2="204"/>
    <line x1="266" y1="192" x2="266" y2="204"/>
  </g>

  <!-- SUNGLASSES grounded on the sockets, casting shadow -->
  <g opacity="0.35"><rect x="222" y="152" width="34" height="20" rx="7" fill="#000"/>
     <rect x="258" y="152" width="34" height="20" rx="7" fill="#000"/></g>
  <g fill="#101820" stroke="#0a0f16" stroke-width="2">
    <rect x="222" y="144" width="34" height="20" rx="7"/>
    <rect x="258" y="144" width="34" height="20" rx="7"/>
    <path d="M256 150 L256 156" stroke="#0a0f16" stroke-width="5" fill="none"/>
    <path d="M222 150 L206 146 M292 150 L308 146" stroke="#0a0f16" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M226 148 L248 148 L238 160 Z" fill="#4fd8cf" opacity="0.55"/>
  <path d="M262 148 L284 148 L274 160 Z" fill="#4fd8cf" opacity="0.55"/>

  <!-- RIM LIGHT: cool edge on left of figure -->
  <g fill="none" stroke="#7ff0e6" stroke-linecap="round" opacity="0.85">
    <path d="M216 128 A42 42 0 0 0 218 188" stroke-width="4"/>
    <path d="M248 292 L248 206" stroke-width="3"/>
    <path d="M250 208 L146 198" stroke-width="3"/>
    <path d="M208 300 L146 398" stroke-width="3"/>
    <path d="M222 214 Q190 232 196 262" stroke-width="2"/>
  </g>

  <!-- floating om / dust motes for atmosphere -->
  <g fill="#7ff0e6" opacity="0.5">
    <circle cx="120" cy="120" r="3"/><circle cx="400" cy="100" r="2.5"/>
    <circle cx="440" cy="300" r="3"/><circle cx="80" cy="330" r="2.5"/>
    <circle cx="150" cy="60" r="2"/><circle cx="360" cy="460" r="2.5"/>
  </g>
  <ellipse cx="256" cy="440" rx="150" ry="10" fill="#3fd0c9" opacity="0.18"/>
</svg>
