<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- warm kitchen wall to every edge -->
  <rect x="0" y="0" width="512" height="512" fill="#fde7c2"/>
  <rect x="0" y="0" width="512" height="330" fill="#ffd9a0"/>
  <rect x="300" y="30" width="180" height="130" rx="8" fill="#bfe6ff" stroke="#8a5a2b" stroke-width="8"/>
  <line x1="390" y1="30" x2="390" y2="160" stroke="#8a5a2b" stroke-width="6"/>
  <!-- window curtains -->
  <path d="M300 30 Q318 90 300 160 L320 160 Q336 90 320 30 Z" fill="#f08a8a"/>
  <path d="M480 30 Q462 90 480 160 L460 160 Q444 90 460 30 Z" fill="#f08a8a"/>
  <!-- counter -->
  <rect x="0" y="330" width="512" height="182" fill="#b5703a"/>
  <rect x="0" y="330" width="512" height="14" fill="#8f5327"/>
  <!-- dragon tail curling behind -->
  <path d="M60 380 Q10 370 30 320 Q45 290 70 320" stroke="#3c8f48" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- dragon body -->
  <ellipse cx="150" cy="350" rx="105" ry="70" fill="#4fae5a"/>
  <!-- chef bib apron -->
  <path d="M90 300 L210 300 L222 400 L78 400 Z" fill="#ffffff" stroke="#e05a5a" stroke-width="6"/>
  <!-- dragon head -->
  <circle cx="160" cy="200" r="72" fill="#5fc46a"/>
  <path d="M118 150 L104 108 L142 140 Z" fill="#3c8f48"/>
  <path d="M192 140 L206 100 L212 150 Z" fill="#3c8f48"/>
  <!-- chef hat -->
  <ellipse cx="160" cy="132" rx="46" ry="26" fill="#ffffff" stroke="#d8d8d8" stroke-width="3"/>
  <rect x="120" y="136" width="80" height="18" fill="#ffffff" stroke="#d8d8d8" stroke-width="3"/>
  <!-- eyes, cheeks, smile -->
  <circle cx="135" cy="200" r="15" fill="#ffffff"/>
  <circle cx="185" cy="200" r="15" fill="#ffffff"/>
  <circle cx="139" cy="203" r="8" fill="#1d2b1f"/>
  <circle cx="189" cy="203" r="8" fill="#1d2b1f"/>
  <ellipse cx="122" cy="226" rx="9" ry="6" fill="#ff8f8f"/>
  <ellipse cx="198" cy="226" rx="9" ry="6" fill="#ff8f8f"/>
  <path d="M130 235 Q160 262 190 235" stroke="#1d2b1f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- little flame breath -->
  <path d="M232 222 Q252 200 242 178 Q266 196 262 222 Q248 232 232 222 Z" fill="#ff8c2b"/>
  <path d="M240 222 Q250 210 246 198 Q258 212 254 222 Z" fill="#ffd34d"/>
  <path d="M100 300 L108 400 M140 300 L142 400 M180 300 L176 400" stroke="#e05a5a" stroke-width="4" opacity="0.6"/>
  <!-- spatula in hand -->
  <rect x="222" y="300" width="10" height="70" fill="#8f5327" transform="rotate(-20 227 300)"/>
  <ellipse cx="218" cy="290" rx="18" ry="10" fill="#c7cdd4" transform="rotate(-20 218 290)"/>
  <!-- tall pancake stack on plate -->
  <ellipse cx="380" cy="420" rx="120" ry="28" fill="#e9eef2"/>
  <ellipse cx="380" cy="414" rx="108" ry="22" fill="#ffffff"/>
  <ellipse cx="380" cy="396" rx="84" ry="32" fill="#e8a955"/>
  <ellipse cx="380" cy="370" rx="84" ry="32" fill="#f2b862"/>
  <ellipse cx="380" cy="344" rx="84" ry="32" fill="#f7c46e"/>
  <ellipse cx="380" cy="320" rx="72" ry="26" fill="#fbd27f"/>
  <!-- butter and syrup -->
  <rect x="362" y="304" width="36" height="18" rx="3" fill="#ffe27a"/>
  <path d="M320 336 Q380 352 440 336" stroke="#c46a1a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- steam -->
  <path d="M340 290 Q332 270 344 255 Q356 240 346 222" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M390 286 Q382 266 394 252 Q406 238 396 220" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- blueberries on top of the stack -->
  <circle cx="352" cy="312" r="6" fill="#3b4fa8"/>
  <circle cx="368" cy="306" r="6" fill="#3b4fa8"/>
  <circle cx="394" cy="310" r="6" fill="#3b4fa8"/>
  <!-- contact shadows -->
  <ellipse cx="150" cy="424" rx="110" ry="8" fill="#8f5327" opacity="0.5"/>
  <!-- batter bowl on counter -->
  <ellipse cx="90" cy="478" rx="60" ry="10" fill="#6b3a1c" opacity="0.5"/>
  <path d="M30 430 Q30 470 90 470 Q150 470 150 430 Z" fill="#7fb8e0" stroke="#4a7fa8" stroke-width="5"/>
  <ellipse cx="90" cy="430" rx="60" ry="12" fill="#f6e3b0" stroke="#4a7fa8" stroke-width="5"/>
  <!-- flipped pancakes on the counter -->
  <ellipse cx="270" cy="470" rx="46" ry="12" fill="#e8a955"/>
  <ellipse cx="270" cy="458" rx="46" ry="12" fill="#f7c46e"/>
  <ellipse cx="270" cy="446" rx="46" ry="12" fill="#fbd27f"/>
  <ellipse cx="430" cy="484" rx="40" ry="10" fill="#e8a955"/>
  <ellipse cx="430" cy="474" rx="40" ry="10" fill="#f7c46e"/>
</svg>
