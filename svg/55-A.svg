<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Video Game Screen & Treehouse Jellyfish (Final Bell Polish) -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#212d53"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="jellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff79c6" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#bd93f9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8be9fd" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1608"/>
      <stop offset="50%" stop-color="#5c381f"/>
      <stop offset="100%" stop-color="#180d05"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" stroke="#bd93f9" stroke-width="6"/>

  <!-- Arcade Starry Background Pixels -->
  <g fill="#f8f8f2" opacity="0.9">
    <rect x="40" y="60" width="4" height="4"/>
    <rect x="470" y="80" width="6" height="6"/>
    <rect x="420" y="250" width="5" height="5"/>
    <rect x="60" y="290" width="4" height="4"/>
    <rect x="230" y="50" width="5" height="5"/>
    <rect x="120" y="140" width="4" height="4"/>
    <rect x="380" y="120" width="5" height="5"/>
    <rect x="90" y="390" width="4" height="4"/>
    <rect x="410" y="370" width="5" height="5"/>
    <rect x="195" y="105" width="3" height="3" fill="#8be9fd"/>
    <rect x="315" y="85" width="4" height="4" fill="#ff79c6"/>
    <rect x="260" y="45" width="4" height="4" fill="#50fa7b"/>
  </g>

  <!-- HUD / Video Game Frame -->
  <rect x="16" y="16" width="480" height="480" rx="8" fill="none" stroke="#6272a4" stroke-width="3"/>
  
  <!-- Score & HP Bar UI -->
  <text x="32" y="48" fill="#50fa7b" font-family="monospace" font-size="16" font-weight="bold">SCORE: 09420</text>
  <text x="360" y="48" fill="#ff5555" font-family="monospace" font-size="16" font-weight="bold">HP: ♥♥♥♡♡</text>
  <rect x="32" y="58" width="120" height="10" fill="#44475a" rx="3"/>
  <rect x="32" y="58" width="120" height="10" fill="#50fa7b" rx="3"/>
  <text x="380" y="76" fill="#f1fa8c" font-family="monospace" font-size="14">COIN x 99</text>

  <!-- Tree Trunk & Branches (Treehouse Structure) -->
  <path d="M 155 512 L 195 280 L 130 195 L 185 155 L 327 155 L 382 195 L 317 280 L 357 512 Z" fill="url(#trunkGrad)" stroke="#1a0f07" stroke-width="4"/>
  
  <!-- Wood Grain Detail -->
  <path d="M 210 290 L 205 490" stroke="#3b220c" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 302 290 L 307 490" stroke="#3b220c" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Treehouse Room / Balcony Structure -->
  <rect x="188" y="215" width="136" height="154" fill="#654321" stroke="#3b220c" stroke-width="4" rx="6"/>
  <!-- Canopy Roof -->
  <polygon points="256,92 130,185 382,185" fill="#2d5a27" stroke="#1b3617" stroke-width="4"/>
  <polygon points="256,110 160,180 352,180" fill="#387032" opacity="0.8"/>
  
  <!-- Open Balcony Window -->
  <rect x="214" y="245" width="84" height="112" fill="#050a18" stroke="#ffb86c" stroke-width="3" rx="4"/>

  <!-- Vibrant Vines & Leaves -->
  <path d="M 185 170 Q 155 220 185 270" fill="none" stroke="#50fa7b" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 327 170 Q 357 220 327 270" fill="none" stroke="#50fa7b" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="175" cy="215" r="8" fill="#50fa7b"/>
  <circle cx="337" cy="215" r="8" fill="#50fa7b"/>
  <circle cx="190" cy="285" r="7" fill="#50fa7b"/>
  <circle cx="322" cy="285" r="7" fill="#50fa7b"/>

  <!-- Jellyfish in Treehouse Canopy / Balcony (Maximum Glow & Polish) -->
  <g filter="url(#glow)">
    <!-- Bioluminescent Spores / Particles -->
    <circle cx="215" cy="195" r="5.5" fill="#8be9fd"/>
    <circle cx="297" cy="195" r="4.5" fill="#ff79c6"/>
    <circle cx="256" cy="185" r="6.5" fill="#50fa7b"/>
    <circle cx="232" cy="225" r="4" fill="#ffb86c"/>
    <circle cx="280" cy="225" r="4" fill="#8be9fd"/>

    <!-- Tentacles with graceful fluid curves -->
    <path d="M 222 195 Q 232 235 212 275 T 228 320" fill="none" stroke="#ff79c6" stroke-width="4" stroke-linecap="round"/>
    <path d="M 256 195 Q 238 240 265 280 T 242 335" fill="none" stroke="#8be9fd" stroke-width="4" stroke-linecap="round"/>
    <path d="M 290 195 Q 300 235 278 280 T 292 335" fill="none" stroke="#ff79c6" stroke-width="4" stroke-linecap="round"/>
    <path d="M 238 200 Q 256 245 248 295 T 258 340" fill="none" stroke="#50fa7b" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Jellyfish Bell -->
    <path d="M 204 170 C 204 118 308 118 308 170 C 308 188 204 188 204 170 Z" fill="url(#jellyGrad)" stroke="#f8f8f2" stroke-width="3"/>
    <path d="M 218 150 Q 256 132 294 150" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.95"/>
  </g>

  <!-- Arcade Joystick & Button UI -->
  <g transform="translate(410, 410)">
    <rect x="-16" y="10" width="52" height="26" rx="5" fill="#44475a" stroke="#6272a4" stroke-width="2"/>
    <circle cx="10" cy="-4" r="11" fill="#ff5555" stroke="#ff79c6" stroke-width="2"/>
    <line x1="10" y1="7" x2="10" y2="20" stroke="#f8f8f2" stroke-width="3.5"/>
  </g>

  <!-- Level Banner UI -->
  <rect x="124" y="450" width="264" height="40" rx="9" fill="#282a36" stroke="#8be9fd" stroke-width="2.5"/>
  <text x="256" y="475" fill="#f8f8f2" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">LVL 3: CANOPY DEPTHS</text>
</svg>
