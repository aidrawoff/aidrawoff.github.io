  <circle cx="200" cy="240" r="40" fill="#3fae5c"/>
  <circle cx="312" cy="240" r="40" fill="#3fae5c"/>
  <circle cx="200" cy="238" r="28" fill="#fffbe8"/>
  <circle cx="312" cy="238" r="28" fill="#fffbe8"/>
  <circle cx="204" cy="240" r="14" fill="#1a1a2a"/>
  <circle cx="308" cy="240" r="14" fill="#1a1a2a"/>
