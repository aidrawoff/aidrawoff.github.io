    <ellipse cx="204" cy="418" rx="30" ry="18"/>
    <ellipse cx="308" cy="418" rx="30" ry="18"/>
  </g>
  <g fill="#3fae5c">
    <circle cx="184" cy="424" r="9"/><circle cx="204" cy="430" r="9"/><circle cx="224" cy="424" r="9"/>
    <circle cx="288" cy="424" r="9"/><circle cx="308" cy="430" r="9"/><circle cx="328" cy="424" r="9"/>
  </g>
  <!-- rim light on outer body silhouette -->
  <path d="M138 340 Q136 290 150 258" stroke="#b9f5c0" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M374 340 Q376 290 362 258" stroke="#b9f5c0" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- wand held out to the side -->
  <g transform="rotate(28 396 402)">
    <rect x="391" y="300" width="10" height="110" rx="5" fill="#5b3a1e"/>
    <path d="M396 262 L405 288 L432 288 L410 304 L418 330 L396 314 L374 330 L382 304 L360 288 L387 288 Z" fill="#ffd76b"/>
  </g>
  <circle cx="396" cy="296" r="4" fill="#fffbe8" opacity="0.9"/>
