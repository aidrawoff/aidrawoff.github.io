  <circle cx="314" cy="234" r="5" fill="#ffffff"/>
  <!-- smile -->
  <path d="M186 320 Q256 372 326 320" stroke="#1c5c31" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- cheek blush -->
  <ellipse cx="164" cy="312" rx="18" ry="11" fill="#f2839f" opacity="0.7"/>
  <ellipse cx="348" cy="312" rx="18" ry="11" fill="#f2839f" opacity="0.7"/>
  <!-- witch hat -->
  <path d="M158 208 Q256 176 354 208 Q300 100 268 62 Q252 44 240 78 Q220 140 158 208 Z" fill="#6d2f8f"/>
  <ellipse cx="256" cy="208" rx="112" ry="26" fill="#8a3fae"/>
  <path d="M200 150 Q256 168 312 150 L306 128 Q256 146 206 128 Z" fill="#f2c14e"/>
  <circle cx="256" cy="140" r="12" fill="#f2c14e"/>
