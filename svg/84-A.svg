  <g stroke="#153f2a" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M40 512 Q34 440 52 404"/>
    <path d="M66 512 Q70 452 88 424"/>
    <path d="M472 512 Q478 442 458 406"/>
    <path d="M446 512 Q442 456 424 428"/>
