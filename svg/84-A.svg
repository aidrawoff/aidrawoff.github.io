<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1038"/>
      <stop offset="1" stop-color="#4a2a6b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="392" cy="112" r="70" fill="#f4e9c8"/>
  <circle cx="418" cy="96" r="62" fill="url(#sky)"/>
  <g fill="#ffe9a8">
    <circle cx="70" cy="70" r="3"/><circle cx="140" cy="40" r="2"/><circle cx="60" cy="200" r="2.5"/>
    <circle cx="470" cy="230" r="3"/><circle cx="300" cy="60" r="2"/><circle cx="250" cy="30" r="2.5"/>
  </g>
  <ellipse cx="256" cy="470" rx="230" ry="60" fill="#231640"/>
  <!-- body -->
  <ellipse cx="256" cy="330" rx="120" ry="110" fill="#3fae5c"/>
  <ellipse cx="256" cy="352" rx="82" ry="76" fill="#8fd98a"/>
