  <g fill="#ffe9a8">
    <path d="M96 300 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
    <path d="M432 340 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <circle cx="120" cy="150" r="3"/><circle cx="452" cy="176" r="2.5"/>
  </g>
