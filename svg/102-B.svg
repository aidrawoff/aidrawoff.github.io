<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0f071e"/>
    </radialGradient>
    <radialGradient id="pumpkinGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="70%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#689f38"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="415" rx="140" ry="25" fill="#0b0414"/>

  <!-- Fallen leaves on ground -->
  <path d="M 120 400 Q 140 380 160 410 Q 130 430 120 400 Z" fill="#d84315" opacity="0.8"/>
  <path d="M 370 405 Q 390 385 410 415 Q 380 435 370 405 Z" fill="#ef6c00" opacity="0.8"/>

  <!-- Motion wind lines for sneeze -->
  <path d="M 380 280 Q 430 270 470 250" stroke="#76ff03" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 360 320 Q 420 330 480 340" stroke="#76ff03" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 390 370 Q 440 390 490 410" stroke="#76ff03" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Pumpkin body segments -->
  <ellipse cx="256" cy="290" rx="150" ry="120" fill="#e65100"/>
  <ellipse cx="256" cy="290" rx="125" ry="118" fill="url(#pumpkinGrad)"/>
  <ellipse cx="210" cy="290" rx="80" ry="110" fill="#ffa726" opacity="0.3"/>
  <ellipse cx="302" cy="290" rx="80" ry="110" fill="#e65100" opacity="0.4"/>
  <ellipse cx="256" cy="290" rx="60" ry="115" fill="#ffb74d" opacity="0.4"/>

  <!-- Top highlight sheen -->
  <ellipse cx="256" cy="205" rx="70" ry="25" fill="#ffecb3" opacity="0.25"/>

  <!-- Stem -->
  <path d="M 235 170 Q 220 120 195 95 Q 230 115 255 150 Z" fill="url(#stemGrad)"/>
  <path d="M 255 150 Q 275 130 300 125 Q 275 140 255 165 Z" fill="#558b2f"/>

  <!-- Flying leaf caught in sneeze -->
  <path d="M 390 230 Q 410 210 430 240 Q 400 260 390 230 Z" fill="#7cb342" transform="rotate(35 410 230)"/>

  <!-- Furrowed brow / expression lines -->
  <path d="M 180 215 Q 210 235 235 215" stroke="#bf360c" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 332 215 Q 302 235 277 215" stroke="#bf360c" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Squinting / sneezing eyes >< with glow -->
  <path d="M 190 235 L 225 265 M 225 235 L 190 265" stroke="#1a0b2e" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 322 235 L 287 265 M 287 235 L 322 265" stroke="#1a0b2e" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Nose area (wrinkled) -->
  <path d="M 240 270 Q 256 280 272 270" stroke="#bf360c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 250 255 Q 256 265 262 255" stroke="#ffb74d" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Huge sneezing mouth -->
  <path d="M 210 300 Q 256 280 302 300 Q 340 350 302 390 Q 256 420 210 390 Q 170 350 210 300 Z" fill="#1a0b2e" stroke="#bf360c" stroke-width="6"/>
  <!-- Teeth inside mouth -->
  <path d="M 220 310 L 235 325 L 250 310 L 265 325 L 280 310 L 295 325" stroke="#ffcc80" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Sneeze explosion: green slime / droplets / seeds flying out -->
  <path d="M 290 350 Q 350 320 420 310 Q 370 360 300 370 Z" fill="#76ff03" opacity="0.85" filter="url(#glow)"/>
  <circle cx="330" cy="340" r="18" fill="#76ff03" filter="url(#glow)"/>
  <circle cx="370" cy="320" r="24" fill="#aeea00" filter="url(#glow)"/>
  <circle cx="420" cy="345" r="14" fill="#76ff03"/>
  <circle cx="390" cy="385" r="20" fill="#64dd17"/>
  <circle cx="440" cy="390" r="10" fill="#aeea00"/>
  <!-- Flying pumpkin seeds -->
  <ellipse cx="350" cy="370" rx="8" ry="12" fill="#ffecb3" transform="rotate(45 350 370)"/>
  <ellipse cx="400" cy="320" rx="7" ry="11" fill="#ffecb3" transform="rotate(-30 400 320)"/>
  <ellipse cx="450" cy="360" rx="9" ry="14" fill="#ffecb3" transform="rotate(60 450 360)"/>

  <!-- Little sparkles / saliva droplets -->
  <circle cx="320" cy="310" r="5" fill="#ffffff"/>
  <circle cx="380" cy="295" r="7" fill="#ffffff"/>
  <circle cx="420" cy="330" r="4" fill="#ffffff"/>
  <circle cx="460" cy="310" r="3" fill="#ffffff"/>
</svg>
