<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="50%" stop-color="#F09819"/>
      <stop offset="100%" stop-color="#FFDD55"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#92FE9D"/>
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#C71585"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4B2B"/>
      <stop offset="100%" stop-color="#FF416C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#111122" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Sunset & Dynamic Speed Streaks -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <g stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" stroke-linecap="round">
    <line x1="20" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="160" x2="240" y2="160"/>
    <line x1="40" y1="260" x2="280" y2="260"/>
    <line x1="10" y1="360" x2="180" y2="360"/>
  </g>

  <!-- Highway Ground / Commute Track -->
  <path d="M 0 430 Q 256 460 512 410 L 512 512 L 0 512 Z" fill="#1E272E" opacity="0.9"/>
  <path d="M 0 430 Q 256 460 512 410" fill="none" stroke="#F1C40F" stroke-width="8" stroke-dasharray="25,18"/>

  <!-- Motion Sparks and Energy Particles -->
  <g fill="#F1C40F">
    <circle cx="140" cy="410" r="5"/>
    <circle cx="120" cy="425" r="3"/>
    <circle cx="100" cy="415" r="2"/>
    <circle cx="360" cy="390" r="6"/>
    <circle cx="380" cy="375" r="4"/>
    <circle cx="395" cy="365" r="2"/>
  </g>

  <!-- Main Turtle Character Group (Dynamic Diagonal Action Pose) -->
  <g transform="rotate(-18 256 256)" filter="url(#shadow)">
    
    <!-- Skateboard / Commuter wheels -->
    <g stroke="#1E272E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <rect x="130" y="370" width="240" height="26" rx="13" fill="url(#boardGrad)"/>
      <!-- Wheel assembly & bearings -->
      <circle cx="165" cy="408" r="16" fill="#34495E"/>
      <circle cx="345" cy="388" r="16" fill="#34495E"/>
      <circle cx="165" cy="408" r="6" fill="#ECF0F1"/>
      <circle cx="345" cy="388" r="6" fill="#ECF0F1"/>
      <!-- Grip tape edge -->
      <line x1="145" y1="375" x2="355" y2="375" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10,6"/>
    </g>

    <!-- Back Flipper / Action Thrust -->
    <path d="M 150 270 C 100 310 80 355 60 330 C 40 305 90 240 130 235 Z" fill="#2ECC71" stroke="#1E272E" stroke-width="6" stroke-linejoin="round"/>

    <!-- Shell Bottom / Body -->
    <path d="M 170 210 Q 256 170 340 210 Q 380 270 340 330 Q 256 370 170 330 Q 130 270 170 210 Z" fill="#27AE60" stroke="#1E272E" stroke-width="6" stroke-linejoin="round"/>

    <!-- Shell Dome Pattern (Glossy Gradient) -->
    <path d="M 200 230 Q 256 200 310 230 Q 330 270 310 310 Q 256 330 200 310 Q 180 270 200 230 Z" fill="url(#shellGrad)" stroke="#1E272E" stroke-width="6" stroke-linejoin="round"/>
    <!-- Scutes lines -->
    <path d="M 256 210 L 256 330" stroke="#1E272E" stroke-width="5"/>
    <path d="M 200 260 L 310 260" stroke="#1E272E" stroke-width="5"/>
    <path d="M 200 295 L 310 295" stroke="#1E272E" stroke-width="5"/>

    <!-- Head & Extended Neck -->
    <path d="M 310 220 C 365 210 405 190 425 155 C 440 130 415 115 395 140 C 375 160 355 190 310 200 Z" fill="#2ECC71" stroke="#1E272E" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Eye & Determined Commuter Expression -->
    <circle cx="395" cy="150" r="8" fill="#1E272E"/>
    <circle cx="397" cy="148" r="3" fill="#FFFFFF"/>
    <!-- Determined Eyebrow -->
    <path d="M 385 138 L 405 142" stroke="#1E272E" stroke-width="4" stroke-linecap="round"/>
    <!-- Confident Smile -->
    <path d="M 405 162 Q 418 168 412 178" fill="none" stroke="#1E272E" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Executive Commuter Tie -->
    <polygon points="320,200 340,205 332,255 327,255" fill="#E74C3C" stroke="#1E272E" stroke-width="4" stroke-linejoin="round"/>
    <!-- Tie Knot -->
    <polygon points="318,198 335,202 332,212 320,210" fill="#C0392B" stroke="#1E272E" stroke-width="3"/>

    <!-- Front Flipper (Reaching forward, strong action) -->
    <path d="M 330 280 C 380 315 425 295 445 250 C 460 215 420 210 390 235 C 365 260 340 270 330 280 Z" fill="#2ECC71" stroke="#1E272E" stroke-width="6" stroke-linejoin="round"/>

  </g>

  <!-- The Birthday Cake (Mandatory Twist requirement) prominently riding on shell / side -->
  <g transform="translate(50, 30)" filter="url(#shadow)">
    <!-- Plate -->
    <ellipse cx="230" cy="270" rx="70" ry="18" fill="#ECF0F1" stroke="#1E272E" stroke-width="6"/>
    
    <!-- Cake Base Tier -->
    <path d="M 168 220 L 168 260 Q 230 278 292 260 L 292 220 Q 230 238 168 220 Z" fill="url(#cakeGrad)" stroke="#1E272E" stroke-width="6"/>
    <ellipse cx="230" cy="220" rx="62" ry="16" fill="#FF69B4" stroke="#1E272E" stroke-width="6"/>
    
    <!-- Rich White Icing Drips -->
    <path d="M 172 225 Q 190 250 205 225 Q 225 255 242 225 Q 260 250 278 225 L 288 235 L 288 220 Q 230 238 168 220 Z" fill="#FFFFFF" stroke="#1E272E" stroke-width="4"/>

    <!-- Festive Candles -->
    <rect x="222" y="170" width="16" height="50" fill="#F1C40F" stroke="#1E272E" stroke-width="5" rx="3"/>
    <!-- Flame with Inner Glow -->
    <path d="M 230 135 C 248 148 242 168 230 172 C 218 168 212 148 230 135 Z" fill="#FF4500" stroke="#1E272E" stroke-width="4"/>
    <path d="M 230 145 C 238 152 236 162 230 166 C 224 162 222 152 230 145 Z" fill="#FFD700"/>
    
    <!-- Sprinkles on cake -->
    <circle cx="200" cy="245" r="3" fill="#00CED1"/>
    <circle cx="255" cy="240" r="3" fill="#32CD32"/>
    <circle cx="225" cy="252" r="3" fill="#9370DB"/>
    <circle cx="210" cy="235" r="2.5" fill="#FFD700"/>
    <circle cx="245" cy="250" r="2.5" fill="#FFFFFF"/>
  </g>

</svg>
