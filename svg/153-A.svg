<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="lampGlow" cx="400" cy="225" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffea9f" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffb703" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1b120c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241710"/>
      <stop offset="100%" stop-color="#120a07"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#wallGrad)"/>
  
  <!-- Back Wall / Bookshelves -->
  <rect x="40" y="30" width="432" height="330" fill="#2d1e15" rx="8"/>
  <rect x="40" y="30" width="432" height="330" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Bookshelf shelves -->
  <line x1="40" y1="115" x2="472" y2="115" stroke="#180f0a" stroke-width="8"/>
  <line x1="40" y1="200" x2="472" y2="200" stroke="#180f0a" stroke-width="8"/>
  <line x1="40" y1="285" x2="472" y2="285" stroke="#180f0a" stroke-width="8"/>
  
  <!-- Books on top shelf with gold foil highlights -->
  <g fill="#8b263e">
    <rect x="55" y="55" width="20" height="60" rx="2"/>
    <rect x="77" y="60" width="24" height="55" rx="2"/>
    <rect x="115" y="50" width="16" height="65" rx="2"/>
    <rect x="145" y="55" width="32" height="60" rx="2"/>
  </g>
  <line x1="65" y1="70" x2="65" y2="100" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <line x1="161" y1="70" x2="161" y2="100" stroke="#d4af37" stroke-width="2" opacity="0.6"/>

  <g fill="#2e5b88">
    <rect x="188" y="53" width="22" height="62" rx="2"/>
    <rect x="225" y="58" width="28" height="57" rx="2"/>
    <rect x="275" y="50" width="20" height="65" rx="2"/>
  </g>
  <line x1="239" y1="75" x2="239" y2="105" stroke="#d4af37" stroke-width="2" opacity="0.6"/>

  <g fill="#3a7d44">
    <rect x="308" y="55" width="24" height="60" rx="2"/>
    <rect x="345" y="52" width="18" height="63" rx="2"/>
    <rect x="375" y="60" width="30" height="55" rx="2"/>
    <rect x="418" y="55" width="22" height="60" rx="2"/>
  </g>

  <!-- Books on middle shelf -->
  <g fill="#b57c2a">
    <rect x="52" y="135" width="28" height="65" rx="2"/>
    <rect x="95" y="140" width="22" height="60" rx="2"/>
    <rect x="135" y="130" width="38" height="70" rx="2"/>
  </g>
  <g fill="#6a358a">
    <rect x="195" y="138" width="20" height="62" rx="2"/>
    <rect x="240" y="132" width="32" height="68" rx="2"/>
    <rect x="295" y="140" width="24" height="60" rx="2"/>
  </g>
  <g fill="#2b7a78">
    <rect x="335" y="135" width="32" height="65" rx="2"/>
    <rect x="385" y="138" width="22" height="62" rx="2"/>
    <rect x="425" y="140" width="28" height="60" rx="2"/>
  </g>

  <!-- Wooden Library Table -->
  <rect x="50" y="335" width="412" height="155" fill="#4a2e18" rx="6"/>
  <rect x="50" y="335" width="412" height="22" fill="#623d21" rx="4"/>
  <!-- Table legs -->
  <rect x="75" y="445" width="32" height="65" fill="#2d1c10" rx="3"/>
  <rect x="405" y="445" width="32" height="65" fill="#2d1c10" rx="3"/>

  <!-- Steaming Mug of Tea with saucer -->
  <ellipse cx="104" cy="403" rx="20" ry="6" fill="#382213"/>
  <g transform="translate(90, 360)">
    <rect x="0" y="15" width="28" height="35" fill="#a3522f" rx="4"/>
    <path d="M 28 22 C 38 22 38 42 28 42" stroke="#a3522f" stroke-width="4" fill="none"/>
    <!-- Steam -->
    <path d="M 8 10 Q 14 -2 8 -14" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 18 12 Q 24 0 18 -12" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Open Book on Table with detailed pages & bookmark ribbon -->
  <g transform="translate(180, 360)">
    <!-- Bookmark ribbon hanging down -->
    <path d="M 122 110 L 122 135 L 128 145 L 122 140 Z" fill="#991b1b"/>
    <!-- Book shadow -->
    <path d="M 25 65 Q 106 35 122 65 L 122 115 Q 106 85 25 115 Z" fill="#201005" opacity="0.5"/>
    <!-- Book cover/pages -->
    <path d="M 30 60 Q 76 30 122 60 L 122 110 Q 76 80 30 110 Z" fill="#fcf6db"/>
    <path d="M 122 60 Q 168 30 214 60 L 214 110 Q 168 80 122 110 Z" fill="#fcf6db"/>
    <!-- Page text lines -->
    <line x1="45" y1="70" x2="105" y2="85" stroke="#b8a880" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="85" x2="95" y2="98" stroke="#b8a880" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="100" x2="85" y2="110" stroke="#b8a880" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="135" y1="70" x2="195" y2="85" stroke="#b8a880" stroke-width="3" stroke-linecap="round"/>
    <line x1="135" y1="85" x2="190" y2="98" stroke="#b8a880" stroke-width="3" stroke-linecap="round"/>
    <line x1="135" y1="100" x2="180" y2="110" stroke="#b8a880" stroke-width="3" stroke-linecap="round"/>
    <!-- Spine shadow -->
    <line x1="122" y1="60" x2="122" y2="110" stroke="#8a7852" stroke-width="4"/>
  </g>

  <!-- Werewolf Character -->
  <!-- Body / Fur Torso behind table -->
  <ellipse cx="256" cy="305" rx="95" ry="105" fill="#362922"/>
  <!-- Fur tufts on shoulders -->
  <path d="M 160 260 Q 145 275 160 290 Q 150 305 165 320" fill="#42332a"/>
  <path d="M 352 260 Q 367 275 352 290 Q 362 305 347 320" fill="#42332a"/>

  <!-- Head -->
  <ellipse cx="256" cy="195" rx="78" ry="78" fill="#42332a"/>
  
  <!-- Fur texture tufts on cheeks -->
  <path d="M 178 220 Q 165 235 185 245" fill="#362922"/>
  <path d="M 334 220 Q 347 235 327 245" fill="#362922"/>

  <!-- Ears -->
  <polygon points="185,145 155,80 215,125" fill="#362922"/>
  <polygon points="327,145 357,80 297,125" fill="#362922"/>
  <polygon points="190,140 170,98 210,125" fill="#c47070"/>
  <polygon points="322,140 342,98 302,125" fill="#c47070"/>

  <!-- Snout / Muzzle -->
  <ellipse cx="256" cy="225" rx="48" ry="38" fill="#59453b"/>
  <!-- Nose -->
  <polygon points="244,202 268,202 256,218" fill="#150e0a"/>
  <!-- Mouth / Friendly intelligent grin -->
  <path d="M 232 235 Q 256 252 280 235" stroke="#150e0a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Fangs -->
  <polygon points="236,236 242,252 248,236" fill="#fff"/>
  <polygon points="276,236 270,252 264,236" fill="#fff"/>

  <!-- Eyes with intelligent scholarly gleam -->
  <ellipse cx="222" cy="170" rx="15" ry="11" fill="#fcd34d"/>
  <ellipse cx="290" cy="170" rx="15" ry="11" fill="#fcd34d"/>
  <circle cx="222" cy="170" r="5" fill="#150e0a"/>
  <circle cx="290" cy="170" r="5" fill="#150e0a"/>
  <!-- Eye highlight -->
  <circle cx="218" cy="166" r="2" fill="#fff"/>
  <circle cx="286" cy="166" r="2" fill="#fff"/>

  <!-- Reading Glasses -->
  <circle cx="222" cy="170" r="20" fill="none" stroke="#eab308" stroke-width="4"/>
  <circle cx="290" cy="170" r="20" fill="none" stroke="#eab308" stroke-width="4"/>
  <line x1="242" y1="170" x2="270" y2="170" stroke="#eab308" stroke-width="4"/>

  <!-- Paws on Table holding book -->
  <ellipse cx="190" cy="365" rx="28" ry="22" fill="#42332a"/>
  <ellipse cx="322" cy="365" rx="28" ry="22" fill="#42332a"/>
  <!-- Claws -->
  <line x1="168" y1="375" x2="162" y2="392" stroke="#150e0a" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="380" x2="176" y2="398" stroke="#150e0a" stroke-width="3" stroke-linecap="round"/>
  <line x1="344" y1="380" x2="348" y2="398" stroke="#150e0a" stroke-width="3" stroke-linecap="round"/>
  <line x1="332" y1="375" x2="338" y2="392" stroke="#150e0a" stroke-width="3" stroke-linecap="round"/>

  <!-- Desk Lamp (Warm Lighting Source) -->
  <path d="M 380 340 L 415 235 L 395 225" stroke="#eab308" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lamp shade -->
  <polygon points="360,220 440,220 455,190 345,190" fill="#991b1b"/>
  <polygon points="360,220 440,220 445,225 355,225" fill="#7f1d1d"/>
  <!-- Lamp bulb glow -->
  <circle cx="400" cy="222" r="10" fill="#fef08a"/>
</svg>
