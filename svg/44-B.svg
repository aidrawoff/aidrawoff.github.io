<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Knit Pattern -->
    <pattern id="knit-bg" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f7f3ec"/>
      <path d="M12,2 Q18,8 12,14 Q6,8 12,2 Z" fill="none" stroke="#e8dfd1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0,14 Q6,20 0,26 Q-6,20 0,14 Z" fill="none" stroke="#e8dfd1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24,14 Q30,20 24,26 Q18,20 24,14 Z" fill="none" stroke="#e8dfd1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6,6 L18,18 M18,6 L6,18" stroke="#f0eae0" stroke-width="1" opacity="0.6"/>
    </pattern>

    <!-- Mint Yarn Texture -->
    <pattern id="yarn-mint" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="16" height="16" fill="#a3e4d7"/>
      <path d="M8,0 C4,4 12,12 8,16" stroke="#76d7c4" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M0,8 C4,4 12,12 16,8" stroke="#52be80" stroke-width="1.5" fill="none" opacity="0.7"/>
    </pattern>

    <!-- Peach Yarn Texture -->
    <pattern id="yarn-peach" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
      <rect width="16" height="16" fill="#fad7a0"/>
      <path d="M8,0 C12,4 4,12 8,16" stroke="#f8c471" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M0,8 C4,12 12,4 16,8" stroke="#eb984e" stroke-width="1.5" fill="none" opacity="0.7"/>
    </pattern>

    <!-- Periwinkle Yarn Texture -->
    <pattern id="yarn-periwinkle" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="16" height="16" fill="#d7bde2"/>
      <path d="M8,0 C5,5 11,11 8,16" stroke="#bb8fce" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M0,8 C5,11 11,5 16,8" stroke="#8e44ad" stroke-width="1.5" fill="none" opacity="0.7"/>
    </pattern>

    <!-- Yellow Yarn Texture -->
    <pattern id="yarn-yellow" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
      <rect width="16" height="16" fill="#fcf3cf"/>
      <path d="M8,0 C6,6 10,10 8,16" stroke="#f9e79f" stroke-width="4" fill="none" stroke-linecap="round"/>
    </pattern>

    <!-- Pink Yarn Texture -->
    <pattern id="yarn-pink" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="16" height="16" fill="#f5b7b1"/>
      <path d="M8,0 C5,5 11,11 8,16" stroke="#e74c3c" stroke-width="4" fill="none" stroke-linecap="round"/>
    </pattern>

    <!-- Soft Drop Shadow -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4a3b32" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Cozy Knitted Background -->
  <rect width="512" height="512" fill="url(#knit-bg)"/>

  <!-- Atmospheric Knitted Hills / Ground Waves at Bottom -->
  <path d="M 0,430 Q 140,400 280,430 T 512,410 L 512,512 L 0,512 Z" fill="#ebdcc8" opacity="0.8"/>
  <path d="M 0,455 Q 180,425 360,455 T 512,445 L 512,512 L 0,512 Z" fill="#e3ceb5" opacity="0.9"/>
  <path d="M 0,480 Q 200,460 400,480 T 512,475 L 512,512 L 0,512 Z" fill="#dac0a3" opacity="1.0"/>

  <!-- Ambient Knitted Clouds / Yarn Loops in Background -->
  <g opacity="0.55" fill="none" stroke="#d5c7b1" stroke-width="6" stroke-linecap="round">
    <path d="M 60,100 C 60,70 90,70 100,90 C 110,60 140,70 140,100 C 160,100 170,130 140,140 L 60,140 C 40,130 40,110 60,100 Z"/>
    <path d="M 380,70 C 380,45 410,45 420,65 C 430,35 460,45 460,70 C 480,70 490,100 460,110 L 380,110 C 360,100 360,80 380,70 Z"/>
    <path d="M 410,340 C 410,315 440,315 450,335 C 460,305 490,315 490,340 C 510,340 520,370 490,380 L 410,380 C 390,370 390,350 410,340 Z"/>
  </g>

  <!-- Trailing Yarn Stitches (Flight Paths) with Sparkle Knots -->
  <path d="M 80,420 Q 180,350 240,260 T 420,110" fill="none" stroke="#d4ac0d" stroke-width="3" stroke-dasharray="8,10" stroke-linecap="round" opacity="0.75"/>
  <path d="M 120,460 Q 220,380 300,300 T 460,170" fill="none" stroke="#bb8fce" stroke-width="2.5" stroke-dasharray="6,8" stroke-linecap="round" opacity="0.65"/>

  <!-- FLOCK OF PAPER PLANES (KNITTED) - 6 Planes -->

  <!-- Plane 1: Small Background Periwinkle Plane (Top Right) -->
  <g transform="translate(370, 95) rotate(-28) scale(0.5)" filter="url(#soft-shadow)">
    <polygon points="0,0 120,40 60,140" fill="url(#yarn-periwinkle)" stroke="#8e44ad" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="0,0 60,140 35,80" fill="#c39bd3" stroke="#8e44ad" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="0,0 120,40 70,65" fill="#e8daef" stroke="#8e44ad" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 0,0 L 60,140" stroke="#fff" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
  </g>

  <!-- Plane 2: Pink Plane (Mid Right) -->
  <g transform="translate(410, 220) rotate(-40) scale(0.6)" filter="url(#soft-shadow)">
    <polygon points="0,0 120,40 60,140" fill="url(#yarn-pink)" stroke="#c0392b" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="0,0 60,140 35,80" fill="#f1948a" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="0,0 120,40 70,65" fill="#fadbd8" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 0,0 L 60,140" stroke="#fff" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
  </g>

  <!-- Plane 3: Medium Peach Plane (Upper Left) -->
  <g transform="translate(120, 150) rotate(-12) scale(0.75)" filter="url(#soft-shadow)">
    <polygon points="0,0 160,50 80,180" fill="url(#yarn-peach)" stroke="#d35400" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="0,0 80,180 50,105" fill="#f5b041" stroke="#d35400" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="0,0 160,50 95,85" fill="#fdebd0" stroke="#d35400" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 0,0 L 80,180" stroke="#fff" stroke-width="3.5" stroke-dasharray="8,5" stroke-linecap="round"/>
    <circle cx="75" cy="115" r="8" fill="#e74c3c" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Plane 4: Tiny Scout Plane (Top Center) -->
  <g transform="translate(260, 80) rotate(-5) scale(0.45)" filter="url(#soft-shadow)">
    <polygon points="0,0 120,40 60,140" fill="url(#yarn-yellow)" stroke="#d4ac0d" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="0,0 60,140 35,80" fill="#f9e79f" stroke="#d4ac0d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 0,0 L 60,140" stroke="#fff" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
  </g>

  <!-- Plane 5: Large Hero Mint Plane (Center / Foreground) -->
  <g transform="translate(200, 230) rotate(14) scale(1.2)" filter="url(#soft-shadow)">
    <!-- Main Right Wing -->
    <polygon points="0,0 150,45 70,160" fill="url(#yarn-mint)" stroke="#117a65" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Left Wing (Underfold) -->
    <polygon points="0,0 70,160 40,95" fill="#48c9b0" stroke="#117a65" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Underbelly / Center Fold -->
    <polygon points="0,0 150,45 85,75" fill="#d1f2eb" stroke="#117a65" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Chunky Knitted Ribbing / Seam Stitching along edges -->
    <path d="M 0,0 L 150,45 L 70,160 Z" fill="none" stroke="#fff" stroke-width="3" opacity="0.6"/>
    <!-- Center Crease Yarn Stitches -->
    <path d="M 0,0 L 70,160" stroke="#ffffff" stroke-width="4" stroke-dasharray="10,6" stroke-linecap="round"/>
    <!-- Decorative Knit Button & Bow on wing -->
    <circle cx="65" cy="95" r="10" fill="#e74c3c" stroke="#f9e79f" stroke-width="3"/>
    <path d="M 50,85 Q 65,95 80,85 M 50,105 Q 65,95 80,105" fill="none" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Plane 6: Small Yellow Plane (Lower Right) -->
  <g transform="translate(320, 350) rotate(-32) scale(0.65)" filter="url(#soft-shadow)">
    <polygon points="0,0 120,40 60,140" fill="url(#yarn-yellow)" stroke="#d4ac0d" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="0,0 60,140 35,80" fill="#f9e79f" stroke="#d4ac0d" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="0,0 120,40 70,65" fill="#fef9e7" stroke="#d4ac0d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 0,0 L 60,140" stroke="#d68910" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
  </g>

  <!-- Foreground Knitted Yarn Ball & Loose Thread with Crochet Needle -->
  <g transform="translate(80, 410)" filter="url(#soft-shadow)">
    <!-- Yarn Ball -->
    <circle cx="0" cy="0" r="38" fill="#e74c3c" stroke="#b03a2e" stroke-width="3"/>
    <path d="M -28,-15 Q 0,-38 28,-15 Q 38,10 18,28 Q -10,38 -28,10 Z" fill="none" stroke="#c0392b" stroke-width="4.5"/>
    <path d="M -22,18 Q 0,28 22,5 Q 18,-22 -18,-18 Z" fill="none" stroke="#f1948a" stroke-width="3.5"/>
    <!-- Wooden Crochet Needle piercing the yarn ball -->
    <path d="M -50,-50 L 35,35" stroke="#d4ac0d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-shadow)"/>
    <circle cx="35" cy="35" r="4" fill="#b7950b"/>
    <!-- Unspooling thread winding up toward the planes -->
    <path d="M 28,15 Q 60,45 120,-10 T 130,-130" fill="none" stroke="#e74c3c" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round"/>
  </g>

  <!-- Floating Knit Stars / Confetti for extra magic -->
  <g fill="#f9e79f" stroke="#d4ac0d" stroke-width="1.5">
    <path d="M 240,160 L 243,168 L 251,171 L 243,174 L 240,182 L 237,174 L 229,171 L 237,168 Z" transform="scale(0.6) translate(150, 40)"/>
    <path d="M 240,160 L 243,168 L 251,171 L 243,174 L 240,182 L 237,174 L 229,171 L 237,168 Z" transform="scale(0.5) translate(450, 320)"/>
    <path d="M 240,160 L 243,168 L 251,171 L 243,174 L 240,182 L 237,174 L 229,171 L 237,168 Z" transform="scale(0.4) translate(280, 500)"/>
  </g>

</svg>
