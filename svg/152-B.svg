<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c9a0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- back wall -->
  <rect x="0" y="0" width="512" height="512" fill="#24133a"/>
  <!-- window with moon -->
  <rect x="340" y="50" width="120" height="110" fill="#140a2a" stroke="#0a0418" stroke-width="6"/>
  <circle cx="400" cy="95" r="26" fill="#f5e9b8"/>
  <line x1="400" y1="50" x2="400" y2="160" stroke="#0a0418" stroke-width="4"/>
  <!-- oven -->
  <rect x="20" y="230" width="180" height="200" fill="#3d2a24" stroke="#1a0f0c" stroke-width="6"/>
  <rect x="45" y="290" width="130" height="100" fill="#ff6a1a" stroke="#1a0f0c" stroke-width="5"/>
  <rect x="45" y="290" width="130" height="100" fill="url(#glow)"/>
  <rect x="35" y="278" width="150" height="10" fill="#1a0f0c"/>
  <!-- smoke puffs billowing -->
  <circle cx="80" cy="220" r="22" fill="#6b6370"/>
  <circle cx="120" cy="190" r="28" fill="#5a5260"/>
  <circle cx="90" cy="150" r="24" fill="#4a4250"/>
  <circle cx="140" cy="120" r="18" fill="#3e3648"/>
  <!-- floor -->
  <rect x="0" y="425" width="512" height="87" fill="#4a3026"/>
  <line x1="0" y1="425" x2="512" y2="425" stroke="#2e1b14" stroke-width="4"/>
  <!-- witch: pinched stance, cloak -->
  <path d="M262 326 Q226 340 218 430 L306 430 Q298 340 262 326 Z" fill="#3b1f5c" stroke="#120818" stroke-width="6"/>
  <path d="M250 340 L248 428" stroke="#5a3a85" stroke-width="3" opacity="0.7"/>
  <!-- arms raised holding tray, pinched -->
  <path d="M268 320 L300 285" stroke="#120818" stroke-width="14" stroke-linecap="round"/>
  <path d="M262 325 L240 300" stroke="#120818" stroke-width="12" stroke-linecap="round"/>
  <!-- cookie tray -->
  <rect x="236" y="268" width="110" height="12" fill="#9aa0a8" stroke="#120818" stroke-width="3"/>
  <!-- burnt lumpy cookies -->
  <circle cx="252" cy="258" r="13" fill="#2b1608" stroke="#120818" stroke-width="3"/>
  <circle cx="280" cy="254" r="15" fill="#2b1608" stroke="#120818" stroke-width="3"/>
  <circle cx="312" cy="258" r="12" fill="#2b1608" stroke="#120818" stroke-width="3"/>
  <circle cx="262" cy="252" r="5" fill="#120818" opacity="0.6"/>
  <circle cx="298" cy="250" r="4" fill="#120818" opacity="0.6"/>
  <circle cx="276" cy="240" r="6" fill="#ff8c3a" opacity="0.6"/>
  <!-- smoke wisps off cookies -->
  <path d="M280 236 Q290 220 280 205" stroke="#8a8394" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M312 240 Q322 225 312 212" stroke="#8a8394" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="262" cy="300" r="24" fill="#9fd98a" stroke="#120818" stroke-width="5"/>
  <!-- hair -->
  <path d="M240 296 Q238 318 246 326" stroke="#e8e0f0" stroke-width="6" fill="none"/>
  <path d="M284 296 Q286 318 278 326" stroke="#e8e0f0" stroke-width="6" fill="none"/>
  <!-- hat -->
  <path d="M226 290 Q262 284 298 290 L262 160 Z" fill="#1a0b2e" stroke="#120818" stroke-width="5"/>
  <ellipse cx="262" cy="290" rx="46" ry="9" fill="#1a0b2e" stroke="#120818" stroke-width="4"/>
  <path d="M236 280 Q262 274 288 280" stroke="#ff7ad9" stroke-width="5" fill="none"/>
  <!-- stuck expression: wide eyes, open mouth -->
  <circle cx="253" cy="300" r="5" fill="#fff" stroke="#120818" stroke-width="2"/>
  <circle cx="271" cy="300" r="5" fill="#fff" stroke="#120818" stroke-width="2"/>
  <circle cx="253" cy="301" r="2" fill="#120818"/>
  <circle cx="271" cy="301" r="2" fill="#120818"/>
  <ellipse cx="262" cy="316" rx="7" ry="8" fill="#3a0a14"/>
  <!-- dropped cookie at feet -->
  <circle cx="330" cy="418" r="8" fill="#2b1608" stroke="#120818" stroke-width="2"/>
  <!-- rim light on cloak edge -->
  <path d="M275 320 L300 430" stroke="#c9a0ff" stroke-width="3" opacity="0.6" fill="none"/>
  <ellipse cx="262" cy="300" rx="60" ry="80" fill="url(#rim)"/>
  <!-- sparkle of flour puffing off the tray -->
  <circle cx="300" cy="232" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="330" cy="226" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="345" cy="240" r="2" fill="#fff" opacity="0.6"/>
  <!-- contact shadow -->
  <ellipse cx="262" cy="432" rx="62" ry="9" fill="#000" opacity="0.45"/>
</svg>
