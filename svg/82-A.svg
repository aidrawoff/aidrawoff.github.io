<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1030"/>
      <stop offset="0.6" stop-color="#1b2450"/>
      <stop offset="1" stop-color="#2e3768"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="418" cy="72" r="34" fill="#f7f3d8" opacity="0.9"/>
  <circle cx="430" cy="66" r="30" fill="#1b2450" opacity="0.55"/>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="40" r="1.5"/><circle cx="200" cy="80" r="2"/>
    <circle cx="290" cy="46" r="1.5"/><circle cx="350" cy="110" r="2"/><circle cx="40" cy="150" r="1.5"/>
    <circle cx="170" cy="140" r="1.5"/><circle cx="470" cy="160" r="2"/>
  </g>

  <!-- distant skyline -->
  <g fill="#141a3a">
    <rect x="0" y="250" width="70" height="110"/>
    <rect x="78" y="215" width="56" height="145"/>
    <rect x="140" y="270" width="46" height="90"/>
    <rect x="192" y="235" width="60" height="125"/>
  </g>
  <g fill="#ffd86e" opacity="0.75">
    <rect x="14" y="266" width="8" height="10"/><rect x="34" y="288" width="8" height="10"/>
    <rect x="90" y="232" width="8" height="10"/><rect x="112" y="260" width="8" height="10"/>
    <rect x="206" y="252" width="8" height="10"/><rect x="228" y="284" width="8" height="10"/>
  </g>

  <!-- road + sidewalk -->
  <rect x="0" y="360" width="512" height="152" fill="#23283f"/>
  <rect x="0" y="360" width="512" height="10" fill="#3a4160"/>
  <g stroke="#c9b45a" stroke-width="5" stroke-dasharray="26 22" opacity="0.7">
    <line x1="0" y1="452" x2="512" y2="452"/>
  </g>

  <!-- arriving bus (right) -->
  <g>
    <rect x="376" y="228" width="140" height="150" rx="14" fill="#c8412f"/>
    <rect x="376" y="248" width="140" height="12" fill="#8e2b20"/>
    <rect x="392" y="266" width="112" height="52" rx="6" fill="#9fd8ea"/>
    <rect x="392" y="266" width="112" height="52" rx="6" fill="none" stroke="#7a251b" stroke-width="3"/>
    <line x1="448" y1="266" x2="448" y2="318" stroke="#7a251b" stroke-width="3"/>
    <rect x="386" y="330" width="120" height="16" rx="4" fill="#2b2f45"/>
    <circle cx="410" cy="372" r="20" fill="#16181f"/><circle cx="410" cy="372" r="8" fill="#5a5f78"/>
    <circle cx="486" cy="372" r="20" fill="#16181f"/><circle cx="486" cy="372" r="8" fill="#5a5f78"/>
    <circle cx="392" cy="344" r="11" fill="#fff3c4"/>
    <polygon points="392,344 250,300 250,404" fill="url(#beam)"/>
    <rect x="376" y="212" width="60" height="18" rx="4" fill="#f2e6c9"/>
    <text x="406" y="226" font-family="monospace" font-size="13" fill="#3a2c14" text-anchor="middle">12</text>
  </g>

  <!-- bus shelter -->
  <g>
    <rect x="40" y="196" width="196" height="10" rx="4" fill="#4a5578"/>
    <rect x="48" y="206" width="8" height="164" fill="#4a5578"/>
    <rect x="222" y="206" width="8" height="164" fill="#4a5578"/>
    <rect x="56" y="212" width="166" height="112" fill="#7fa8c4" opacity="0.22"/>
    <rect x="56" y="212" width="166" height="112" fill="none" stroke="#4a5578" stroke-width="4"/>
    <rect x="60" y="330" width="164" height="10" fill="#4a5578"/>
  </g>

  <!-- sign post -->
  <rect x="262" y="230" width="6" height="150" fill="#6b7597"/>
  <rect x="246" y="196" width="40" height="34" rx="4" fill="#f2e6c9"/>
  <text x="266" y="220" font-family="monospace" font-size="20" fill="#3a2c14" text-anchor="middle">B</text>

  <!-- bench -->
  <g fill="#6b4a2e">
    <rect x="86" y="318" width="120" height="12" rx="3"/>
    <rect x="86" y="336" width="120" height="10" rx="3"/>
    <rect x="96" y="346" width="10" height="30" fill="#4a3320"/>
    <rect x="186" y="346" width="10" height="30" fill="#4a3320"/>
  </g>

  <!-- SKELETON waiting on bench -->
  <g stroke="#f2f4ee" stroke-width="6" fill="none" stroke-linecap="round">
    <!-- legs: thigh forward, shin down -->
    <path d="M124 320 L150 344 L150 376"/>
    <path d="M140 320 L168 342 L168 376"/>
    <path d="M144 258 L144 316"/>
    <!-- pelvis -->
    <ellipse cx="144" cy="252" rx="18" ry="10" fill="#f2f4ee" stroke="none"/>
    <!-- ribs -->
    <path d="M126 226 q18 10 36 0"/>
    <path d="M124 238 q20 12 40 0"/>
    <path d="M126 250 q18 10 36 0"/>
    <line x1="144" y1="216" x2="144" y2="252"/>
    <!-- arms: one holding a mug, one draped -->
    <path d="M128 220 L104 246 L112 268"/>
    <path d="M160 220 L186 244 L180 272"/>
    <!-- spine to skull -->
    <line x1="144" y1="212" x2="144" y2="200"/>
  </g>
  <!-- skull -->
  <g>
    <circle cx="144" cy="182" r="24" fill="#f6f7f0"/>
    <path d="M126 198 q18 14 36 0 l0 8 q-18 10 -36 0 z" fill="#f6f7f0"/>
    <ellipse cx="135" cy="180" rx="6" ry="7" fill="#1a1f36"/>
    <ellipse cx="153" cy="180" rx="6" ry="7" fill="#1a1f36"/>
    <path d="M144 188 l-4 8 h8 z" fill="#1a1f36"/>
    <g stroke="#1a1f36" stroke-width="2">
      <line x1="134" y1="202" x2="134" y2="208"/>
      <line x1="144" y1="203" x2="144" y2="209"/>
      <line x1="154" y1="202" x2="154" y2="208"/>
    </g>
  </g>
  <!-- mug + steam -->
  <g>
    <rect x="100" y="262" width="20" height="18" rx="3" fill="#d9dee8"/>
    <path d="M120 266 q10 5 0 11" fill="none" stroke="#d9dee8" stroke-width="3"/>
    <path d="M106 258 q6 -8 0 -16 M114 258 q-6 -8 0 -16" fill="none" stroke="#cfd6e6" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- rain -->
  <g stroke="#9fc3e8" stroke-width="2" opacity="0.5">
    <line x1="30" y1="40" x2="18" y2="120"/><line x1="90" y1="20" x2="78" y2="100"/>
    <line x1="160" y1="60" x2="148" y2="140"/><line x1="230" y1="30" x2="218" y2="110"/>
    <line x1="300" y1="70" x2="288" y2="150"/><line x1="360" y1="30" x2="348" y2="110"/>
    <line x1="440" y1="90" x2="428" y2="170"/><line x1="490" y1="40" x2="478" y2="120"/>
    <line x1="60" y1="160" x2="48" y2="240"/><line x1="200" y1="180" x2="188" y2="250"/>
    <line x1="270" y1="150" x2="258" y2="230"/><line x1="330" y1="200" x2="322" y2="270"/>
  </g>
  <!-- wet ground reflections -->
  <g stroke="#7f8bb5" stroke-width="3" opacity="0.4">
    <line x1="110" y1="392" x2="180" y2="392"/>
    <line x1="300" y1="404" x2="420" y2="404"/>
    <line x1="60" y1="420" x2="140" y2="420"/>
  </g>
  <ellipse cx="150" cy="384" rx="46" ry="7" fill="#ffe9a8" opacity="0.18"/>
</svg>
