<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3b235f"/>
      <stop offset="55%" stop-color="#1b1030"/>
      <stop offset="100%" stop-color="#0a0512"/>
    </radialGradient>
    <linearGradient id="stem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0d0b0"/>
      <stop offset="50%" stop-color="#fdf6e2"/>
      <stop offset="100%" stop-color="#d4c29c"/>
    </linearGradient>
    <linearGradient id="cap" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>
    <linearGradient id="beanie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="50%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Atmospheric glowing flora in background -->
  <circle cx="120" cy="200" r="45" fill="#7209b7" opacity="0.25" filter="blur(15px)"/>
  <circle cx="390" cy="250" r="55" fill="#4361ee" opacity="0.2" filter="blur(20px)"/>
  <circle cx="256" cy="180" r="80" fill="#f72585" opacity="0.1" filter="blur(30px)"/>

  <!-- Glowing ambient aura behind mushroom -->
  <circle cx="256" cy="270" r="170" fill="#48cae4" opacity="0.15" filter="blur(25px)"/>

  <!-- Ground / Mossy hill -->
  <ellipse cx="256" cy="425" rx="200" ry="45" fill="#150e23"/>
  <ellipse cx="256" cy="435" rx="160" ry="30" fill="#0d0817"/>

  <!-- Grass tufts on ground -->
  <path d="M 120 420 Q 125 395 130 420 Q 135 400 140 425" stroke="#52b788" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 372 425 Q 377 400 382 425 Q 387 405 392 428" stroke="#52b788" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 160 430 Q 166 405 170 432" stroke="#74c69d" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 340 428 Q 345 408 350 430" stroke="#74c69d" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Mushroom Shadow -->
  <ellipse cx="256" cy="415" rx="75" ry="16" fill="#000000" opacity="0.65"/>

  <!-- Mushroom Stem with drop shadow -->
  <g filter="url(#shadow)">
    <path d="M 205 395 C 200 325 212 270 230 250 L 282 250 C 300 270 312 325 307 395 Z" fill="url(#stem)"/>
  </g>

  <!-- Face: Eyes and Cheeks -->
  <circle cx="233" cy="315" r="8.5" fill="#140b24"/>
  <circle cx="279" cy="315" r="8.5" fill="#140b24"/>
  <circle cx="230" cy="312" r="3.2" fill="#ffffff"/>
  <circle cx="276" cy="312" r="3.2" fill="#ffffff"/>
  <!-- Cheeks -->
  <ellipse cx="220" cy="326" r="11" fill="#ff6b6b" opacity="0.55"/>
  <ellipse cx="292" cy="326" r="11" fill="#ff6b6b" opacity="0.55"/>
  <!-- Smile -->
  <path d="M 244 330 Q 256 342 268 330" stroke="#140b24" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Active Hand 1 (holding brush) -->
  <path d="M 205 345 Q 185 335 172 318" stroke="url(#stem)" stroke-width="13" stroke-linecap="round" fill="none"/>
  <circle cx="168" cy="315" r="7.5" fill="#fdf6e2"/>

  <!-- Active Hand 2 (gesturing happily on right) -->
  <path d="M 307 345 Q 325 335 338 322" stroke="url(#stem)" stroke-width="13" stroke-linecap="round" fill="none"/>
  <circle cx="342" cy="318" r="7.5" fill="#fdf6e2"/>

  <!-- Mushroom Cap -->
  <g filter="url(#shadow)">
    <path d="M 110 265 C 110 160 180 125 256 125 C 332 125 402 160 402 265 C 362 255 256 270 110 265 Z" fill="url(#cap)"/>
  </g>

  <!-- Cap Specular Highlight -->
  <path d="M 160 160 Q 256 135 320 155" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.35" fill="none"/>

  <!-- Cap spots with soft inner shadow feel -->
  <circle cx="175" cy="195" r="19" fill="#ffffff" opacity="0.92"/>
  <circle cx="330" cy="195" r="23" fill="#ffffff" opacity="0.92"/>
  <circle cx="256" cy="168" r="15" fill="#ffffff" opacity="0.92"/>
  <circle cx="145" cy="240" r="13" fill="#ffffff" opacity="0.92"/>
  <circle cx="370" cy="240" r="16" fill="#ffffff" opacity="0.92"/>

  <!-- Cozy Striped Beanie -->
  <g filter="url(#shadow)">
    <path d="M 176 190 C 176 110 210 85 256 85 C 302 85 336 110 336 190 C 315 200 197 200 176 190 Z" fill="url(#beanie)"/>
    <!-- Beanie ribbing cuff -->
    <path d="M 168 180 C 196 192 316 192 344 180 L 347 202 C 316 214 196 214 165 202 Z" fill="#023e8a"/>
    <!-- Beanie stripes -->
    <path d="M 195 138 Q 256 126 317 138" stroke="#ffb703" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 185 160 Q 256 148 327 160" stroke="#edf2f4" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Pom-pom -->
    <circle cx="256" cy="68" r="19" fill="#ffb703"/>
    <circle cx="251" cy="63" r="6" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Paintbrush in hand -->
  <g transform="translate(142, 278) rotate(-35)">
    <rect x="0" y="0" width="9" height="65" rx="4.5" fill="#dda15e"/>
    <rect x="-1" y="60" width="11" height="13" rx="3" fill="#6c757d"/>
    <path d="M -1 73 Q 4.5 88 10 73 Z" fill="#e63946"/>
  </g>

  <!-- Additional glowing paint splash drops from brush -->
  <circle cx="128" cy="255" r="4" fill="#e63946" opacity="0.8"/>
  <circle cx="115" cy="270" r="3" fill="#ffb703" opacity="0.8"/>
  <circle cx="135" cy="285" r="3.5" fill="#48cae4" opacity="0.8"/>

  <!-- Floating magical sparkles -->
  <circle cx="95" cy="115" r="3.5" fill="#ffb703" opacity="0.85"/>
  <circle cx="430" cy="130" r="4.5" fill="#ffb703" opacity="0.85"/>
  <circle cx="395" cy="375" r="3.5" fill="#ffb703" opacity="0.85"/>
  <circle cx="125" cy="395" r="3" fill="#ffb703" opacity="0.85"/>
  <polygon points="256,40 259,48 267,51 259,54 256,62 253,54 245,51 253,48" fill="#ffb703" opacity="0.9"/>
</svg>
