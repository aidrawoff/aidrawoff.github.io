<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#3b2a6b"/>
    </linearGradient>
  </defs>
  <!-- night sky backdrop -->
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
  <circle cx="420" cy="90" r="36" fill="#f7efc8"/>
  <circle cx="432" cy="80" r="30" fill="#3b2a6b" opacity="0.35"/>
  <!-- stars -->
  <circle cx="60" cy="50" r="2" fill="#fff"/>
  <circle cx="150" cy="30" r="1.5" fill="#fff"/>
  <circle cx="260" cy="60" r="2" fill="#fff"/>
  <circle cx="330" cy="150" r="1.5" fill="#fff"/>
  <!-- ground -->
  <path d="M0 380 Q256 350 512 380 L512 512 L0 512 Z" fill="#2d4a2a"/>
  <path d="M0 430 Q256 405 512 430 L512 512 L0 512 Z" fill="#1f331d"/>
  <!-- garden fence behind -->
  <rect x="0" y="330" width="512" height="6" fill="#3a2418"/>
  <g fill="#3a2418">
    <rect x="20" y="318" width="8" height="40"/>
    <rect x="90" y="318" width="8" height="40"/>
    <rect x="300" y="318" width="8" height="40"/>
    <rect x="470" y="318" width="8" height="40"/>
  </g>
  <!-- wizard body: robe -->
  <path d="M190 360 L200 230 Q230 200 262 230 L274 360 Z" fill="#5a2d91"/>
  <path d="M215 240 L226 360 L240 360 L234 236 Z" fill="#7a46b8" opacity="0.6"/>
  <!-- head -->
  <circle cx="232" cy="200" r="22" fill="#f2c7a0"/>
  <!-- beard -->
  <path d="M214 208 Q232 252 250 208 Q240 222 232 222 Q224 222 214 208 Z" fill="#e8e8f0"/>
  <!-- hat -->
  <path d="M206 186 Q232 184 258 186 L232 108 Z" fill="#3a1f6e"/>
  <ellipse cx="232" cy="186" rx="34" ry="7" fill="#2a1452"/>
  <circle cx="236" cy="150" r="3" fill="#ffe27a"/>
  <!-- arm holding wand -->
  <path d="M262 245 Q300 240 320 215" stroke="#5a2d91" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="322" cy="212" r="6" fill="#f2c7a0"/>
  <!-- wand -->
  <line x1="322" y1="212" x2="370" y2="170" stroke="#6b4a2b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="374" cy="166" r="9" fill="#ffe27a"/>
  <circle cx="374" cy="166" r="30" fill="url(#glow)"/>
  <!-- sparkles -->
  <path d="M395 140 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 Z" fill="#fff6c0"/>
  <path d="M350 120 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 Z" fill="#ffe27a"/>
  <!-- glowing flowers left -->
  <line x1="120" y1="380" x2="120" y2="300" stroke="#2f6b34" stroke-width="4"/>
  <circle cx="120" cy="292" r="14" fill="#ff8fd0"/>
  <circle cx="120" cy="292" r="22" fill="#ff8fd0" opacity="0.25"/>
  <line x1="88" y1="380" x2="84" y2="330" stroke="#2f6b34" stroke-width="4"/>
  <circle cx="84" cy="322" r="11" fill="#8fe3ff"/>
  <circle cx="84" cy="322" r="18" fill="#8fe3ff" opacity="0.25"/>
  <!-- glowing flowers right -->
  <line x1="400" y1="390" x2="400" y2="320" stroke="#2f6b34" stroke-width="4"/>
  <circle cx="400" cy="312" r="16" fill="#ffb347"/>
  <circle cx="400" cy="312" r="26" fill="#ffb347" opacity="0.2"/>
  <line x1="436" y1="390" x2="440" y2="345" stroke="#2f6b34" stroke-width="4"/>
  <circle cx="440" cy="338" r="12" fill="#ff8fd0"/>
  <!-- wizard's watering can and stream of sparkling water -->
  <path d="M256 400 Q280 375 300 395" stroke="#8fe3ff" stroke-width="4" fill="none" stroke-dasharray="6 5"/>
  <path d="M276 362 L300 362 L300 394 L276 394 Z" fill="#7d8aa6"/>
  <path d="M300 368 L316 352" stroke="#7d8aa6" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="288" cy="396" rx="18" ry="3" fill="#0f1a0e" opacity="0.5"/>
  <!-- potted sprout in foreground -->
  <ellipse cx="120" cy="482" rx="34" ry="5" fill="#0f1a0e" opacity="0.5"/>
  <path d="M90 440 L150 440 L142 480 L98 480 Z" fill="#8a4b2a"/>
  <ellipse cx="120" cy="440" rx="30" ry="5" fill="#5a2d1a"/>
  <path d="M120 440 L120 418 M120 426 Q104 410 100 414 M120 424 Q136 408 140 412" stroke="#4fbf5a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="120" cy="416" r="5" fill="#fff6c0"/>
  <!-- lantern hanging from fence -->
  <line x1="200" y1="330" x2="200" y2="350" stroke="#3a2418" stroke-width="2"/>
  <rect x="192" y="350" width="16" height="20" rx="3" fill="#ffd36b"/>
  <circle cx="200" cy="360" r="40" fill="url(#glow)" opacity="0.6"/>
  <!-- ground shadows under flowers -->
  <ellipse cx="120" cy="382" rx="16" ry="4" fill="#0f1a0e" opacity="0.5"/>
  <ellipse cx="84" cy="382" rx="12" ry="3" fill="#0f1a0e" opacity="0.5"/>
  <ellipse cx="400" cy="392" rx="14" ry="3" fill="#0f1a0e" opacity="0.5"/>
  <ellipse cx="440" cy="392" rx="10" ry="3" fill="#0f1a0e" opacity="0.5"/>
  <!-- mushrooms by the fence -->
  <path d="M250 402 Q262 380 274 402 Z" fill="#ff8fd0"/>
  <rect x="258" y="400" width="8" height="10" fill="#f7efc8"/>
  <ellipse cx="262" cy="412" rx="22" ry="3" fill="#0f1a0e" opacity="0.5"/>
  <path d="M440 402 Q452 382 464 402 Z" fill="#8fe3ff"/>
  <rect x="448" y="400" width="8" height="10" fill="#f7efc8"/>
  <ellipse cx="452" cy="412" rx="20" ry="3" fill="#0f1a0e" opacity="0.5"/>
  <!-- wand light spilling on the wizard's hat and beard -->
  <circle cx="240" cy="200" r="46" fill="url(#glow)" opacity="0.35"/>
  <!-- sparkle trail from wand -->
  <path d="M345 185 l3 -6 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 Z" fill="#ffe27a" opacity="0.8"/>
  <circle cx="338" cy="196" r="2" fill="#fff6c0"/>
  <circle cx="356" cy="182" r="2" fill="#fff6c0"/>
  <!-- fireflies drifting over the blooms -->
  <circle cx="160" cy="250" r="2.5" fill="#fff6c0"/>
  <circle cx="60" cy="230" r="2.5" fill="#fff6c0"/>
  <circle cx="470" cy="260" r="2.5" fill="#fff6c0"/>
  <circle cx="330" cy="300" r="2" fill="#fff6c0"/>
  <!-- wizard's boots peeking under robe -->
  <path d="M220 356 L226 366 L238 366 L234 356 Z" fill="#2a1452"/>
  <path d="M248 356 L254 366 L266 366 L262 356 Z" fill="#2a1452"/>
  <!-- wizard's feet and shadow -->
  <ellipse cx="232" cy="362" rx="48" ry="6" fill="#0f1a0e" opacity="0.5"/>
</svg>
