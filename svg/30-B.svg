<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: deep starfield -->
  <rect width="512" height="512" fill="#050510"/>
  <!-- Stars (subtle, varied opacity) -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="60" cy="50" r="1"/>
    <circle cx="470" cy="70" r="1.1"/>
    <circle cx="100" cy="420" r="0.9"/>
    <circle cx="320" cy="40" r="1.2"/>
    <circle cx="490" cy="370" r="1"/>
    <circle cx="180" cy="20" r="1.3"/>
    <circle cx="130" cy="220" r="1"/>
    <circle cx="370" cy="420" r="1.1"/>
    <circle cx="420" cy="170" r="0.8"/>
    <circle cx="70" cy="320" r="1.2"/>
    <circle cx="220" cy="80" r="0.7"/>
    <circle cx="440" cy="280" r="1"/>
  </g>
  <!-- Moon (screaming silhouette) with eerie glow -->
  <path d="M 256 100 C 150 100 100 200 100 300 C 100 400 150 500 256 500 C 362 500 412 400 412 300 C 412 200 362 100 256 100 Z" fill="#f0e0d0"/>
  <!-- Moon craters (depth) -->
  <circle cx="180" cy="220" r="22" fill="#d8c8b8"/>
  <circle cx="330" cy="250" r="16" fill="#d8c8b8"/>
  <circle cx="220" cy="350" r="14" fill="#d8c8b8"/>
  <circle cx="380" cy="300" r="20" fill="#d8c8b8"/>
  <!-- Spooky glow on moon edges -->
  <path d="M 256 100 C 150 100 100 200 100 300 C 100 400 150 500 256 500 C 362 500 412 400 412 300 C 412 200 362 100 256 100 Z" fill="none" stroke="#ff99aa" stroke-width="4" stroke-opacity="0.9"/>
  <!-- Faint inner glow -->
  <ellipse cx="256" cy="300" rx="140" ry="100" fill="#ffccdd" opacity="0.12"/>
  <!-- Spaceship hull (bee-shaped viewport) with distressed edges -->
  <path d="M 200 200 C 180 200 160 220 160 250 C 160 280 180 300 200 300 C 220 300 240 280 240 250 C 240 220 220 200 200 200 Z" fill="#222222" stroke="#444444" stroke-width="2.5"/>
  <!-- Ship interior glow -->
  <ellipse cx="200" cy="250" rx="35" ry="25" fill="#ffccdd" opacity="0.25"/>
  <!-- Bee in spaceship (detailed, eerie silhouette) -->
  <path d="M 210 230 L 215 215 L 220 230 L 215 235 Z" fill="#ffcc00" stroke="#333333" stroke-width="0.8"/>
  <path d="M 212 220 L 218 220 L 218 225 Z" fill="#333333" stroke="#000000" stroke-width="0.3"/>
  <!-- Bee wings (translucent, ghostly) -->
  <path d="M 210 230 L 205 245 L 215 245 Z" fill="#ffcc00" opacity="0.3"/>
  <path d="M 220 230 L 225 245 L 215 245 Z" fill="#ffcc00" opacity="0.3"/>
  <!-- Distressed details on ship -->
  <path d="M 180 220 L 190 210 L 210 210 L 220 220" stroke="#ff99aa" stroke-width="1" fill="none" stroke-dasharray="2,1"/>
  <path d="M 240 280 L 250 270 L 270 270 L 280 280" stroke="#ff99aa" stroke-width="1" fill="none" stroke-dasharray="2,1"/>
  <!-- Spooky rays from moon (more varied) -->
  <g stroke="#ff99aa" stroke-width="2" stroke-opacity="0.7" fill="none">
    <path d="M 256 100 L 180 40"/>
    <path d="M 256 100 L 332 40"/>
    <path d="M 256 100 L 120 80"/>
    <path d="M 256 100 L 392 80"/>
    <path d="M 256 100 L 200 20"/>
    <path d="M 256 100 L 312 20"/>
    <path d="M 256 100 L 256 0"/>
  </g>
  <!-- Faint grid lines (subtle sci-fi) -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="100" x2="512" y2="100"/>
    <line x1="0" y1="200" x2="512" y2="200"/>
    <line x1="0" y1="300" x2="512" y2="300"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="512"/>
    <line x1="200" y1="0" x2="200" y2="512"/>
    <line x1="300" y1="0" x2="300" y2="512"/>
    <line x1="400" y1="0" x2="400" y2="512"/>
  </g>
</svg>