<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03a9f4"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="512" height="340" fill="url(#wallGrad)"/>
  <!-- Floor -->
  <rect x="0" y="340" width="512" height="172" fill="url(#floorGrad)"/>
  <line x1="0" y1="340" x2="512" y2="340" stroke="#78909c" stroke-width="4"/>

  <!-- Dental Cabinet / Chart in background -->
  <rect x="380" y="140" height="200" width="100" fill="#ffffff" stroke="#b0bec5" stroke-width="3" rx="4"/>
  <rect x="395" y="160" width="70" height="90" fill="#eceff1" stroke="#cfd8dc" stroke-width="2"/>
  <!-- Teeth x-ray poster with glowing teeth -->
  <circle cx="415" cy="190" r="10" fill="#ffffff" stroke="#ffa000" stroke-width="2"/>
  <circle cx="445" cy="190" r="10" fill="#ffffff" stroke="#ffa000" stroke-width="2"/>
  <path d="M 410 215 Q 430 230 450 215" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round"/>
  <text x="430" y="238" font-family="sans-serif" font-size="10" fill="#546e7a" text-anchor="middle">X-RAY</text>

  <!-- Dental Overhead Lamp -->
  <path d="M 256 0 L 256 120" stroke="#37474f" stroke-width="6" fill="none"/>
  <ellipse cx="256" cy="150" rx="45" ry="25" fill="#ffa726" stroke="#e65100" stroke-width="3" filter="url(#glow)"/>
  <ellipse cx="256" cy="150" rx="35" ry="17" fill="#fff9c4"/>
  <!-- Light beam cone -->
  <polygon points="256,175 120,400 392,400" fill="#fffde7" opacity="0.35"/>

  <!-- Dentist Chair -->
  <!-- Base & Stem -->
  <rect x="226" y="400" width="60" height="70" rx="10" ry="10" fill="#546e7a"/>
  <rect x="196" y="465" width="120" height="15" rx="6" ry="6" fill="#37474f"/>
  <rect x="240" y="290" width="32" height="120" fill="#78909c"/>
  
  <!-- Seat / Reclined Backrest -->
  <path d="M 170 230 L 320 320 L 300 370 L 150 280 Z" fill="url(#chairGrad)" stroke="#0288d1" stroke-width="4" rx="8"/>
  <!-- Headrest -->
  <ellipse cx="140" cy="255" rx="28" ry="22" fill="url(#chairGrad)" stroke="#0288d1" stroke-width="3"/>

  <!-- Vampire Patient -->
  <!-- Head & Face -->
  <circle cx="165" cy="265" r="34" fill="#fcfcfc" stroke="#b0bec5" stroke-width="2"/>
  <!-- Sleek Vampire Hair -->
  <path d="M 135 255 Q 145 230 175 235 Q 195 240 200 265 Q 170 245 135 255 Z" fill="#1a1a1a"/>
  <!-- Relaxed / Nervous Eyes (Closed with long lashes) -->
  <path d="M 150 260 Q 158 266 166 260" fill="none" stroke="#37474f" stroke-width="2" stroke-linecap="round"/>
  <path d="M 174 260 Q 182 266 190 260" fill="none" stroke="#37474f" stroke-width="2" stroke-linecap="round"/>
  <!-- Open mouth showing massive fangs -->
  <path d="M 158 284 Q 172 308 186 284 Z" fill="#4a0000" stroke="#880e4f" stroke-width="2"/>
  <!-- Detailed Fangs -->
  <polygon points="162,285 166,302 170,285" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <polygon points="174,285 178,302 182,285" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  
  <!-- Cape / Collar -->
  <path d="M 135 305 L 110 245 L 150 280 Z" fill="#c62828" stroke="#8e0000" stroke-width="2"/>
  <path d="M 200 305 L 225 245 L 185 280 Z" fill="#c62828" stroke="#8e0000" stroke-width="2"/>
  <!-- Bowtie -->
  <polygon points="167,305 160,312 174,312" fill="#111"/>
  <polygon points="167,305 160,298 174,298" fill="#111"/>

  <!-- Dentist -->
  <!-- Body / White Coat -->
  <path d="M 320 280 L 390 290 L 400 440 L 320 440 Z" fill="#ffffff" stroke="#cfd8dc" stroke-width="3" rx="10"/>
  <path d="M 355 290 L 355 420" stroke="#e0e0e0" stroke-width="3" stroke-dasharray="6,6"/>
  <!-- Pocket with pen -->
  <rect x="332" y="320" width="16" height="20" fill="none" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="336" y1="316" x2="336" y2="330" stroke="#1565c0" stroke-width="3"/>
  <line x1="342" y1="316" x2="342" y2="328" stroke="#d32f2f" stroke-width="3"/>

  <!-- Head -->
  <circle cx="360" cy="225" r="28" fill="#ffccbc" stroke="#ffab91" stroke-width="2"/>
  <!-- Focused Eyes & Glasses -->
  <circle cx="350" cy="220" r="6" fill="none" stroke="#37474f" stroke-width="2"/>
  <circle cx="370" cy="220" r="6" fill="none" stroke="#37474f" stroke-width="2"/>
  <line x1="356" y1="220" x2="364" y2="220" stroke="#37474f" stroke-width="2"/>
  <!-- Surgical Mask -->
  <rect x="342" y="230" width="36" height="22" rx="6" ry="6" fill="#26a69a" stroke="#00897b" stroke-width="2"/>
  <!-- Dentist Cap -->
  <path d="M 335 210 Q 360 190 385 210 Z" fill="#26a69a"/>

  <!-- Dentist Tools (Mirror & Pick) -->
  <path d="M 330 295 L 285 275" stroke="#78909c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="280" cy="272" r="14" fill="#e0f7fa" stroke="#00acc1" stroke-width="3"/>
  <ellipse cx="280" cy="272" rx="10" ry="6" fill="#ffffff" opacity="0.6"/>

  <path d="M 345 315 L 295 335" stroke="#78909c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 292 336 L 285 342" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"/>

  <!-- IV Stand with Blood Bag -->
  <line x1="75" y1="100" x2="75" y2="470" stroke="#78909c" stroke-width="6" stroke-linecap="round"/>
  <line x1="55" y1="100" x2="95" y2="100" stroke="#78909c" stroke-width="4" stroke-linecap="round"/>
  <!-- Blood Bag -->
  <path d="M 60 125 Q 75 115 90 125 L 85 185 Q 75 195 65 185 Z" fill="#e53935" stroke="#b71c1c" stroke-width="3"/>
  <text x="75" y="162" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">O-</text>
  <!-- Tubing to Vampire arm -->
  <path d="M 75 190 Q 60 220 130 260" fill="none" stroke="#e53935" stroke-width="3" stroke-dasharray="5,3"/>

  <!-- Garlic Cluster hanging as a funny joke on the wall -->
  <g transform="translate(20, 80)">
    <ellipse cx="15" cy="20" rx="12" ry="15" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
    <ellipse cx="30" cy="25" rx="10" ry="13" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
    <ellipse cx="20" cy="35" rx="11" ry="14" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
    <path d="M 22 5 Q 22 15 20 18" stroke="#8d6e63" stroke-width="3" fill="none"/>
    <path d="M 22 0 Q 15 -10 5 -5" stroke="#5d4037" stroke-width="2" fill="none"/>
  </g>

  <!-- Sparkling Polish Highlights -->
  <path d="M 166 280 L 168 288 L 172 286 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="282" cy="265" r="3.5" fill="#ffffff"/>
  <circle cx="256" cy="140" r="4.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="150" cy="120" r="2" fill="#ffffff" opacity="0.8"/>
</svg>
