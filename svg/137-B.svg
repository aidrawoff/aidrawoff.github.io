<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#E1F5FE"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#skyGrad)"/>
  <!-- Sun glow -->
  <circle cx="420" cy="80" r="90" fill="url(#sunGlow)"/>
  <!-- Sun -->
  <circle cx="420" cy="80" r="50" fill="#FFD700"/>
  <!-- Ground -->
  <rect y="380" width="512" height="132" fill="#66BB6A"/>
  <rect y="380" width="512" height="12" fill="#43A047"/>
  <!-- Pumpkin shadow -->
  <ellipse cx="256" cy="418" rx="110" ry="16" fill="#1B5E20" opacity="0.35"/>
  <!-- Pumpkin body -->
  <ellipse cx="256" cy="320" rx="115" ry="100" fill="#FF7518"/>
  <!-- Pumpkin ridges -->
  <ellipse cx="205" cy="320" rx="38" ry="85" fill="#E65100" opacity="0.5"/>
  <ellipse cx="256" cy="320" rx="38" ry="90" fill="#FF7518"/>
  <ellipse cx="307" cy="320" rx="38" ry="85" fill="#E65100" opacity="0.5"/>
  <!-- Stem -->
  <path d="M 244 228 Q 250 190 270 195 Q 262 225 256 232 Z" fill="#33691E"/>
  <ellipse cx="258" cy="195" rx="8" ry="4" fill="#558B2F"/>
  <!-- Sunburn red on top -->
  <ellipse cx="256" cy="255" rx="85" ry="40" fill="#FF3D00" opacity="0.55"/>
  <ellipse cx="256" cy="248" rx="60" ry="22" fill="#FF1744" opacity="0.45"/>
  <!-- Sunburn blush spots -->
  <ellipse cx="195" cy="278" rx="22" ry="14" fill="#FF1744" opacity="0.5"/>
  <ellipse cx="317" cy="278" rx="22" ry="14" fill="#FF1744" opacity="0.5"/>
  <!-- Face: wince eyes -->
  <path d="M 205 298 Q 220 288 235 298" stroke="#3E1F00" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 277 298 Q 292 288 307 298" stroke="#3E1F00" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eyebrows angled in pain -->
  <line x1="200" y1="285" x2="230" y2="292" stroke="#3E1F00" stroke-width="5" stroke-linecap="round"/>
  <line x1="312" y1="285" x2="282" y2="292" stroke="#3E1F00" stroke-width="5" stroke-linecap="round"/>
  <!-- Nose -->
  <polygon points="256,312 264,328 248,328" fill="#3E1F00"/>
  <!-- Mouth: pained grimace -->
  <path d="M 220 345 Q 256 335 292 345 Q 256 360 220 345 Z" fill="#3E1F00"/>
  <!-- Sunglasses askew -->
  <rect x="198" y="290" width="48" height="24" rx="6" fill="#111" transform="rotate(-8 222 302)"/>
  <rect x="268" y="286" width="48" height="24" rx="6" fill="#111" transform="rotate(6 292 298)"/>
  <line x1="246" y1="302" x2="268" y2="298" stroke="#111" stroke-width="4"/>
  <line x1="198" y1="302" x2="170" y2="295" stroke="#111" stroke-width="3"/>
  <line x1="316" y1="298" x2="340" y2="292" stroke="#111" stroke-width="3"/>
  <!-- Lens shine -->
  <rect x="206" y="294" width="14" height="7" rx="2" fill="#FFF" opacity="0.3" transform="rotate(-8 213 297)"/>
  <rect x="276" y="290" width="14" height="7" rx="2" fill="#FFF" opacity="0.3" transform="rotate(6 283 293)"/>
  <!-- Sweat drops -->
  <ellipse cx="345" cy="255" rx="6" ry="10" fill="#4FC3F7" opacity="0.85"/>
  <ellipse cx="358" cy="275" rx="5" ry="8" fill="#4FC3F7" opacity="0.75"/>
  <ellipse cx="335" cy="290" rx="4" ry="6" fill="#4FC3F7" opacity="0.7"/>
  <!-- Sun rays -->
  <line x1="420" y1="15" x2="420" y2="0" stroke="#FFD700" stroke-width="5"/>
  <line x1="420" y1="145" x2="420" y2="160" stroke="#FFD700" stroke-width="5"/>
  <line x1="355" y1="80" x2="340" y2="80" stroke="#FFD700" stroke-width="5"/>
  <line x1="485" y1="80" x2="500" y2="80" stroke="#FFD700" stroke-width="5"/>
  <line x1="375" y1="35" x2="365" y2="25" stroke="#FFD700" stroke-width="4"/>
  <line x1="465" y1="35" x2="475" y2="25" stroke="#FFD700" stroke-width="4"/>
  <line x1="375" y1="125" x2="365" y2="135" stroke="#FFD700" stroke-width="4"/>
  <line x1="465" y1="125" x2="475" y2="135" stroke="#FFD700" stroke-width="4"/>
  <!-- Sunscreen bottle -->
  <rect x="60" y="360" width="34" height="56" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
  <rect x="68" y="348" width="18" height="12" rx="3" fill="#1565C0"/>
  <text x="77" y="395" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">SPF</text>
  <text x="77" y="410" font-family="sans-serif" font-size="10" fill="#1565C0" text-anchor="middle">50</text>
  <!-- Little puddle under sunscreen -->
  <ellipse cx="77" cy="420" rx="14" ry="4" fill="#1565C0" opacity="0.3"/>
</svg>
