  <path d="M238 100 C276 130 288 190 268 250 C250 220 240 200 230 176 C236 150 240 124 238 100 Z" fill="#3a2a5e" stroke="#0f0a1e" stroke-width="4"/>
  <!-- head (lowest part, upside down) -->
