  <ellipse cx="225" cy="192" rx="8" ry="9" fill="#ffffff"/>
  <circle cx="204" cy="195" r="4.2" fill="#141020"/>
  <circle cx="226" cy="195" r="4.2" fill="#141020"/>
  <circle cx="206" cy="193" r="1.4" fill="#fff"/>
  <circle cx="228" cy="193" r="1.4" fill="#fff"/>
  <path d="M209 176 q5 -6 9 0 q-4 5 -9 0 Z" fill="#1d1430"/>
  <path d="M198 208 q15 8 30 0" fill="none" stroke="#1d1430" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M204 212 l3 7 l4 -6 l4 6 l3 -7" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
