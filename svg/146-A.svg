<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: dark night -->
  <rect width="512" height="512" fill="#0a0a1a"/>
  <!-- Pavement hint -->
  <linearGradient id="pavement" x1="256" y1="400" x2="256" y2="512" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#111"/>
    <stop offset="100%" stop-color="#222"/>
  </linearGradient>
  <rect x="256" y="400" width="256" height="112" fill="url(#pavement)"/>
  <!-- Pavement texture -->
  <path d="M264 416 h8 v8 h-8 z M280 416 h8 v8 h-8 z M296 416 h8 v8 h-8 z M312 416 h8 v8 h-8 z M328 416 h8 v8 h-8 z M344 416 h8 v8 h-8 z M360 416 h8 v8 h-8 z M376 416 h8 v8 h-8 z M392 416 h8 v8 h-8 z M408 416 h8 v8 h-8 z M424 416 h8 v8 h-8 z M440 416 h8 v8 h-8 z M456 416 h8 v8 h-8 z M472 416 h8 v8 h-8 z" fill="#000" opacity="0.1"/>
  <!-- Streetlamp glow -->
  <radialGradient id="lampGlow" cx="384" cy="128" r="96" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#f8e8a8" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#f8e8a8" stop-opacity="0"/>
  </radialGradient>
  <circle cx="384" cy="128" r="96" fill="url(#lampGlow)"/>
  <!-- Lamp post light spill -->
  <ellipse cx="384" cy="200" rx="24" ry="12" fill="#f8e8a8" opacity="0.15"/>
  <!-- Bus stop pole -->
  <rect x="368" y="192" width="8" height="256" fill="#555"/>
  <!-- Bus stop sign -->
  <rect x="352" y="176" width="32" height="16" rx="2" fill="#333"/>
  <text x="368" y="188" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle" dominant-baseline="middle">BUS</text>
  <!-- Sign highlight -->
  <circle cx="380" cy="184" r="2" fill="#f8e8a8" opacity="0.7"/>
  <!-- Bench seat -->
  <rect x="288" y="384" width="144" height="16" rx="4" fill="#333"/>
  <!-- Bench shadow -->
  <rect x="296" y="392" width="128" height="4" fill="#000" opacity="0.2"/>
  <!-- Bench highlight -->
  <rect x="296" y="384" width="128" height="2" fill="#555" opacity="0.3"/>
  <!-- Bench legs -->
  <rect x="304" y="392" width="8" height="8" fill="#555"/>
  <rect x="400" y="392" width="8" height="8" fill="#555"/>
  <!-- Skeleton standing tall -->
  <g fill="#e0e0e0">
    <!-- Head -->
    <circle cx="384" cy="224" r="16"/>
    <!-- Spine -->
    <rect x="376" y="240" width="16" height="96" rx="2"/>
    <!-- Spine shadow -->
    <rect x="378" y="242" width="12" height="92" fill="#000" opacity="0.15"/>
    <!-- Shoulders -->
    <rect x="360" y="240" width="32" height="8" rx="4"/>
    <!-- Arms -->
    <rect x="344" y="248" width="16" height="8" rx="4"/>
    <rect x="400" y="248" width="16" height="8" rx="4"/>
    <!-- Hands -->
    <rect x="336" y="256" width="8" height="8" rx="2"/>
    <rect x="416" y="256" width="8" height="8" rx="2"/>
    <!-- Legs -->
    <rect x="368" y="336" width="16" height="96" rx="2"/>
    <rect x="392" y="336" width="16" height="96" rx="2"/>
    <!-- Feet -->
    <rect x="360" y="432" width="16" height="8" rx="2"/>
    <rect x="392" y="432" width="16" height="8" rx="2"/>
    <!-- Shadow under skeleton -->
    <ellipse cx="384" cy="440" rx="24" ry="6" fill="#000" opacity="0.2"/>
  </g>
  <!-- Title -->
  <text x="256" y="48" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle" dominant-baseline="hanging">Skeleton Waits for Bus</text>
</svg>
