<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1b143f"/>
      <stop offset="100%" stop-color="#2c1654"/>
    </linearGradient>

    <!-- Mirror Glow Gradient -->
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241d4f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#120c2b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Neon Rim / Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="ghostGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ghost Body Gradient -->
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#b8e3ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6bc5ff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Barber Chair Gradient -->
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#552277"/>
      <stop offset="100%" stop-color="#2a0e40"/>
    </linearGradient>

    <!-- Metallic Gradient -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Background Ambient Lighting / Orbs -->
  <circle cx="100" cy="120" r="80" fill="#7928ca" opacity="0.15" filter="url(#neonGlow)"/>
  <circle cx="420" cy="380" r="100" fill="#00dfff" opacity="0.1" filter="url(#neonGlow)"/>
  <ellipse cx="256" cy="480" rx="200" ry="30" fill="#15082e" opacity="0.6"/>

  <!-- Mini Barber Pole on Left Wall -->
  <g transform="translate(55, 180)" filter="url(#softShadow)">
    <rect x="0" y="0" width="22" height="130" rx="11" fill="#221133" stroke="#ffb703" stroke-width="2"/>
    <g>
      <path d="M0,0 L22,22 L22,12 L0,-10 Z" fill="#ff4444" opacity="0.85"/>
      <path d="M0,30 L22,52 L22,42 L0,20 Z" fill="#ffffff" opacity="0.85"/>
      <path d="M0,60 L22,82 L22,72 L0,50 Z" fill="#00f0ff" opacity="0.85"/>
      <path d="M0,90 L22,112 L22,102 L0,80 Z" fill="#ff4444" opacity="0.85"/>
    </g>
  </g>

  <!-- Salon Wall Panel / Mirror Frame -->
  <g filter="url(#softShadow)">
    <!-- Outer Mirror Frame (Art Deco Arch) -->
    <path d="M 146,80 C 146,30 366,30 366,80 L 366,380 C 366,410 346,430 316,430 L 196,430 C 166,430 146,410 146,380 Z" fill="none" stroke="#ffb703" stroke-width="6" filter="url(#neonGlow)"/>
    <path d="M 152,86 C 152,40 360,40 360,86 L 360,376 C 360,402 340,422 310,422 L 202,422 C 172,422 152,402 152,376 Z" fill="url(#mirrorGrad)" stroke="#ffb703" stroke-width="2"/>
  </g>

  <!-- Mirror Reflections / Interior Wall Vibe -->
  <path d="M 180,100 Q 256,70 332,100 L 332,250 Q 256,220 180,250 Z" fill="#ffffff" opacity="0.03"/>

  <!-- Checkerboard Floor at Bottom -->
  <g opacity="0.3">
    <path d="M 0,440 L 512,440 L 512,512 L 0,512 Z" fill="#150b2b"/>
    <line x1="0" y1="460" x2="512" y2="460" stroke="#331c5e" stroke-width="2"/>
    <line x1="0" y1="485" x2="512" y2="485" stroke="#331c5e" stroke-width="2"/>
    <line x1="128" y1="440" x2="64" y2="512" stroke="#331c5e" stroke-width="2"/>
    <line x1="256" y1="440" x2="220" y2="512" stroke="#331c5e" stroke-width="2"/>
    <line x1="384" y1="440" x2="390" y2="512" stroke="#331c5e" stroke-width="2"/>
  </g>

  <!-- Barber Chair Base & Stand -->
  <g filter="url(#softShadow)">
    <ellipse cx="256" cy="430" rx="60" ry="16" fill="url(#metal)"/>
    <rect x="246" y="340" width="20" height="90" fill="url(#metal)"/>
    <path d="M 230,345 L 282,345 L 270,335 L 242,335 Z" fill="url(#metal)"/>
  </g>

  <!-- Barber Chair Seat & Backrest -->
  <g filter="url(#softShadow)">
    <!-- Backrest -->
    <rect x="206" y="220" width="100" height="120" rx="20" fill="url(#chairGrad)" stroke="#ff70a6" stroke-width="3"/>
    <!-- Seat -->
    <rect x="196" y="310" width="120" height="40" rx="15" fill="url(#chairGrad)" stroke="#ff70a6" stroke-width="3"/>
    <!-- Armrests -->
    <path d="M 186,300 C 186,280 206,280 216,300 L 216,340 C 206,350 186,340 186,320 Z" fill="url(#metal)"/>
    <path d="M 326,300 C 326,280 306,280 296,300 L 296,340 C 306,350 326,340 326,320 Z" fill="url(#metal)"/>
  </g>

  <!-- Ghost Client in Chair -->
  <g filter="url(#ghostGlow)">
    <!-- Ethereal Body & Wavy Tail -->
    <path d="M 216,210 C 190,210 180,260 190,300 C 200,340 220,380 210,410 C 205,425 218,430 225,415 C 240,380 250,420 265,415 C 280,410 270,370 285,380 C 300,390 310,340 310,300 C 320,260 302,210 276,210 Z" fill="url(#ghostGrad)"/>

    <!-- Ghost Head & Cheerful Face -->
    <circle cx="246" cy="175" r="45" fill="url(#ghostGrad)"/>

    <!-- Closed happy crescent eyes / blinking -->
    <path d="M 228,172 Q 236,182 244,172" fill="none" stroke="#1b143f" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 248,172 Q 256,182 264,172" fill="none" stroke="#1b143f" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 238,190 Q 246,200 254,190" fill="none" stroke="#1b143f" stroke-width="3" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="225" cy="186" r="6" fill="#ff70a6" opacity="0.6"/>
    <circle cx="267" cy="186" r="6" fill="#ff70a6" opacity="0.6"/>
  </g>

  <!-- Salon Cape on Ghost -->
  <path d="M 210,240 L 282,240 L 310,320 L 182,320 Z" fill="#00f0ff" opacity="0.8" filter="url(#softShadow)"/>
  <path d="M 210,240 L 282,240 L 256,320 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M 246,240 L 256,320" stroke="#005577" stroke-width="4" stroke-dasharray="6,6"/>

  <!-- Floating Ectoplasm "Hair" being snipped -->
  <g filter="url(#ghostGlow)">
    <path d="M 230,130 Q 220,100 240,80 Q 260,60 250,90 Q 240,110 256,130" fill="none" stroke="#b8e3ff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 250,125 Q 270,100 260,75 Q 250,50 270,70 Q 290,90 270,125" fill="none" stroke="#79dcff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Barber Ghost (Stylist) on the Right -->
  <g filter="url(#ghostGlow)">
    <!-- Barber Ghost Body -->
    <path d="M 360,230 C 340,230 330,280 340,330 C 350,380 335,420 350,450 C 360,465 375,455 375,440 C 375,410 390,430 405,420 C 420,410 410,370 415,330 C 420,280 400,230 380,230 Z" fill="url(#ghostGrad)"/>
    <!-- Barber Head -->
    <circle cx="375" cy="190" r="38" fill="url(#ghostGrad)"/>

    <!-- Concentrated Expression (Dot eyes, focused mouth) -->
    <circle cx="364" cy="186" r="4" fill="#1b143f"/>
    <circle cx="386" cy="186" r="4" fill="#1b143f"/>
    <ellipse cx="375" cy="202" rx="5" ry="3" fill="#1b143f"/>

    <!-- Barber Hat / Cap -->
    <path d="M 350,165 Q 375,150 400,165 L 395,175 Q 375,162 355,175 Z" fill="#ffb703"/>

    <!-- Stylist Apron -->
    <path d="M 355,250 L 395,250 L 400,380 L 350,380 Z" fill="#ff70a6" opacity="0.9"/>
    <circle cx="375" cy="280" r="8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Barber Arms & Scissors actively snipping -->
  <g filter="url(#softShadow)">
    <!-- Stylist Arm -->
    <path d="M 350,260 Q 300,240 270,160" fill="none" stroke="url(#ghostGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Giant Glowing Scissors -->
    <g transform="translate(250, 130) rotate(-25)">
      <!-- Blade 1 -->
      <line x1="0" y1="0" x2="60" y2="-40" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
      <!-- Blade 2 -->
      <line x1="0" y1="0" x2="60" y2="20" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
      <!-- Pivot Ring -->
      <circle cx="0" cy="0" r="6" fill="#ffb703" stroke="#999" stroke-width="2"/>
      <!-- Handles -->
      <circle cx="-15" cy="-10" r="10" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>
      <circle cx="-15" cy="15" r="10" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>
    </g>
  </g>

  <!-- Floating Sparkles / Snipped Ecto-Bits -->
  <g fill="#00f0ff" filter="url(#neonGlow)">
    <circle cx="230" cy="95" r="3"/>
    <circle cx="265" cy="85" r="4"/>
    <circle cx="280" cy="115" r="2.5"/>
    <circle cx="245" cy="65" r="3.5"/>
    <!-- Extra polished magical sparkles -->
    <circle cx="310" cy="150" r="2"/>
    <circle cx="205" cy="140" r="3"/>
  </g>
</svg>
