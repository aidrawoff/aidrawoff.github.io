<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<radialGradient id="spot" cx="0.5" cy="0.4" r="0.6">
<stop offset="0%" stop-color="#4a3b2a"/>
<stop offset="60%" stop-color="#1a120a"/>
<stop offset="100%" stop-color="#0a0502"/>
</radialGradient>
<linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#f5f0e6"/>
<stop offset="100%" stop-color="#c8bdb0"/>
</linearGradient>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#b8962e"/>
<stop offset="30%" stop-color="#f0d878"/>
<stop offset="70%" stop-color="#d4af37"/>
<stop offset="100%" stop-color="#8a6e1c"/>
</linearGradient>
</defs>

<!-- background stage -->
<rect width="512" height="512" fill="url(#spot)"/>

<!-- floor spotlight -->
<ellipse cx="260" cy="440" rx="180" ry="30" fill="#2a1f14" opacity="0.6"/>
<!-- rim light behind skeleton -->
<ellipse cx="222" cy="320" rx="55" ry="140" fill="none" stroke="#5a4a3a" stroke-width="3" opacity="0.4"/>

<!-- skeleton body -->
<g transform="translate(180,140)">
<!-- spine -->
<rect x="38" y="80" width="8" height="120" rx="4" fill="url(#bone)"/>
<!-- ribs -->
<rect x="20" y="100" width="44" height="6" rx="3" fill="url(#bone)"/>
<rect x="18" y="115" width="48" height="6" rx="3" fill="url(#bone)"/>
<rect x="20" y="130" width="44" height="6" rx="3" fill="url(#bone)"/>
<rect x="24" y="145" width="36" height="6" rx="3" fill="url(#bone)"/>
<!-- pelvis -->
<path d="M28,200 L56,200 L52,220 L32,220 Z" fill="url(#bone)"/>
<!-- legs -->
<rect x="28" y="220" width="10" height="70" rx="5" fill="url(#bone)"/>
<rect x="46" y="220" width="10" height="70" rx="5" fill="url(#bone)"/>
<!-- feet -->
<ellipse cx="33" cy="295" rx="12" ry="6" fill="url(#bone)"/>
<ellipse cx="51" cy="295" rx="12" ry="6" fill="url(#bone)"/>
<!-- arms -->
<rect x="-5" y="95" width="10" height="55" rx="5" fill="url(#bone)" transform="rotate(-20,0,95)"/>
<rect x="65" y="95" width="10" height="55" rx="5" fill="url(#bone)" transform="rotate(35,70,95)"/>
<!-- skull -->
<circle cx="42" cy="45" r="32" fill="url(#bone)"/>
<!-- skull rim light -->
<path d="M14,45 A32,32 0 0,1 42,13" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
<!-- bow tie -->
<polygon points="30,88 18,82 18,94" fill="#c41e3a"/>
<polygon points="54,88 66,82 66,94" fill="#c41e3a"/>
<circle cx="42" cy="88" r="5" fill="#a01830"/>
<!-- eye sockets -->
<ellipse cx="32" cy="42" rx="9" ry="11" fill="#1a120a"/>
<ellipse cx="52" cy="42" rx="9" ry="11" fill="#1a120a"/>
<!-- nose -->
<polygon points="42,52 38,62 46,62" fill="#1a120a"/>
<!-- grin -->
<path d="M28,68 Q42,78 56,68" fill="none" stroke="#1a120a" stroke-width="2.5"/>
<line x1="32" y1="66" x2="32" y2="72" stroke="#1a120a" stroke-width="1.5"/>
<line x1="38" y1="69" x2="38" y2="74" stroke="#1a120a" stroke-width="1.5"/>
<line x1="46" y1="69" x2="46" y2="74" stroke="#1a120a" stroke-width="1.5"/>
<line x1="52" y1="66" x2="52" y2="72" stroke="#1a120a" stroke-width="1.5"/>
</g>

<!-- trombone -->
<g transform="translate(180,140)">
<!-- slide outer -->
<rect x="75" y="104" width="145" height="6" rx="3" fill="url(#brass)"/>
<rect x="75" y="112" width="145" height="6" rx="3" fill="#8a6e1c"/>
<!-- inner slide -->
<rect x="82" y="107" width="130" height="8" rx="4" fill="#f0d878"/>
<!-- bell -->
<path d="M220,100 L268,78 L275,142 L220,122 Z" fill="url(#brass)"/>
<ellipse cx="271" cy="110" rx="10" ry="32" fill="#f8e8a0"/>
<ellipse cx="273" cy="110" rx="6" ry="24" fill="#fff5c8"/>
<!-- mouthpiece end -->
<rect x="68" y="105" width="10" height="12" rx="3" fill="#8a6e1c"/>
<!-- hand on slide -->
<circle cx="135" cy="128" r="8" fill="url(#bone)"/>
<!-- hand near mouthpiece -->
<circle cx="85" cy="128" r="7" fill="url(#bone)"/>
</g>

<!-- music notes -->
<g fill="#f0d878" opacity="0.9">
<ellipse cx="380" cy="120" rx="7" ry="6" transform="rotate(-15,380,120)"/>
<line x1="386" y1="120" x2="386" y2="92" stroke="#f0d878" stroke-width="2.5"/>
<path d="M386,92 Q398,86 404,98" fill="none" stroke="#f0d878" stroke-width="2.5"/>

<ellipse cx="420" cy="95" rx="6" ry="5" transform="rotate(-10,420,95)"/>
<line x1="425" y1="95" x2="425" y2="70" stroke="#f0d878" stroke-width="2"/>
<path d="M425,70 Q435,65 440,75" fill="none" stroke="#f0d878" stroke-width="2"/>

<ellipse cx="450" cy="130" rx="5" ry="4" transform="rotate(-20,450,130)"/>
<line x1="454" y1="130" x2="454" y2="110" stroke="#f0d878" stroke-width="1.5"/>
</g>

<!-- sound waves from bell -->
<g fill="none" stroke="#f0d878" stroke-width="1.5" opacity="0.5">
<path d="M290,200 Q310,180 300,160"/>
<path d="M300,220 Q330,190 315,155"/>
<path d="M310,240 Q350,200 330,150"/>
</g>

<!-- sparkles / jazz energy -->
<g fill="#fff" opacity="0.7">
<circle cx="320" cy="80" r="2.5"/>
<circle cx="345" cy="60" r="2"/>
<circle cx="295" cy="100" r="1.5"/>
<circle cx="365" cy="70" r="2.5"/>
<circle cx="335" cy="45" r="1.5"/>
<circle cx="375" cy="55" r="1"/>
</g>

</svg>