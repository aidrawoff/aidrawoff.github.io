<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background atmospheric gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#100a16"/>
      <stop offset="50%" stop-color="#1e1422"/>
      <stop offset="100%" stop-color="#281a20"/>
    </linearGradient>
    
    <!-- Window glow gradient -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.98"/>
      <stop offset="55%" stop-color="#ff6f00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Wood counter gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="100%" stop-color="#23120b"/>
    </linearGradient>
    
    <linearGradient id="counterTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>

    <!-- Quill gradient -->
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="50%" stop-color="#24130d"/>
      <stop offset="100%" stop-color="#120805"/>
    </linearGradient>

    <linearGradient id="chefHat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7ccc8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#030201" flood-opacity="0.75"/>
    </filter>
    
    <!-- Glow filter for spooky atmosphere -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .outline { stroke: #0f0805; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .thin-outline { stroke: #0f0805; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <!-- Room Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Gothic Wallpaper wood panel lines & star/sparkle details -->
  <g stroke="#17100c" stroke-width="2.5" opacity="0.65">
    <line x1="128" y1="0" x2="128" y2="330"/>
    <line x1="256" y1="0" x2="256" y2="330"/>
    <line x1="384" y1="0" x2="384" y2="330"/>
  </g>

  <!-- Tiny magical sparkles on wallpaper -->
  <g fill="#ffb74d" opacity="0.4">
    <circle cx="64" cy="80" r="1.5"/>
    <circle cx="192" cy="40" r="2"/>
    <circle cx="320" cy="90" r="1.5"/>
    <circle cx="448" cy="60" r="2"/>
  </g>

  <!-- Hanging dried herbs & gothic garlic wreaths on wall -->
  <g class="thin-outline" filter="url(#shadow)">
    <!-- Dried herb bundle left -->
    <path d="M 90,60 L 95,110 L 80,115 L 100,115 L 85,110 Z" fill="#3b4a3e"/>
    <path d="M 95,48 L 95,60" stroke="#795548" stroke-width="3" stroke-linecap="round"/>
    <path d="M 85,75 Q 70,85 85,95" fill="none" stroke="#2e3b32" stroke-width="3"/>
    <circle cx="82" cy="85" r="3" fill="#a5d6a7"/>

    <!-- Gothic garlic string right -->
    <path d="M 420,48 Q 430,68 415,88 Q 435,108 420,128" fill="none" stroke="#4e342e" stroke-width="2"/>
    <circle cx="420" cy="68" r="8.5" fill="#f5f5f5"/>
    <circle cx="414" cy="93" r="9.5" fill="#e0e0e0"/>
    <circle cx="422" cy="118" r="8.5" fill="#f5f5f5"/>
  </g>

  <!-- Tiny Arched Window showing Spooky Autumn Forest (Polished) -->
  <g class="outline" filter="url(#shadow)">
    <!-- Window frame -->
    <path d="M 170,48 L 342,48 C 372,48 395,70 395,100 L 395,235 L 117,235 L 117,100 C 117,70 140,48 170,48 Z" fill="#1b0d06"/>
    <!-- Window pane background / glow -->
    <path d="M 180,58 L 332,58 C 358,58 380,78 380,104 L 380,225 L 132,225 L 132,104 C 132,78 154,58 180,58 Z" fill="url(#windowGlow)"/>
  </g>

  <!-- Autumn Twisted Trees & Falling Leaves in Window -->
  <g opacity="0.9">
    <!-- Spooky twisted trees with branch details -->
    <path d="M 155,225 C 168,155 188,125 195,90 C 197,125 208,155 218,225 Z" fill="#4a1515"/>
    <path d="M 180,140 Q 165,130 155,135" stroke="#4a1515" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <path d="M 228,225 C 238,145 258,105 268,75 C 273,105 288,145 308,225 Z" fill="#65280b"/>
    <path d="M 268,110 Q 285,100 295,108" stroke="#65280b" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <path d="M 298,225 C 308,165 328,125 338,95 C 340,125 352,165 362,225 Z" fill="#381302"/>
    
    <!-- Window crossbars -->
    <path d="M 256,58 L 256,225 M 132,142 L 380,142" stroke="#0f0805" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Floating glowing autumn leaves -->
    <path d="M 165,85 Q 180,95 170,110 Q 160,100 165,85 Z" fill="#ffb300" class="thin-outline"/>
    <path d="M 315,165 Q 330,170 320,185 Q 310,180 315,165 Z" fill="#f4511e" class="thin-outline"/>
    <path d="M 205,170 Q 215,180 200,190 Q 195,180 205,170 Z" fill="#ffea00" class="thin-outline"/>
  </g>

  <!-- Tiny Kitchen Shelves & Polished Props -->
  <g>
    <!-- Shelf left -->
    <rect x="38" y="132" width="78" height="12" rx="3" fill="#3e2723" class="outline" filter="url(#shadow)"/>
    <!-- Tiny magical potion bottle on shelf -->
    <path d="M 58,102 L 78,102 L 83,132 L 53,132 Z" fill="#4db6ac" class="thin-outline"/>
    <rect x="63" y="93" width="10" height="10" rx="2" fill="#004d40" class="thin-outline"/>
    <path d="M 63,112 L 73,112" stroke="#00796b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="68" cy="121" r="3.5" fill="#e0f2f1" filter="url(#glow)"/>

    <!-- Shelf right -->
    <rect x="396" y="132" width="78" height="12" rx="3" fill="#3e2723" class="outline" filter="url(#shadow)"/>
    <!-- Tiny spooky jam jar with star label -->
    <path d="M 424,105 L 444,105 L 449,132 L 419,132 Z" fill="#ffccbc" class="thin-outline"/>
    <path d="M 419,105 L 449,105" stroke="#d84315" stroke-width="3" stroke-linecap="round"/>
    <circle cx="434" cy="119" r="5" fill="#c62828"/>
    <circle cx="434" cy="119" r="1.5" fill="#ffeb3b"/>
  </g>

  <!-- Kitchen Counter / Base (Polished wood texture, brass knobs) -->
  <g filter="url(#shadow)">
    <!-- Counter body -->
    <rect x="18" y="312" width="476" height="185" rx="10" fill="url(#counterGrad)" class="outline"/>
    <!-- Counter top surface -->
    <rect x="8" y="292" width="496" height="30" rx="6" fill="url(#counterTop)" class="outline"/>
    <!-- Countertop highlight edge -->
    <line x1="14" y1="295" x2="498" y2="295" stroke="#bcaaa4" stroke-width="2" stroke-linecap="round"/>
    <!-- Cabinet division line -->
    <line x1="256" y1="322" x2="256" y2="495" stroke="#170d07" stroke-width="4" stroke-linecap="round"/>
    <!-- Ornate brass handles -->
    <g class="outline">
      <ellipse cx="208" cy="400" rx="5" ry="8.5" fill="#ffecb3"/>
      <ellipse cx="304" cy="400" rx="5" ry="8.5" fill="#ffecb3"/>
    </g>
  </g>

  <!-- Kitchen Props on Counter -->
  <!-- Tiny Cutting Board with Chopped Mushrooms & Herb (left) -->
  <g transform="translate(42, 262)" class="outline" filter="url(#shadow)">
    <path d="M 10,10 C 10,4 20,4 25,4 L 88,4 C 93,4 103,4 103,10 L 103,50 C 103,56 93,56 88,56 L 25,56 C 20,56 10,56 10,50 Z" fill="#bcaaa4"/>
    <circle cx="18" cy="30" r="3.5" fill="#23120b"/>
  </g>

  <!-- Autumn Mushrooms & Acorn on Cutting Board -->
  <g transform="translate(52, 265)">
    <!-- Big Mushroom -->
    <path d="M 28,35 L 32,20 C 32,14 46,14 46,20 L 50,35 Z" fill="#ffe0b2" class="thin-outline"/>
    <path d="M 18,22 C 18,9 58,9 58,22 C 58,25 18,25 18,22 Z" fill="#d32f2f" class="thin-outline"/>
    <circle cx="30" cy="17" r="2" fill="#fff"/>
    <circle cx="44" cy="18" r="1.5" fill="#fff"/>
    <!-- Tiny Acorn -->
    <path d="M 70,32 L 76,22 L 82,32 Z" fill="#8d6e63" class="thin-outline"/>
    <ellipse cx="76" cy="23" rx="5" ry="3" fill="#4e342e" class="thin-outline"/>
  </g>

  <!-- Tiny Copper Pot with Steaming Autumn Stew & Ladle (right) -->
  <g transform="translate(352, 248)" class="outline" filter="url(#shadow)">
    <!-- Pot handle -->
    <path d="M 75,30 L 108,18" stroke="#d7ccc8" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <!-- Pot body -->
    <path d="M 15,20 L 78,20 C 88,20 95,32 88,60 C 81,83 12,83 5,60 C -2,32 5,20 15,20 Z" fill="#f57c00"/>
    <!-- Rim -->
    <ellipse cx="46" cy="20" rx="33" ry="7" fill="#ffb74d"/>
    <!-- Stew surface bubble -->
    <circle cx="46" cy="22" rx="12" ry="10" fill="#bf360c"/>
    <circle cx="42" cy="20" r="3" fill="#ff8a80"/>
    <circle cx="52" cy="23" r="2" fill="#ffccbc"/>
    <!-- Steam swirls -->
    <path d="M 35,5 Q 42,-8 35,-20 Q 28,-32 40,-45" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M 55,3 Q 62,-10 55,-22 Q 48,-34 60,-47" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55"/>
  </g>

  <!-- THE HEDGEHOG IN THE TINY KITCHEN (Master Final Polish: Silhouette & Contrast) -->
  <g id="hedgehog" transform="translate(182, 172)" filter="url(#shadow)">
    <!-- Deep Shadow beneath hedgehog -->
    <ellipse cx="78" cy="152" rx="72" ry="19" fill="#090503" opacity="0.7"/>

    <!-- Body & Quills (Large rounded silhouette, deep rich dark brown/black) -->
    <path d="M 15,90 C -12,52 5,2 55,8 C 98,13 130,36 145,78 C 155,108 145,142 118,148 C 90,154 35,148 15,90 Z" fill="url(#quillGrad)" class="outline"/>
    
    <!-- Rich Quill Texture Highlights along the spine -->
    <path d="M 12,75 Q -2,58 8,42 M 22,32 Q 8,20 22,12 M 48,10 Q 38,0 58,4 M 82,8 Q 85,-4 100,8 M 115,20 Q 130,8 132,30 M 140,55 Q 158,45 145,72" stroke="#5d4037" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Cozy Baker's Apron with maple leaf motif & recipe corner -->
    <path d="M 40,72 L 105,72 L 115,150 C 115,154 102,158 98,158 L 48,158 C 42,158 30,154 30,150 Z" fill="#fffde7" class="outline"/>
    
    <!-- Apron pocket with autumn maple leaf motif -->
    <rect x="56" y="108" width="34" height="28" rx="4" fill="#fff9c4" class="thin-outline"/>
    <path d="M 73,114 Q 80,121 73,130 Q 66,121 73,114 Z" fill="#e65100"/>
    <path d="M 73,130 L 73,134" stroke="#795548" stroke-width="2" stroke-linecap="round"/>

    <!-- Tiny tucked recipe card in apron strap -->
    <g transform="translate(85, 78) rotate(12)" class="thin-outline">
      <rect x="0" y="0" width="18" height="22" rx="2" fill="#fff"/>
      <line x1="3" y1="5" x2="15" y2="5" stroke="#b71c1c" stroke-width="2" stroke-linecap="round"/>
      <line x1="3" y1="10" x2="12" y2="10" stroke="#795548" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="3" y1="15" x2="14" y2="15" stroke="#795548" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Head & Snout (Warm peach tone with strong outline) -->
    <path d="M 85,45 C 118,45 142,65 142,92 C 142,118 118,135 90,130 C 75,128 70,112 70,95 C 70,72 75,48 85,45 Z" fill="#ffe0b2" class="outline"/>
    
    <!-- Snout / Muzzle tip -->
    <path d="M 125,82 C 152,82 162,95 152,108 C 142,116 130,112 125,105 Z" fill="#ffe0b2" class="outline"/>
    <!-- Cute glistening black nose -->
    <ellipse cx="155" cy="98" rx="6.5" ry="4.5" fill="#0f0805"/>
    <!-- Sparkle on nose -->
    <circle cx="153" cy="96" r="1.8" fill="#fff"/>

    <!-- Expressive Eyes & Cheeks -->
    <circle cx="118" cy="78" r="6.5" fill="#0f0805"/>
    <circle cx="116" cy="76" r="2.2" fill="#fff"/>
    <!-- Eyebrow -->
    <path d="M 110,68 Q 118,63 126,68" stroke="#0f0805" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheek -->
    <circle cx="126" cy="91" r="8" fill="#ff5722" opacity="0.65"/>

    <!-- Tiny Paws holding wooden spoon -->
    <path d="M 85,116 Q 95,122 102,138" stroke="#ffe0b2" stroke-width="8.5" stroke-linecap="round" class="outline"/>
    <path d="M 118,110 Q 130,120 140,130" stroke="#ffe0b2" stroke-width="8.5" stroke-linecap="round" class="outline"/>

    <!-- Tiny Wooden Spoon held firmly -->
    <g transform="translate(112, 115) rotate(-28)">
      <line x1="0" y1="0" x2="58" y2="-22" stroke="#8d6e63" stroke-width="5.5" stroke-linecap="round" class="outline"/>
      <ellipse cx="63" cy="-24" rx="11.5" ry="7.5" fill="#a1887f" class="outline"/>
    </g>

    <!-- Tiny Puffy Chef Hat on Head -->
    <g transform="translate(85, 6)">
      <!-- Hat band -->
      <rect x="5" y="32" width="50" height="13" rx="3" fill="url(#chefHat)" class="outline"/>
      <!-- Puffy top -->
      <path d="M 5,35 C -6,22 0,0 30,0 C 60,0 68,22 55,35 Z" fill="url(#chefHat)" class="outline"/>
    </g>
  </g>

  <!-- Foreground Autumn Leaves Scattered on Counter (Richer Colors & Detail) -->
  <g class="thin-outline" filter="url(#shadow)">
    <!-- Leaf 1 (Left) -->
    <path d="M 22,282 Q 35,268 52,275 Q 45,292 28,298 Z" fill="#ff6f00"/>
    <path d="M 35,275 L 42,288" stroke="#b71c1c" stroke-width="1.5" fill="none"/>
    
    <!-- Leaf 2 (Right) -->
    <path d="M 458,272 Q 474,258 492,270 Q 484,288 466,280 Z" fill="#d84315"/>
    <path d="M 474,265 L 482,278" stroke="#ffe0b2" stroke-width="1.5" fill="none"/>
    
    <!-- Leaf 3 (Center foreground) -->
    <path d="M 222,305 Q 240,292 254,310 Q 236,324 222,305 Z" fill="#fbc02d"/>
    <path d="M 236,302 L 240,316" stroke="#e65100" stroke-width="1.5" fill="none"/>
  </g>
</svg>
