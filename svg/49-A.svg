<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4a63"/>
      <stop offset="1" stop-color="#7d8ba3"/>
    </linearGradient>
    <g id="puff">
      <circle cx="0" cy="0" r="30" fill="#f4f7fb"/>
      <circle cx="-26" cy="8" r="22" fill="#e3eaf3"/>
      <circle cx="26" cy="8" r="22" fill="#e3eaf3"/>
      <circle cx="0" cy="-12" r="22" fill="#fbfdff"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- cloud rain drops -->
  <g fill="#c9d6e6" opacity="0.8">
    <use href="#puff" transform="translate(60 60) scale(0.4)"/>
    <use href="#puff" transform="translate(440 70) scale(0.5)"/>
    <use href="#puff" transform="translate(80 170) scale(0.35)"/>
    <use href="#puff" transform="translate(430 230) scale(0.4)"/>
  </g>
  <!-- ground: a cloud bank -->
  <ellipse cx="256" cy="505" rx="340" ry="70" fill="#dfe7f1"/>
  <use href="#puff" transform="translate(70 470) scale(1.2)"/>
  <use href="#puff" transform="translate(440 468) scale(1.2)"/>
  <!-- umbrella made of clouds, held above -->
  <path d="M96 150 Q256 -20 416 150 Z" fill="#c0392b"/>
  <use href="#puff" transform="translate(120 150) scale(0.6)"/>
  <use href="#puff" transform="translate(256 140) scale(0.6)"/>
  <use href="#puff" transform="translate(392 150) scale(0.6)"/>
  <path d="M256 140 L256 330" stroke="#3a2e27" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 330 Q266 340 256 348" fill="none" stroke="#3a2e27" stroke-width="8" stroke-linecap="round"/>
  <!-- dog detective, cloud body -->
  <g id="dog">
    <ellipse cx="200" cy="250" rx="26" ry="46" fill="#f4f7fb"/>
    <ellipse cx="312" cy="250" rx="26" ry="46" fill="#f4f7fb"/>
    <!-- detective fedora made of cloud -->
    <ellipse cx="256" cy="206" rx="88" ry="14" fill="#4a4858"/>
    <path d="M204 206 Q206 166 256 166 Q306 166 308 206 Z" fill="#3b3a46"/>
    <path d="M204 198 Q256 210 308 198" fill="none" stroke="#c0392b" stroke-width="6"/>
    <circle cx="256" cy="262" r="62" fill="#fbfdff"/>
    <circle cx="232" cy="250" r="9" fill="#2a2a33"/>
    <circle cx="280" cy="250" r="9" fill="#2a2a33"/>
    <circle cx="235" cy="247" r="3" fill="#ffffff"/>
    <circle cx="283" cy="247" r="3" fill="#ffffff"/>
    <!-- raincloud puffs falling -->
    <use href="#puff" transform="translate(150 380) scale(0.3)"/>
    <use href="#puff" transform="translate(380 330) scale(0.3)"/>
    <ellipse cx="256" cy="280" rx="13" ry="9" fill="#2a2a33"/>
    <path d="M240 296 Q256 308 272 296" fill="none" stroke="#2a2a33" stroke-width="4" stroke-linecap="round"/>
    <!-- trench coat -->
    <path d="M200 318 Q256 304 312 318 L330 480 Q256 496 182 480 Z" fill="#8a6f55"/>
    <path d="M256 310 L256 484" stroke="#5e4a38" stroke-width="5"/>
    <!-- ground shadow under the detective -->
    <ellipse cx="256" cy="482" rx="110" ry="12" fill="#c5d1e0" opacity="0.7"/>
    <!-- magnifying glass -->
    <circle cx="350" cy="380" r="22" fill="none" stroke="#e8c15a" stroke-width="7"/>
    <path d="M366 396 L392 422" stroke="#e8c15a" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
