<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#48dbfb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Recursive squares tower -->
  <g transform="translate(256,420)" opacity="0.9">
    <rect x="-180" y="-40" width="360" height="80" fill="url(#glow)" rx="4"/>
    <rect x="-140" y="-110" width="280" height="70" fill="#ff6b6b" rx="4" opacity="0.95"/>
    <rect x="-105" y="-170" width="210" height="60" fill="#feca57" rx="4" opacity="0.9"/>
    <rect x="-75" y="-220" width="150" height="50" fill="#48dbfb" rx="4" opacity="0.85"/>
    <rect x="-50" y="-260" width="100" height="40" fill="#ff9ff3" rx="4" opacity="0.8"/>
    <rect x="-32" y="-290" width="64" height="30" fill="#54a0ff" rx="3" opacity="0.75"/>
    <rect x="-18" y="-312" width="36" height="22" fill="#5f27cd" rx="2" opacity="0.7"/>
    <rect x="-9" y="-326" width="18" height="14" fill="#00d2d3" rx="2" opacity="0.65"/>
    <rect x="-4" y="-334" width="8" height="8" fill="#ffffff" rx="1" opacity="0.6"/>
  </g>

  <!-- Shadow ground -->
  <ellipse cx="256" cy="430" rx="200" ry="18" fill="#000000" opacity="0.4"/>

  <!-- Floating recursive squares -->
  <g opacity="0.7">
    <rect x="60" y="120" width="50" height="50" fill="#ff6b6b" rx="3" opacity="0.8"/>
    <rect x="75" y="105" width="35" height="35" fill="#feca57" rx="3" opacity="0.7"/>
    <rect x="85" y="95" width="20" height="20" fill="#48dbfb" rx="2" opacity="0.6"/>
    <rect x="92" y="88" width="10" height="10" fill="#ffffff" rx="1" opacity="0.5"/>
  </g>

  <g opacity="0.7">
    <rect x="400" y="80" width="45" height="45" fill="#ff9ff3" rx="3" opacity="0.8"/>
    <rect x="413" y="67" width="30" height="30" fill="#54a0ff" rx="2" opacity="0.7"/>
    <rect x="421" y="59" width="18" height="18" fill="#5f27cd" rx="2" opacity="0.6"/>
    <rect x="427" y="53" width="9" height="9" fill="#ffffff" rx="1" opacity="0.5"/>
  </g>

  <g opacity="0.6">
    <rect x="320" y="200" width="35" height="35" fill="#feca57" rx="3" opacity="0.8"/>
    <rect x="330" y="190" width="22" height="22" fill="#ff6b6b" rx="2" opacity="0.7"/>
    <rect x="336" y="184" width="12" height="12" fill="#48dbfb" rx="1" opacity="0.6"/>
  </g>

  <!-- Sparkles -->
  <circle cx="120" cy="80" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="380" cy="150" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="200" cy="60" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="450" cy="250" r="1.5" fill="#ffffff" opacity="0.7"/>
</svg>