<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="spot" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff69b4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a0f2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capeL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#0d0202"/>
    </linearGradient>
    <linearGradient id="capeR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#0d0202"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#140a21"/>
  <rect x="0" y="360" width="512" height="152" fill="#24143d"/>
  
  <!-- Counter -->
  <rect x="30" y="320" width="452" height="20" fill="#4a306d" rx="3"/>
  <rect x="30" y="340" width="452" height="90" fill="#3d265c" rx="3"/>
  
  <!-- Vampire body (fills more frame) -->
  <ellipse cx="220" cy="260" rx="110" ry="130" fill="#0a0a0a"/>
  
  <!-- Cape -->
  <path d="M110 260 Q60 320 50 430 L140 430 Q130 350 110 260" fill="url(#capeL)"/>
  <path d="M330 260 Q380 320 390 430 L300 430 Q310 350 330 260" fill="url(#capeR)"/>
  <!-- Cape collar -->
  <path d="M150 180 Q220 140 290 180 L310 220 Q220 190 130 220 Z" fill="#1a0505"/>
  
  <!-- Head (bigger, lower) -->
  <ellipse cx="220" cy="170" rx="65" ry="70" fill="#f0d5e8"/>
  <!-- Hair -->
  <path d="M155 150 Q220 90 285 150 Q290 120 260 100 Q220 85 180 100 Q150 120 155 150" fill="#0a0a0a"/>
  <!-- Widow's peak -->
  <path d="M220 115 L210 135 L220 125 L230 135 Z" fill="#0a0a0a"/>
  
  <!-- Eyes (glowing red, larger) -->
  <ellipse cx="200" cy="165" rx="14" ry="10" fill="#ff0040"/>
  <ellipse cx="240" cy="165" rx="14" ry="10" fill="#ff0040"/>
  <ellipse cx="200" cy="163" rx="5" ry="4" fill="#ff88aa"/>
  <ellipse cx="240" cy="163" rx="5" ry="4" fill="#ff88aa"/>
  <circle cx="203" cy="162" r="2.5" fill="#fff"/>
  <circle cx="243" cy="162" r="2.5" fill="#fff"/>
  
  <!-- Eyebrows -->
  <path d="M185 148 Q200 142 215 148" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M225 148 Q240 142 255 148" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M220 170 L216 185 L224 185 Z" fill="#dcb8d0"/>
  
  <!-- Mouth with fangs -->
  <path d="M200 195 Q220 205 240 195" stroke="#8b0000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M208 196 L212 210 L216 196" fill="#fff"/>
  <path d="M224 196 L228 210 L232 196" fill="#fff"/>
  
  <!-- Smoothie cup (iconic, 20%+ of subject) -->
  <path d="M340 290 L352 370 L408 370 L420 290 Z" fill="#ff4da6"/>
  <ellipse cx="380" cy="290" rx="40" ry="12" fill="#ff1493"/>
  <ellipse cx="380" cy="290" rx="34" ry="8" fill="#ffb6c1"/>
  <!-- Straw -->
  <rect x="376" y="240" width="8" height="50" fill="#00e676" rx="3"/>
  <path d="M376 240 L365 215" stroke="#00e676" stroke-width="8" stroke-linecap="round"/>
  <!-- Blood drip on cup -->
  <path d="M360 310 Q358 330 360 340 Q365 330 365 310" fill="#8b0000"/>
  <circle cx="362" cy="345" r="3" fill="#8b0000"/>
  
  <!-- Hand on cup -->
  <ellipse cx="330" cy="310" rx="22" ry="14" fill="#f0d5e8"/>
  <ellipse cx="345" cy="325" rx="10" ry="7" fill="#f0d5e8"/>
  
  <!-- Menu board -->
  <rect x="370" y="50" width="120" height="85" fill="#2d1b4e" rx="5" stroke="#4a306d" stroke-width="2"/>
  <text x="430" y="78" text-anchor="middle" fill="#ff69b4" font-family="sans-serif" font-size="14" font-weight="bold">SMOOTHIES</text>
  <text x="430" y="100" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">A+ Berry</text>
  <text x="430" y="118" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11">O- Mango</text>
  <text x="430" y="136" text-anchor="middle" fill="#ff4da6" font-family="sans-serif" font-size="10">Ask about our</text>
  <text x="430" y="148" text-anchor="middle" fill="#ff4da6" font-family="sans-serif" font-size="10">blood boost!</text>
  
  <!-- Spotlight -->
  <ellipse cx="220" cy="250" rx="160" ry="180" fill="url(#spot)"/>
  
  <!-- Subtle rim light on vampire -->
  <ellipse cx="220" cy="260" rx="112" ry="132" fill="none" stroke="#ff69b4" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Polish: cheek blush, ear, counter reflection -->
  <ellipse cx="175" cy="185" rx="10" ry="6" fill="#ff0040" opacity="0.15"/>
  <ellipse cx="265" cy="185" rx="10" ry="6" fill="#ff0040" opacity="0.15"/>
  <ellipse cx="150" cy="170" rx="8" ry="12" fill="#f0d5e8"/>
  <ellipse cx="290" cy="170" rx="8" ry="12" fill="#f0d5e8"/>
  
  <!-- Counter shine -->
  <rect x="30" y="320" width="452" height="4" fill="#ff69b4" opacity="0.2" rx="2"/>
</svg>