<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="jellyCar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3a6"/>
      <stop offset="0.55" stop-color="#ff7a6b"/>
      <stop offset="1" stop-color="#e85a4f"/>
    </linearGradient>
    <linearGradient id="jellyWheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe6da"/>
      <stop offset="1" stop-color="#2fa597"/>
    </linearGradient>
    <linearGradient id="jellyGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4f0b8"/>
      <stop offset="1" stop-color="#8fd98a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="#fff1d6"/>
  <circle cx="420" cy="88" r="52" fill="#ffb347" opacity="0.85"/>
  <circle cx="420" cy="88" r="70" fill="#ffb347" opacity="0.15"/>

  <g id="ground">
    <path d="M0 400 Q128 380 256 400 T512 400 L512 512 L0 512 Z" fill="url(#jellyGround)" stroke="#3a2a2a" stroke-width="6" stroke-linejoin="round"/>
    <!-- wobbly jelly shadow under car -->
    <ellipse cx="262" cy="410" rx="206" ry="14" fill="#3a2a2a" opacity="0.18"/>
    <!-- jelly puddle spilled from the wobbling car -->
    <path d="M330 420 Q350 404 380 410 Q410 416 412 432 Q400 446 360 444 Q330 442 330 420 Z" fill="#8fe6da" opacity="0.85" stroke="#3a2a2a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M344 422 Q356 414 370 416" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <ellipse cx="120" cy="440" rx="34" ry="8" fill="#ffffff" opacity="0.55"/>
    <ellipse cx="400" cy="462" rx="46" ry="9" fill="#ffffff" opacity="0.45"/>
  </g>

  <g id="body">
    <!-- jelly car body, translucent with sheen -->
    <path d="M86 300 Q78 248 150 244 L198 200 Q228 184 300 184 L362 204 Q424 216 440 288 L452 326 Q456 362 420 364 L112 364 Q80 362 86 300 Z" fill="url(#jellyCar)" stroke="#3a2a2a" stroke-width="7" stroke-linejoin="round"/>
    <!-- window (jelly glass) -->
    <path d="M214 214 L296 212 L346 262 L206 264 Z" fill="#bff0ea" opacity="0.9" stroke="#3a2a2a" stroke-width="6" stroke-linejoin="round"/>
    <path d="M220 222 L262 220 L232 254 L212 256 Z" fill="#ffffff" opacity="0.55"/>
    <!-- jelly shine -->
    <path d="M118 290 Q124 268 150 262" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M388 252 Q410 262 418 292" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <path d="M160 214 Q180 204 206 204" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <!-- stripe accent -->
    <path d="M100 330 L438 330" stroke="#ffa630" stroke-width="10" stroke-linecap="round"/>
    <!-- headlamp -->
    <circle cx="438" cy="296" r="9" fill="#fff7c2" stroke="#3a2a2a" stroke-width="4"/>
  </g>

  <g id="cow">
    <!-- ears -->
    <ellipse cx="224" cy="214" rx="22" ry="11" transform="rotate(-28 224 214)" fill="#fffdf5" stroke="#3a2a2a" stroke-width="5"/>
    <ellipse cx="330" cy="206" rx="22" ry="11" transform="rotate(28 330 206)" fill="#fffdf5" stroke="#3a2a2a" stroke-width="5"/>
    <ellipse cx="224" cy="214" rx="11" ry="5" transform="rotate(-28 224 214)" fill="#ffb7b2"/>
    <ellipse cx="330" cy="206" rx="11" ry="5" transform="rotate(28 330 206)" fill="#ffb7b2"/>
    <!-- horns -->
    <path d="M250 196 Q252 176 268 178" fill="none" stroke="#3a2a2a" stroke-width="8" stroke-linecap="round"/>
    <path d="M302 192 Q316 176 324 188" fill="none" stroke="#3a2a2a" stroke-width="8" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="276" cy="234" rx="52" ry="42" fill="#fffdf5" stroke="#3a2a2a" stroke-width="6"/>
    <path d="M240 210 Q254 198 270 204" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <!-- spots -->
    <ellipse cx="300" cy="216" rx="14" ry="11" fill="#3a2a2a" opacity="0.85"/>
    <ellipse cx="250" cy="250" rx="9" ry="7" fill="#3a2a2a" opacity="0.85"/>
    <!-- eyes with shine -->
    <circle cx="256" cy="228" r="7" fill="#3a2a2a"/>
    <circle cx="298" cy="226" r="7" fill="#3a2a2a"/>
    <circle cx="258" cy="226" r="2.5" fill="#ffffff"/>
    <circle cx="300" cy="224" r="2.5" fill="#ffffff"/>
    <!-- blush and eyelashes -->
    <ellipse cx="246" cy="246" rx="7" ry="4" fill="#ff9a92" opacity="0.7"/>
    <path d="M250 222 Q254 216 260 220 M292 220 Q296 214 302 218" fill="none" stroke="#3a2a2a" stroke-width="3" stroke-linecap="round"/>
    <!-- snout shine -->
    <path d="M284 252 Q290 248 298 250" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- snout -->
    <ellipse cx="300" cy="262" rx="30" ry="19" fill="#ffb7b2" stroke="#3a2a2a" stroke-width="5"/>
    <circle cx="290" cy="262" r="3.5" fill="#3a2a2a"/>
    <circle cx="310" cy="262" r="3.5" fill="#3a2a2a"/>
    <!-- hoof on steering wheel -->
    <path d="M168 300 Q176 290 192 296 L196 318 L166 318 Z" fill="#fffdf5" stroke="#3a2a2a" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <g id="scarf">
    <!-- red ribbon collar with flowing tail -->
    <path d="M224 286 Q276 300 330 284 L334 302 Q280 316 222 304 Z" fill="#e63946" stroke="#3a2a2a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M300 300 Q318 320 306 352 Q296 368 314 384 L330 372 Q316 350 326 322 Q334 306 324 294 Z" fill="#e63946" stroke="#3a2a2a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M236 292 Q262 300 286 294" fill="none" stroke="#ff8a8f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="limbs">
    <!-- jelly wheels -->
    <circle cx="150" cy="364" r="44" fill="url(#jellyWheel)" stroke="#3a2a2a" stroke-width="7"/>
    <circle cx="150" cy="364" r="16" fill="#ffa630" stroke="#3a2a2a" stroke-width="5"/>
    <circle cx="382" cy="364" r="44" fill="url(#jellyWheel)" stroke="#3a2a2a" stroke-width="7"/>
    <circle cx="382" cy="364" r="16" fill="#ffa630" stroke="#3a2a2a" stroke-width="5"/>
    <path d="M124 350 Q130 340 140 338" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M356 350 Q362 340 372 338" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g id="fx">
    <!-- wobble lines -->
    <path d="M52 330 Q40 340 52 350 Q64 360 52 370" fill="none" stroke="#3a2a2a" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M30 300 Q20 310 30 320" fill="none" stroke="#3a2a2a" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <!-- jiggle sparkles -->
    <path d="M470 150 l8 0 M474 146 l0 8" stroke="#ff7a6b" stroke-width="4" stroke-linecap="round"/>
    <path d="M46 200 l8 0 M50 196 l0 8" stroke="#3bb8a8" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
