<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c7a3"/>
      <stop offset="1" stop-color="#c4ad84"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc583"/>
      <stop offset="1" stop-color="#3a8a55"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="512" height="330" fill="#cfe9e3"/>

  <!-- window with foggy morning outside -->
  <rect x="24" y="36" width="200" height="130" rx="4" fill="#e3eef2" stroke="#5d7b87" stroke-width="6"/>
  <rect x="30" y="42" width="188" height="118" fill="#b9d3dc"/>
  <ellipse cx="90" cy="80" rx="80" ry="20" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="160" cy="110" rx="90" ry="22" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="110" cy="140" rx="100" ry="18" fill="#ffffff" opacity="0.5"/>
  <rect x="122" y="42" width="6" height="118" fill="#5d7b87"/>
  <circle cx="165" cy="72" r="16" fill="#fff6c9" opacity="0.9"/>
  <circle cx="165" cy="72" r="26" fill="#fff6c9" opacity="0.25"/>

  <!-- wall sign and hanging lamp glow -->
  <rect x="268" y="50" width="110" height="26" rx="5" fill="#ffffff" stroke="#5d7b87" stroke-width="3"/>
  <path d="M282 63 L366 63" stroke="#5d7b87" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 8"/>
  <circle cx="330" cy="20" r="6" fill="#f7e27a" stroke="#a88a12" stroke-width="2"/>

  <!-- clock -->
  <circle cx="420" cy="92" r="38" fill="#ffffff" stroke="#5d7b87" stroke-width="6"/>
  <line x1="420" y1="92" x2="420" y2="66" stroke="#3b4e57" stroke-width="5" stroke-linecap="round"/>
  <line x1="420" y1="92" x2="440" y2="102" stroke="#3b4e57" stroke-width="5" stroke-linecap="round"/>

  <!-- back row of washing machines -->
  <g>
    <rect x="28" y="190" width="132" height="132" rx="10" fill="#9fb9c6" stroke="#4e6974" stroke-width="5"/>
    <rect x="28" y="190" width="132" height="22" rx="6" fill="#7f9cab"/>
    <circle cx="94" cy="262" r="42" fill="#58798a" stroke="#34505c" stroke-width="5"/>
    <circle cx="94" cy="262" r="30" fill="#b7dfee" opacity="0.85"/>

    <rect x="190" y="190" width="132" height="132" rx="10" fill="#9fb9c6" stroke="#4e6974" stroke-width="5"/>
    <rect x="190" y="190" width="132" height="22" rx="6" fill="#7f9cab"/>
    <circle cx="256" cy="262" r="42" fill="#58798a" stroke="#34505c" stroke-width="5"/>
    <circle cx="256" cy="262" r="30" fill="#b7dfee" opacity="0.85"/>

    <rect x="352" y="190" width="132" height="132" rx="10" fill="#9fb9c6" stroke="#4e6974" stroke-width="5"/>
    <rect x="352" y="190" width="132" height="22" rx="6" fill="#7f9cab"/>
    <circle cx="418" cy="262" r="42" fill="#58798a" stroke="#34505c" stroke-width="5"/>
    <circle cx="418" cy="262" r="30" fill="#b7dfee" opacity="0.85"/>
  </g>

  <!-- fog over the back row -->
  <rect x="0" y="180" width="512" height="150" fill="url(#fog)"/>
  <ellipse cx="120" cy="250" rx="180" ry="26" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="400" cy="300" rx="200" ry="22" fill="#ffffff" opacity="0.4"/>

  <!-- floor -->
  <rect x="0" y="330" width="512" height="182" fill="url(#floorG)"/>
  <g stroke="#b29a70" stroke-width="2" opacity="0.7">
    <line x1="0" y1="370" x2="512" y2="370"/>
    <line x1="0" y1="414" x2="512" y2="414"/>
    <line x1="0" y1="460" x2="512" y2="460"/>
    <line x1="0" y1="500" x2="512" y2="500"/>
    <line x1="64" y1="330" x2="64" y2="370"/>
    <line x1="192" y1="330" x2="192" y2="370"/>
    <line x1="320" y1="330" x2="320" y2="370"/>
    <line x1="448" y1="330" x2="448" y2="370"/>
    <line x1="32" y1="370" x2="32" y2="414"/>
    <line x1="160" y1="370" x2="160" y2="414"/>
    <line x1="288" y1="370" x2="288" y2="414"/>
    <line x1="416" y1="370" x2="416" y2="414"/>
    <line x1="96" y1="414" x2="96" y2="460"/>
    <line x1="224" y1="414" x2="224" y2="460"/>
    <line x1="352" y1="414" x2="352" y2="460"/>
    <line x1="480" y1="414" x2="480" y2="460"/>
  </g>

  <!-- laundry basket with towels, on the right -->
  <path d="M372 368 L470 368 L456 432 L386 432 Z" fill="#e39a4e" stroke="#9a5b24" stroke-width="4" stroke-linejoin="round"/>
  <path d="M380 388 L462 388" stroke="#9a5b24" stroke-width="4"/>
  <path d="M378 408 L458 408" stroke="#9a5b24" stroke-width="4"/>
  <!-- a striped sock hanging over the basket rim -->
  <path d="M396 368 L396 344 Q396 336 404 336 L414 336 L414 350 L404 360 L404 368 Z" fill="#ffffff" stroke="#8a8a8a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M396 348 L404 348 M396 356 L404 356" stroke="#4f8fd6" stroke-width="3"/>
  <rect x="380" y="352" width="26" height="18" rx="6" fill="#f2d24f" stroke="#a88a12" stroke-width="3"/>
  <rect x="412" y="346" width="28" height="22" rx="6" fill="#ef6f7a" stroke="#9c3d47" stroke-width="3"/>
  <rect x="442" y="354" width="24" height="16" rx="6" fill="#6fb6e8" stroke="#2d6f9f" stroke-width="3"/>

  <!-- detergent bottle and soap bubbles -->
  <rect x="60" y="392" width="34" height="50" rx="10" fill="#7fb8e0" stroke="#2d6f9f" stroke-width="4"/>
  <rect x="68" y="380" width="18" height="14" rx="3" fill="#2d6f9f"/>
  <rect x="66" y="408" width="22" height="16" rx="3" fill="#ffffff" opacity="0.9"/>
  <g fill="#ffffff" stroke="#8fb9cf" stroke-width="2" opacity="0.85">
    <circle cx="112" cy="356" r="7"/>
    <circle cx="128" cy="338" r="5"/>
    <circle cx="140" cy="366" r="9"/>
    <circle cx="372" cy="326" r="6"/>
  </g>

  <!-- turtle's shadow -->
  <ellipse cx="236" cy="414" rx="124" ry="15" fill="#4a3b25" opacity="0.22"/>

  <!-- tail -->
  <path d="M158 352 L140 348 L156 340 Z" fill="#8fd08f" stroke="#245c36" stroke-width="4" stroke-linejoin="round"/>

  <!-- back legs -->
  <ellipse cx="176" cy="398" rx="20" ry="13" fill="#8fd08f" stroke="#245c36" stroke-width="4"/>
  <ellipse cx="292" cy="398" rx="20" ry="13" fill="#8fd08f" stroke="#245c36" stroke-width="4"/>

  <!-- shell -->
  <ellipse cx="236" cy="352" rx="98" ry="62" fill="url(#shell)" stroke="#245c36" stroke-width="5"/>
  <ellipse cx="236" cy="352" rx="50" ry="34" fill="#7fd79a" stroke="#245c36" stroke-width="4"/>
  <g stroke="#245c36" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="186" y1="352" x2="236" y2="318"/>
    <line x1="286" y1="352" x2="236" y2="318"/>
    <line x1="186" y1="352" x2="236" y2="386"/>
    <line x1="286" y1="352" x2="236" y2="386"/>
    <line x1="236" y1="290" x2="236" y2="318"/>
    <line x1="236" y1="414" x2="236" y2="386"/>
  </g>
  <!-- tiny stripes of towel-colored sock draped over the shell -->
  <!-- soft highlight on the shell -->
  <path d="M190 326 Q214 300 252 298" fill="none" stroke="#c9f2d4" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- front legs -->
  <ellipse cx="300" cy="392" rx="22" ry="14" fill="#8fd08f" stroke="#245c36" stroke-width="4"/>
  <ellipse cx="206" cy="402" rx="20" ry="13" fill="#8fd08f" stroke="#245c36" stroke-width="4"/>

  <!-- neck and head -->
  <ellipse cx="320" cy="330" rx="20" ry="16" fill="#8fd08f" stroke="#245c36" stroke-width="4"/>
  <circle cx="340" cy="312" r="26" fill="#8fd08f" stroke="#245c36" stroke-width="4"/>
  <!-- eyes -->
  <circle cx="331" cy="306" r="7" fill="#ffffff" stroke="#245c36" stroke-width="2"/>
  <circle cx="349" cy="306" r="7" fill="#ffffff" stroke="#245c36" stroke-width="2"/>
  <circle cx="333" cy="307" r="3.5" fill="#1d2b22"/>
  <circle cx="351" cy="307" r="3.5" fill="#1d2b22"/>
  <!-- cheeks and smile -->
  <circle cx="324" cy="318" r="4" fill="#f59a9a" opacity="0.8"/>
  <circle cx="356" cy="318" r="4" fill="#f59a9a" opacity="0.8"/>
  <path d="M332 322 Q340 330 348 322" fill="none" stroke="#245c36" stroke-width="3" stroke-linecap="round"/>

  <!-- low morning mist drifting across the floor, in front of the turtle's feet -->
  <ellipse cx="256" cy="446" rx="260" ry="26" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="90" cy="486" rx="200" ry="20" fill="#ffffff" opacity="0.25"/>

  <!-- foggy morning veil over the floor and turtle's base -->
  <rect x="0" y="360" width="512" height="152" fill="#ffffff" opacity="0.18"/>
  <rect x="0" y="420" width="512" height="92" fill="#ffffff" opacity="0.12"/>
</svg>
