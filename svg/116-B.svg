<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14112a"/>
      <stop offset="1" stop-color="#2a2446"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff8e0"/>
      <stop offset="1" stop-color="#e3cf8a"/>
    </radialGradient>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a883"/>
      <stop offset="0.35" stop-color="#f1e6cb"/>
      <stop offset="1" stop-color="#cdbd98"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="400" cy="90" r="46" fill="url(#moon)"/>
  <g fill="#fff8e0" opacity="0.8">
    <circle cx="80" cy="70" r="2"/><circle cx="150" cy="40" r="1.5"/><circle cx="210" cy="95" r="2"/><circle cx="60" cy="150" r="1.5"/>
  </g>
  <rect x="0" y="440" width="512" height="72" fill="#0c0a18"/>
  <ellipse cx="256" cy="468" rx="170" ry="22" fill="#000" opacity="0.5"/>
  <!-- body wrapped in bandages -->
  <g transform="rotate(-3 256 350)">
    <rect x="170" y="230" width="172" height="230" rx="40" fill="url(#wrap)"/>
    <g stroke="#a89670" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M176 262 Q256 282 336 262"/>
      <path d="M176 302 Q256 322 336 302"/>
      <path d="M176 342 Q256 362 336 342"/>
      <path d="M176 382 Q256 402 336 382"/>
      <path d="M176 422 Q256 442 336 422"/>
    </g>
    <!-- loose bandage tail -->
    <path d="M330 420 Q352 430 344 452 Q334 446 326 440 Z" fill="#e8dcc0" stroke="#a89670" stroke-width="3"/>
  </g>
  <!-- head, tilted -->
  <g transform="rotate(-6 256 200)">
    <ellipse cx="256" cy="170" rx="90" ry="100" fill="url(#wrap)"/>
    <g stroke="#a89670" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M168 128 Q256 148 344 128"/>
      <path d="M166 166 Q256 186 346 166"/>
      <path d="M170 204 Q256 222 342 204"/>
    </g>
    <!-- brows, lowered lids and eyes -->
    <path d="M206 146 Q222 138 236 146" stroke="#6b5a3c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M276 146 Q290 138 306 146" stroke="#6b5a3c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="222" cy="166" rx="15" ry="9" fill="#1b1830"/>
    <ellipse cx="290" cy="166" rx="15" ry="9" fill="#1b1830"/>
    <path d="M207 160 Q222 152 237 160 Z" fill="#e8dcc0"/>
    <path d="M275 160 Q290 152 305 160 Z" fill="#e8dcc0"/>
    <circle cx="226" cy="165" r="2.5" fill="#fff"/>
    <circle cx="294" cy="165" r="2.5" fill="#fff"/>
  </g>
  <!-- scarf -->
  <path d="M170 262 Q256 290 342 262 L350 292 Q256 324 162 292 Z" fill="#d7263d"/>
  <path d="M300 290 L322 300 Q332 340 318 380 L298 372 Q306 335 288 350 Z" fill="#d7263d" stroke="#8c1424" stroke-width="4"/>
  <path d="M170 262 Q256 290 342 262" fill="none" stroke="#f0606f" stroke-width="3" opacity="0.6"/>
  <!-- scarf knot and fringe -->
  <ellipse cx="300" cy="292" rx="16" ry="12" fill="#b31d31" stroke="#8c1424" stroke-width="3"/>
  <g stroke="#d7263d" stroke-width="4" stroke-linecap="round">
    <path d="M300 378 L296 392"/><path d="M308 378 L306 394"/><path d="M316 380 L318 395"/>
  </g>
  <!-- snowflakes drifting by -->
  <g fill="#fff8e0" opacity="0.85">
    <circle cx="120" cy="300" r="3"/><circle cx="400" cy="250" r="3"/><circle cx="90" cy="380" r="2.5"/><circle cx="420" cy="370" r="2.5"/>
  </g>
  <!-- shadow under the head wrap for volume -->
  <path d="M190 230 Q256 250 322 230 Q256 240 190 230 Z" fill="#000" opacity="0.15"/>
  <!-- contact shadow -->
  <ellipse cx="256" cy="462" rx="120" ry="10" fill="#000" opacity="0.4"/>
</svg>
