      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#f4b183"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
  <circle cx="420" cy="90" r="60" fill="url(#glow)"/>
