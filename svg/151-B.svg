      <line x1="250" y1="310" x2="282" y2="378"/>
      <line x1="282" y1="378" x2="300" y2="425"/>
      <line x1="250" y1="205" x2="200" y2="168"/>
      <line x1="200" y1="168" x2="165" y2="130"/>
      <line x1="250" y1="205" x2="305" y2="160"/>
