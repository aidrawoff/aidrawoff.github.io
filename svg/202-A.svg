<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: Party room with warm/cool lighting -->
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c29"/>
      <stop offset="50%" stop-color="#2d2b42"/>
      <stop offset="100%" stop-color="#151322"/>
    </linearGradient>
    <radialGradient id="discoGlow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ff79c6" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8be9fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#151322" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zombieSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78a67c"/>
      <stop offset="100%" stop-color="#4f7553"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1826"/>
      <stop offset="100%" stop-color="#0d0b12"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Wall & Floor -->
  <rect width="512" height="512" fill="url(#wallGrad)"/>
  <rect width="512" height="512" fill="url(#discoGlow)"/>
  <rect x="0" y="380" width="512" height="132" fill="url(#floorGrad)"/>
  <line x1="0" y1="380" x2="512" y2="380" stroke="#ff79c6" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="#8be9fd" stroke-width="1.5" opacity="0.3"/>

  <!-- Floating Balloons in Background -->
  <g filter="url(#shadow)" opacity="0.95">
    <ellipse cx="90" cy="220" rx="22" ry="26" fill="#ff5555"/>
    <path d="M 90 246 Q 92 290 85 340" fill="none" stroke="#6272a4" stroke-width="1.5"/>
    <ellipse cx="430" cy="200" rx="24" ry="28" fill="#bd93f9"/>
    <path d="M 430 228 Q 425 280 435 340" fill="none" stroke="#6272a4" stroke-width="1.5"/>
  </g>

  <!-- Party Banners / Garlands -->
  <path d="M 0 60 Q 128 120 256 60 T 512 60" fill="none" stroke="#ffb86c" stroke-width="3" opacity="0.7"/>
  <polygon points="60,83 75,120 90,83" fill="#ff5555" filter="url(#shadow)"/>
  <polygon points="170,96 185,135 200,96" fill="#f1fa8c" filter="url(#shadow)"/>
  <polygon points="280,80 295,118 310,80" fill="#50fa7b" filter="url(#shadow)"/>
  <polygon points="390,92 405,130 420,92" fill="#8be9fd" filter="url(#shadow)"/>

  <!-- Disco Ball -->
  <circle cx="256" cy="60" r="28" fill="#e2e8f0" filter="url(#shadow)"/>
  <line x1="256" y1="0" x2="256" y2="32" stroke="#64748b" stroke-width="2"/>
  <path d="M 235 50 Q 256 70 277 50" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 235 60 Q 256 80 277 60" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="256" cy="60" r="28" fill="url(#discoGlow)" opacity="0.85"/>

  <!-- Buffet Table & Punch Bowl in background -->
  <rect x="310" y="270" width="170" height="110" rx="8" fill="#2d2222" filter="url(#shadow)"/>
  <rect x="305" y="262" width="180" height="14" rx="4" fill="#4a3b3b"/>
  <!-- Punch Bowl -->
  <ellipse cx="395" cy="262" rx="45" ry="16" fill="#ff79c6" filter="url(#shadow)"/>
  <ellipse cx="395" cy="258" rx="38" ry="11" fill="#ff479b"/>
  <!-- Punch ladle -->
  <path d="M 395 250 Q 420 210 435 225" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <!-- Snacks / Plates on table -->
  <rect x="330" y="248" width="18" height="16" rx="3" fill="#50fa7b"/>
  <ellipse cx="339" cy="248" rx="9" ry="3" fill="#8aff9b"/>

  <!-- SHY ZOMBIE CHARACTER -->
  <g transform="translate(180, 150)" filter="url(#shadow)">
    <!-- Body / Hoodie / Party Outfit -->
    <path d="M 40 130 L 15 250 L 115 250 L 90 130 Z" fill="#44475a"/>
    <path d="M 45 130 L 85 130 L 75 190 L 55 190 Z" fill="#f8f8f2"/> <!-- Shirt collar -->
    <path d="M 65 130 L 65 190" stroke="#282a36" stroke-width="2"/> <!-- shirt split -->
    
    <!-- Nervous Arms / Hunch (shrugging / holding cup tight) -->
    <path d="M 42 140 Q 12 180 32 210" fill="none" stroke="url(#zombieSkin)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 88 140 Q 118 170 98 205" fill="none" stroke="url(#zombieSkin)" stroke-width="26" stroke-linecap="round"/>

    <!-- Red Solo Cup in hand -->
    <rect x="86" y="180" width="24" height="32" rx="3" fill="#ff5555" transform="rotate(-15 98 196)"/>
    <ellipse cx="98" cy="180" rx="12" ry="4.5" fill="#ff9999"/>
    <!-- Drink surface inside cup -->
    <ellipse cx="97" cy="183" rx="10" ry="3" fill="#bd93f9"/>

    <!-- Head & Neck -->
    <rect x="50" y="85" width="32" height="48" fill="#5f8a63"/>
    <ellipse cx="66" cy="72" rx="45" ry="40" fill="url(#zombieSkin)"/>

    <!-- Stitches / Scars / Details -->
    <path d="M 32 60 L 42 70 M 37 58 L 39 72" stroke="#2e4d32" stroke-width="3" stroke-linecap="round"/>
    <path d="M 92 85 L 100 95 M 96 83 L 98 97" stroke="#2e4d32" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="88" cy="55" r="7" fill="#4f7553" opacity="0.6"/> <!-- Rot spot / bruise -->

    <!-- Shy Expression: Asymmetric Eyebrows & Eyes -->
    <!-- Left eye (wide, anxious) -->
    <circle cx="48" cy="65" r="10" fill="#fff"/>
    <circle cx="50" cy="65" r="4.5" fill="#bd93f9"/>
    <circle cx="51" cy="64" r="1.8" fill="#111"/>
    <!-- Right eye (nervous squint / looking away) -->
    <circle cx="78" cy="65" r="10" fill="#fff"/>
    <circle cx="76" cy="65" r="4.5" fill="#bd93f9"/>
    <circle cx="75" cy="64" r="1.8" fill="#111"/>
    <!-- Eye highlights -->
    <circle cx="53" cy="62" r="1.2" fill="#fff"/>
    <circle cx="73" cy="62" r="1.2" fill="#fff"/>

    <!-- Eyebrows (slanted nervously inwards) -->
    <path d="M 38 52 Q 48 60 58 52" fill="none" stroke="#2e4d32" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 68 52 Q 78 60 88 52" fill="none" stroke="#2e4d32" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Shy / Awkward Smile with one stitched corner -->
    <path d="M 50 88 Q 66 98 82 85" fill="none" stroke="#2e4d32" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 80 81 L 88 90 M 84 79 L 86 88" stroke="#2e4d32" stroke-width="2.5"/> <!-- Stitch at corner -->

    <!-- Cute party hat tilted sideways -->
    <polygon points="54,34 88,18 70,-14" fill="#ff79c6" filter="url(#shadow)"/>
    <ellipse cx="70" cy="-14" rx="7" ry="7" fill="#f1fa8c"/>
    <path d="M 50 34 Q 70 44 92 34" fill="none" stroke="#bd93f9" stroke-width="4.5"/>
    <!-- Hat polka dots -->
    <circle cx="68" cy="15" r="3" fill="#f1fa8c"/>
    <circle cx="76" cy="24" r="2.5" fill="#50fa7b"/>
  </g>

  <!-- Confetti / Floating Party Elements -->
  <circle cx="120" cy="140" r="4.5" fill="#ff5555"/>
  <circle cx="360" cy="120" r="5.5" fill="#50fa7b"/>
  <rect x="75" y="270" width="10" height="7" fill="#f1fa8c" transform="rotate(35 80 273.5)"/>
  <rect x="290" y="330" width="12" height="8" fill="#ff79c6" transform="rotate(-20 296 334)"/>
  <circle cx="210" cy="360" r="4" fill="#8be9fd"/>
  <polygon points="150,220 155,232 145,232" fill="#ffb86c"/>
  <polygon points="340,180 346,192 338,190" fill="#8be9fd"/>
</svg>