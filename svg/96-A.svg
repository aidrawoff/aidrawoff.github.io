<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#f0f8ff"/>
  <!-- Sky gradient -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="512">
    <stop offset="0%" stop-color="#0a1a2f"/>
    <stop offset="100%" stop-color="#1a3a5f"/>
  </linearGradient>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="400" cy="120" r="40" fill="#f8f8d0" opacity="0.9"/>
  <circle cx="400" cy="120" r="20" fill="#0a1a2f"/>

  <!-- Sand gradient -->
  <linearGradient id="sand" x1="0" y1="400" x2="0" y2="512">
    <stop offset="0%" stop-color="#c9a96e"/>
    <stop offset="70%" stop-color="#8b6914"/>
    <stop offset="100%" stop-color="#5d4022"/>
  </linearGradient>
  <rect x="0" y="400" width="512" height="112" fill="url(#sand)"/>

  <!-- Sand texture noise -->
  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.3
                                         0 0 0 0 0.25
                                         0 0 0 0 0.15
                                         0 0 0 0.2 0"/>
    <feComposite in="SourceGraphic" in2="noise" operator="over"/>
  </filter>
  <rect x="0" y="400" width="512" height="112" fill="url(#sand)" filter="url(#noise)" opacity="0.3"/>

  <!-- Bedsheet (ghosts rest on it) -->
  <path d="M60 320h400v120c0 20-40 10-80 10s-80-10-80-10H132c-40 0-80 10-80-10V320z" fill="#f8f8f8" stroke="#ddd" stroke-width="2"/>

  <!-- Ghost 1 (left) -->
  <path id="g1" d="M180 280c-20-30-40-60-40-90 0-20 10-40 30-50 20-10 40-10 60 0 20 10 30 30 30 50 0 30-20 60-40 90-10 15-20 30-20 45 0 20 10 40 30 50 20 10 40 10 60 0 20-10 30-30 30-50 0-15-10-30-20-45z" fill="#e0e0ff" opacity="0.85"/>
  <!-- Ghost 1 eyes -->
  <circle cx="190" cy="270" r="6" fill="#0a1a2f"/>
  <circle cx="210" cy="270" r="6" fill="#0a1a2f"/>
  <!-- Ghost 1 subtle mouth -->
  <path d="M195 285c5 0 10 2 10 5s-5 5-10 5-10-2-10-5 5-5 10-5z" fill="#0a1a2f" opacity="0.7"/>
  <!-- Ghost 1 highlight (moonlight) -->
  <ellipse cx="170" cy="240" rx="25" ry="15" fill="#ffffff" opacity="0.3"/>
  <!-- Ghost 1 extra wisp -->
  <path d="M160 220c-10-5-15-10-15-20 0-15 10-25 25-25s25 10 25 25c0 10-5 15-15 20-5 0-10 0-15 0z" fill="#ffffff" opacity="0.15"/>  

  <!-- Ghost 2 (right) -->
  <path id="g2" d="M320 280c-20-30-40-60-40-90 0-20 10-40 30-50 20-10 40-10 60 0 20 10 30 30 30 50 0 30-20 60-40 90-10 15-20 30-20 45 0 20 10 40 30 50 20 10 40 10 60 0 20-10 30-30 30-50 0-15-10-30-20-45z" fill="#e0e0ff" opacity="0.85"/>
  <!-- Ghost 2 eyes -->
  <circle cx="330" cy="270" r="6" fill="#0a1a2f"/>
  <circle cx="350" cy="270" r="6" fill="#0a1a2f"/>
  <!-- Ghost 2 subtle mouth -->
  <path d="M335 285c5 0 10 2 10 5s-5 5-10 5-10-2-10-5 5-5 10-5z" fill="#0a1a2f" opacity="0.7"/>
  <!-- Ghost 2 highlight (moonlight) -->
  <ellipse cx="310" cy="240" rx="25" ry="15" fill="#ffffff" opacity="0.3"/>
  <!-- Ghost 2 extra wisp -->
  <path d="M290 220c-10-5-15-10-15-20 0-15 10-25 25-25s25 10 25 25c0 10-5 15-15 20-5 0-10 0-15 0z" fill="#ffffff" opacity="0.15"/>  

  <!-- Subtle shadow under sheet -->
  <ellipse cx="250" cy="420" rx="120" ry="15" fill="#0a1a2f" opacity="0.12"/>
  <!-- Subtle shadow under ghosts -->
  <ellipse cx="180" cy="380" rx="40" ry="10" fill="#0a1a2f" opacity="0.15"/>
  <ellipse cx="320" cy="380" rx="40" ry="10" fill="#0a1a2f" opacity="0.15"/>

  <!-- Bedsheet creases -->
  <path d="M100 360h20L120 340h20L140 360h20L160 340h20L180 360h20L200 340h20L220 360h20L240 340h20L260 360h20L280 340h20L300 360h20L320 340h20L340 360h20L360 340h20L380 360h20L400 340h20L420 360" stroke="#e8e8e8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M80 370h20L100 350h20L120 370h20L140 350h20L160 370h20L180 350h20L200 370h20L220 350h20L240 370h20L260 350h20L280 370h20L300 350h20L320 370h20L340 350h20L360 370h20L380 350h20L400 370h20L420 350" stroke="#d8d8d8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>