<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181333"/>
      <stop offset="50%" stop-color="#322457"/>
      <stop offset="100%" stop-color="#6a3952"/>
    </linearGradient>
    
    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120c19"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <!-- Bus Gradient -->
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f1a"/>
      <stop offset="100%" stop-color="#ffb833"/>
    </linearGradient>
    
    <!-- Pelican Body Gradient -->
    <linearGradient id="pelicanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecf0f1"/>
    </linearGradient>

    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ff7675"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="512" height="360" fill="url(#skyGrad)"/>
  
  <!-- Square Sun / Neon Billboard -->
  <rect x="375" y="40" width="95" height="95" fill="#f1c40f" opacity="0.95" rx="8"/>
  <rect x="350" y="15" width="145" height="145" fill="#f39c12" opacity="0.2" rx="16"/>

  <!-- Background Square Clouds -->
  <rect x="30" y="65" width="160" height="45" fill="#ffffff" opacity="0.14" rx="6"/>
  <rect x="65" y="45" width="110" height="40" fill="#ffffff" opacity="0.14" rx="6"/>
  <rect x="210" y="95" width="130" height="40" fill="#ffffff" opacity="0.14" rx="6"/>

  <!-- Background City Skyline (Detailed Square Architecture & Neon Lights) -->
  <rect x="10" y="150" width="70" height="210" fill="#251a42" opacity="0.9"/>
  <rect x="80" y="110" width="80" height="250" fill="#1b1231" opacity="0.98"/>
  <rect x="160" y="90" width="95" height="270" fill="#281c4a" opacity="0.92"/>
  <rect x="255" y="130" width="100" height="230" fill="#1e1338" opacity="0.98"/>
  <rect x="365" y="100" width="135" height="260" fill="#241944" opacity="0.9"/>

  <!-- Square Windows with glowing yellow & cyan lights -->
  <g fill="#ffeaa7" opacity="0.8">
    <rect x="25" y="170" width="14" height="14" rx="2"/>
    <rect x="50" y="170" width="14" height="14" rx="2"/>
    <rect x="25" y="205" width="14" height="14" rx="2"/>
    <rect x="50" y="205" width="14" height="14" rx="2"/>
    <rect x="25" y="240" width="14" height="14" rx="2"/>
    <rect x="50" y="240" width="14" height="14" rx="2"/>
    <rect x="25" y="275" width="14" height="14" rx="2"/>
    <rect x="50" y="275" width="14" height="14" rx="2"/>
    
    <rect x="95" y="130" width="16" height="16" rx="2"/>
    <rect x="125" y="130" width="16" height="16" rx="2"/>
    <rect x="95" y="170" width="16" height="16" rx="2"/>
    <rect x="125" y="170" width="16" height="16" rx="2"/>
    <rect x="95" y="210" width="16" height="16" rx="2"/>
    <rect x="125" y="210" width="16" height="16" rx="2"/>
    <rect x="95" y="250" width="16" height="16" rx="2"/>
    <rect x="125" y="250" width="16" height="16" rx="2"/>

    <rect x="180" y="110" width="18" height="18" rx="2"/>
    <rect x="215" y="110" width="18" height="18" rx="2"/>
    <rect x="180" y="155" width="18" height="18" rx="2"/>
    <rect x="215" y="155" width="18" height="18" rx="2"/>
    <rect x="180" y="200" width="18" height="18" rx="2"/>
    <rect x="215" y="200" width="18" height="18" rx="2"/>
    
    <rect x="280" y="150" width="16" height="16" rx="2"/>
    <rect x="315" y="150" width="16" height="16" rx="2"/>
    <rect x="280" y="195" width="16" height="16" rx="2"/>
    <rect x="315" y="195" width="16" height="16" rx="2"/>
    <rect x="280" y="240" width="16" height="16" rx="2"/>
    <rect x="315" y="240" width="16" height="16" rx="2"/>
  </g>

  <!-- Ground / Road -->
  <rect x="0" y="360" width="512" height="152" fill="url(#groundGrad)"/>
  <rect x="0" y="360" width="512" height="20" fill="#2c1e3d"/>
  
  <!-- Road markings (Square dashes with glowing reflection) -->
  <rect x="20" y="440" width="70" height="12" fill="#f1c40f" rx="3" opacity="0.95"/>
  <rect x="120" y="440" width="70" height="12" fill="#f1c40f" rx="3" opacity="0.95"/>
  <rect x="220" y="440" width="70" height="12" fill="#f1c40f" rx="3" opacity="0.95"/>
  <rect x="320" y="440" width="70" height="12" fill="#f1c40f" rx="3" opacity="0.95"/>
  <rect x="420" y="440" width="70" height="12" fill="#f1c40f" rx="3" opacity="0.95"/>

  <!-- Bus Stop Shelter on the right -->
  <g filter="url(#shadow)">
    <!-- Stop Pole -->
    <rect x="435" y="225" width="20" height="155" fill="#747d8c"/>
    <!-- Stop Sign Board -->
    <rect x="410" y="190" width="70" height="48" fill="#ff4757" rx="8"/>
    <rect x="422" y="200" width="46" height="28" fill="#ffffff" rx="4"/>
    <text x="445" y="219" font-family="monospace" font-weight="bold" font-size="16" fill="#ff4757" text-anchor="middle">BUS</text>
    <!-- Shelter Glass/Roof -->
    <rect x="380" y="270" width="115" height="110" fill="#ffffff" opacity="0.1" stroke="#dfe4ea" stroke-width="4" rx="6"/>
    <rect x="370" y="252" width="135" height="20" fill="#2f3542" rx="4"/>
  </g>

  <!-- The Arriving Bus (Ultra Polished & Dynamic) -->
  <g filter="url(#shadow)">
    <!-- Bus Body -->
    <rect x="310" y="270" width="160" height="100" fill="url(#busGrad)" rx="10"/>
    <!-- Bus Stripe & Details -->
    <rect x="310" y="322" width="160" height="14" fill="#ff4757" opacity="0.9"/>
    <rect x="310" y="360" width="160" height="10" fill="#2f3542"/>
    <!-- Windows -->
    <rect x="410" y="285" width="45" height="34" fill="#2f3542" rx="6"/>
    <rect x="355" y="285" width="45" height="34" fill="#2f3542" rx="6"/>
    <rect x="320" y="285" width="25" height="34" fill="#2f3542" rx="6"/>
    <!-- Headlight Beam & Bulb -->
    <rect x="455" y="335" width="15" height="20" fill="#ffffff" rx="4"/>
    <polygon points="470,345 510,320 510,370" fill="#f1c40f" opacity="0.25"/>
    <!-- Wheels -->
    <rect x="340" y="355" width="38" height="38" fill="#2f3542" rx="10"/>
    <rect x="349" y="364" width="20" height="20" fill="#a4b0be" rx="5"/>
    <rect x="420" y="355" width="38" height="38" fill="#2f3542" rx="10"/>
    <rect x="429" y="364" width="20" height="20" fill="#a4b0be" rx="5"/>
    <!-- Bus Destination Sign -->
    <rect x="395" y="273" width="65" height="14" fill="#000000" rx="4"/>
    <text x="427" y="283" font-family="monospace" font-weight="bold" font-size="10" fill="#2ed573" text-anchor="middle">EXPRESS</text>
  </g>

  <!-- HERO SUBJECT: THE PELICAN LATE FOR THE BUS (Supreme Polish & Dynamic Action) -->
  <g filter="url(#shadow)">
    <!-- High-Speed Motion Lines & Puffs -->
    <rect x="25" y="375" width="35" height="12" fill="#ffffff" opacity="0.8" rx="4"/>
    <rect x="70" y="365" width="45" height="14" fill="#ffffff" opacity="0.6" rx="4"/>
    <rect x="15" y="405" width="30" height="10" fill="#ffffff" opacity="0.7" rx="3"/>
    <rect x="50" y="392" width="22" height="9" fill="#ffffff" opacity="0.6" rx="3"/>
    <rect x="85" y="385" width="20" height="8" fill="#ffffff" opacity="0.5" rx="3"/>

    <!-- Pelican Legs & Running Feet (Exaggerated Sprint) -->
    <!-- Back Leg -->
    <rect x="125" y="380" width="16" height="50" fill="#ffa502" rx="4"/>
    <rect x="105" y="424" width="40" height="16" fill="#e67e22" rx="6"/>
    <!-- Front Leg (Sliding forward urgently) -->
    <rect x="185" y="370" width="16" height="58" fill="#ffa502" rx="4"/>
    <rect x="170" y="418" width="45" height="16" fill="#e67e22" rx="6"/>

    <!-- Pelican Body (Square/Geometric torso leaning forward with momentum) -->
    <rect x="100" y="250" width="100" height="120" fill="url(#pelicanGrad)" rx="16" transform="rotate(-15 150 310)"/>
    
    <!-- Wing (Flapping back hard with dynamic trail) -->
    <rect x="85" y="260" width="70" height="90" fill="#dfe4ea" rx="14" transform="rotate(-35 120 305)"/>
    <rect x="75" y="280" width="60" height="30" fill="#b2bec3" rx="10" transform="rotate(-15 105 295)"/>

    <!-- Pelican Neck & Head (Leaning forward intensely) -->
    <rect x="165" y="170" width="42" height="100" fill="url(#pelicanGrad)" rx="12" transform="rotate(15 186 220)"/>
    
    <!-- Head Box -->
    <rect x="170" y="135" width="75" height="65" fill="url(#pelicanGrad)" rx="14"/>

    <!-- Eye (Wide open in extreme panic!) -->
    <rect x="200" y="148" width="25" height="25" fill="#ffffff" rx="6"/>
    <rect x="210" y="156" width="11" height="11" fill="#2f3542" rx="3"/>
    <!-- Panic Eyebrow -->
    <rect x="195" y="141" width="34" height="8" fill="#2f3542" transform="rotate(-24 212 145)" rx="4"/>

    <!-- Massive Square Pouch Beak (Pelican trademark!) -->
    <rect x="210" y="168" width="110" height="62" fill="url(#beakGrad)" rx="16"/>
    <!-- Beak tip hook -->
    <rect x="302" y="205" width="24" height="28" fill="#c0392b" rx="10"/>
    <!-- Beak division line -->
    <rect x="210" y="194" width="100" height="8" fill="#b33939" rx="3"/>

    <!-- Fancy Dressed For Work / Panic Accessory: Square Red Bowtie -->
    <rect x="180" y="250" width="32" height="18" fill="#ff4757" rx="5" transform="rotate(15 196 259)"/>
    <rect x="189" y="254" width="14" height="14" fill="#c0392b" rx="4"/>

    <!-- Briefcase in wing (Showing he's late for work!) -->
    <rect x="75" y="320" width="50" height="35" fill="#9b59b6" rx="8" transform="rotate(-15 100 3375)"/>
    <rect x="95" y="312" width="18" height="10" fill="#e67e22" rx="3" transform="rotate(-15 104 317)"/>
    <rect x="91" y="330" width="14" height="7" fill="#f1c40f" rx="2" transform="rotate(-15 98 333)"/>

    <!-- Clock / Watch in wing showing LATE! -->
    <rect x="130" y="315" width="35" height="35" fill="#f1c40f" rx="10"/>
    <rect x="136" y="321" width="23" height="23" fill="#ffffff" rx="6"/>
    <!-- Clock hands pointing at red -->
    <rect x="145" y="325" width="4" height="12" fill="#ff4757" rx="2"/>
    <rect x="140" y="333" width="12" height="4" fill="#2f3542" rx="2"/>

    <!-- Sweat / Panic Drops (Dynamic floating square pixels) -->
    <rect x="248" y="118" width="13" height="18" fill="#0984e3" rx="6"/>
    <rect x="272" y="134" width="10" height="16" fill="#0984e3" rx="5"/>
    <rect x="230" y="108" width="8" height="12" fill="#0984e3" rx="4"/>
    <rect x="256" y="100" width="9" height="14" fill="#0984e3" rx="4"/>
  </g>

  <!-- Speed lines / Impact blocks in foreground -->
  <rect x="90" y="395" width="20" height="8" fill="#ffffff" opacity="0.9" rx="3"/>
  <rect x="55" y="415" width="32" height="8" fill="#ffffff" opacity="0.7" rx="3"/>

  <!-- Foreground Atmospheric Square Overlay / Border frame -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#f1c40f" stroke-width="10" opacity="0.7"/>
</svg>
