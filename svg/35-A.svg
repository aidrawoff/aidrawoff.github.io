<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00aaff"/>
      <stop offset="1" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a0e0ff"/>
      <stop offset="1" stop-color="#60c0ff"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- City skyline (more buildings) -->
  <g fill="#555">
    <rect x="20" y="320" width="40" height="192"/>
    <rect x="70" y="340" width="35" height="172"/>
    <rect x="115" y="310" width="50" height="202"/>
    <rect x="175" y="350" width="45" height="162"/>
    <rect x="230" y="330" width="60" height="182"/>
    <rect x="300" y="360" width="55" height="152"/>
    <rect x="365" y="320" width="40" height="192"/>
    <rect x="415" y="340" width="35" height="172"/>
    <rect x="460" y="310" width="32" height="202"/>
  </g>

  <!-- Windows -->
  <g fill="#f8f9fa">
    <rect x="30" y="340" width="8" height="8" />
    <rect x="30" y="360" width="8" height="8" />
    <rect x="30" y="380" width="8" height="8" />
    <rect x="50" y="340" width="8" height="8" />
    <rect x="50" y="360" width="8" height="8" />
    <rect x="80" y="360" width="8" height="8" />
    <rect x="80" y="380" width="8" height="8" />
    <rect x="130" y="330" width="8" height="8" />
    <rect x="130" y="350" width="8" height="8" />
    <rect x="130" y="370" width="8" height="8" />
    <rect x="150" y="330" width="8" height="8" />
    <rect x="150" y="350" width="8" height="8" />
    <rect x="190" y="360" width="8" height="8" />
    <rect x="190" y="380" width="8" height="8" />
    <rect x="250" y="340" width="8" height="8" />
    <rect x="250" y="360" width="8" height="8" />
    <rect x="250" y="380" width="8" height="8" />
    <rect x="270" y="340" width="8" height="8" />
    <rect x="270" y="360" width="8" height="8" />
    <rect x="320" y="370" width="8" height="8" />
    <rect x="320" y="390" width="8" height="8" />
    <rect x="340" y="370" width="8" height="8" />
    <rect x="340" y="390" width="8" height="8" />
    <rect x="380" y="350" width="8" height="8" />
    <rect x="380" y="370" width="8" height="8" />
    <rect x="425" y="330" width="8" height="8" />
    <rect x="425" y="350" width="8" height="8" />
    <rect x="480" y="320" width="8" height="8" />
    <rect x="480" y="340" width="8" height="8" />
  </g>

  <!-- Ice rink surface -->
  <rect x="0" y="450" width="512" height="62" fill="url(#ice)"/>

  <!-- Ice texture -->
  <g stroke="#b3e0ff" stroke-width="1" opacity="0.6">
    <line x1="20" y1="460" x2="500" y2="460" />
    <line x1="40" y1="470" x2="500" y2="470" />
    <line x1="60" y1="480" x2="500" y2="480" />
    <line x1="80" y1="490" x2="500" y2="490" />
  </g>

  <!-- Street below -->
  <rect x="0" y="400" width="512" height="50" fill="url(#street)"/>

  <!-- Streetlights -->
  <g>
    <rect x="100" y="300" width="4" height="50" fill="#333" />
    <circle cx="102" cy="300" r="8" fill="#ffcc00" />
    <rect x="250" y="300" width="4" height="50" fill="#333" />
    <circle cx="252" cy="300" r="8" fill="#ffcc00" />
    <rect x="400" y="300" width="4" height="50" fill="#333" />
    <circle cx="402" cy="300" r="8" fill="#ffcc00" />
  </g>

  <!-- Shark body (refined skating pose) -->
  <path d="M200,400 Q220,380 240,400 Q260,420 280,400 Q300,380 320,400 L340,420 Q360,440 380,420 Q400,400 420,420 L440,440 Q460,460 480,440 L500,460" stroke="#4a90e2" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Shark fins -->
  <path d="M240,400 L220,380 L230,400 Z" fill="#4a90e2" />
  <path d="M320,400 L300,380 L310,400 Z" fill="#4a90e2" />
  <path d="M380,420 L360,440 L370,420 Z" fill="#4a90e2" />

  <!-- Shark tail -->
  <path d="M480,440 L460,460 L470,440 Z" fill="#4a90e2" />

  <!-- Shark eye -->
  <circle cx="260" cy="395" r="6" fill="#000" />
  <circle cx="262" cy="393" r="2" fill="#fff" />

  <!-- Shark mouth -->
  <path d="M220,405 Q210,410 220,415" stroke="#000" stroke-width="2" fill="none" />

  <!-- Skates -->
  <ellipse cx="240" cy="430" rx="12" ry="6" fill="#d0021b" />
  <ellipse cx="320" cy="430" rx="12" ry="6" fill="#d0021b" />
  <ellipse cx="380" cy="450" rx="12" ry="6" fill="#d0021b" />

  <!-- Motion blur -->
  <g opacity="0.4">
    <path d="M180,390 Q200,370 220,390" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M280,410 Q300,390 320,410" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M360,430 Q380,410 400,430" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" />
  </g>

  <!-- City street details -->
  <rect x="50" y="420" width="412" height="20" fill="#222"/>
  <rect x="100" y="400" width="20" height="40" fill="#ff0000"/>
  <rect x="200" y="410" width="20" height="30" fill="#ffff00"/>
  <rect x="300" y="405" width="20" height="35" fill="#00ff00"/>
  <rect x="400" y="415" width="20" height="25" fill="#0000ff"/>

  <!-- Highlights on shark -->
  <path d="M200,380 C220,390 240,400 256,410" stroke="#777" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M120,400 C100,380 90,360 90,340" stroke="#777" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Shadows -->
  <ellipse cx="200" cy="440" rx="60" ry="15" fill="#000" opacity="0.2"/>
  <ellipse cx="150" cy="430" rx="40" ry="10" fill="#000" opacity="0.15"/>

  <!-- Crowd silhouettes on skyline -->
  <g fill="#aaa" opacity="0.7">
    <circle cx="50" cy="330" r="4"/>
    <circle cx="90" cy="350" r="4"/>
    <circle cx="140" cy="320" r="4"/>
    <circle cx="200" cy="360" r="4"/>
    <circle cx="260" cy="340" r="4"/>
    <circle cx="320" cy="370" r="4"/>
    <circle cx="380" cy="330" r="4"/>
    <circle cx="430" cy="350" r="4"/>
    <circle cx="470" cy="320" r="4"/>
  </g>

  <!-- Rink reflection glow -->
  <ellipse cx="256" cy="480" rx="180" ry="20" fill="#60c0ff" opacity="0.2"/>
</svg>