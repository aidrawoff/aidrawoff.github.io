<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- night sky -->
  <rect width="512" height="512" fill="#1b1f3b"/>
  <!-- moon -->
  <circle cx="92" cy="92" r="30" fill="#f5f7ff" opacity="0.9"/>
  <circle cx="82" cy="84" r="5" fill="#cfd6e6"/>
  <circle cx="100" cy="102" r="4" fill="#cfd6e6"/>
  <!-- stars -->
  <g fill="#f5f7ff">
    <circle cx="40" cy="30" r="2"/>
    <circle cx="150" cy="28" r="2.5"/>
    <circle cx="200" cy="70" r="1.8"/>
    <circle cx="470" cy="180" r="2"/>
    <circle cx="36" cy="200" r="1.8"/>
    <circle cx="450" cy="250" r="2.2"/>
    <circle cx="300" cy="28" r="2"/>
    <circle cx="20" cy="260" r="1.6"/>
    <circle cx="250" cy="40" r="1.5"/>
    <circle cx="480" cy="40" r="2"/>
  </g>
  <!-- distant mountain range -->
  <polygon points="0,400 90,300 150,350 230,260 300,340 380,280 512,390 512,512 0,512" fill="#2c3563"/>
  <!-- disco light beams -->
  <polygon points="390,120 250,330 300,330" fill="#ffd166" opacity="0.2"/>
  <polygon points="390,120 340,330 400,330" fill="#ff6fb5" opacity="0.2"/>
  <polygon points="390,120 440,330 490,300" fill="#7fe3ff" opacity="0.18"/>
  <polygon points="390,120 60,240 90,260" fill="#c9a7ff" opacity="0.14"/>
  <!-- disco ball -->
  <line x1="390" y1="0" x2="390" y2="46" stroke="#ffd166" stroke-width="3"/>
  <circle cx="390" cy="80" r="34" fill="#cfd6e6" stroke="#ffffff" stroke-width="3"/>
  <g fill="#8e97b5">
    <rect x="378" y="66" width="8" height="8"/>
    <rect x="394" y="72" width="8" height="8"/>
    <rect x="384" y="86" width="8" height="8"/>
    <rect x="368" y="84" width="8" height="8"/>
    <rect x="400" y="92" width="6" height="6"/>
  </g>
  <!-- disco ball shine -->
  <path d="M372 62 Q380 52 392 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="376" cy="80" r="2.5" fill="#ffffff"/>
  <!-- main mountain -->
  <polygon points="0,512 256,150 512,512" fill="#3a4a7a" stroke="#0f1330" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="226,184 256,150 286,184 270,178 256,192 242,178" fill="#f0f4ff"/>
  <!-- glow under the stage -->
  <ellipse cx="256" cy="156" rx="90" ry="26" fill="url(#glow)"/>
  <!-- peak stage -->
  <ellipse cx="256" cy="152" rx="52" ry="9" fill="#7a4fb5" stroke="#0f1330" stroke-width="3"/>
  <ellipse cx="256" cy="150" rx="36" ry="5" fill="#ff6fb5" opacity="0.7"/>
  <!-- scarecrow pole -->
  <rect x="252" y="96" width="8" height="54" fill="#8b5a2b"/>
  <!-- straw bits poking from sleeves -->
  <g stroke="#ffd166" stroke-width="2" stroke-linecap="round">
    <line x1="200" y1="98" x2="192" y2="90"/>
    <line x1="204" y1="96" x2="200" y2="86"/>
    <line x1="312" y1="98" x2="320" y2="90"/>
    <line x1="308" y1="96" x2="312" y2="86"/>
  </g>
  <!-- arms -->
  <line x1="256" y1="114" x2="206" y2="102" stroke="#e8548a" stroke-width="9" stroke-linecap="round"/>
  <line x1="256" y1="114" x2="306" y2="102" stroke="#e8548a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="202" cy="101" r="7" fill="#f5d27a"/>
  <circle cx="310" cy="101" r="7" fill="#f5d27a"/>
  <!-- flared disco pants -->
  <path d="M240 132 L272 132 L280 152 L232 152 Z" fill="#3b3b8a"/>
  <rect x="242" y="132" width="10" height="18" fill="#3b3b8a"/>
  <rect x="260" y="132" width="10" height="18" fill="#3b3b8a"/>
  <!-- body with patches -->
  <rect x="236" y="106" width="40" height="36" rx="6" fill="#e8548a"/>
  <rect x="242" y="112" width="10" height="10" rx="2" fill="#ffd166"/>
  <rect x="262" y="124" width="9" height="9" rx="2" fill="#7fe3ff"/>
  <g stroke="#0f1330" stroke-width="1.5" stroke-dasharray="3 2" fill="none">
    <path d="M236 106 L236 142"/>
    <path d="M276 106 L276 142"/>
  </g>
  <!-- head -->
  <circle cx="256" cy="88" r="16" fill="#f5d27a" stroke="#0f1330" stroke-width="2"/>
  <!-- straw hair -->
  <g stroke="#ffd166" stroke-width="2" stroke-linecap="round">
    <line x1="244" y1="78" x2="240" y2="70"/>
    <line x1="268" y1="78" x2="272" y2="70"/>
  </g>
  <!-- face -->
  <g stroke="#0f1330" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M249 86 l4 4 M253 86 l-4 4"/>
    <path d="M259 86 l4 4 M263 86 l-4 4"/>
    <path d="M249 96 Q256 101 263 96"/>
  </g>
  <!-- hat -->
  <rect x="240" y="48" width="32" height="26" fill="#c98b3c" stroke="#0f1330" stroke-width="2"/>
  <ellipse cx="256" cy="74" rx="30" ry="6" fill="#c98b3c" stroke="#0f1330" stroke-width="2"/>
  <rect x="240" y="66" width="32" height="5" fill="#ff6fb5"/>
  <!-- sparkles -->
  <g fill="#ffd166">
    <path d="M190 56 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z"/>
    <path d="M320 60 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5 -7 l-7 -2.5 l7 -2.5 z"/>
    <path d="M150 200 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
  </g>
  <g fill="#ff6fb5">
    <path d="M300 150 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
    <path d="M360 200 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5 l4.5 -1.5 z"/>
  </g>
  <!-- scarecrow shadow on stage -->
  <ellipse cx="256" cy="151" rx="26" ry="4" fill="#2a1d55" opacity="0.6"/>
  <!-- dance floor -->
  <polygon points="120,512 392,512 330,440 182,440" fill="#5a3fa0" stroke="#ffd166" stroke-width="3"/>
  <g fill="#ff6fb5" opacity="0.5">
    <polygon points="200,470 230,470 226,490 196,490"/>
    <polygon points="270,480 300,480 296,500 266,500"/>
  </g>
  <g stroke="#ffd166" stroke-width="2" opacity="0.8">
    <line x1="156" y1="512" x2="194" y2="440"/>
    <line x1="256" y1="512" x2="256" y2="440"/>
    <line x1="356" y1="512" x2="318" y2="440"/>
    <line x1="182" y1="476" x2="330" y2="476"/>
  </g>
  <!-- snow -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="70" cy="420" r="3"/>
    <circle cx="130" cy="380" r="2.5"/>
    <circle cx="440" cy="400" r="3"/>
    <circle cx="470" cy="470" r="2.5"/>
    <circle cx="30" cy="490" r="2.5"/>
    <circle cx="380" cy="300" r="2"/>
    <circle cx="150" cy="270" r="2"/>
  </g>
</svg>
