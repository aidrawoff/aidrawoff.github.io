<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140b1e"/>
      <stop offset="50%" stop-color="#32142a"/>
      <stop offset="100%" stop-color="#8a3320"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#25252f"/>
      <stop offset="100%" stop-color="#101015"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3838"/>
      <stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>
    <linearGradient id="squirrel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="512" height="220" fill="url(#sky)"/>

  <!-- City Skyline with Detailed Neon Windows & Spire -->
  <path d="M0,220 L0,120 L30,120 L30,100 L70,100 L70,220 L110,220 L110,70 L150,70 L150,220 L200,220 L200,50 L240,50 L240,220 L290,220 L290,90 L330,90 L330,220 L390,220 L390,60 L430,60 L430,220 L480,220 L480,110 L512,110 L512,220 Z" fill="#0d0712" opacity="0.95"/>
  <!-- Spire on tallest building -->
  <polygon points="220,50 220,25 222,25 222,50" fill="#e74c3c" filter="url(#glow)"/>

  <!-- Neon building windows / chaotic city lights -->
  <rect x="80" y="115" width="8" height="12" fill="#00d2d3" opacity="0.9"/>
  <rect x="95" y="130" width="8" height="12" fill="#f1c40f" opacity="0.9"/>
  <rect x="120" y="85" width="10" height="15" fill="#ff9ff3" opacity="0.9"/>
  <rect x="135" y="110" width="8" height="12" fill="#f1c40f" opacity="0.9"/>
  <rect x="210" y="65" width="10" height="15" fill="#00d2d3" opacity="0.9"/>
  <rect x="225" y="90" width="8" height="12" fill="#ff6b6b" opacity="0.9"/>
  <rect x="305" y="105" width="8" height="12" fill="#f1c40f" opacity="0.9"/>
  <rect x="400" y="75" width="12" height="15" fill="#ff9ff3" opacity="0.9"/>
  <rect x="445" y="130" width="10" height="15" fill="#00d2d3" opacity="0.9"/>

  <!-- Chaos smog / pollution clouds & sirens -->
  <circle cx="110" cy="90" r="35" fill="#e74c3c" opacity="0.25" filter="url(#glow)"/>
  <circle cx="350" cy="70" r="45" fill="#f39c12" opacity="0.3" filter="url(#glow)"/>
  <circle cx="450" cy="100" r="30" fill="#9b59b6" opacity="0.3" filter="url(#glow)"/>

  <!-- Road / Highway Gridlock -->
  <path d="M0,220 L512,220 L512,512 L0,512 Z" fill="url(#road)"/>
  
  <!-- Perspective Road Lanes -->
  <path d="M256,220 L100,512" stroke="#f1c40f" stroke-width="5" stroke-dasharray="24,16" opacity="0.9"/>
  <path d="M256,220 L412,512" stroke="#f1c40f" stroke-width="5" stroke-dasharray="24,16" opacity="0.9"/>
  <path d="M256,220 L256,512" stroke="#ffffff" stroke-width="7" stroke-dasharray="35,22" opacity="0.85"/>

  <!-- Background Cars & Jammed Traffic Details -->
  <!-- Left Lane Truck -->
  <rect x="35" y="245" width="100" height="65" rx="14" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="50" cy="277" r="9" fill="#ff3333" filter="url(#glow)"/>
  <circle cx="120" cy="277" r="9" fill="#ff3333" filter="url(#glow)"/>
  <text x="52" y="268" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fff">EXPRESS</text>

  <!-- Right Lane Taxi / Car -->
  <rect x="375" y="265" width="105" height="65" rx="14" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
  <circle cx="390" cy="297" r="9" fill="#ff3333" filter="url(#glow)"/>
  <circle cx="465" cy="297" r="9" fill="#ff3333" filter="url(#glow)"/>
  <rect x="405" y="250" width="45" height="16" rx="4" fill="#111"/>

  <!-- More distant chaotic vehicles & glowing lights -->
  <rect x="175" y="225" width="60" height="34" rx="8" fill="#9b59b6"/>
  <circle cx="185" cy="245" r="6" fill="#ff3333" filter="url(#glow)"/>
  <circle cx="225" cy="245" r="6" fill="#ff3333" filter="url(#glow)"/>

  <rect x="280" y="230" width="65" height="36" rx="8" fill="#e67e22"/>
  <circle cx="292" cy="252" r="6" fill="#ff3333" filter="url(#glow)"/>
  <circle cx="333" cy="252" r="6" fill="#ff3333" filter="url(#glow)"/>

  <!-- Police / Ambulance flashing light on top of jam -->
  <circle cx="256" cy="220" r="16" fill="#3498db" filter="url(#glow)" opacity="0.95"/>
  <circle cx="256" cy="220" r="7" fill="#ffffff"/>

  <!-- Chaos Text Bubbles & Exclamations -->
  <text x="70" y="235" font-family="sans-serif" font-weight="900" font-size="28" fill="#f1c40f" transform="rotate(-12, 70, 235)">HONK!!</text>
  <text x="390" y="245" font-family="sans-serif" font-weight="900" font-size="32" fill="#e74c3c" transform="rotate(12, 390, 245)">BEEP!</text>
  <text x="285" y="205" font-family="sans-serif" font-weight="900" font-size="36" fill="#ff4757">#@!$%</text>
  <text x="135" y="290" font-family="sans-serif" font-weight="900" font-size="22" fill="#00d2d3">MOVE!</text>

  <!-- HERO CAR (Foreground Center) -->
  <g transform="translate(170, 310)">
    <!-- Car shadow -->
    <ellipse cx="85" cy="165" rx="85" ry="22" fill="#000000" opacity="0.75"/>

    <!-- Wheels with motion blur / rims -->
    <rect x="20" y="135" width="30" height="40" rx="10" fill="#111"/>
    <circle cx="35" cy="155" r="8" fill="#555"/>
    <rect x="120" y="135" width="30" height="40" rx="10" fill="#111"/>
    <circle cx="135" cy="155" r="8" fill="#555"/>
    
    <!-- Car Body (Sporty Nut-Mobile) -->
    <path d="M12,95 Q12,55 45,55 L125,55 Q158,55 158,95 L165,140 Q165,155 140,155 L30,155 Q5,155 12,140 Z" fill="url(#carBody)" stroke="#c0392b" stroke-width="3"/>
    
    <!-- Side Door Line & Detail -->
    <path d="M30,110 L140,110" stroke="#b21f1f" stroke-width="3" stroke-linecap="round"/>
    <rect x="70" y="102" width="25" height="8" rx="4" fill="#d63031"/>

    <!-- Windshield -->
    <path d="M42,55 L52,20 L118,20 L128,55 Z" fill="#74b9ff" opacity="0.75"/>
    <path d="M42,55 L52,20 L118,20 L128,55 Z" fill="none" stroke="#dfe6e9" stroke-width="3"/>
    <!-- Windshield wiper frantic -->
    <path d="M85,50 L65,28" stroke="#2d3436" stroke-width="4" stroke-linecap="round"/>

    <!-- Headlights (Super bright glowing) -->
    <circle cx="22" cy="110" r="12" fill="#fff200" filter="url(#glow)"/>
    <circle cx="22" cy="110" r="6" fill="#ffffff"/>
    <circle cx="148" cy="110" r="12" fill="#fff200" filter="url(#glow)"/>
    <circle cx="148" cy="110" r="6" fill="#ffffff"/>

    <!-- Radiator Grill -->
    <rect x="65" y="125" width="40" height="18" rx="6" fill="#2d3436"/>
    <line x1="75" y1="125" x2="75" y2="143" stroke="#fff" stroke-width="2"/>
    <line x1="85" y1="125" x2="85" y2="143" stroke="#fff" stroke-width="2"/>
    <line x1="95" y1="125" x2="95" y2="143" stroke="#fff" stroke-width="2"/>

    <!-- HERO SQUIRREL DRIVER (More expressive & frantic!) -->
    <g transform="translate(52, -15)">
      <!-- Giant Bushy Fluffy Tail waving frantically in background -->
      <path d="M 45,55 C 80,35 105,-15 70,-45 C 35,-65 5,-40 18,-15 C 22,-5 10,25 45,55 Z" fill="#e67e22" stroke="#b94e00" stroke-width="3"/>
      <path d="M 50,40 C 75,25 90,-5 60,-25 C 35,-35 20,-20 28,0 Z" fill="#f39c12"/>

      <!-- Body / Torso in driver seat -->
      <ellipse cx="38" cy="58" rx="24" ry="26" fill="url(#squirrel)"/>
      <ellipse cx="38" cy="62" rx="14" ry="17" fill="#ffeaa7"/>

      <!-- Head -->
      <circle cx="38" cy="16" r="23" fill="url(#squirrel)" stroke="#b94e00" stroke-width="2.5"/>
      
      <!-- Big Alert Ears -->
      <circle cx="21" cy="-4" r="9" fill="url(#squirrel)" stroke="#b94e00" stroke-width="2"/>
      <circle cx="21" cy="-4" r="5" fill="#ff7675"/>
      <circle cx="55" cy="-4" r="9" fill="url(#squirrel)" stroke="#b94e00" stroke-width="2"/>
      <circle cx="55" cy="-4" r="5" fill="#ff7675"/>

      <!-- Cheeks -->
      <circle cx="28" cy="21" r="6" fill="#ffeaa7"/>
      <circle cx="48" cy="21" r="6" fill="#ffeaa7"/>

      <!-- Eyes (Wide, bulging, frantic terror!) -->
      <circle cx="28" cy="13" r="6" fill="#ffffff" stroke="#2d3436" stroke-width="2"/>
      <circle cx="29" cy="13" r="2.5" fill="#2d3436"/>
      <circle cx="48" cy="13" r="6" fill="#ffffff" stroke="#2d3436" stroke-width="2"/>
      <circle cx="47" cy="13" r="2.5" fill="#2d3436"/>

      <!-- Eyebrows (Worried / Angry slant) -->
      <line x1="22" y1="5" x2="33" y2="9" stroke="#2d3436" stroke-width="3" stroke-linecap="round"/>
      <line x1="54" y1="5" x2="43" y2="9" stroke="#2d3436" stroke-width="3" stroke-linecap="round"/>

      <!-- Nose and Screaming Mouth -->
      <ellipse cx="38" cy="20" rx="3" ry="2" fill="#2d3436"/>
      <path d="M 32,27 Q 38,38 44,27 Z" fill="#2d3436"/>
      <!-- Little white teeth / panic breath -->
      <rect x="35" y="27" width="6" height="3" fill="#fff"/>

      <!-- Paws gripping steering wheel in panic -->
      <circle cx="16" cy="35" r="8" fill="url(#squirrel)" stroke="#b94e00" stroke-width="2"/>
      <circle cx="60" cy="35" r="8" fill="url(#squirrel)" stroke="#b94e00" stroke-width="2"/>
    </g>

    <!-- Steering Wheel -->
    <ellipse cx="85" cy="55" rx="18" ry="12" fill="none" stroke="#2d3436" stroke-width="6"/>
    <line x1="85" y1="67" x2="85" y2="55" stroke="#2d3436" stroke-width="5"/>
  </g>

  <!-- Flying Chaos Debris & Acorns in the Air -->
  <g transform="translate(0, 0)">
    <circle cx="115" cy="365" r="6" fill="#d35400" stroke="#78281f" stroke-width="2"/>
    <path d="M115,357 L115,353" stroke="#78281f" stroke-width="2"/>
    
    <circle cx="395" cy="345" r="7" fill="#d35400" stroke="#78281f" stroke-width="2"/>
    <path d="M395,336 L395,332" stroke="#78281f" stroke-width="2"/>

    <!-- Sparks & Speed lines -->
    <line x1="95" y1="385" x2="125" y2="375" stroke="#f1c40f" stroke-width="4" stroke-linecap="round"/>
    <line x1="395" y1="375" x2="425" y2="365" stroke="#f1c40f" stroke-width="4" stroke-linecap="round"/>
    <line x1="220" y1="310" x2="200" y2="290" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
