  <path d="M148 306q108 30 216 0l4 12q-112 30-224 0z" fill="#5e3a17"/>
  <!-- ghost rising, wavy tail hem -->
  <path d="M256 96c60 0 96 52 96 122 0 54 12 84 26 104-16 10-32-6-44 8-14-14-28 8-44-6-16 14-30-8-46 6-14-14-30 6-44-8-12 14-28-2-44-8 14-20 26-50 26-104 0-70 36-122 96-122z" fill="url(#sheet)" stroke="#8fa6c8" stroke-width="3"/>
  <!-- face: huge surprised mouth, squeezed eyes -->
  <ellipse cx="222" cy="196" rx="17" ry="9" fill="#2b3552"/>
  <ellipse cx="290" cy="196" rx="17" ry="9" fill="#2b3552"/>
  <ellipse cx="256" cy="240" rx="26" ry="32" fill="#2b3552"/>
  <ellipse cx="256" cy="252" rx="12" ry="14" fill="#e0607a"/>
  <circle cx="204" cy="228" r="12" fill="#ffb3c8" opacity=".7"/>
  <circle cx="308" cy="228" r="12" fill="#ffb3c8" opacity=".7"/>
