<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#2b3552"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#bff4ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#bff4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ea"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#wall)"/>
  <rect y="404" width="512" height="108" fill="#171c2c"/>
  <ellipse cx="256" cy="470" rx="180" ry="26" fill="#0e1220"/>
  <circle cx="256" cy="270" r="200" fill="url(#glow)"/>
