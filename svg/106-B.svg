  <path d="M120 452q40-34 96-20t120 6q40 10 56 30H96z" fill="#7f5fb8"/>
  <ellipse cx="150" cy="462" rx="46" ry="20" fill="#e8724f"/>
  <ellipse cx="360" cy="466" rx="52" ry="18" fill="#f2c14e"/>
