  <path d="M168 210q-46-30-58-74" stroke="url(#sheet)" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M344 210q46-30 58-74" stroke="url(#sheet)" stroke-width="26" fill="none" stroke-linecap="round"/>
