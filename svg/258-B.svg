<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4a3228"/>
      <stop offset="60%" stop-color="#221814"/>
      <stop offset="100%" stop-color="#120c0a"/>
    </radialGradient>
    <linearGradient id="mug" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="50%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#b71540"/>
    </linearGradient>
    <linearGradient id="porc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="50%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#873600"/>
    </linearGradient>
    <linearGradient id="table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1e18"/>
      <stop offset="100%" stop-color="#0d0908"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Table surface with wood texture highlight -->
  <path d="M0 395 Q256 375 512 395 L512 512 L0 512 Z" fill="url(#table)"/>
  <ellipse cx="256" cy="400" rx="210" ry="22" fill="#1b120f" opacity="0.9"/>
  <ellipse cx="256" cy="400" rx="180" ry="14" fill="#32221b" opacity="0.4"/>

  <!-- Ambient Steam Glow -->
  <circle cx="256" cy="170" r="80" fill="#ffd32a" opacity="0.06" filter="url(#glow)"/>

  <!-- Steamy Wisps with gradient opacity -->
  <path d="M210 180 Q190 130 220 90 T205 40" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="7" stroke-linecap="round"/>
  <path d="M302 180 Q322 130 292 90 T307 40" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 195 Q268 140 250 95 T260 45" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="5" stroke-linecap="round"/>

  <!-- Saucer -->
  <ellipse cx="256" cy="385" rx="116" ry="22" fill="#b2bec3"/>
  <ellipse cx="256" cy="381" rx="98" ry="16" href="#" fill="#dfe6e9"/>
  <ellipse cx="256" cy="378" rx="84" ry="12" fill="#f5f6fa"/>

  <!-- Mug shadow -->
  <ellipse cx="256" cy="375" rx="76" ry="10" fill="rgba(0,0,0,0.45)"/>

  <!-- Mug Body -->
  <path d="M180 220 H332 L316 375 H196 Z" fill="url(#mug)"/>
  <!-- Mug Rim -->
  <ellipse cx="256" cy="220" rx="76" ry="14" fill="#ff6b6b"/>
  <ellipse cx="256" cy="217" rx="76" ry="12" fill="#ff9ff3"/>
  <!-- Mug Inner (Coffee/Cocoa) -->
  <ellipse cx="256" cy="217" rx="66" ry="8" fill="#3d2314"/>
  <ellipse cx="256" cy="217" rx="60" ry="6" fill="#4a2c16"/>

  <!-- Mug Handle -->
  <path d="M324 240 C375 240 375 335 324 335" fill="none" stroke="url(#mug)" stroke-width="22" stroke-linecap="round"/>
  <path d="M324 246 C358 246 358 329 324 329" fill="none" stroke="#ff7675" stroke-width="8" stroke-linecap="round"/>

  <!-- Mug Glossy Highlight -->
  <path d="M194 240 L202 355" stroke="rgba(255,255,255,0.3)" stroke-width="6" stroke-linecap="round"/>

  <!-- Heart on Mug with Glow -->
  <path d="M256 300 C240 280 215 295 230 320 L256 345 L282 320 C297 295 272 280 256 300 Z" fill="#ffffff" opacity="0.95" filter="url(#glow)"/>

  <!-- Porcupine Body & Layered Quills -->
  <g>
    <!-- Background Quills (Radial cluster) -->
    <g stroke="#6e2c00" stroke-width="11" stroke-linecap="round">
      <line x1="256" y1="285" x2="135" y2="200"/>
      <line x1="256" y1="285" x2="90" y2="250"/>
      <line x1="256" y1="285" x2="70" y2="310"/>
      <line x1="256" y1="285" x2="80" y2="375"/>
      <line x1="256" y1="285" x2="120" y2="430"/>
      <line x1="256" y1="285" x2="377" y2="200"/>
      <line x1="256" y1="285" x2="422" y2="250"/>
      <line x1="256" y1="285" x2="442" y2="310"/>
      <line x1="256" y1="285" x2="432" y2="375"/>
      <line x1="256" y1="285" x2="392" y2="430"/>
    </g>
    
    <!-- Secondary Quill golden highlights -->
    <g stroke="#f39c12" stroke-width="4" stroke-linecap="round">
      <line x1="256" y1="285" x2="137" y2="202"/>
      <line x1="256" y1="285" x2="92" y2="252"/>
      <line x1="256" y1="285" x2="72" y2="312"/>
      <line x1="256" y1="285" x2="375" y2="202"/>
      <line x1="256" y1="285" x2="420" y2="252"/>
      <line x1="256" y1="285" x2="440" y2="312"/>
    </g>

    <!-- Porcupine Main Body Circle -->
    <circle cx="256" cy="295" r="94" fill="url(#porc)" stroke="#512e5f" stroke-width="0"/>
    <circle cx="256" cy="295" r="92" fill="url(#porc)" stroke="#6e2c00" stroke-width="4"/>

    <!-- Face Patch -->
    <ellipse cx="256" cy="308" rx="56" ry="45" fill="#f39c12"/>
    <ellipse cx="256" cy="314" rx="48" ry="38" fill="#f5b041"/>

    <!-- Eyes (sparkling anime style) -->
    <circle cx="233" cy="298" r="7.5" fill="#2d221e"/>
    <circle cx="231" cy="296" r="2.5" fill="#ffffff"/>
    <circle cx="279" cy="298" r="7.5" fill="#2d221e"/>
    <circle cx="277" cy="296" r="2.5" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="222" cy="315" rx="9" ry="6" fill="#ff6b6b" opacity="0.7"/>
    <ellipse cx="290" cy="315" rx="9" ry="6" fill="#ff6b6b" opacity="0.7"/>

    <!-- Cute Nose & Mouth -->
    <ellipse cx="256" cy="318" rx="12" ry="8.5" fill="#2d221e"/>
    <ellipse cx="253" cy="316" rx="3.5" ry="2" fill="#ffffff" opacity="0.7"/>
    <path d="M244 328 Q256 340 268 328" fill="none" stroke="#2d221e" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Paws Hugging the Mug -->
    <g fill="#d35400" stroke="#6e2c00" stroke-width="3">
      <ellipse cx="210" cy="338" rx="21" ry="15" transform="rotate(-15 210 338)"/>
      <ellipse cx="302" cy="338" rx="21" ry="15" transform="rotate(15 302 338)"/>
    </g>
    <!-- Little paw claws -->
    <path d="M195 336 L191 341 M201 343 L199 349 M317 336 L321 341 M311 343 L313 349" stroke="#6e2c00" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Sparkles & Heartlets -->
  <path d="M150 150 L153 158 L161 161 L153 164 L150 172 L147 164 L139 161 L147 158 Z" fill="#f1c40f" opacity="0.9"/>
  <path d="M360 130 L363 138 L371 141 L363 144 L360 152 L357 144 L349 141 L357 138 Z" fill="#f1c40f" opacity="0.95"/>
  <path d="M330 90 L332 95 L337 97 L332 99 L330 104 L328 99 L323 97 L328 95 Z" fill="#f1c40f" opacity="0.8"/>
  <circle cx="180" cy="200" r="3" fill="#ff9ff3" opacity="0.8"/>
  <circle cx="340" cy="190" r="4" fill="#ff9ff3" opacity="0.8"/>

</svg>
