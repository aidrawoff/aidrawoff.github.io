<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1016"/>
      <stop offset="100%" stop-color="#2c1f36"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5229"/>
      <stop offset="100%" stop-color="#4a2811"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8c5830"/>
      <stop offset="100%" stop-color="#3d2211"/>
    </linearGradient>
  </defs>

  <!-- Background Room & Window -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Window with Moonlight & Stars -->
  <circle cx="256" cy="110" r="70" fill="#1d263b" stroke="#4a5568" stroke-width="6"/>
  <circle cx="230" cy="90" r="3" fill="#fff"/>
  <circle cx="280" cy="120" r="2" fill="#fff"/>
  <circle cx="260" cy="70" r="2.5" fill="#fff"/>
  <path d="M 230 110 Q 256 90 282 110 Q 256 140 230 110 Z" fill="#90cdf4" opacity="0.3"/>

  <!-- Shelf on back wall -->
  <rect x="80" y="190" width="352" height="12" rx="3" fill="#2d1b11"/>
  <!-- Teacups on shelf -->
  <ellipse cx="120" cy="182" rx="10" ry="6" fill="#e2e8f0"/>
  <rect x="112" y="172" width="16" height="12" rx="3" fill="#cbd5e0"/>
  <ellipse cx="392" cy="182" rx="10" ry="6" fill="#e2e8f0"/>
  <rect x="384" y="172" width="16" height="12" rx="3" fill="#cbd5e0"/>

  <!-- Floor shadow -->
  <ellipse cx="256" cy="440" rx="220" ry="60" fill="#110d14" opacity="0.9"/>

  <!-- Wooden Table Front -->
  <rect x="96" y="330" width="320" height="130" rx="12" fill="url(#wood)"/>
  <rect x="96" y="330" width="320" height="15" fill="#a06131" opacity="0.6"/>

  <!-- Table Top Surface -->
  <path d="M 96 330 L 116 300 L 396 300 L 416 330 Z" fill="#a06131"/>
  <path d="M 126 310 L 386 310 L 396 330 L 96 330 Z" fill="#8a5229"/>

  <!-- Spilled Tea Pool & Splatters on Table Top -->
  <ellipse cx="280" cy="318" rx="55" ry="14" fill="#b45309" opacity="0.85"/>
  <ellipse cx="280" cy="318" rx="42" ry="10" fill="#d97706" opacity="0.95"/>
  <circle cx="330" cy="315" r="4" fill="#d97706"/>
  <circle cx="225" cy="322" r="5" fill="#d97706"/>

  <!-- Knocked over Teapot on table top -->
  <g transform="translate(290, 312) rotate(25)">
    <rect x="-18" y="-25" width="36" height="42" rx="10" fill="#f8fafc"/>
    <polygon points="18,-6 32,-16 32,4" fill="#e2e8f0"/>
    <path d="M -18 -6 Q -30 -3 -24 10" stroke="#cbd5e0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="-7" y="-31" width="14" height="7" rx="2" fill="#cbd5e0"/>
  </g>

  <!-- Steam wisps -->
  <path d="M 280 290 Q 290 260 270 230 Q 250 200 270 170" stroke="#fff" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 310 295 Q 325 265 305 235 Q 295 220 315 195" stroke="#fff" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Werewolf Body / Fur Coat -->
  <path d="M 186 350 Q 200 270 256 270 Q 312 270 326 350 Z" fill="url(#fur)"/>
  <!-- Collar / Bow -->
  <polygon points="236,275 276,275 256,295" fill="#ef4444"/>
  <circle cx="256" cy="285" r="8" fill="#b91c1c"/>

  <!-- Werewolf Head -->
  <circle cx="256" cy="190" r="85" fill="url(#fur)"/>
  
  <!-- Shaggy tufts on cheeks -->
  <path d="M 175 190 Q 165 210 185 220 Z" fill="#5c381f"/>
  <path d="M 337 190 Q 347 210 327 220 Z" fill="#5c381f"/>
  <path d="M 190 230 Q 175 250 200 255 Z" fill="#5c381f"/>
  <path d="M 322 230 Q 337 250 312 255 Z" fill="#5c381f"/>

  <!-- Pointy Wolf Ears with inner pink -->
  <polygon points="180,135 150,60 210,105" fill="url(#fur)"/>
  <polygon points="185,125 165,80 205,105" fill="#fda4af"/>
  <polygon points="332,135 362,60 302,105" fill="url(#fur)"/>
  <polygon points="327,125 347,80 307,105" fill="#fda4af"/>

  <!-- Snout Area -->
  <ellipse cx="256" cy="215" rx="48" ry="36" fill="#4a2a16"/>
  <!-- Black Nose -->
  <path d="M 236 195 Q 256 185 276 195 Q 270 215 256 215 Q 242 215 236 195 Z" fill="#0f0f0f"/>
  <!-- Mouth open in shock/oops expression with little fangs -->
  <path d="M 236 230 Q 256 250 276 230 Z" fill="#1a0a05"/>
  <polygon points="242,230 248,242 250,230" fill="#fff"/>
  <polygon points="270,230 264,242 262,230" fill="#fff"/>

  <!-- Big Surprised Eyes -->
  <g>
    <!-- Left Eye -->
    <circle cx="220" cy="165" r="18" fill="#fff" stroke="#1f1108" stroke-width="3"/>
    <circle cx="222" cy="165" r="8" fill="#1e1b4b"/>
    <circle cx="225" cy="162" r="3" fill="#fff"/>
    <!-- Right Eye -->
    <circle cx="292" cy="165" r="18" fill="#fff" stroke="#1f1108" stroke-width="3"/>
    <circle cx="290" cy="165" r="8" fill="#1e1b4b"/>
    <circle cx="287" cy="162" r="3" fill="#fff"/>
    <!-- Worried Eyebrows -->
    <path d="M 200 142 Q 220 130 240 145" stroke="#3a2012" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 312 142 Q 292 130 272 145" stroke="#3a2012" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Clumsy Paws on Table Edge -->
  <g>
    <!-- Left Paw (flailing/slipping) -->
    <circle cx="160" cy="310" r="26" fill="url(#fur)" stroke="#3a2012" stroke-width="3"/>
    <circle cx="147" cy="306" r="7" fill="#2d170c"/>
    <circle cx="160" cy="296" r="7" fill="#2d170c"/>
    <circle cx="173" cy="306" r="7" fill="#2d170c"/>
    
    <!-- Right Paw (knocking teapot) -->
    <circle cx="340" cy="310" r="26" fill="url(#fur)" stroke="#3a2012" stroke-width="3"/>
    <circle cx="327" cy="306" r="7" fill="#2d170c"/>
    <circle cx="340" cy="296" r="7" fill="#2d170c"/>
    <circle cx="353" cy="306" r="7" fill="#2d170c"/>
  </g>

  <!-- Floating tea cup in mid-air -->
  <g transform="translate(150, 240) rotate(-25)">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#fed7aa"/>
    <path d="M -12 0 L -8 20 Q 0 26 8 20 L 12 0 Z" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 11 5 Q 20 8 12 18" stroke="#fff" stroke-width="3" fill="none"/>
    <ellipse cx="0" cy="3" rx="10" ry="6" fill="#d97706"/>
  </g>

  <!-- Flying Biscuit -->
  <g transform="translate(360, 250) rotate(15)">
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="#d97706"/>
    <ellipse cx="-3" cy="-2" rx="3" ry="2" fill="#92400e" opacity="0.6"/>
    <ellipse cx="4" cy="2" rx="2.5" ry="1.5" fill="#92400e" opacity="0.6"/>
  </g>
</svg>
