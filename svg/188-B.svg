<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7b54"/>
      <stop offset="40%" stop-color="#ffb26b"/>
      <stop offset="100%" stop-color="#ffe599"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4534"/>
      <stop offset="100%" stop-color="#2c1e14"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sunset Sky -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="380" cy="110" r="55" fill="#fffbe6" opacity="0.9" filter="url(#glow)"/>

  <!-- Distant Hills -->
  <path d="M0 340 Q 120 280, 260 330 T 512 300 L 512 512 L 0 512 Z" fill="#6b4c3b" opacity="0.7"/>
  <path d="M0 370 Q 180 320, 360 360 T 512 340 L 512 512 L 0 512 Z" fill="url(#ground)"/>

  <!-- Ground Wildflowers & Grass Tuft -->
  <g fill="#f4c430">
    <circle cx="80" cy="420" r="5"/><circle cx="95" cy="435" r="4"/><circle cx="120" cy="410" r="6"/>
    <circle cx="400" cy="430" r="5"/><circle cx="425" cy="415" r="6"/><circle cx="440" cy="440" r="4"/>
  </g>
  <path d="M 70 420 Q 75 400, 80 420" fill="none" stroke="#557a46" stroke-width="3"/>
  <path d="M 430 430 Q 435 410, 440 430" fill="none" stroke="#557a46" stroke-width="3"/>

  <!-- Cute Park Bench -->
  <rect x="130" y="330" width="252" height="14" rx="7" fill="#8b5a2b" filter="url(#shadow)"/>
  <rect x="150" y="344" width="16" height="85" fill="#5c3a21"/>
  <rect x="346" y="344" width="16" height="85" fill="#5c3a21"/>
  <rect x="130" y="312" width="252" height="10" rx="5" fill="#a06c3a"/>

  <!-- Teacup on bench -->
  <g transform="translate(160, 295)">
    <rect x="0" y="5" width="20" height="15" rx="3" fill="#fdf6e2"/>
    <path d="M 20 8 Q 26 8, 26 13 Q 26 18, 20 18" fill="none" stroke="#fdf6e2" stroke-width="3"/>
    <path d="M 5 3 Q 10 -2, 15 3" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Scarecrow Date Character -->
  <g transform="translate(256, 275)" filter="url(#shadow)">
    <!-- Wooden stake / post -->
    <rect x="-8" y="-60" width="16" height="185" fill="#654321"/>
    
    <!-- Tweed Jacket with Lapels -->
    <path d="M -48 -25 L 48 -25 L 58 65 L -58 65 Z" fill="#705335"/>
    <path d="M -48 -25 L 0 12 L 48 -25 Z" fill="#5a3d20"/>
    <path d="M -15 12 L 0 45 L 15 12 Z" fill="#fdf6e2"/> <!-- Shirt collar & tie -->
    <polygon points="0,25 -5,42 5,42" fill="#d9534f"/> <!-- Red bow tie -->

    <!-- Cute Patch on Jacket -->
    <rect x="-32" y="15" width="22" height="20" rx="4" fill="#d97736" transform="rotate(-12 -21 25)"/>
    <line x1="-32" y1="15" x2="-10" y2="35" stroke="#332211" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Head (Burlap Sack) -->
    <rect x="-38" y="-110" width="76" height="80" rx="24" fill="#c49a65" stroke="#8c6239" stroke-width="4"/>
    <path d="M -16 -110 C -5 -122, 5 -122, 16 -110" fill="none" stroke="#5c3a21" stroke-width="4" stroke-linecap="round"/>

    <!-- Asymmetric Expressive Eyes -->
    <circle cx="-14" cy="-78" r="9" fill="#2c1e14"/>
    <circle cx="-16" cy="-80" r="3.5" fill="#fff"/>
    <circle cx="16" cy="-74" r="7" fill="#2c1e14"/>
    <circle cx="14" cy="-76" r="2.5" fill="#fff"/>

    <!-- Eyebrows (Tilted, eager) -->
    <path d="M -24 -94 Q -14 -102, -3 -88" fill="none" stroke="#2c1e14" stroke-width="3" stroke-linecap="round"/>
    <path d="M 7 -86 Q 17 -95, 27 -82" fill="none" stroke="#2c1e14" stroke-width="3" stroke-linecap="round"/>

    <!-- Shy Blushing Cheeks -->
    <circle cx="-25" cy="-62" r="7" fill="#ff7b7b" opacity="0.6"/>
    <circle cx="26" cy="-58" r="7" fill="#ff7b7b" opacity="0.6"/>

    <!-- Shy Smile (Stitched) -->
    <path d="M -16 -56 Q 0 -38, 18 -52" fill="none" stroke="#2c1e14" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-16" y1="-60" x2="-16" y2="-52" stroke="#2c1e14" stroke-width="2.5"/>
    <line x1="0" y1="-44" x2="0" y2="-37" stroke="#2c1e14" stroke-width="2.5"/>
    <line x1="16" y1="-51" x2="16" y2="-57" stroke="#2c1e14" stroke-width="2.5"/>

    <!-- Straw Hat -->
    <ellipse cx="0" cy="-118" rx="60" ry="13" fill="#e0c085" stroke="#b08d4f" stroke-width="3"/>
    <path d="M -32 -118 C -26 -152, 26 -152, 32 -118 Z" fill="#e0c085" stroke="#b08d4f" stroke-width="3"/>
    <rect x="-33" y="-125" width="66" height="9" fill="#d9534f" rx="3"/>

    <!-- Holding Sunflower Bouquet -->
    <g transform="translate(52, 12) rotate(18)">
      <line x1="0" y1="0" x2="25" y2="-65" stroke="#557a46" stroke-width="6"/>
      <line x1="10" y1="-10" x2="35" y2="-60" stroke="#557a46" stroke-width="4"/>
      <circle cx="25" cy="-70" r="16" fill="#654321"/>
      <g fill="#f4c430">
        <circle cx="25" cy="-94" r="10"/><circle cx="47" cy="-70" r="10"/><circle cx="3" cy="-70" r="10"/><circle cx="25" cy="-46" r="10"/>
        <circle cx="9" cy="-86" r="10"/><circle cx="41" cy="-86" r="10"/><circle cx="9" cy="-54" r="10"/><circle cx="41" cy="-54" r="10"/>
      </g>
      <circle cx="25" cy="-70" r="12" fill="#795548"/>
    </g>
  </g>

  <!-- Floating Hearts & Fireflies -->
  <path d="M 210 130 Q 220 115, 230 130 T 230 150 Q 220 165, 210 150 Z" fill="#ff4757" opacity="0.9" filter="url(#glow)"/>
  <circle cx="100" cy="200" r="3" fill="#fff68f" filter="url(#glow)"/>
  <circle cx="420" cy="220" r="3.5" fill="#fff68f" filter="url(#glow)"/>
  <circle cx="370" cy="280" r="2.5" fill="#fff68f" filter="url(#glow)"/>
</svg>
