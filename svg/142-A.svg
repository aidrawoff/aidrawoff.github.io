<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060e"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Ghost Glow & Lighting -->
    <radialGradient id="ghostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ghostBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="ghostShade" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Night Sky Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Distant Nebula / Glow -->
  <circle cx="256" cy="240" r="210" fill="url(#ghostGlow)"/>

  <!-- Twinkling Stars & Particles -->
  <g fill="#93c5fd">
    <circle cx="80" cy="100" r="2" opacity="0.8"/>
    <circle cx="140" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="430" cy="90" r="2.5" opacity="0.9"/>
    <circle cx="450" cy="320" r="1.5" opacity="0.5"/>
    <circle cx="70" cy="400" r="2" opacity="0.7"/>
    <circle cx="200" cy="450" r="1" opacity="0.4"/>
    <circle cx="340" cy="80" r="2" opacity="0.8"/>
    <circle cx="110" cy="180" r="1.5" opacity="0.7"/>
    <!-- Star sparkles -->
    <path d="M 420 180 L 423 186 L 429 189 L 423 192 L 420 198 L 417 192 L 411 189 L 417 186 Z" fill="#bae6fd" opacity="0.8"/>
    <path d="M 110 240 L 112 244 L 116 246 L 112 248 L 110 252 L 108 248 L 104 246 L 108 244 Z" fill="#bae6fd" opacity="0.6"/>
    <path d="M 320 380 L 322 384 L 326 386 L 322 388 L 320 392 L 318 388 L 314 386 L 318 384 Z" fill="#7dd3fc" opacity="0.7"/>
  </g>

  <!-- Atmospheric Floor Mist & Ground Waves -->
  <ellipse cx="256" cy="460" rx="200" ry="28" fill="#38bdf8" opacity="0.18" filter="url(#glow)"/>
  <ellipse cx="256" cy="472" rx="140" ry="16" fill="#7dd3fc" opacity="0.22"/>
  <path d="M 80 470 Q 200 490 320 470 T 520 475" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Ghost Character -->
  <g filter="url(#glow)">
    <!-- Wavy Spectral Tail / Skirt -->
    <path d="M 160 340 
             Q 185 395 210 345 
             T 260 345 
             T 310 345 
             T 360 340 
             L 368 220 
             Q 368 130 256 130 
             Q 144 130 144 220 
             Z" 
          fill="url(#ghostBody)" opacity="0.97"/>

    <!-- Inner Shading & Highlights -->
    <path d="M 170 210 Q 170 150 256 150 Q 320 150 345 200 Q 330 160 256 160 Q 180 160 170 210 Z" fill="url(#ghostShade)" opacity="0.7"/>

    <!-- Concentrated Eyes (tight curves showing extreme focus) -->
    <g stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none">
      <!-- Left Eye squinted -->
      <path d="M 214 188 Q 224 174 234 188"/>
      <!-- Right Eye squinted -->
      <path d="M 278 188 Q 288 174 298 188"/>
      <!-- Eyebrows of intense concentration -->
      <path d="M 210 175 Q 224 166 238 175" stroke-width="3.5"/>
      <path d="M 274 175 Q 288 166 302 175" stroke-width="3.5"/>
    </g>

    <!-- Puffed Cheeks with extra rosy/magical glow -->
    <circle cx="228" cy="216" r="15" fill="#38bdf8" opacity="0.45"/>
    <circle cx="284" cy="216" r="15" fill="#38bdf8" opacity="0.45"/>
    <ellipse cx="256" cy="214" rx="22" ry="13" fill="#ffffff" opacity="0.65"/>

    <!-- Pursed Whistling Lips (O-shape) -->
    <ellipse cx="256" cy="224" rx="11" ry="15" fill="#0f172a"/>
    <ellipse cx="256" cy="224" rx="5" ry="8" fill="#38bdf8"/>
    <!-- Lip shine -->
    <path d="M 251 215 Q 256 213 261 215" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Spectral Hands holding sides / gesture -->
    <circle cx="154" cy="260" r="13" fill="url(#ghostBody)" opacity="0.96"/>
    <circle cx="358" cy="260" r="13" fill="url(#ghostBody)" opacity="0.96"/>
    <circle cx="154" cy="260" r="6" fill="#38bdf8" opacity="0.6"/>
    <circle cx="358" cy="260" r="6" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Whistle Wind Stream & Musical Notes -->
  <g>
    <!-- Dynamic Air Swirls -->
    <path d="M 270 220 Q 320 205 360 170 Q 400 135 440 100" stroke="#38bdf8" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>
    <path d="M 270 230 Q 330 250 380 230 Q 430 210 470 170" stroke="#7dd3fc" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 265 235 Q 315 275 365 275 Q 415 275 455 240" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 275 215 Q 310 170 350 140" stroke="#e0f2fe" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Floating Musical Notes with Glow -->
    <g filter="url(#glow)">
      <!-- Note 1 -->
      <g transform="translate(365, 145) rotate(15)">
        <text x="0" y="0" font-size="38" fill="#7dd3fc" font-family="sans-serif" font-weight="bold">♪</text>
      </g>
      <!-- Note 2 -->
      <g transform="translate(435, 85) rotate(-12)">
        <text x="0" y="0" font-size="48" fill="#ffffff" font-family="sans-serif" font-weight="bold">♫</text>
      </g>
      <!-- Note 3 -->
      <g transform="translate(400, 225) rotate(25)">
        <text x="0" y="0" font-size="30" fill="#38bdf8" font-family="sans-serif">♪</text>
      </g>
      <!-- Note 4 -->
      <g transform="translate(470, 155) rotate(-20)" opacity="0.85">
        <text x="0" y="0" font-size="24" fill="#bae6fd" font-family="sans-serif">♪</text>
      </g>
      <!-- Note 5 -->
      <g transform="translate(320, 100) rotate(8)" opacity="0.8">
        <text x="0" y="0" font-size="22" fill="#e0f2fe" font-family="sans-serif">♪</text>
      </g>
    </g>
  </g>

  <!-- Sparkles & Magic Dust -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="256" cy="115" r="2" />
    <circle cx="215" cy="135" r="2.5" />
    <circle cx="300" cy="125" r="1.5" />
    <circle cx="340" cy="190" r="1.2" opacity="0.8" />
    <circle cx="180" cy="180" r="1.5" opacity="0.9" />
    <circle cx="380" cy="130" r="1" opacity="0.85" />
  </g>
</svg>
