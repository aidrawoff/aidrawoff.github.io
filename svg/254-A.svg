<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a70"/>
      <stop offset="1" stop-color="#9fb2c4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- midground hills and pines -->
  <path d="M0 380 Q90 330 180 370 T360 360 T512 350 V440 H0 Z" fill="#3e5a46"/>
  <g fill="#2c4536">
    <path d="M40 380 L60 330 L80 380 Z"/>
    <path d="M70 385 L90 340 L110 385 Z"/>
    <path d="M430 370 L455 318 L480 370 Z"/>
    <path d="M460 375 L480 335 L500 375 Z"/>
  </g>
  <rect y="430" width="512" height="82" fill="#5e7a4f"/>
  <!-- puddles -->
  <g fill="#7d9bb3" opacity="0.8">
    <ellipse cx="190" cy="455" rx="40" ry="6"/>
    <ellipse cx="330" cy="470" rx="50" ry="7"/>
  </g>
  <!-- rain -->
  <g stroke="#dfe9f5" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="40" y1="60" x2="30" y2="90"/>
    <line x1="120" y1="30" x2="110" y2="60"/>
    <line x1="210" y1="50" x2="200" y2="80"/>
    <line x1="300" y1="20" x2="290" y2="50"/>
    <line x1="420" y1="40" x2="410" y2="70"/>
    <line x1="480" y1="120" x2="470" y2="150"/>
    <line x1="70" y1="170" x2="60" y2="200"/>
    <line x1="160" y1="150" x2="150" y2="180"/>
    <line x1="260" y1="130" x2="250" y2="160"/>
    <line x1="350" y1="110" x2="340" y2="140"/>
    <line x1="20" y1="280" x2="10" y2="310"/>
    <line x1="500" y1="260" x2="490" y2="290"/>
    <line x1="230" y1="200" x2="220" y2="230"/>
    <line x1="60" y1="420" x2="50" y2="450"/>
    <line x1="450" y1="400" x2="440" y2="430"/>
  </g>
  <!-- legs -->
  <g fill="#6b4a2e">
    <rect x="170" y="330" width="26" height="80" rx="8"/>
    <rect x="215" y="330" width="26" height="80" rx="8"/>
    <rect x="290" y="330" width="26" height="80" rx="8"/>
    <rect x="335" y="330" width="26" height="80" rx="8"/>
  </g>
  <!-- rain boots -->
  <g fill="#e8452c">
    <path d="M166 395 h34 v35 q0 10 -10 10 h-14 q-10 0 -10 -10 z"/>
    <path d="M211 395 h34 v35 q0 10 -10 10 h-14 q-10 0 -10 -10 z"/>
    <path d="M286 395 h34 v35 q0 10 -10 10 h-14 q-10 0 -10 -10 z"/>
    <path d="M331 395 h34 v35 q0 10 -10 10 h-14 q-10 0 -10 -10 z"/>
  </g>
  <!-- body -->
  <ellipse cx="256" cy="290" rx="120" ry="62" fill="#7a5532"/>
  <!-- neck and head -->
  <path d="M340 260 Q365 210 380 200 L400 230 Q390 260 360 300 Z" fill="#7a5532"/>
  <ellipse cx="392" cy="215" rx="40" ry="28" fill="#8a6239"/>
  <ellipse cx="418" cy="232" rx="24" ry="18" fill="#a57a4c"/>
  <circle cx="400" cy="205" r="5" fill="#fff"/>
  <circle cx="401" cy="206" r="2.5" fill="#222"/>
  <!-- antlers -->
  <g stroke="#e9dcc2" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M382 185 L368 150 L352 140"/>
    <path d="M368 160 L356 158"/>
    <path d="M396 185 L410 150 L428 138"/>
    <path d="M410 160 L424 156"/>
  </g>
  <!-- ear -->
  <ellipse cx="372" cy="200" rx="12" ry="6" fill="#5c3e22" transform="rotate(-25 372 200)"/>
  <!-- body shading and sheen -->
  <ellipse cx="256" cy="312" rx="100" ry="30" fill="#5c3e22" opacity="0.6"/>
  <ellipse cx="225" cy="268" rx="50" ry="14" fill="#9a7048" opacity="0.7"/>
  <path d="M200 340 q10 8 20 0" stroke="#4a301a" stroke-width="3" fill="none"/>
  <path d="M300 340 q10 8 20 0" stroke="#4a301a" stroke-width="3" fill="none"/>
  <path d="M412 240 q-6 4 -12 2" stroke="#3a2412" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- glossy boot highlights -->
  <g fill="#ffb3a6" opacity="0.7">
    <rect x="172" y="402" width="5" height="18" rx="2"/>
    <rect x="217" y="402" width="5" height="18" rx="2"/>
    <rect x="292" y="402" width="5" height="18" rx="2"/>
    <rect x="337" y="402" width="5" height="18" rx="2"/>
  </g>
  <circle cx="432" cy="226" r="4" fill="#3a2412"/>
  <!-- puddle reflections of the boots -->
  <g fill="#e8452c" opacity="0.35">
    <rect x="180" y="458" width="20" height="6"/>
    <rect x="310" y="466" width="22" height="6"/>
  </g>
  <!-- tail -->
  <ellipse cx="140" cy="280" rx="10" ry="8" fill="#5c3e22"/>
  <!-- boot cuffs -->
  <g fill="#ffd23f">
    <rect x="166" y="393" width="34" height="6"/>
    <rect x="211" y="393" width="34" height="6"/>
    <rect x="286" y="393" width="34" height="6"/>
    <rect x="331" y="393" width="34" height="6"/>
  </g>
  <!-- splashes -->
  <g stroke="#dfe9f5" stroke-width="2" fill="none" opacity="0.8">
    <path d="M160 445 l-8 -8 M162 447 l-10 0"/>
    <path d="M370 448 l8 -8 M368 450 l10 0"/>
  </g>
  <!-- shadow -->
  <ellipse cx="256" cy="440" rx="150" ry="10" fill="#2f4a2a" opacity="0.5"/>
</svg>
