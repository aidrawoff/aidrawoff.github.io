  <path d="M280 412 L330 396 L334 404 L284 420 Z" fill="#6b4226"/>
  <path d="M290 412 L340 400 L342 408 L292 420 Z" fill="#4a2c17"/>
  <path d="M300 388 Q292 370 304 356 Q302 372 312 378 Q316 364 320 350 Q326 376 322 388 Z" fill="#ff8c1a"/>
  <path d="M305 386 Q301 376 308 368 Q310 378 316 380 Q318 374 320 368 Q322 384 316 388 Z" fill="#ffe066"/>
