    <g transform="translate(360 446)"><circle r="3.5"/><circle cx="-6" r="2.5"/><circle cx="6" r="3.5" fill="#1a1a1a"/><path d="M8 -2 L13 -6 M8 2 L13 6" fill="none"/></g>
    <g transform="translate(374 452) rotate(10)"><circle r="3.5"/><circle cx="-6" r="2.5"/><circle cx="6" r="3.5"/><path d="M8 -2 L13 -6 M8 2 L13 6" fill="none"/></g>
    <g transform="translate(390 457) rotate(6)"><circle r="3.5"/><circle cx="-6" r="2.5"/><circle cx="6" r="3.5"/><path d="M8 -2 L13 -6 M8 2 L13 6" fill="none"/></g>
    <g transform="translate(406 462) rotate(-4)"><circle r="3.5"/><circle cx="-6" r="2.5"/><circle cx="6" r="3.5"/><path d="M8 -2 L13 -6 M8 2 L13 6" fill="none"/></g>
    <g transform="translate(422 466)"><circle r="3.5"/><circle cx="-6" r="2.5"/><circle cx="6" r="3.5"/><path d="M8 -2 L13 -6 M8 2 L13 6" fill="none"/></g>
    <g transform="translate(438 470) rotate(8)"><circle r="3.5"/><circle cx="-6" r="2.5"/><circle cx="6" r="3.5"/><path d="M8 -2 L13 -6 M8 2 L13 6" fill="none"/></g>
  </g>
  <!-- ant hill and the honey jar the bear is after -->
  <path d="M338 452 Q352 436 368 452 Z" fill="#6b4226"/>
  <path d="M440 412 L456 412 L458 436 Q448 442 438 436 Z" fill="#e8a33a"/>
  <rect x="436" y="404" width="24" height="10" rx="2" fill="#8a5a2b"/>
  <ellipse cx="448" cy="414" rx="10" ry="3" fill="#ffd27a"/>
  <!-- ants on the bear's leg -->
  <g fill="#1a1a1a">
    <circle cx="396" cy="436" r="2.5"/><circle cx="398" cy="428" r="2.5"/><circle cx="402" cy="420" r="2.5"/>
  </g>
  <!-- crumbs the ants are carrying -->
  <circle cx="384" cy="447" r="2" fill="#e0b050"/>
  <circle cx="414" cy="459" r="2" fill="#e0b050"/>
  <!-- tent doorway glow -->
  <path d="M140 400 L150 350 L162 400 Z" fill="#ffcc66" opacity="0.8"/>
  <!-- trees -->
  <path d="M30 420 L60 260 L90 420 Z" fill="#1f3326"/>
  <path d="M450 430 L480 280 L510 430 Z" fill="#1f3326"/>
