  <g fill="#6b4a2e">
    <circle cx="410" cy="350" r="34"/>
    <circle cx="380" cy="320" r="11"/>
    <circle cx="440" cy="320" r="11"/>
    <ellipse cx="410" cy="400" rx="42" ry="50"/>
    <ellipse cx="438" cy="428" rx="16" ry="10"/>
