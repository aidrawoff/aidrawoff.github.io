  <circle cx="380" cy="320" r="5" fill="#a07850"/>
  <circle cx="440" cy="320" r="5" fill="#a07850"/>
  <ellipse cx="425" cy="352" rx="7" ry="5" fill="#2b1a0e"/>
  <circle cx="400" cy="342" r="3" fill="#111"/>
  <circle cx="401" cy="341" r="1" fill="#fff"/>
  <path d="M392 380 Q410 390 428 380" fill="none" stroke="#4a2e18" stroke-width="2" opacity="0.5"/>
