<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#3d5a80"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff7c2" stop-opacity="0.08"/>
    </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- sky -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- stars -->
  <circle cx="60" cy="50" r="2" fill="#fff"/>
  <circle cx="200" cy="30" r="1.5" fill="#fff"/>
  <circle cx="440" cy="70" r="2" fill="#fff"/>
  <circle cx="150" cy="90" r="1.5" fill="#fff"/>
  <circle cx="470" cy="180" r="1.5" fill="#fff"/>
  <circle cx="30" cy="200" r="1.5" fill="#fff"/>
  <circle cx="380" cy="30" r="1" fill="#fff"/>
  <!-- UFO -->
  <path d="M232 134 L268 134 L345 420 L175 420 Z" fill="url(#beam)"/>
  <ellipse cx="250" cy="120" rx="70" ry="18" fill="#9aa8b8"/>
  <path d="M210 110 Q250 60 290 110 Z" fill="#cfe3f0"/>
  <ellipse cx="250" cy="120" rx="70" ry="18" fill="none" stroke="#dfe7ef" stroke-width="2"/>
  <circle cx="220" cy="122" r="3" fill="#ffd54a"/>
  <circle cx="250" cy="126" r="3" fill="#ffd54a"/>
  <circle cx="280" cy="122" r="3" fill="#ffd54a"/>
  <!-- hills -->
  <path d="M0 330 Q120 270 260 320 Q380 280 512 320 L512 512 L0 512 Z" fill="#2e4a3a"/>
  <!-- tent -->
