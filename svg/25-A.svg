<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect x="0" y="0" width="512" height="512" fill="#f4f4f4"/>
  <!-- sky details -->
  <path d="M0 96 Q60 60 120 100" fill="none" stroke="#000" stroke-width="5"/>
  <circle cx="456" cy="52" r="20" fill="#000"/>
  <line x1="32" y1="262" x2="92" y2="262" stroke="#000" stroke-width="5"/>
  <line x1="40" y1="330" x2="88" y2="330" stroke="#000" stroke-width="5"/>
  <line x1="420" y1="268" x2="480" y2="268" stroke="#000" stroke-width="5"/>
  <path d="M300 60 Q308 52 316 60 Q324 52 332 60" fill="none" stroke="#000" stroke-width="3"/>
  <!-- blimp tail fins -->
  <polygon points="84,150 26,110 34,210 84,184" fill="#000"/>
  <polygon points="436,148 490,120 490,200 436,176" fill="#000"/>
  <!-- blimp body -->
  <ellipse cx="256" cy="150" rx="192" ry="84" fill="#ffffff" stroke="#000" stroke-width="8"/>
  <path d="M80 136 Q256 96 432 136" fill="none" stroke="#000" stroke-width="4"/>
  <path d="M84 170 Q256 210 428 170" fill="none" stroke="#777" stroke-width="4"/>
  <path d="M170 70 Q190 150 170 226" fill="none" stroke="#000" stroke-width="3"/>
  <path d="M342 70 Q322 150 342 226" fill="none" stroke="#000" stroke-width="3"/>
  <!-- ropes -->
  <line x1="196" y1="226" x2="186" y2="290" stroke="#000" stroke-width="5"/>
  <line x1="316" y1="226" x2="326" y2="290" stroke="#000" stroke-width="5"/>
  <!-- cupcake wrapper -->
  <path d="M168 292 L344 292 L324 446 Q256 458 188 446 Z" fill="#777" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <line x1="190" y1="330" x2="322" y2="330" stroke="#000" stroke-width="4"/>
  <line x1="186" y1="370" x2="326" y2="370" stroke="#000" stroke-width="4"/>
  <line x1="182" y1="410" x2="330" y2="410" stroke="#000" stroke-width="4"/>
  <!-- frosting dome -->
  <g fill="#ffffff" stroke="#000" stroke-width="6">
    <circle cx="256" cy="218" r="52"/>
    <circle cx="186" cy="262" r="42"/>
    <circle cx="326" cy="262" r="42"/>
    <circle cx="222" cy="200" r="36"/>
    <circle cx="292" cy="200" r="36"/>
    <rect x="150" y="262" width="212" height="34" rx="12"/>
  </g>
  <!-- sprinkles -->
  <g stroke="#000" stroke-width="5" stroke-linecap="round">
    <line x1="200" y1="196" x2="208" y2="190"/>
    <line x1="246" y1="180" x2="254" y2="186"/>
    <line x1="290" y1="186" x2="298" y2="180"/>
    <line x1="316" y1="236" x2="324" y2="230"/>
    <line x1="170" y1="240" x2="178" y2="246"/>
  </g>
  <!-- cherry -->
  <line x1="256" y1="168" x2="262" y2="150" stroke="#000" stroke-width="4"/>
  <circle cx="262" cy="148" r="12" fill="#000"/>
  <!-- pilot face -->
  <circle cx="226" cy="284" r="14" fill="#000"/>
  <circle cx="286" cy="284" r="14" fill="#000"/>
  <circle cx="230" cy="280" r="4" fill="#fff"/>
  <circle cx="290" cy="280" r="4" fill="#fff"/>
  <path d="M234 306 Q256 326 278 306" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <circle cx="204" cy="306" r="8" fill="#bbb"/>
  <circle cx="308" cy="306" r="8" fill="#bbb"/>
  <!-- propeller -->
  <g transform="translate(372 330)">
    <ellipse cx="0" cy="-22" rx="8" ry="20" fill="#000"/>
    <ellipse cx="0" cy="22" rx="8" ry="20" fill="#000"/>
    <circle cx="0" cy="0" r="8" fill="#fff" stroke="#000" stroke-width="4"/>
  </g>
  <!-- ground -->
  <path d="M0 448 Q128 420 256 448 T512 448 V512 H0 Z" fill="#bdbdbd" stroke="#000" stroke-width="3"/>
  <ellipse cx="256" cy="478" rx="130" ry="12" fill="#555"/>
