<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: lunar surface with detailed craters and subtle dust texture -->
  <defs>
    <radialGradient id="lunar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d2b48c"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </radialGradient>
    <pattern id="craters" patternUnits="userSpaceOnUse" width="64" height="64">
      <circle cx="16" cy="16" r="3" fill="#708090" opacity="0.5"/>
      <circle cx="48" cy="48" r="2" fill="#708090" opacity="0.5"/>
      <circle cx="32" cy="16" r="1" fill="#708090" opacity="0.5"/>
      <circle cx="16" cy="48" r="2" fill="#708090" opacity="0.5"/>
    </pattern>
    <pattern id="dust" patternUnits="userSpaceOnUse" width="32" height="32">
      <circle cx="8" cy="8" r="1" fill="#ffffff" opacity="0.15"/>
      <circle cx="24" cy="24" r="1" fill="#ffffff" opacity="0.15"/>
    </pattern>
    <linearGradient id="earthrise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="16" height="16">
      <circle cx="8" cy="8" r="2" fill="#ff69b4"/>
    </pattern>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="24" height="24" patternTransform="rotate(45 12 12)">
      <rect x="0" y="0" width="12" height="24" fill="#ff1493"/>
    </pattern>
    <g id="gumdrop">
      <circle cx="0" cy="0" r="6" fill="#ff6347"/>
      <circle cx="0" cy="0" r="4" fill="#ffa500"/>
    </g>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Lunar surface with craters and dust -->
  <rect width="512" height="512" fill="url(#lunar)"/>
  <rect width="512" height="512" fill="url(#craters)"/>
  <rect width="512" height="512" fill="url(#dust)"/>

  <!-- Earthrise glow behind cloud -->
  <rect x="0" y="0" width="512" height="512" fill="url(#earthrise)"/>

  <!-- Candy cloud silhouette with refined shape and soft glow -->
  <path d="M 256 128 C 160 128 96 192 96 256 C 96 320 160 384 256 384 C 352 384 416 320 416 256 C 416 192 352 128 256 128 Z" fill="#ffd1dc" stroke="#ffffff" stroke-width="2" filter="url(#softGlow)"/>

  <!-- Candy textures on cloud -->
  <rect x="180" y="180" width="152" height="152" fill="url(#dots)" opacity="0.7"/>
  <rect x="160" y="160" width="192" height="192" fill="url(#stripes)" opacity="0.5"/>

  <!-- Mermaid tail silhouette -->
  <path d="M 256 384 C 256 448 320 512 320 512 C 320 480 288 448 256 448 C 224 448 192 480 192 512 C 192 512 256 448 256 384 Z" fill="#4169e1" stroke="#ffffff" stroke-width="2"/>

  <!-- Gumdrops scattered on surface -->
  <use href="#gumdrop" x="120" y="400" transform="scale(1.2)"/>
  <use href="#gumdrop" x="380" y="380" transform="scale(1.0)"/>
  <use href="#gumdrop" x="200" y="450" transform="scale(0.8)"/>
  <use href="#gumdrop" x="420" y="420" transform="scale(1.1)"/>
  <use href="#gumdrop" x="80" y="360" transform="scale(0.9)"/>
  <use href="#gumdrop" x="300" y="420" transform="scale(1.3)"/>
  <use href="#gumdrop" x="150" y="380" transform="scale(1.0)"/>

  <!-- Candy debris and sprinkles -->
  <circle cx="100" cy="200" r="3" fill="#ffd700"/>
  <circle cx="400" cy="180" r="2" fill="#ff69b4"/>
  <circle cx="300" cy="220" r="4" fill="#ffa500"/>
  <circle cx="150" cy="300" r="2" fill="#ffffff"/>
  <circle cx="350" cy="320" r="3" fill="#ffd700"/>
  <circle cx="200" cy="160" r="2" fill="#ff69b4"/>
  <circle cx="280" cy="190" r="3" fill="#ffa500"/>
</svg>
