<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101b45"/><stop offset="1" stop-color="#3b255e"/></linearGradient>
  <linearGradient id="dome" x2="0" y2="1"><stop stop-color="#9eeaff" stop-opacity=".25"/><stop offset="1" stop-color="#87b5d8" stop-opacity=".08"/></linearGradient>
  <linearGradient id="moon" x2="0" y2="1"><stop stop-color="#ffe8b0"/><stop offset="1" stop-color="#c87958"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="512" height="512" fill="url(#sky)"/>
