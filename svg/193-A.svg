<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- back wall -->
  <rect x="0" y="0" width="512" height="512" fill="#2b2d42"/>
  <!-- ceiling beam -->
  <rect x="0" y="0" width="512" height="36" fill="#6b4423"/>
  <line x1="0" y1="14" x2="512" y2="14" stroke="#523419" stroke-width="2"/>
  <line x1="0" y1="28" x2="512" y2="28" stroke="#523419" stroke-width="2"/>
  <!-- floor -->
  <rect x="0" y="430" width="512" height="82" fill="#4a3a2e"/>
  <!-- desk -->
  <rect x="90" y="330" width="330" height="24" fill="#8d6e4f"/>
  <rect x="100" y="354" width="12" height="76" fill="#6b4423"/>
  <rect x="390" y="354" width="12" height="76" fill="#6b4423"/>
  <!-- monitor -->
  <rect x="250" y="230" width="150" height="100" rx="6" fill="#1d1f2b"/>
  <rect x="260" y="240" width="130" height="80" fill="#7fd1ae"/>
  <rect x="318" y="330" width="24" height="10" fill="#333"/>
  <!-- mug -->
  <rect x="110" y="300" width="30" height="30" rx="4" fill="#e76f51"/>
  <!-- keyboard and papers on desk -->
  <rect x="196" y="316" width="112" height="14" rx="3" fill="#444857"/>
  <line x1="204" y1="320" x2="300" y2="320" stroke="#888" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="340" y="314" width="40" height="16" fill="#f1faee"/>
  <!-- wall clock showing late hour -->
  <circle cx="430" cy="110" r="36" fill="#f1faee" stroke="#1d1f2b" stroke-width="6"/>
  <line x1="430" y1="110" x2="430" y2="88" stroke="#1d1f2b" stroke-width="4" stroke-linecap="round"/>
  <line x1="430" y1="110" x2="448" y2="118" stroke="#1d1f2b" stroke-width="3" stroke-linecap="round"/>
  <!-- sticky notes on wall -->
  <rect x="330" y="200" width="26" height="22" fill="#ffd166"/>
  <rect x="362" y="186" width="24" height="22" fill="#ef8b8b"/>
  <!-- plant beside desk -->
  <rect x="440" y="380" width="34" height="50" rx="4" fill="#b5651d"/>
  <circle cx="457" cy="366" r="22" fill="#4caf7a"/>
  <circle cx="440" cy="356" r="14" fill="#3e9a6a"/>
  <circle cx="474" cy="354" r="14" fill="#3e9a6a"/>
  <!-- screen glow on the desk and the hero -->
  <ellipse cx="325" cy="300" rx="90" ry="22" fill="#7fd1ae" opacity="0.18"/>
  <!-- steam from the mug -->
  <path d="M118 290 Q112 278 120 268 Q128 258 120 246" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <!-- screen highlight -->
  <rect x="266" y="246" width="40" height="6" fill="#ffffff" opacity="0.35"/>
  <!-- contact shadows -->
  <ellipse cx="255" cy="432" rx="170" ry="7" fill="#000" opacity="0.35"/>
  <ellipse cx="200" cy="354" rx="120" ry="5" fill="#000" opacity="0.3"/>
  <!-- hanging feet -->
  <line x1="196" y1="112" x2="196" y2="40" stroke="#3a3050" stroke-width="5"/>
  <line x1="208" y1="112" x2="208" y2="40" stroke="#3a3050" stroke-width="5"/>
  <!-- wings draping down -->
  <path d="M190 130 Q120 90 90 150 Q120 140 140 160 Q130 180 110 200 Q160 190 185 170 Z" fill="#3a3050"/>
  <path d="M216 130 Q290 95 320 150 Q290 140 270 160 Q280 185 300 200 Q255 190 230 170 Z" fill="#3a3050"/>
  <!-- body -->
  <ellipse cx="202" cy="140" rx="18" ry="28" fill="#6a5a8a"/>
  <!-- ears -->
  <path d="M190 170 L184 150 L196 166 Z" fill="#6a5a8a"/>
  <path d="M214 170 L220 150 L208 166 Z" fill="#6a5a8a"/>
  <!-- head -->
  <circle cx="202" cy="182" r="16" fill="#6a5a8a"/>
  <!-- eyes -->
  <circle cx="195" cy="184" r="3.5" fill="#ffd166"/>
  <circle cx="209" cy="184" r="3.5" fill="#ffd166"/>
  <!-- arm and claws typing on the keyboard -->
  <path d="M186 158 Q196 236 226 314" fill="none" stroke="#3a3050" stroke-width="6" stroke-linecap="round"/>
  <circle cx="226" cy="316" r="4" fill="#6a5a8a"/>
</svg>
