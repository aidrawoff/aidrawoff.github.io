<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: deep indigo with subtle stars -->
  <rect width="512" height="512" fill="#0a0a2a"/>
  <circle cx="120" cy="80" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="380" cy="110" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="200" cy="160" r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="450" cy="200" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="80" cy="280" r="1.1" fill="#fff" opacity="0.7"/>
  <circle cx="320" cy="320" r="0.9" fill="#fff" opacity="0.7"/>
  <circle cx="150" cy="400" r="1.3" fill="#fff" opacity="0.7"/>
  <circle cx="400" cy="450" r="1" fill="#fff" opacity="0.7"/>

  <!-- Bat body: single path, mid-left, facing right -->
  <path id="batBody" d="M 180 220 C 180 200 190 180 210 180 C 230 180 240 200 240 220 C 240 240 230 260 210 260 C 190 260 180 240 180 220 Z" fill="#3a2e4d" stroke="#1a122b" stroke-width="2"/>
  <!-- Subtle shadow under bat -->
  <ellipse cx="210" cy="270" rx="30" ry="8" fill="#0a0a2a" fill-opacity="0.3"/>

  <!-- Bat head and ears -->
  <path d="M 240 220 C 250 210 260 210 270 220 C 280 230 275 245 265 245 C 255 245 250 230 240 220 Z" fill="#3a2e4d" stroke="#1a122b" stroke-width="2"/>
  <path d="M 250 200 L 255 190 L 260 200 Z" fill="#3a2e4d" stroke="#1a122b" stroke-width="1"/>
  <path d="M 260 200 L 265 190 L 270 200 Z" fill="#3a2e4d" stroke="#1a122b" stroke-width="1"/>

  <!-- Bat wings: single path each side -->
  <path d="M 180 220 C 140 200 120 260 140 280 C 160 300 180 280 180 260 C 180 240 170 220 180 220 Z" fill="#4d3a6a" stroke="#2a1e3d" stroke-width="1.5"/>
  <path d="M 240 220 C 280 200 300 260 280 280 C 260 300 240 280 240 260 C 240 240 250 220 240 220 Z" fill="#4d3a6a" stroke="#2a1e3d" stroke-width="1.5"/>
  <!-- Highlight on left wing -->
  <ellipse cx="160" cy="240" rx="14" ry="8" fill="#7a6bc9" fill-opacity="0.3"/>
  <!-- Subtle inner wing detail -->
  <path d="M 180 220 C 160 230 160 250 180 260 C 200 250 200 230 180 220 Z" fill="#6a5a8a" fill-opacity="0.4"/>

  <!-- Phone: held by bat’s right wing -->
  <rect x="260" y="240" width="40" height="60" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="265" y="245" width="30" height="40" fill="#000" rx="3"/>
  <rect x="268" y="250" width="24" height="20" fill="#0078d7" rx="2"/>
  <!-- Screen content: simple "call" icon -->
  <rect x="272" y="254" width="16" height="12" fill="#fff"/>
  <circle cx="280" cy="260" r="2" fill="#0078d7"/>
  <circle cx="280" cy="260" r="1" fill="#fff"/>

  <!-- Glow behind phone -->
  <ellipse cx="280" cy="260" rx="28" ry="16" fill="#4a4aff" fill-opacity="0.2"/>
  <ellipse cx="280" cy="260" rx="20" ry="10" fill="#4a4aff" fill-opacity="0.35"/>
  <ellipse cx="280" cy="260" rx="12" ry="6" fill="#4a4aff" fill-opacity="0.5"/>

  <!-- Simple eyes -->
  <circle cx="255" cy="215" r="3" fill="#fff"/>
  <circle cx="257" cy="215" r="1" fill="#000"/>
  <!-- Ambient glow around head -->
  <ellipse cx="255" cy="215" rx="12" ry="10" fill="#4a4aff" fill-opacity="0.12"/>
  <!-- Subtle cheek glow -->
  <circle cx="245" cy="220" r="4" fill="#4a4aff" fill-opacity="0.1"/>
</svg>
