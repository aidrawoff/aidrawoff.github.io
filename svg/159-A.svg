  <path d="M 226 310 L 286 310 L 292 370 L 220 370 Z" fill="#e74c3c"/>
  <path d="M 236 310 L 236 290 Q 256 300 276 290 L 276 310" fill="none" stroke="#e74c3c" stroke-width="4"/>
