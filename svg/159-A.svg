  <rect x="380" y="200" width="100" height="140" rx="8" fill="#555"/>
  <rect x="390" y="210" width="80" height="100" rx="4" fill="#222"/>
  <rect x="390" y="320" width="80" height="12" rx="2" fill="#333"/>
  <circle cx="405" cy="326" r="3" fill="#e74c3c"/>
  <circle cx="420" cy="326" r="3" fill="#f1c40f"/>
  <circle cx="435" cy="326" r="3" fill="#2ecc71"/>
