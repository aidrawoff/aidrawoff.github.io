  <rect x="0" y="380" width="512" height="132" fill="#8b5a2b"/>
  <rect x="0" y="380" width="512" height="8" fill="#5c3a1e"/>
  <!-- Spider body -->
  <ellipse cx="256" cy="280" rx="55" ry="65" fill="#2c1a0e"/>
