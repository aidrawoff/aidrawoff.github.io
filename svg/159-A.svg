  <path d="M 330 340 Q 320 320 335 310" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 350 345 Q 360 325 345 315" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
