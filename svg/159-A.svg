  <path d="M 210 320 Q 175 330 165 365" fill="none" stroke="#2c1a0e" stroke-width="7" stroke-linecap="round"/>
  <path d="M 302 260 Q 342 240 362 280" fill="none" stroke="#2c1a0e" stroke-width="7" stroke-linecap="round"/>
  <path d="M 302 280 Q 347 270 367 310" fill="none" stroke="#2c1a0e" stroke-width="7" stroke-linecap="round"/>
  <path d="M 302 300 Q 342 300 357 340" fill="none" stroke="#2c1a0e" stroke-width="7" stroke-linecap="round"/>
  <path d="M 302 320 Q 337 330 347 365" fill="none" stroke="#2c1a0e" stroke-width="7" stroke-linecap="round"/>
