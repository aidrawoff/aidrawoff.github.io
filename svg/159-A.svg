  <line x1="355" y1="330" x2="365" y2="375" stroke="#7f8c8d" stroke-width="4"/>
  <ellipse cx="365" cy="375" rx="8" ry="4" fill="none" stroke="#7f8c8d" stroke-width="2"/>
  <!-- Cookie sheet with cookies -->
  <rect x="110" y="385" width="90" height="55" rx="6" fill="#7f8c8d"/>
  <circle cx="135" cy="405" r="12" fill="#d4a017"/>
  <circle cx="165" cy="400" r="12" fill="#d4a017"/>
  <circle cx="150" cy="425" r="12" fill="#d4a017"/>
  <circle cx="180" cy="420" r="12" fill="#d4a017"/>
  <!-- Chocolate chips -->
  <circle cx="132" cy="403" r="2" fill="#3e2723"/>
  <circle cx="138" cy="407" r="2" fill="#3e2723"/>
  <circle cx="162" cy="398" r="2" fill="#3e2723"/>
  <circle cx="168" cy="402" r="2" fill="#3e2723"/>
  <circle cx="147" cy="423" r="2" fill="#3e2723"/>
  <circle cx="153" cy="427" r="2" fill="#3e2723"/>
  <circle cx="177" cy="418" r="2" fill="#3e2723"/>
  <circle cx="183" cy="422" r="2" fill="#3e2723"/>
