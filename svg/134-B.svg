<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pumpkin-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background: Attic Room -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Wooden Wall Planks -->
  <line x1="0" y1="130" x2="512" y2="130" stroke="#172033" stroke-width="3"/>
  <line x1="0" y1="260" x2="512" y2="260" stroke="#172033" stroke-width="3"/>
  <line x1="0" y1="390" x2="512" y2="390" stroke="#172033" stroke-width="3"/>
  
  <!-- Attic Window with Moon & Bats -->
  <path d="M 370 30 L 460 30 L 460 160 Q 415 180 370 160 Z" fill="#05080f" stroke="#334155" stroke-width="6"/>
  <circle cx="415" cy="100" r="45" fill="url(#moon)"/>
  <circle cx="415" cy="100" r="18" fill="#fef9c3" opacity="0.9"/>
  <!-- Window Panes -->
  <line x1="415" y1="30" x2="415" y2="165" stroke="#334155" stroke-width="4"/>
  <line x1="370" y1="95" x2="460" y2="95" stroke="#334155" stroke-width="4"/>
  <!-- Silhouette bat outside -->
  <path d="M 390 60 Q 395 55 400 60 Q 405 55 410 60 Q 405 65 400 70 Q 395 65 390 60 Z" fill="#090d16"/>

  <!-- Hanging Cobwebs in Corners -->
  <path d="M 0 0 Q 50 50 100 0 M 0 0 Q 25 70 0 140 M 30 30 Q 70 70 30 110" stroke="#475569" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 512 0 Q 462 50 412 0 M 512 0 Q 487 70 512 140" stroke="#475569" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Crooked Picture Frame on Left Wall -->
  <g transform="translate(65, 55) rotate(-10)">
    <rect x="0" y="0" width="80" height="100" fill="#1e293b" stroke="#475569" stroke-width="5"/>
    <circle cx="40" cy="50" r="22" fill="#090d16"/>
    <!-- Glowing red spooky eyes in painting -->
    <circle cx="32" cy="44" r="5" fill="#f87171"/>
    <circle cx="48" cy="44" r="5" fill="#f87171"/>
    <path d="M 35 62 Q 40 68 45 62" stroke="#f87171" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Wooden Floor & Rug -->
  <path d="M0 420 Q 256 395 512 420 L 512 512 L 0 512 Z" fill="#05080f"/>
  <ellipse cx="256" cy="455" rx="190" ry="35" fill="#2b0e02" opacity="0.8"/>
  <ellipse cx="256" cy="455" rx="150" ry="25" fill="#3d1303" opacity="0.9"/>
  <ellipse cx="256" cy="455" rx="100" ry="15" fill="#521b04" opacity="0.9"/>

  <!-- Jack-o'-Lantern on the floor (Left) -->
  <circle cx="95" cy="440" r="32" fill="url(#pumpkin-glow)"/>
  <ellipse cx="95" cy="440" rx="26" ry="24" fill="#f97316"/>
  <path d="M 95 416 Q 78 440 95 464 M 95 416 Q 112 440 95 464" stroke="#c2410c" stroke-width="2.5" fill="none"/>
  <polygon points="84,432 90,441 78,441" fill="#1e1b4b"/>
  <polygon points="106,432 112,441 100,441" fill="#1e1b4b"/>
  <path d="M 89 452 Q 95 460 101 452" stroke="#1e1b4b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 95 416 Q 99 406 103 404" stroke="#15803d" stroke-width="3.5" fill="none"/>

  <!-- Small Gift / Candy Bucket on Right -->
  <rect x="410" y="430" width="35" height="30" rx="6" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
  <path d="M 410 438 L 445 438" stroke="#fcd34d" stroke-width="3"/>
  <path d="M 427 430 Q 427 415 415 412" stroke="#fcd34d" stroke-width="2" fill="none"/>

  <!-- TWO GHOSTS, ONE SHEET (Main Subject) -->
  <g filter="url(#glow)">
    <!-- Sheet Main Body -->
    <path d="M 100 395 
             Q 80 280 135 185 
             Q 195 105 256 120 
             Q 317 105 377 185 
             Q 432 280 412 395
             Q 350 435 256 425
             Q 162 435 100 395 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="3.5"/>
          
    <!-- Sheet Folds and Drapes -->
    <path d="M 256 120 Q 245 250 260 425" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <path d="M 165 160 Q 145 270 160 410" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
    <path d="M 347 160 Q 367 270 352 410" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
    <path d="M 205 130 Q 195 220 210 360" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    <path d="M 307 130 Q 317 220 302 360" stroke="#e2e8f0" stroke-width="2" fill="none"/>

    <!-- Left Ghost Face -->
    <ellipse cx="190" cy="205" rx="15" ry="19" fill="#090d16"/>
    <circle cx="185" cy="198" r="5.5" fill="#ffffff"/>
    <ellipse cx="190" cy="248" rx="10" ry="13" fill="#090d16"/>
    <!-- Cute little blush -->
    <ellipse cx="170" cy="225" rx="7" ry="4" fill="#fecdd3" opacity="0.6"/>

    <!-- Right Ghost Face (Surprised / Playful) -->
    <ellipse cx="322" cy="205" rx="15" ry="19" fill="#090d16"/>
    <circle cx="317" cy="198" r="5.5" fill="#ffffff"/>
    <circle cx="322" cy="250" rx="11" ry="13" fill="#090d16"/>
    <path d="M 312 242 Q 322 238 332 242" stroke="#f8fafc" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Cute little blush -->
    <ellipse cx="342" cy="225" rx="7" ry="4" fill="#fecdd3" opacity="0.6"/>

    <!-- Tiny Ghost Arms holding edges of sheet -->
    <path d="M 115 295 Q 100 305 110 320" stroke="#cbd5e1" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 397 295 Q 412 305 402 320" stroke="#cbd5e1" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Cute Ghost Feet sticking out bottom -->
    <ellipse cx="138" cy="425" rx="16" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="374" cy="425" rx="16" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Little toe lines -->
    <line x1="130" y1="431" x2="135" y2="434" stroke="#94a3b8" stroke-width="2"/>
    <line x1="138" y1="432" x2="143" y2="434" stroke="#94a3b8" stroke-width="2"/>
    <line x1="369" y1="431" x2="374" y2="434" stroke="#94a3b8" stroke-width="2"/>
    <line x1="377" y1="432" x2="382" y2="434" stroke="#94a3b8" stroke-width="2"/>

    <!-- Floating Magical Sparkles & Dust Motes -->
    <circle cx="120" cy="135" r="4" fill="#38bdf8" opacity="0.95"/>
    <circle cx="390" cy="210" r="4.5" fill="#38bdf8" opacity="0.95"/>
    <circle cx="256" cy="80" r="3.5" fill="#38bdf8" opacity="0.95"/>
    <circle cx="215" cy="95" r="2.5" fill="#fef08a" opacity="0.9"/>
    <circle cx="295" cy="90" r="3" fill="#fef08a" opacity="0.9"/>
    <circle cx="160" cy="250" r="2" fill="#fef08a" opacity="0.9"/>
    <circle cx="350" cy="250" r="2" fill="#fef08a" opacity="0.9"/>
  </g>
</svg>