<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#d7ccc8"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- background: cozy cottage floor -->
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect x="0" y="350" width="512" height="162" fill="#a1887f"/>
  <line x1="0" y1="350" x2="512" y2="350" stroke="#5d4037" stroke-width="3"/>
  <!-- floorboards -->
  <line x1="0" y1="380" x2="512" y2="380" stroke="#8d6e63" stroke-width="2"/>
  <line x1="0" y1="420" x2="512" y2="420" stroke="#8d6e63" stroke-width="2"/>
  <line x1="0" y1="460" x2="512" y2="460" stroke="#8d6e63" stroke-width="2"/>

  <!-- broom silhouette -->
  <g transform="translate(260,180) rotate(12)">
    <!-- bristles -->
    <path d="M-25,180 Q-35,260 -20,280 Q0,290 20,280 Q35,260 25,180 Z" fill="#5d4037"/>
    <path d="M-20,200 Q-10,270 0,275 Q10,270 20,200" fill="none" stroke="#3e2723" stroke-width="2"/>
    <!-- handle -->
    <rect x="-6" y="0" width="12" height="190" rx="4" fill="#8d6e63"/>
    <rect x="-3" y="10" width="6" height="170" rx="2" fill="#a1887f"/>
    <!-- binding -->
    <rect x="-10" y="170" width="20" height="18" rx="3" fill="#4e342e"/>
  </g>

  <!-- magic sparkles / motion lines -->
  <g stroke="#ffd54f" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M220,380 Q180,360 160,390" opacity="0.8"/>
    <path d="M230,400 Q190,390 170,420" opacity="0.6"/>
    <path d="M240,420 Q200,410 180,440" opacity="0.4"/>
  </g>
  <circle cx="150" cy="400" r="4" fill="#ffd54f" opacity="0.9"/>
  <circle cx="130" cy="430" r="3" fill="#ffd54f" opacity="0.7"/>
  <circle cx="170" cy="370" r="2" fill="#ffd54f" opacity="0.8"/>

  <!-- dust trail being swept -->
  <ellipse cx="140" cy="450" rx="60" ry="12" fill="#d7ccc8" opacity="0.6"/>
  <ellipse cx="100" cy="455" rx="30" ry="8" fill="#d7ccc8" opacity="0.5"/>

  <!-- small stars for magic -->
  <polygon points="300,120 302,126 308,126 303,130 305,136 300,132 295,136 297,130 292,126 298,126" fill="#ffd54f" opacity="0.9"/>
  <polygon points="340,160 341,163 344,163 342,165 343,168 340,166 337,168 338,165 336,163 339,163" fill="#ffd54f" opacity="0.7"/>
  <polygon points="280,200 281,203 284,203 282,205 283,208 280,206 277,208 278,205 276,203 279,203" fill="#ffd54f" opacity="0.8"/>

  <!-- shadow under broom -->
  <ellipse cx="290" cy="460" rx="40" ry="8" fill="#3e2723" opacity="0.3"/>

  <!-- floating arms / personality: the broom has little stick arms waving -->
  <g stroke="#5d4037" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M250,240 Q230,220 210,230" />
    <path d="M210,230 L205,225" />
    <path d="M210,230 L200,232" />
    <path d="M280,250 Q300,230 320,240" />
    <path d="M320,240 L325,235" />
    <path d="M320,240 L330,242" />
  </g>

  <!-- happy face on the broom binding -->
  <circle cx="255" cy="355" r="2.5" fill="#3e2723"/>
  <circle cx="265" cy="355" r="2.5" fill="#3e2723"/>
  <path d="M256,362 Q260,366 264,362" stroke="#3e2723" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- more dust particles in the air for liveliness -->
  <circle cx="120" cy="380" r="2" fill="#d7ccc8" opacity="0.7"/>
  <circle cx="90" cy="410" r="1.5" fill="#d7ccc8" opacity="0.6"/>
  <circle cx="140" cy="340" r="2" fill="#d7ccc8" opacity="0.5"/>

  <!-- a small cobweb in the corner to show what it's cleaning -->
  <g stroke="#d7ccc8" stroke-width="1" fill="none" opacity="0.5">
    <path d="M480,20 Q460,40 440,30 Q450,50 470,60 Q490,50 480,20"/>
    <line x1="460" y1="30" x2="470" y2="50"/>
    <line x1="450" y1="40" x2="480" y2="40"/>
    <line x1="465" y1="25" x2="465" y2="55"/>
  </g>
</svg>