<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9e40" />
      <stop offset="100%" stop-color="#6a0dad" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" />

  <!-- Worm body (main silhouette) -->
  <path d="M 256 280 C 220 280, 190 260, 180 230 C 170 200, 190 170, 220 160 C 250 150, 280 160, 300 180 C 320 200, 310 230, 290 250 C 270 270, 256 280, 256 280 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2" />

  <!-- Worm segments (subtle definition) -->
  <path d="M 220 230 C 210 220, 200 210, 195 200" stroke="#d35400" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 200 200 C 195 190, 190 180, 190 170" stroke="#d35400" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 230 190 C 225 180, 220 170, 220 160" stroke="#d35400" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Earmuffs (soft pink) -->
  <ellipse cx="200" cy="140" rx="35" ry="45" fill="#f8c4d9" stroke="#e74c3c" stroke-width="2" />
  <ellipse cx="310" cy="140" rx="35" ry="45" fill="#f8c4d9" stroke="#e74c3c" stroke-width="2" />

  <!-- Earmuff inner (soft highlight) -->
  <ellipse cx="200" cy="140" rx="20" ry="25" fill="#ffd1dc" />
  <ellipse cx="310" cy="140" rx="20" ry="25" fill="#ffd1dc" />

  <!-- Earmuff band (soft purple) -->
  <path d="M 235 140 Q 256 120, 275 140" stroke="#9b59b6" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- Worm face (friendly eyes and smile) -->
  <circle cx="240" cy="250" r="8" fill="#2c3e50" />
  <circle cx="265" cy="250" r="8" fill="#2c3e50" />
  <path d="M 245 270 Q 256 280, 265 270" stroke="#2c3e50" stroke-width="3" fill="none" />

  <!-- Worm antennae (subtle) -->
  <path d="M 230 220 L 220 200" stroke="#d35400" stroke-width="2" stroke-linecap="round" />
  <path d="M 280 220 L 290 200" stroke="#d35400" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle ground shadow -->
  <ellipse cx="256" cy="480" rx="120" ry="20" fill="rgba(0,0,0,0.1)" />

  <!-- Highlight on earmuffs -->
  <ellipse cx="200" cy="140" rx="10" ry="12" fill="white" opacity="0.4" />
  <ellipse cx="310" cy="140" rx="10" ry="12" fill="white" opacity="0.4" />
</svg>