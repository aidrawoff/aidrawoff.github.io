<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6a8f"/>
      <stop offset="1" stop-color="#17415c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd6e8"/>
      <stop offset="1" stop-color="#1b8fb5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#wall)"/>
  <g stroke="#0f2f44" stroke-width="3" opacity="0.5">
    <line x1="0" y1="80" x2="512" y2="80"/><line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="128" y1="0" x2="128" y2="240"/><line x1="256" y1="0" x2="256" y2="240"/><line x1="384" y1="0" x2="384" y2="240"/>
  </g>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- deck -->
  <rect x="0" y="392" width="512" height="120" fill="#c98a4b"/>
  <rect x="0" y="392" width="512" height="10" fill="#a06a34"/>

  <!-- tub body -->
  <g>
    <ellipse cx="256" cy="420" rx="212" ry="58" fill="#8d5a2b"/>
    <rect x="44" y="286" width="424" height="140" rx="34" fill="#b0713a"/>
    <rect x="44" y="286" width="424" height="140" rx="34" fill="none" stroke="#6d431d" stroke-width="6"/>
    <line x1="120" y1="300" x2="112" y2="418" stroke="#7d4d22" stroke-width="7"/>
    <line x1="256" y1="302" x2="256" y2="424" stroke="#7d4d22" stroke-width="7"/>
    <line x1="392" y1="300" x2="400" y2="418" stroke="#7d4d22" stroke-width="7"/>
    <ellipse cx="256" cy="292" rx="212" ry="46" fill="#e0a86a"/>
    <ellipse cx="256" cy="296" rx="188" ry="38" fill="url(#water)"/>
  </g>

  <!-- DONKEY -->
  <g>
    <!-- hooves on rim -->
    <ellipse cx="168" cy="292" rx="26" ry="14" fill="#8e8fa6"/>
    <ellipse cx="344" cy="292" rx="26" ry="14" fill="#8e8fa6"/>
    <path d="M150 292h36M326 292h36" stroke="#3a3b4a" stroke-width="6" stroke-linecap="round"/>
    <!-- neck/shoulders -->
    <path d="M196 300 Q210 210 256 196 Q302 210 316 300 Z" fill="#a9adc4"/>
    <!-- head -->
    <ellipse cx="256" cy="196" rx="62" ry="56" fill="#b6bad0"/>
    <ellipse cx="256" cy="222" rx="40" ry="30" fill="#d7dcea"/>
    <!-- ears -->
    <path d="M212 158 Q186 84 206 62 Q232 92 236 152 Z" fill="#a9adc4" stroke="#6f7391" stroke-width="4"/>
    <path d="M300 158 Q326 84 306 62 Q280 92 276 152 Z" fill="#a9adc4" stroke="#6f7391" stroke-width="4"/>
    <path d="M214 146 Q200 96 208 80 Q224 106 228 146 Z" fill="#f0b6c4"/>
    <path d="M298 146 Q312 96 304 80 Q288 106 284 146 Z" fill="#f0b6c4"/>
    <!-- mane -->
    <path d="M232 146 Q256 128 280 146 Q268 158 256 152 Q244 158 232 146Z" fill="#4a4d63"/>
    <!-- eyes: blissful closed -->
    <path d="M222 190 Q234 202 246 190" fill="none" stroke="#2f3244" stroke-width="6" stroke-linecap="round"/>
    <path d="M266 190 Q278 202 290 190" fill="none" stroke="#2f3244" stroke-width="6" stroke-linecap="round"/>
    <!-- nostrils + smile -->
    <ellipse cx="242" cy="224" rx="5" ry="7" fill="#4a4d63"/>
    <ellipse cx="270" cy="224" rx="5" ry="7" fill="#4a4d63"/>
    <path d="M232 240 Q256 258 280 240" fill="none" stroke="#4a4d63" stroke-width="5" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="214" cy="214" rx="13" ry="8" fill="#f4a3b6" opacity="0.7"/>
    <ellipse cx="298" cy="214" rx="13" ry="8" fill="#f4a3b6" opacity="0.7"/>
  </g>

  <!-- water line over chest -->
  <path d="M118 296 Q180 312 256 300 Q332 288 394 300" fill="none" stroke="#bff3ff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- rubber duck -->
  <g>
    <ellipse cx="372" cy="312" rx="26" ry="16" fill="#ffd23f"/>
    <circle cx="392" cy="296" r="13" fill="#ffd23f"/>
    <path d="M402 296 l14 5 -14 5z" fill="#ff8c1a"/>
    <circle cx="392" cy="293" r="3" fill="#2f3244"/>
    <path d="M360 318 q12 8 26 2" fill="none" stroke="#e8b021" stroke-width="4"/>
  </g>

  <!-- towel on rim -->
  <path d="M96 282 q34 -12 62 0 l-4 40 q-30 10 -58 0z" fill="#ff6f91"/>
  <path d="M100 292 q30 -8 54 0M100 306 q30 -8 54 0" fill="none" stroke="#ffd7e0" stroke-width="4"/>

  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.5">
    <path d="M150 250 q-22 -40 6 -74 q26 -32 4 -70"/>
    <path d="M256 240 q-24 -44 4 -78 q26 -34 2 -72"/>
    <path d="M362 250 q22 -40 -6 -74 q-26 -32 -4 -70"/>
  </g>

  <!-- bubbles -->
  <g fill="#eafcff" opacity="0.85">
    <circle cx="128" cy="330" r="9"/><circle cx="150" cy="352" r="5"/><circle cx="404" cy="336" r="8"/>
    <circle cx="330" cy="344" r="6"/><circle cx="196" cy="360" r="4"/><circle cx="286" cy="356" r="5"/>
    <circle cx="92" cy="300" r="6"/><circle cx="430" cy="304" r="5"/>
  </g>

  <!-- splash droplets -->
  <g fill="#bff3ff">
    <circle cx="108" cy="262" r="6"/><circle cx="132" cy="246" r="4"/><circle cx="410" cy="266" r="6"/>
    <circle cx="386" cy="248" r="4"/><circle cx="60" cy="352" r="5"/><circle cx="456" cy="356" r="5"/>
  </g>

  <!-- slippers on deck -->
  <g fill="#5cc4a8" stroke="#2f7d68" stroke-width="3">
    <ellipse cx="86" cy="452" rx="26" ry="12"/><ellipse cx="140" cy="462" rx="26" ry="12"/>
  </g>
</svg>
