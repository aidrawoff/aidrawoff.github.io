<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: dark twilight ice rink -->
  <rect width="512" height="512" fill="#0a1a2a"/>
  <!-- Ice surface: subtle radial gradient -->
  <radialGradient id="ice" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
    <stop offset="0%" stop-color="#e0f7ff"/>
    <stop offset="100%" stop-color="#a5d8ff"/>
  </radialGradient>
  <rect x="0" y="320" width="512" height="192" fill="url(#ice)"/>
  <!-- Peacock body: teal ellipse -->
  <ellipse cx="256" cy="240" rx="40" ry="60" fill="#008080"/>
  <!-- Tail feathers fanned out behind -->
  <path d="M160,240 Q120,200 100,160 Q90,140 110,120 Q130,100 160,100 Q190,100 220,120 Q240,140 230,160 Q220,180 190,200 Q160,220 160,240 Z" fill="#008080"/>
  <!-- Head and eye -->
  <circle cx="256" cy="200" r="20" fill="#008080"/>
  <circle cx="256" cy="200" r="6" fill="#000000"/>
  <!-- Beak -->
  <path d="M256,200 L266,190 L260,185 Z" fill="#ff8c00"/>
  <!-- Skates -->
  <path d="M236,320 L276,320 L276,330 L236,330 Z" fill="#555"/>
  <path d="M236,320 L230,310 L240,310 Z" fill="#555"/>
  <path d="M276,320 L282,310 L272,310 Z" fill="#555"/>
  <!-- Ice sparkle highlights -->
  <circle cx="160" cy="380" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="352" cy="360" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="256" cy="340" r="10" fill="#ffffff" opacity="0.8"/>
</svg>