<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#f0f4ff"/>
  <!-- Sky gradient -->
  <rect x="0" y="0" width="512" height="256" fill="url(#sky)"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="256">
      <stop offset="0%" stop-color="#e0f0ff"/>
      <stop offset="100%" stop-color="#d0e8ff"/>
    </linearGradient>
  </defs>
  <!-- Bat wings as a single path, refined pose -->
  <path d="M256 144c-40 0-72 24-72 64 0 16 8 32 24 48 16 16 32 24 48 24s32-8 48-24c16-16 24-32 24-48 0-40-32-64-72-64zm-72 64c0-16 8-32 24-48 16-16 32-24 48-24s32 8 48 24c16 16 24 32 24 48 0 8-2 16-6 24H202c-4-8-6-16-6-24z" fill="#2a2a2a"/>
  <!-- Subtle reading light on book -->
  <ellipse cx="256" cy="224" rx="48" ry="8" fill="#ffffff" fill-opacity="0.15"/>
  <!-- Book beneath the bat, refined shape and shadow -->
  <rect x="192" y="224" width="128" height="80" rx="8" fill="#d4a017" filter="url(#bookShadow)"/>
  <rect x="196" y="228" width="120" height="64" rx="4" fill="#f5d76e"/>
  <text x="256" y="260" font-family="serif" font-size="24" text-anchor="middle" fill="#333">read</text>
  <defs>
    <filter id="bookShadow" x="-2" y="2" width="132" height="84">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  <!-- Soft highlight on bat wing -->
  <path d="M256 144c-40 0-72 24-72 64 0 16 8 32 24 48 16 16 32 24 48 24s32-8 48-24c16-16 24-32 24-48 0-40-32-64-72-64zm-72 64c0-16 8-32 24-48 16-16 32-24 48-24s32 8 48 24c16 16 24 32 24 48 0 8-2 16-6 24H202c-4-8-6-16-6-24z" fill="#2a2a2a" fill-opacity="0.8"/>
  <!-- Subtle page curl on book -->
  <path d="M316 232c-8 0-16 4-20 12 4-8 12-12 20-12s16 4 20 12c-4 8-12 12-20 12z" fill="#c49010" opacity="0.8"/>
  <!-- Refined bat wing silhouette -->
  <path d="M256 144c-40 0-72 24-72 64 0 16 8 32 24 48 16 16 32 24 48 24s32-8 48-24c16-16 24-32 24-48 0-40-32-64-72-64zm-72 64c0-16 8-32 24-48 16-16 32-24 48-24s32 8 48 24c16 16 24 32 24 48 0 8-2 16-6 24H202c-4-8-6-16-6-24z" fill="#2a2a2a" fill-opacity="0.9"/>
  <!-- Gentle ambient shadow under bat -->
  <ellipse cx="256" cy="224" rx="64" ry="16" fill="#000000" fill-opacity="0.08"/>
</svg>