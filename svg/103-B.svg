<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151728"/>
      <stop offset="100%" stop-color="#2a203d"/>
    </linearGradient>
    <linearGradient id="counter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#96613b"/>
      <stop offset="100%" stop-color="#4e2e17"/>
    </linearGradient>
    <linearGradient id="mug" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8c82"/>
      <stop offset="100%" stop-color="#d13b2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Ambient glow behind counter -->
  <circle cx="320" cy="320" r="160" fill="url(#glow)"/>

  <!-- Shelf / Menu Board -->
  <rect x="70" y="45" width="372" height="110" rx="14" fill="#201f33" stroke="#484370" stroke-width="3"/>
  <text x="256" y="85" fill="#ffd166" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">★ SPELLBREW CAFE ★</text>
  <text x="256" y="115" fill="#c2b6d6" font-family="sans-serif" font-size="15" text-anchor="middle">Midnight Cocoa - 2 Souls</text>
  <text x="256" y="138" fill="#c2b6d6" font-family="sans-serif" font-size="13" text-anchor="middle">Marshmallows &amp; Star Sprinkles</text>

  <!-- Barista Ghost in Background behind counter -->
  <g transform="translate(300, 205)">
    <!-- Floating Shadow -->
    <ellipse cx="65" cy="115" rx="30" ry="8" fill="#000" opacity="0.3"/>
    <!-- Barista Hat -->
    <path d="M 35 25 h 30 v 15 h -30 z" fill="#ffffff"/>
    <path d="M 25 40 h 50 v 8 h -50 z" fill="#e0e4f8"/>
    <!-- Body -->
    <path d="M 20 55 C 20 15, 45 0, 65 0 C 85 0, 110 15, 110 55 C 100 50, 90 60, 80 55 C 70 50, 60 60, 50 55 C 40 50, 30 60, 20 55 Z" fill="#e8ecf8"/>
    <!-- Eyes -->
    <ellipse cx="48" cy="22" rx="4.5" ry="6.5" fill="#1e1c2e"/>
    <ellipse cx="82" cy="22" rx="4.5" ry="6.5" fill="#1e1c2e"/>
    <!-- Smiling Barista -->
    <path d="M 60 30 q 5 5 10 0" fill="none" stroke="#1e1c2e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Serving tray with spare mug -->
    <rect x="75" y="45" width="30" height="4" rx="2" fill="#d0d4e8"/>
    <path d="M 85 45 v -10 a 3 3 0 0 1 3 -3 h 4 a 3 3 0 0 1 3 3 v 10 z" fill="#4ea8de"/>
  </g>

  <!-- Cafe Counter -->
  <rect x="0" y="340" width="512" height="172" fill="url(#counter)"/>
  <rect x="0" y="330" width="512" height="14" fill="#361f0f"/>
  <line x1="0" y1="390" x2="512" y2="390" stroke="#361f0f" stroke-width="3" opacity="0.5"/>
  <line x1="0" y1="450" x2="512" y2="450" stroke="#361f0f" stroke-width="3" opacity="0.3"/>

  <!-- Pastry Plate on Counter -->
  <ellipse cx="380" cy="355" rx="35" ry="10" fill="#f0f2fc"/>
  <!-- Pumpkin muffin -->
  <path d="M 365 355 c -5 -15, 15 -20, 20 -20 c 5 0, 25 5, 20 20 z" fill="#f4a261"/>
  <circle cx="385" cy="333" r="5" fill="#e76f51"/>
  <path d="M 378 335 q 7 -3 14 0" fill="none" stroke="#e76f51" stroke-width="2"/>

  <!-- Ghost Customer -->
  <g transform="translate(130, 170)">
    <!-- Floating Shadow -->
    <ellipse cx="75" cy="245" rx="50" ry="14" fill="#000" opacity="0.45"/>
    
    <!-- Ghost Body -->
    <path d="M 25 210 C 25 90, 60 20, 110 20 C 160 20, 195 90, 195 210 C 180 198, 165 215, 150 202 C 135 189, 120 215, 105 202 C 90 189, 70 215, 55 202 C 40 189, 40 210, 25 210 Z" fill="#f8f9ff" stroke="#d5dcf7" stroke-width="4"/>
    
    <!-- Ghost Eyes (Expressive & happy) -->
    <ellipse cx="75" cy="85" rx="10" ry="14" fill="#151728"/>
    <ellipse cx="125" cy="85" rx="10" ry="14" fill="#151728"/>
    <!-- Eye shine -->
    <circle cx="78" cy="80" r="3.5" fill="#ffffff"/>
    <circle cx="128" cy="80" r="3.5" fill="#ffffff"/>
    
    <!-- Cheerful Open Mouth with tiny tongue -->
    <path d="M 95 113 q 10 14 20 0 z" fill="#151728"/>
    <circle cx="105" cy="121" r="4.5" fill="#ff7b72"/>

    <!-- Cute Blush -->
    <ellipse cx="62" cy="105" rx="8" ry="4" fill="#ffb7b2" opacity="0.7"/>
    <ellipse cx="138" cy="105" rx="8" ry="4" fill="#ffb7b2" opacity="0.7"/>

    <!-- Hot Cocoa Mug held by ghost -->
    <g transform="translate(110, 130)">
      <path d="M 0 0 h 50 a 6 6 0 0 1 6 6 v 35 a 18 18 0 0 1 -18 18 h -20 a 18 18 0 0 1 -18 -18 v -35 a 6 6 0 0 1 6 -6 z" fill="url(#mug)"/>
      <path d="M 56 12 c 12 0, 18 6, 18 15 c 0 9, -6 15, -18 15" fill="none" stroke="#d13b2c" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Whipped Cream / Marshmallow top -->
      <path d="M 5 0 c 5 -10, 20 -10, 25 0 c 5 -10, 20 -10, 25 0 z" fill="#ffffff"/>
      <!-- Star sprinkles on cocoa -->
      <polygon points="25,-3 27,-7 31,-8 27,-10 25,-14 23,-10 19,-8 23,-7" fill="#ffd166"/>
      
      <!-- Steaming swirls -->
      <path d="M 18 -15 q 8 -18 -2 -32" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 38 -18 q -8 -18 4 -35" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>

  <!-- Sparkles in air & magic dust -->
  <g fill="#ffd166" opacity="0.85">
    <polygon points="90,180 93,188 101,191 93,194 90,202 87,194 79,191 87,188"/>
    <polygon points="420,240 422,245 427,247 422,249 420,254 418,249 413,247 418,245"/>
    <circle cx="200" cy="290" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="280" cy="270" r="2.5" fill="#ffd166" opacity="0.7"/>
  </g>
</svg>
