<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#6a0dad"/>

  <!-- Background: Square sky and ground -->
  <rect x="0" y="0" width="512" height="256" fill="#2a235c"/>
  <rect x="0" y="256" width="512" height="256" fill="#1b1425"/>

  <!-- Square "sun" -->
  <rect x="380" y="50" width="80" height="80" fill="#f1c40f" opacity="0.9" rx="4"/>

  <!-- Square city skyline (background) -->
  <rect x="20" y="180" width="60" height="180" fill="#38295c" opacity="0.8"/>
  <rect x="90" y="140" width="70" height="220" fill="#291f45" opacity="0.9"/>
  <rect x="170" y="120" width="85" height="240" fill="#3b2b5e" opacity="0.85"/>
  <rect x="270" y="160" width="90" height="200" fill="#2d224d" opacity="0.9"/>
  <rect x="380" y="130" width="110" height="230" fill="#352656" opacity="0.8"/>

  <!-- Square windows in buildings -->
  <g fill="#f5cd79" opacity="0.6">
    <rect x="35" y="200" width="12" height="12"/>
    <rect x="55" y="200" width="12" height="12"/>
    <rect x="35" y="230" width="12" height="12"/>
    <rect x="55" y="230" width="12" height="12"/>
    <rect x="110" y="160" width="14" height="14"/>
    <rect x="135" y="160" width="14" height="14"/>
    <rect x="110" y="195" width="14" height="14"/>
    <rect x="135" y="195" width="14" height="14"/>
    <rect x="110" y="230" width="14" height="14"/>
    <rect x="135" y="230" width="14" height="14"/>
    <rect x="190" y="140" width="16" height="16"/>
    <rect x="220" y="140" width="16" height="16"/>
    <rect x="190" y="180" width="16" height="16"/>
    <rect x="220" y="180" width="16" height="16"/>
    <rect x="290" y="180" width="15" height="15"/>
    <rect x="325" y="180" width="15" height="15"/>
    <rect x="290" y="220" width="15" height="15"/>
    <rect x="325" y="220" width="15" height="15"/>
  </g>

  <!-- Road markings (square dashes) -->
  <rect x="20" y="440" width="60" height="10" fill="#f1c40f" opacity="0.8"/>
  <rect x="120" y="440" width="60" height="10" fill="#f1c40f" opacity="0.8"/>
  <rect x="220" y="440" width="60" height="10" fill="#f1c40f" opacity="0.8"/>
  <rect x="320" y="440" width="60" height="10" fill="#f1c40f" opacity="0.8"/>
  <rect x="420" y="440" width="60" height="10" fill="#f1c40f" opacity="0.8"/>

  <!-- Square bus stop shelter -->
  <rect x="440" y="240" width="16" height="140" fill="#718093"/>
  <rect x="420" y="210" width="56" height="40" fill="#e74c3c" rx="4"/>
  <rect x="432" y="220" width="32" height="20" fill="#ffffff" rx="2"/>
  <text x="448" y="235" font-family="monospace" font-weight="bold" font-size="14" fill="#c0392b" text-anchor="middle">BUS</text>
  <rect x="390" y="280" width="100" height="100" fill="#ffffff" opacity="0.1" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="380" y="268" width="120" height="16" fill="#475569" rx="2"/>
  <rect x="410" y="200" width="8" height="8" fill="#ffffff" opacity="0.7" rx="2"/>
  <rect x="400" y="210" width="6" height="6" fill="#ffffff" opacity="0.7" rx="2"/>

  <!-- Square bus (late) -->
  <rect x="330" y="280" width="140" height="90" fill="#fbc531" rx="6"/>
  <rect x="420" y="295" width="35" height="45" fill="#2d3436" rx="4"/>
  <rect x="375" y="295" width="35" height="45" fill="#2d3436" rx="4"/>
  <rect x="340" y="295" width="25" height="45" fill="#2d3436" rx="4"/>
  <rect x="465" y="335" width="10" height="15" fill="#ffffff" rx="2"/>
  <rect x="355" y="360" width="30" height="30" fill="#2d3436" rx="6"/>
  <rect x="362" y="367" width="16" height="16" fill="#b2bec3" rx="3"/>
  <rect x="425" y="360" width="30" height="30" fill="#2d3436" rx="6"/>
  <rect x="432" y="367" width="16" height="16" fill="#b2bec3" rx="3"/>
  <rect x="415" y="284" width="45" height="10" fill="#000000" rx="2"/>
  <text x="437" y="292" font-family="monospace" font-size="8" fill="#00ff00" text-anchor="middle">LATE</text>

  <!-- Pelican: square body leaning forward -->
  <rect x="110" y="260" width="90" height="110" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12" transform="rotate(-15 155 315)"/>

  <!-- Pelican wing (flapping back) with motion lines -->
  <rect x="95" y="270" width="60" height="80" fill="#dfe6e9" rx="10" transform="rotate(-35 125 310)"/>
  <rect x="85" y="290" width="50" height="25" fill="#b2bec3" rx="6" transform="rotate(-15 110 300)"/>
  <rect x="70" y="280" width="15" height="15" fill="#ffffff" opacity="0.7" rx="2"/>
  <rect x="60" y="290" width="12" height="12" fill="#ffffff" opacity="0.7" rx="2"/>
  <rect x="50" y="300" width="10" height="10" fill="#ffffff" opacity="0.7" rx="2"/>

  <!-- Pelican neck & head -->
  <rect x="170" y="180" width="35" height="90" fill="#ffffff" stroke="#000000" stroke-width="2" rx="8" transform="rotate(15 187 225)"/>
  <rect x="175" y="145" width="65" height="55" fill="#ffffff" stroke="#000000" stroke-width="2" rx="10"/>

  <!-- Pelican eye (panicked) -->
  <rect x="205" y="158" width="20" height="20" fill="#ffffff" rx="4"/>
  <rect x="213" y="164" width="8" height="8" fill="#2d3436"/>
  <rect x="202" y="152" width="26" height="6" fill="#2d3436" transform="rotate(-20 215 155)" rx="2"/>

  <!-- Pelican massive square pouch beak -->
  <rect x="215" y="175" width="95" height="55" fill="#ff7979" rx="12"/>
  <rect x="300" y="210" width="20" height="25" fill="#d63031" rx="8"/>
  <rect x="215" y="198" width="85" height="6" fill="#c0392b" rx="2"/>

  <!-- Pelican square bowtie -->
  <rect x="185" y="260" width="25" height="15" fill="#e74c3c" rx="3" transform="rotate(15 197 267)"/>
  <rect x="192" y="262" width="11" height="11" fill="#c0392b" rx="2"/>

  <!-- Pelican legs -->
  <rect x="135" y="390" width="12" height="45" fill="#e67e22"/>
  <rect x="120" y="430" width="30" height="12" fill="#e67e22" rx="3"/>
  <rect x="185" y="380" width="12" height="50" fill="#e67e22"/>
  <rect x="175" y="425" width="35" height="12" fill="#e67e22" rx="3"/>

  <!-- Pelican clock in wing -->
  <rect x="125" y="325" width="30" height="30" fill="#f1c40f" rx="6"/>
  <rect x="131" y="331" width="18" height="18" fill="#ffffff" rx="3"/>
  <rect x="139" y="335" width="3" height="9" fill="#c0392b"/>
  <rect x="135" y="341" width="9" height="3" fill="#2d3436"/>

  <!-- Pelican sweat drops -->
  <rect x="245" y="130" width="10" height="14" fill="#0984e3" rx="4"/>
  <rect x="265" y="145" width="8" height="12" fill="#0984e3" rx="3"/>
  <rect x="230" y="120" width="6" height="8" fill="#0984e3" rx="2"/>

  <!-- Foreground square overlay frame -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#e1b12c" stroke-width="8" opacity="0.5"/>
</svg>
