<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#f0f8ff"/>
  <!-- Carnival tent backdrop with stripes -->
  <path d="M0 384h512v128H0z" fill="#d42f4f"/>
  <path d="M0 384h128v128H0z" fill="#f7d442"/>
  <path d="M256 384h128v128H256z" fill="#f7d442"/>
  <path d="M128 384h256v128H128z" fill="#f7d442"/>
  <!-- Tent stripes -->
  <path d="M0 384h512v8H0z" fill="#a01a2f" opacity="0.6"/>
  <path d="M0 392h512v8H0z" fill="#a01a2f" opacity="0.6"/>
  <path d="M0 400h512v8H0z" fill="#a01a2f" opacity="0.6"/>
  <path d="M0 408h512v8H0z" fill="#a01a2f" opacity="0.6"/>
  <path d="M0 416h512v8H0z" fill="#a01a2f" opacity="0.6"/>
  <path d="M0 424h512v8H0z" fill="#a01a2f" opacity="0.6"/>
  <path d="M0 432h512v8H0z" fill="#a01a2f" opacity="0.6"/>
  <!-- Pig body with gradient -->
  <defs>
    <radialGradient id="pigGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e894a0"/>
      <stop offset="100%" stop-color="#d17c8a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="256" cy="320" r="64" fill="url(#pigGrad)"/>
  <!-- Snout with highlight -->
  <circle cx="256" cy="304" r="24" fill="#f5cba7"/>
  <circle cx="256" cy="300" r="8" fill="#fff" opacity="0.8"/>
  <!-- Ears -->
  <ellipse cx="224" cy="288" rx="16" ry="24" fill="#e894a0"/>
  <ellipse cx="288" cy="288" rx="16" ry="24" fill="#e894a0"/>
  <!-- Eyes with sparkle -->
  <circle cx="244" cy="300" r="6" fill="#2a1e18"/>
  <circle cx="268" cy="300" r="6" fill="#2a1e18"/>
  <circle cx="244" cy="298" r="2" fill="#fff"/>
  <circle cx="268" cy="298" r="2" fill="#fff"/>
  <!-- Curly tail with curl -->
  <path d="M320 320c8-16 16-8 24 0s16 16 8 24-16 8-24 0-16-16-8-24 16-8 24 0z" fill="#e894a0"/>
  <path d="M336 312c4-8 8-4 12 0s8 8 4 12-8 4-12 0-8-8-4-12 8-4 12 0z" fill="#d17c8a"/>
  <!-- Legs -->
  <rect x="224" y="384" width="16" height="48" rx="8" fill="#e894a0"/>
  <rect x="272" y="384" width="16" height="48" rx="8" fill="#e894a0"/>
  <rect x="192" y="384" width="16" height="48" rx="8" fill="#e894a0"/>
  <rect x="320" y="384" width="16" height="48" rx="8" fill="#e894a0"/>
  <!-- Carnival ring with glow -->
  <circle cx="256" cy="224" r="40" fill="none" stroke="#ff6b6b" stroke-width="8" stroke-dasharray="8 6" filter="url(#glow)"/>
  <!-- Balloon string -->
  <path d="M256 184v-40" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
  <!-- Balloon with glow -->
  <ellipse cx="256" cy="128" rx="16" ry="24" fill="#ff9f43" filter="url(#softGlow)"/>
  <circle cx="256" cy="128" r="6" fill="#fff"/>
  <!-- Booth window -->
  <rect x="160" y="320" width="32" height="32" rx="4" fill="#a01a2f" opacity="0.7"/>
  <rect x="164" y="324" width="24" height="24" rx="2" fill="#f7d442"/>
  <!-- Booth sign -->
  <rect x="368" y="320" width="64" height="32" rx="8" fill="#f7d442"/>
  <text x="400" y="340" font-family="serif" font-size="16" text-anchor="middle" fill="#a01a2f">PIG RING</text>
  <!-- Pig shadow for depth -->
  <ellipse cx="256" cy="384" rx="72" ry="16" fill="#000" opacity="0.1"/>
</svg>