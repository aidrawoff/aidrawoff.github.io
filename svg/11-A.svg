<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: deep night sea -->
  <rect width="512" height="512" fill="#010a2a"/>

  <!-- Moon and stars -->
  <circle cx="400" cy="60" r="25" fill="#f8f8d0" />
  <path d="M 390 50 L 410 50 M 395 45 L 405 45 M 395 70 L 405 70 M 380 65 L 385 65 M 415 65 L 420 65" stroke="#f8f8d0" stroke-width="1" />
  <circle cx="120" cy="150" r="1" fill="#ffffff" />
  <circle cx="200" cy="50" r="1.5" fill="#ffffff" />
  <circle cx="300" cy="200" r="1" fill="#ffffff" />
  <circle cx="450" cy="100" r="1.2" fill="#ffffff" />
  <circle cx="80" cy="250" r="1" fill="#ffffff" />

  <!-- Soft underwater glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
    <stop offset="0%" stop-color="#a8e6ff" stop-opacity="0.6" />
    <stop offset="100%" stop-color="#010a2a" stop-opacity="0.1" />
  </radialGradient>
  <rect x="0" y="0" width="512" height="512" fill="url(#glow)" />

  <!-- Underwater castle silhouette (front-and-center, unobstructed) -->
  <!-- Main tower -->
  <path d="M256 120 L256 280 L220 280 L220 320 L292 320 L292 280 L256 280 Z" fill="#3a3a3a"/>
  <!-- Tower top spire -->
  <path d="M256 120 L240 100 L272 100 Z" fill="#3a3a3a"/>
  <!-- Battlements -->
  <path d="M220 280 L292 280 M220 290 L292 290 M220 300 L292 300 M220 310 L292 310" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
  <!-- Windows (glowing) -->
  <rect x="230" y="180" width="8" height="12" fill="#0a1e3c" stroke="#a8e6ff" stroke-width="0.5"/>
  <rect x="268" y="180" width="8" height="12" fill="#0a1e3c" stroke="#a8e6ff" stroke-width="0.5"/>
  <rect x="230" y="220" width="8" height="12" fill="#0a1e3c" stroke="#a8e6ff" stroke-width="0.5"/>
  <rect x="268" y="220" width="8" height="12" fill="#0a1e3c" stroke="#a8e6ff" stroke-width="0.5"/>
  <!-- Additional glowing windows -->
  <rect x="240" y="240" width="6" height="8" fill="#0a1e3c" stroke="#a8e6ff" stroke-width="0.5"/>
  <rect x="276" y="240" width="6" height="8" fill="#0a1e3c" stroke="#a8e6ff" stroke-width="0.5"/>
  <!-- Doorway glow -->
  <rect x="250" y="300" width="12" height="16" fill="#0a1e3c" stroke="#a8e6ff" stroke-width="0.5"/>

  <!-- Castle base (submerged rocks/platform) -->
  <path d="M180 320 Q256 340 332 320 L332 360 L180 360 Z" fill="#2a2a2a"/>

  <!-- Tall seaweed fronds (left/right, subtle) -->
  <path d="M120 360 Q110 420 100 480" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M392 360 Q402 420 412 480" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Moonlight shaft through water -->
  <path d="M256 0 Q220 100 256 200" stroke="#b3e5fc" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Coral and sea life -->
  <!-- Coral structures -->
  <path d="M 50 400 L 60 350 L 70 400 Z" fill="#e67e5b" />
  <path d="M 100 420 L 110 370 L 120 420 Z" fill="#f39c12" />
  <path d="M 300 410 L 310 360 L 320 410 Z" fill="#e74c3c" />
  <path d="M 400 430 L 410 380 L 420 430 Z" fill="#9b59b6" />
  <!-- Additional coral -->
  <path d="M 150 440 L 160 390 L 170 440 Z" fill="#3498db" />
  <path d="M 200 450 L 210 400 L 220 450 Z" fill="#1abc9c" />

  <!-- Sea creatures -->
  <!-- Jellyfish -->
  <circle cx="100" cy="120" r="15" fill="#e1f5fe" opacity="0.8" />
  <path d="M 100 105 L 90 90 L 100 105 L 110 90 Z" stroke="#0277bd" stroke-width="2" fill="none" />
  <!-- Fish -->
  <path d="M 350 200 L 370 190 L 380 200 L 370 210 Z" fill="#f1c40f" />
  <circle cx="365" cy="200" r="3" fill="#2c3e50" />
  <!-- Seahorse -->
  <path d="M 250 320 L 260 310 L 270 320 L 260 330 Z" fill="#ecf0f1" />
  <path d="M 260 310 L 255 300 L 260 310" stroke="#2c3e50" stroke-width="1" fill="none" />
  <!-- Additional fish -->
  <path d="M 180 280 L 200 270 L 210 280 L 200 290 Z" fill="#e74c3c" />
  <circle cx="195" cy="280" r="2" fill="#2c3e50" />
  <path d="M 300 300 L 320 290 L 330 300 L 320 310 Z" fill="#3498db" />
  <circle cx="315" cy="300" r="2" fill="#2c3e50" />

  <!-- Bubbles -->
  <circle cx="150" cy="180" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="250" cy="160" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="350" cy="190" r="2.5" fill="#ffffff" opacity="0.7" />
  <circle cx="180" cy="220" r="1" fill="#ffffff" opacity="0.7" />
  <!-- More bubbles -->
  <circle cx="120" cy="200" r="1.2" fill="#ffffff" opacity="0.7" />
  <circle cx="280" cy="140" r="1.8" fill="#ffffff" opacity="0.7" />
  <circle cx="400" cy="210" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="90" cy="260" r="1" fill="#ffffff" opacity="0.7" />

  <!-- Subtle texture on castle -->
  <path d="M220 280 L292 280 M220 290 L292 290 M220 300 L292 300 M220 310 L292 310" stroke="#5a5a5a" stroke-width="0.5" stroke-dasharray="2,2"/>
  <path d="M256 120 L256 280" stroke="#5a5a5a" stroke-width="0.5" stroke-dasharray="2,2"/>
</svg>
