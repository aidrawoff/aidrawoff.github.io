<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140C24"/>
      <stop offset="100%" stop-color="#2D1942"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1BEE7"/>
      <stop offset="100%" stop-color="#CE93D8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Castle Interior Background -->
  <rect width="512" height="512" fill="url(#wallGrad)"/>

  <!-- Ornate Stone Brick Pattern / Texture Lines -->
  <g stroke="#D1C4E9" stroke-width="3" fill="none" opacity="0.6">
    <path d="M0 50 H512 M0 100 H512 M0 150 H512 M0 200 H512 M0 250 H512 M0 300 H512"/>
    <path d="M64 0 V50 M128 0 V50 M192 0 V50 M256 0 V50 M320 0 V50 M384 0 V50 M448 0 V50" />
    <path d="M32 50 V100 M96 50 V100 M160 50 V100 M224 50 V100 M288 50 V100 M352 50 V100 M416 50 V100 M480 50 V100" />
    <path d="M64 100 V150 M128 100 V150 M192 100 V150 M256 100 V150 M320 100 V150 M384 100 V150 M448 100 V150" />
    <path d="M32 150 V200 M96 150 V200 M160 150 V200 M224 150 V200 M288 150 V200 M352 150 V200 M416 150 V200 M480 150 V200" />
    <path d="M64 200 V250 M128 200 V250 M192 200 V250 M256 200 V250 M320 200 V250 M384 200 V250 M448 200 V250" />
    <path d="M32 250 V300 M96 250 V300 M160 250 V300 M224 250 V300 M288 250 V300 M352 250 V300 M416 250 V300 M480 250 V300" />
  </g>

  <!-- Castle Banners / Tapestries on Walls -->
  <g transform="translate(60, 40)">
    <path d="M0 0 H50 L50 180 Q25 210 0 180 Z" fill="#9C27B0" stroke="#4A148C" stroke-width="5" stroke-linejoin="round"/>
    <path d="M25 50 L29 65 L44 65 L32 75 L36 90 L25 80 L14 90 L18 75 L6 65 L21 65 Z" fill="#FFD700" stroke="#4A148C" stroke-width="3"/>
    <path d="M0 0 H50" fill="none" stroke="#FFD700" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="translate(402, 40)">
    <path d="M0 0 H50 L50 180 Q25 210 0 180 Z" fill="#9C27B0" stroke="#4A148C" stroke-width="5" stroke-linejoin="round"/>
    <path d="M25 50 L29 65 L44 65 L32 75 L36 90 L25 80 L14 90 L18 75 L6 65 L21 65 Z" fill="#FFD700" stroke="#4A148C" stroke-width="3"/>
    <path d="M0 0 H50" fill="none" stroke="#FFD700" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Majestic Arched Window looking out to Moon / Earth -->
  <g>
    <!-- Window Outer Arch / Wall Cutout -->
    <path d="M126 310 V150 C126 80 180 30 256 30 C332 30 386 80 386 150 V310 Z" fill="url(#skyGrad)" stroke="#4A148C" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Stars outside -->
    <g fill="#FFF" opacity="0.9">
      <circle cx="160" cy="70" r="3"/>
      <circle cx="340" cy="60" r="2.5"/>
      <circle cx="370" cy="120" r="2"/>
      <circle cx="150" cy="140" r="2.5"/>
      <circle cx="280" cy="55" r="3.5"/>
      <circle cx="210" cy="90" r="2"/>
    </g>

    <!-- Planet Earth rising with atmospheric glow -->
    <circle cx="330" cy="130" r="48" fill="#42A5F5" stroke="#4A148C" stroke-width="5"/>
    <path d="M300 110 C310 100 330 105 340 120 C350 135 330 160 315 150 Z" fill="#66BB6A" stroke="#4A148C" stroke-width="4" stroke-linejoin="round"/>
    <path d="M330 90 C345 85 355 95 350 105 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- Moon surface outside window sill -->
    <path d="M126 270 C180 260 230 280 386 270 V310 H126 Z" fill="#B0A8C0" stroke="#4A148C" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="200" cy="285" r="14" fill="#9B92AB" stroke="#4A148C" stroke-width="4"/>
    <circle cx="310" cy="295" r="10" fill="#9B92AB" stroke="#4A148C" stroke-width="4"/>
  </g>

  <!-- Window Stained Glass Arch (Sparkling Gold & Pink) -->
  <path d="M126 150 C126 80 180 30 256 30 C332 30 386 80 386 150" fill="none" stroke="#FFD700" stroke-width="8" opacity="0.9"/>
  <path d="M135 155 C135 90 185 40 256 40 C327 40 377 90 377 155" fill="none" stroke="#FF80AB" stroke-width="4" opacity="0.7"/>

  <!-- Castle Floor -->
  <path d="M0 310 L512 310 L512 512 L0 512 Z" fill="url(#floorGrad)" stroke="#4A148C" stroke-width="8" stroke-linejoin="round"/>

  <!-- Floor tile perspective lines -->
  <g stroke="#BA68C8" stroke-width="4" opacity="0.7">
    <line x1="256" y1="310" x2="256" y2="512"/>
    <line x1="256" y1="310" x2="60" y2="512"/>
    <line x1="256" y1="310" x2="452" y2="512"/>
    <line x1="0" y1="380" x2="512" y2="380"/>
    <line x1="0" y1="450" x2="512" y2="450"/>
  </g>

  <!-- Picnic Blanket (Cozy Pastel Pink & Cream Scalloped) -->
  <g transform="translate(110, 320)">
    <!-- Blanket drop shadow -->
    <ellipse cx="150" cy="110" rx="160" ry="65" fill="#000" opacity="0.2"/>
    
    <!-- Blanket base -->
    <path d="M20 100 C20 40 90 15 150 20 C210 15 280 40 280 100 C280 160 210 190 150 185 C90 190 20 160 20 100 Z" fill="#F48FB1" stroke="#4A148C" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Blanket Pattern (White Scallops / Stars) -->
    <path d="M50 70 Q90 50 130 80 T210 90 T250 120" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <path d="M40 120 Q90 100 140 130 T240 140" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Picnic Basket with Strawberries & Bread -->
  <g transform="translate(330, 350)">
    <ellipse cx="40" cy="55" rx="38" ry="12" fill="#000" opacity="0.25"/>
    <path d="M10 20 H70 L80 65 H0 Z" fill="#D7CCC8" stroke="#4A148C" stroke-width="6" stroke-linejoin="round"/>
    <path d="M18 20 L10 65 M32 20 L30 65 M48 20 L50 65 M62 20 L70 65" stroke="#8D6E63" stroke-width="3" opacity="0.7"/>
    <path d="M5 35 H75 M5 50 H75" stroke="#8D6E63" stroke-width="3" opacity="0.7"/>
    <path d="M22 20 C22 -12 58 -12 58 20" fill="none" stroke="#4A148C" stroke-width="6" stroke-linecap="round"/>
    <path d="M24 20 C24 -9 56 -9 56 20" fill="none" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 10 Q50 -5 60 15 Z" fill="#FFB74D" stroke="#4A148C" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Moon-Cheese Wheel & Plate -->
  <g transform="translate(140, 380)">
    <ellipse cx="45" cy="35" rx="50" ry="20" fill="#FFF" stroke="#4A148C" stroke-width="6"/>
    <path d="M15 25 L75 10 L60 45 Z" fill="#FFD700" stroke="#4A148C" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M15 25 L75 10 L60 45 Z" fill="#FFD700" stroke="#4A148C" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="38" cy="27" r="5" fill="#FFA500" stroke="#4A148C" stroke-width="3"/>
    <circle cx="58" cy="20" r="4" fill="#FFA500" stroke="#4A148C" stroke-width="3"/>
  </g>

  <!-- Extra Magic Pastry / Cupcake Plate -->
  <g transform="translate(230, 420)">
    <ellipse cx="30" cy="25" rx="35" ry="14" fill="#FFF" stroke="#4A148C" stroke-width="5"/>
    <path d="M15 25 L20 40 H40 L45 25 Z" fill="#CE93D8" stroke="#4A148C" stroke-width="4"/>
    <path d="M12 25 C12 10 48 10 48 25 C48 30 12 30 12 25 Z" fill="#FF80AB" stroke="#4A148C" stroke-width="4"/>
    <circle cx="30" cy="10" r="6" fill="#D32F2F" stroke="#4A148C" stroke-width="3"/>
  </g>

  <!-- Cute Character: Space Princess Bunny having picnic -->
  <g transform="translate(210, 290)">
    <!-- Princess Dress Body -->
    <path d="M25 100 C15 75 25 40 50 35 C75 40 85 75 75 100 Z" fill="#FF80AB" stroke="#4A148C" stroke-width="6" stroke-linejoin="round"/>
    <path d="M30 38 Q50 50 70 38 L65 48 Q50 58 35 48 Z" fill="#FFF" stroke="#4A148C" stroke-width="4"/>

    <!-- Head -->
    <circle cx="50" cy="25" r="28" fill="#FFF" stroke="#4A148C" stroke-width="6"/>
    
    <!-- Bunny Ears (Floppy & Adorable) -->
    <path d="M32 5 C22 -25 2 -15 15 15 Z" fill="#FFF" stroke="#4A148C" stroke-width="6" stroke-linejoin="round"/>
    <path d="M30 0 C22 -18 10 -10 18 10 Z" fill="#FF80AB"/>
    
    <path d="M68 5 C78 -25 98 -15 85 15 Z" fill="#FFF" stroke="#4A148C" stroke-width="6" stroke-linejoin="round"/>
    <path d="M70 0 C78 -18 90 -10 82 10 Z" fill="#FF80AB"/>

    <!-- Cute Happy Face -->
    <path d="M38 22 Q42 16 46 22" fill="none" stroke="#4A148C" stroke-width="4" stroke-linecap="round"/>
    <path d="M54 22 Q58 16 62 22" fill="none" stroke="#4A148C" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="50" cy="28" rx="3.5" ry="2.5" fill="#FF4081"/>
    <path d="M46 32 Q50 37 54 32" fill="none" stroke="#4A148C" stroke-width="3.5" stroke-linecap="round"/>
    
    <circle cx="37" cy="30" r="5" fill="#FF80AB" opacity="0.7"/>
    <circle cx="63" cy="30" r="5" fill="#FF80AB" opacity="0.7"/>

    <!-- Princess Tiara with Gem -->
    <path d="M33 12 Q50 -2 67 12 L65 18 Q50 8 35 18 Z" fill="#FFD700" stroke="#4A148C" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="50" cy="6" r="5" fill="#FF4081" stroke="#4A148C" stroke-width="4"/>
  </g>

  <!-- Floating Magic / Floating Teacup in Low Gravity -->
  <g transform="translate(105, 305)" filter="url(#glow)">
    <path d="M10 20 C10 38 32 38 32 20 Z" fill="#4DD0E1" stroke="#4A148C" stroke-width="5" stroke-linejoin="round"/>
    <path d="M32 23 C40 23 40 32 32 34" fill="none" stroke="#4A148C" stroke-width="5" stroke-linecap="round"/>
    <circle cx="21" cy="4" r="3.5" fill="#FFD700"/>
    <circle cx="10" cy="-4" r="2.5" fill="#FF80AB"/>
  </g>

  <!-- Sparkling Fairy Dust & Stars in Castle -->
  <g fill="#FFD700" stroke="#4A148C" stroke-width="3">
    <path d="M 90 190 L 94 198 L 102 202 L 94 206 L 90 214 L 86 206 L 78 202 L 86 198 Z"/>
    <path d="M 430 210 L 433 216 L 440 219 L 433 222 L 430 228 L 427 222 L 420 219 L 427 216 Z"/>
    <path d="M 240 170 L 242 175 L 247 177 L 242 179 L 240 184 L 238 179 L 233 177 L 238 175 Z"/>
  </g>

  <!-- Extra Whimsical Floating Bubbles & Hearts -->
  <circle cx="390" cy="280" r="14" fill="none" stroke="#FF80AB" stroke-width="5" opacity="0.85"/>
  <circle cx="395" cy="274" r="4" fill="#FFF" opacity="0.9"/>
  <path d="M 120 250 Q 125 240 130 250 Q 135 260 120 270 Q 105 260 110 250 Z" fill="#FF80AB" stroke="#4A148C" stroke-width="3" opacity="0.8"/>
</svg>
