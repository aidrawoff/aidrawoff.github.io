      <stop offset="1" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- window with sun -->
  <rect x="18" y="60" width="78" height="100" rx="6" fill="#fff3e0" stroke="#8d6e63" stroke-width="8"/>
  <circle cx="57" cy="105" r="22" fill="#ffd54f"/>
  <line x1="57" y1="60" x2="57" y2="160" stroke="#8d6e63" stroke-width="6"/>
  <!-- wall shelf -->
  <rect x="330" y="120" width="150" height="10" rx="3" fill="#6d4c41"/>
  <rect x="345" y="92" width="26" height="28" fill="#f48fb1"/>
  <rect x="395" y="82" width="30" height="38" fill="#90caf9"/>
