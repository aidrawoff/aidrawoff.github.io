  <path d="M288 262 L306 262 L302 240 L292 240 Z" fill="#ffd54f"/>
  <ellipse cx="297" cy="236" rx="16" ry="12" fill="#f8bbd0"/>
  <circle cx="237" cy="232" r="2" fill="#e53935"/>
  <circle cx="267" cy="229" r="2" fill="#43a047"/>
  <circle cx="297" cy="232" r="2" fill="#1e88e5"/>
