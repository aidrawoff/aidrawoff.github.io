<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#31225e"/>
      <stop offset="60%" stop-color="#191035"/>
      <stop offset="100%" stop-color="#0b0517"/>
    </radialGradient>
    <radialGradient id="ghostGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="55%" stop-color="#d4e0ff" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#8ba4f5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6a82db" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="pumpkinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff7518" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="10" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric floating wisps / stars & magical sparkles -->
  <g fill="#aab8ff" opacity="0.6">
    <circle cx="90" cy="110" r="2.5"/>
    <circle cx="430" cy="80" r="2"/>
    <circle cx="420" cy="320" r="3"/>
    <circle cx="70" cy="360" r="2"/>
    <circle cx="230" cy="70" r="1.5"/>
    <circle cx="370" cy="160" r="2"/>
    <circle cx="140" cy="230" r="1.5"/>
    <path d="M 450 140 L 454 150 L 464 154 L 454 158 L 450 168 L 446 158 L 436 154 L 446 150 Z" fill="#ffd700" opacity="0.7"/>
    <path d="M 80 430 L 82 436 L 88 438 L 82 440 L 80 446 L 78 440 L 72 438 L 78 436 Z" fill="#ffd700" opacity="0.5"/>
  </g>

  <!-- Ground & Floor -->
  <ellipse cx="256" cy="465" rx="230" ry="45" fill="#120822"/>
  <path d="M 26 465 Q 256 425 486 465 L 486 512 L 26 512 Z" fill="#080312"/>

  <!-- Glowing little carved pumpkin -->
  <g transform="translate(325, 395)">
    <circle cx="30" cy="35" r="38" fill="url(#pumpkinGlow)"/>
    <ellipse cx="30" cy="40" rx="26" ry="21" fill="#e65c00"/>
    <ellipse cx="30" cy="40" rx="19" ry="21" fill="#ff7518"/>
    <ellipse cx="30" cy="40" rx="10" ry="21" fill="#ff943d"/>
    <path d="M 30 16 Q 36 24 32 32" stroke="#251406" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polygon points="21,36 25,43 17,43" fill="#140702"/>
    <polygon points="39,36 43,43 35,43" fill="#140702"/>
    <path d="M 24 50 Q 30 45 36 50 Q 30 54 24 50 Z" fill="#140702"/>
  </g>

  <!-- Floating Autumn Leaf -->
  <g transform="translate(120, 280) rotate(-25)">
    <path d="M 0 0 Q 15 -10 25 10 Q 5 20 0 0 Z" fill="#e06d28" opacity="0.9"/>
    <path d="M 0 0 Q 12 5 25 10" stroke="#8c3208" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Nervous Little Ghost -->
  <g filter="url(#softShadow)">
    <!-- Ghost Body -->
    <path d="M 256 100 
             C 340 100, 375 155, 375 245 
             C 375 305, 355 350, 335 380 
             C 320 400, 308 435, 302 448
             C 296 435, 284 400, 269 380
             C 254 400, 242 435, 236 448
             C 230 435, 218 400, 203 380
             C 183 350, 157 305, 157 245 
             C 157 155, 172 100, 256 100 Z" 
          fill="url(#ghostGlow)" filter="url(#glow)"/>

    <!-- Inner Core Brightness -->
    <path d="M 256 120 
             C 320 120, 350 165, 350 245 
             C 350 300, 332 340, 316 368 
             C 304 388, 296 415, 291 425
             C 286 415, 278 388, 266 368 
             C 250 340, 232 300, 232 245 
             C 232 165, 192 120, 256 120 Z" 
          fill="#ffffff" opacity="0.45"/>

    <!-- Shaking / Tremble Lines -->
    <g stroke="#9bb1ff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M 132 200 Q 144 207 132 214"/>
      <path d="M 124 235 Q 136 242 124 249"/>
      <path d="M 380 215 Q 368 222 380 229"/>
      <path d="M 388 250 Q 376 257 388 264"/>
    </g>

    <!-- Rosy Nervous Blushes -->
    <ellipse cx="212" cy="235" rx="12" ry="7" fill="#ff8da1" opacity="0.65"/>
    <ellipse cx="300" cy="235" rx="12" ry="7" fill="#ff8da1" opacity="0.65"/>

    <!-- Hands on Cheeks -->
    <g>
      <circle cx="210" cy="250" r="14" fill="#ffffff" stroke="#c4d4ff" stroke-width="2.5"/>
      <circle cx="302" cy="250" r="14" fill="#ffffff" stroke="#c4d4ff" stroke-width="2.5"/>
    </g>

    <!-- Eyes (Wide & Anxious - cute anime closed/wobbly look) -->
    <path d="M 215 210 Q 224 204 233 210" stroke="#130b26" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 279 210 Q 288 204 297 210" stroke="#130b26" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="224" cy="216" r="3" fill="#130b26"/>
    <circle cx="288" cy="216" r="3" fill="#130b26"/>

    <!-- Worried Tilted Eyebrows -->
    <path d="M 212 192 Q 224 199 236 192" stroke="#130b26" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 276 192 Q 288 199 300 192" stroke="#130b26" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Trembling Mouth -->
    <ellipse cx="256" cy="235" rx="7" ry="10" fill="#130b26"/>
    <path d="M 252 230 Q 256 235 260 230" stroke="#ffffff" stroke-width="1.5" fill="none"/>

    <!-- Big Sweat Drop -->
    <g transform="translate(310, 170) rotate(15)">
      <path d="M 12 0 C 12 0 24 16 24 26 C 24 33 18 38 12 38 C 6 38 0 33 0 26 C 0 16 12 0 12 0 Z" fill="#6bc5f8" opacity="0.95" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M 8 18 C 10 18 12 20 12 24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
