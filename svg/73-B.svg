<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sky and ground -->
  <rect width="512" height="512" fill="#87CEEB"/>
  <rect y="340" width="512" height="172" fill="#7CB342"/>
  <ellipse cx="256" cy="380" rx="200" ry="60" fill="#689F38"/>

  <!-- Beaver body -->
  <ellipse cx="256" cy="300" rx="70" ry="85" fill="#8D6E63"/>
  <ellipse cx="256" cy="300" rx="55" ry="70" fill="#A1887F"/>

  <!-- Beaver head -->
  <ellipse cx="256" cy="210" rx="55" ry="48" fill="#8D6E63"/>
  <ellipse cx="256" cy="210" rx="42" ry="36" fill="#A1887F"/>

  <!-- Ears -->
  <circle cx="210" cy="175" r="14" fill="#8D6E63"/>
  <circle cx="302" cy="175" r="14" fill="#8D6E63"/>
  <circle cx="210" cy="175" r="8" fill="#D7CCC8"/>
  <circle cx="302" cy="175" r="8" fill="#D7CCC8"/>

  <!-- Eyes -->
  <ellipse cx="236" cy="200" rx="8" ry="10" fill="#3E2723"/>
  <ellipse cx="276" cy="200" rx="8" ry="10" fill="#3E2723"/>
  <circle cx="238" cy="197" r="3" fill="white"/>
  <circle cx="278" cy="197" r="3" fill="white"/>

  <!-- Cheeks -->
  <ellipse cx="220" cy="220" rx="12" ry="8" fill="#FF8A80" opacity="0.6"/>
  <ellipse cx="292" cy="220" rx="12" ry="8" fill="#FF8A80" opacity="0.6"/>

  <!-- Nose and mouth -->
  <ellipse cx="256" cy="225" rx="16" ry="10" fill="#3E2723"/>
  <path d="M 248 235 Q 256 245 264 235" stroke="#3E2723" stroke-width="3" fill="none"/>

  <!-- Buck teeth -->
  <rect x="248" y="235" width="7" height="12" fill="white"/>
  <rect x="257" y="235" width="7" height="12" fill="white"/>

  <!-- Whiskers -->
  <line x1="210" y1="225" x2="190" y2="220" stroke="#5D4037" stroke-width="2"/>
  <line x1="210" y1="232" x2="188" y2="235" stroke="#5D4037" stroke-width="2"/>
  <line x1="302" y1="225" x2="322" y2="220" stroke="#5D4037" stroke-width="2"/>
  <line x1="302" y1="232" x2="324" y2="235" stroke="#5D4037" stroke-width="2"/>

  <!-- Tail -->
  <ellipse cx="340" cy="320" rx="55" ry="22" fill="#5D4037" transform="rotate(-15 340 320)"/>

  <!-- Arms -->
  <ellipse cx="195" cy="275" rx="18" ry="35" fill="#8D6E63" transform="rotate(25 195 275)"/>
  <ellipse cx="317" cy="275" rx="18" ry="35" fill="#8D6E63" transform="rotate(-25 317 275)"/>

  <!-- Hands holding trowel -->
  <circle cx="185" cy="295" r="12" fill="#A1887F"/>
  <circle cx="327" cy="295" r="12" fill="#A1887F"/>

  <!-- Trowel -->
  <rect x="248" y="285" width="16" height="50" rx="3" fill="#B0BEC5"/>
  <path d="M 240 335 L 272 335 L 256 380 Z" fill="#78909C"/>
  <rect x="252" y="275" width="8" height="12" rx="2" fill="#8D6E63"/>

  <!-- Feet -->
  <ellipse cx="225" cy="380" rx="22" ry="14" fill="#5D4037"/>
  <ellipse cx="287" cy="380" rx="22" ry="14" fill="#5D4037"/>

  <!-- Overalls -->
  <path d="M 210 260 L 210 340 L 302 340 L 302 260 Z" fill="#1565C0"/>
  <rect x="210" y="260" width="92" height="35" fill="#1565C0"/>
  <rect x="235" y="260" width="42" height="50" fill="#0D47A1"/>
  <circle cx="220" cy="270" r="5" fill="#FFD700"/>
  <circle cx="292" cy="270" r="5" fill="#FFD700"/>
  <rect x="240" y="320" width="32" height="4" rx="2" fill="#0D47A1"/>
  <rect x="240" y="328" width="24" height="4" rx="2" fill="#0D47A1"/>

  <!-- Straw hat -->
  <ellipse cx="256" cy="155" rx="90" ry="18" fill="#F9A825"/>
  <path d="M 220 155 Q 256 100 292 155" fill="#F9A825"/>
  <ellipse cx="256" cy="145" rx="50" ry="12" fill="#FBC02D"/>
  <path d="M 225 148 Q 256 138 287 148" stroke="#E65100" stroke-width="4" fill="none"/>
  <ellipse cx="240" cy="148" rx="18" ry="5" fill="#FFF9C4" opacity="0.5" transform="rotate(-10 240 148)"/>

  <!-- Carrot patch -->
  <g transform="translate(80,360)">
    <rect x="10" y="20" width="6" height="25" fill="#FF7043"/>
    <rect x="25" y="15" width="6" height="30" fill="#FF7043"/>
    <rect x="40" y="22" width="6" height="23" fill="#FF7043"/>
    <path d="M 5 20 Q 13 5 20 20" stroke="#4CAF50" stroke-width="3" fill="none"/>
    <path d="M 20 15 Q 28 0 35 15" stroke="#4CAF50" stroke-width="3" fill="none"/>
    <path d="M 35 22 Q 43 7 50 22" stroke="#4CAF50" stroke-width="3" fill="none"/>
  </g>

  <!-- Sun -->
  <circle cx="420" cy="80" r="35" fill="#FFEB3B"/>
  <line x1="420" y1="30" x2="420" y2="10" stroke="#FFEB3B" stroke-width="4"/>
  <line x1="420" y1="130" x2="420" y2="150" stroke="#FFEB3B" stroke-width="4"/>
  <line x1="370" y1="80" x2="350" y2="80" stroke="#FFEB3B" stroke-width="4"/>
  <line x1="470" y1="80" x2="490" y2="80" stroke="#FFEB3B" stroke-width="4"/>
  <line x1="385" y1="45" x2="370" y2="30" stroke="#FFEB3B" stroke-width="4"/>
  <line x1="455" y1="45" x2="470" y2="30" stroke="#FFEB3B" stroke-width="4"/>
  <line x1="385" y1="115" x2="370" y2="130" stroke="#FFEB3B" stroke-width="4"/>
  <line x1="455" y1="115" x2="470" y2="130" stroke="#FFEB3B" stroke-width="4"/>

  <!-- Clouds -->
  <ellipse cx="100" cy="70" rx="35" ry="18" fill="white" opacity="0.9"/>
  <ellipse cx="130" cy="80" rx="25" ry="14" fill="white" opacity="0.9"/>
  <ellipse cx="75" cy="80" rx="22" ry="12" fill="white" opacity="0.9"/>
  <ellipse cx="380" cy="110" rx="30" ry="14" fill="white" opacity="0.85"/>
  <ellipse cx="405" cy="118" rx="20" ry="10" fill="white" opacity="0.85"/>

  <!-- Beaver shadow -->
  <ellipse cx="256" cy="395" rx="75" ry="12" fill="#33691E" opacity="0.4"/>

  <!-- Watering can -->
  <g transform="translate(380,310)">
    <rect x="10" y="20" width="45" height="35" rx="5" fill="#78909C"/>
    <rect x="5" y="15" width="55" height="10" rx="3" fill="#607D8B"/>
    <path d="M 55 25 L 85 15 L 82 22 L 55 32 Z" fill="#607D8B"/>
    <path d="M 10 30 Q -5 20 5 10" stroke="#607D8B" stroke-width="4" fill="none"/>
    <circle cx="32" cy="37" r="6" fill="#B0BEC5"/>
  </g>

  <!-- Seed packet -->
  <g transform="translate(140,390) rotate(-12)">
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#EF5350"/>
    <rect x="0" y="0" width="30" height="12" rx="3" fill="#E53935"/>
    <circle cx="15" cy="22" r="6" fill="#FFEB3B"/>
    <rect x="8" y="32" width="14" height="3" fill="white"/>
  </g>

  <!-- Grass tufts -->
  <path d="M 180 400 Q 185 380 190 400" stroke="#4CAF50" stroke-width="3" fill="none"/>
  <path d="M 185 402 Q 190 375 195 402" stroke="#4CAF50" stroke-width="3" fill="none"/>
  <path d="M 330 405 Q 335 385 340 405" stroke="#4CAF50" stroke-width="3" fill="none"/>
  <path d="M 335 407 Q 340 380 345 407" stroke="#4CAF50" stroke-width="3" fill="none"/>
  <path d="M 360 395 Q 365 375 370 395" stroke="#4CAF50" stroke-width="3" fill="none"/>

  <!-- Flowers -->
  <g transform="translate(420,390)">
    <rect x="8" y="20" width="6" height="30" fill="#4CAF50"/>
    <circle cx="11" cy="12" r="10" fill="#E91E63"/>
    <circle cx="11" cy="12" r="5" fill="#FFEB3B"/>
  </g>
  <g transform="translate(460,410)">
    <rect x="8" y="10" width="6" height="25" fill="#4CAF50"/>
    <circle cx="11" cy="6" r="9" fill="#9C27B0"/>
    <circle cx="11" cy="6" r="4" fill="#FFEB3B"/>
  </g>
  <g transform="translate(50,400)">
    <rect x="8" y="15" width="6" height="25" fill="#4CAF50"/>
    <circle cx="11" cy="10" r="8" fill="#FF9800"/>
    <circle cx="11" cy="10" r="3" fill="#FFEB3B"/>
  </g>
</svg>