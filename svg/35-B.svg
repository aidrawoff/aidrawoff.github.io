<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#7a3e8f"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f4ff"/>
      <stop offset="1" stop-color="#7fd0ee"/>
    </linearGradient>
    <linearGradient id="shark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7d99"/>
      <stop offset="0.6" stop-color="#8fa9bf"/>
      <stop offset="1" stop-color="#e8f1f7"/>
    </linearGradient>
  </defs>

  <!-- night city sky -->
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
  <circle cx="420" cy="80" r="26" fill="#fff4c2" opacity="0.9"/>

  <!-- skyline -->
  <g fill="#262b5e">
    <rect x="0" y="180" width="60" height="150"/>
    <rect x="52" y="140" width="48" height="190"/>
    <rect x="98" y="200" width="40" height="130"/>
    <rect x="390" y="150" width="52" height="180"/>
    <rect x="440" y="190" width="72" height="140"/>
    <rect x="300" y="210" width="44" height="120"/>
  </g>
  <!-- tower with spire -->
  <rect x="210" y="120" width="60" height="210" fill="#303670"/>
  <polygon points="232,70 252,120 212,120" fill="#303670"/>

  <!-- lit windows -->
  <g fill="#ffd966">
    <rect x="62" y="160" width="6" height="8"/><rect x="76" y="186" width="6" height="8"/>
    <rect x="60" y="220" width="6" height="8"/><rect x="104" y="230" width="6" height="8"/>
    <rect x="62" y="260" width="6" height="8"/><rect x="118" y="250" width="6" height="8"/>
    <rect x="400" y="170" width="6" height="8"/><rect x="420" y="200" width="6" height="8"/>
    <rect x="404" y="240" width="6" height="8"/><rect x="452" y="210" width="6" height="8"/>
    <rect x="470" y="250" width="6" height="8"/><rect x="306" y="230" width="6" height="8"/>
    <rect x="222" y="150" width="6" height="8"/><rect x="246" y="180" width="6" height="8"/>
    <rect x="222" y="210" width="6" height="8"/><rect x="246" y="250" width="6" height="8"/>
  </g>

  <!-- ice rink with reflection -->
  <rect x="0" y="330" width="512" height="182" fill="url(#ice)"/>
  <rect x="0" y="330" width="512" height="4" fill="#ffffff" opacity="0.8"/>
  <g fill="#ffffff" opacity="0.5">
    <rect x="30" y="380" width="120" height="3"/>
    <rect x="300" y="420" width="160" height="3"/>
    <rect x="90" y="460" width="90" height="3"/>
  </g>
  <!-- reflected city lights on ice -->
  <g fill="#ffd966" opacity="0.35">
    <rect x="226" y="340" width="28" height="10"/>
    <rect x="400" y="342" width="22" height="8"/>
    <rect x="72" y="344" width="18" height="8"/>
  </g>

  <!-- shark: tail -->
  <path d="M130 262 L70 205 Q82 262 72 318 L130 280 Z" fill="#5f7d99"/>
  <!-- shark: body -->
  <path d="M120 270 Q150 214 240 218 Q320 220 368 262 Q392 272 370 284 Q322 320 236 316 Q160 316 120 270 Z" fill="url(#shark)"/>
  <!-- dorsal fin -->
  <path d="M212 220 Q232 166 262 222 Z" fill="#5f7d99"/>
  <!-- raised pectoral fin waving -->
  <path d="M250 290 Q272 240 300 226 Q292 262 282 300 Z" fill="#5f7d99"/>
  <!-- belly -->
  <path d="M150 292 Q236 316 352 284 Q322 320 236 316 Q180 314 150 292 Z" fill="#f4fbff"/>
  <!-- gill slits -->
  <g stroke="#40596f" stroke-width="3" stroke-linecap="round">
    <line x1="196" y1="256" x2="196" y2="276"/>
    <line x1="208" y1="254" x2="208" y2="276"/>
    <line x1="220" y1="254" x2="220" y2="276"/>
  </g>
  <!-- eye with sparkle -->
  <circle cx="330" cy="254" r="11" fill="#ffffff"/>
  <circle cx="332" cy="255" r="7" fill="#1a1a2e"/>
  <circle cx="334" cy="252" r="2.5" fill="#ffffff"/>
  <!-- smile and teeth -->
  <path d="M322 282 Q344 298 364 276" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="328,284 334,293 340,284" fill="#ffffff"/>
  <polygon points="344,281 350,291 356,280" fill="#ffffff"/>
  <!-- rosy cheek and sparkles for charm -->
  <circle cx="308" cy="272" r="7" fill="#ff8fa3" opacity="0.6"/>
  <g fill="#fff4c2">
    <path d="M412 150 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M88 120 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
    <path d="M300 110 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
  </g>

  <!-- ice skates attached under belly -->
  <path d="M190 312 L186 332 L192 340 L300 340 L306 332 L296 312 Z" fill="#2b2f3a"/>
  <line x1="172" y1="350" x2="324" y2="350" stroke="#c9d6df" stroke-width="5" stroke-linecap="round"/>
  <path d="M176 340 L316 340 L322 350 L170 350 Z" fill="#2b2f3a" opacity="0.0"/>

  <!-- skate trail arcs behind the blade -->
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M60 356 Q110 346 170 350"/>
    <path d="M40 372 Q100 362 160 362"/>
    <path d="M80 392 Q130 384 176 386"/>
  </g>
  <!-- faint reflection of the shark on the ice -->
  <g opacity="0.22" transform="translate(0,640) scale(1,-1)">
    <path d="M120 270 Q150 214 240 218 Q320 220 368 262 Q392 272 370 284 Q322 320 236 316 Q160 316 120 270 Z" fill="#8fa9bf"/>
    <path d="M212 220 Q232 166 262 222 Z" fill="#5f7d99"/>
  </g>
  <!-- foreground rink boards and crowd silhouettes -->
  <rect x="0" y="478" width="512" height="34" fill="#1d2a48"/>
  <rect x="0" y="474" width="512" height="6" fill="#e2472f"/>
  <g fill="#14203a">
    <circle cx="36" cy="462" r="9"/><rect x="27" y="470" width="18" height="12" rx="4"/>
    <circle cx="92" cy="466" r="8"/><rect x="84" y="473" width="16" height="10" rx="4"/>
    <circle cx="430" cy="462" r="9"/><rect x="421" y="470" width="18" height="12" rx="4"/>
    <circle cx="482" cy="468" r="8"/><rect x="474" y="475" width="16" height="10" rx="4"/>
  </g>
  <!-- ice spray from blade -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="160" cy="356" r="4"/>
    <circle cx="150" cy="350" r="3"/>
    <circle cx="170" cy="362" r="2.5"/>
  </g>
</svg>
