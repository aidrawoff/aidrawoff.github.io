<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcc88"/>
      <stop offset="1" stop-color="#f5e0a8"/>
    </linearGradient>
    <linearGradient id="pumpkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="0.5" stop-color="#ffa500"/>
      <stop offset="1" stop-color="#ff8c00"/>
    </linearGradient>
    <filter id="shadow" x="-2" y="-2" width="104" height="104">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#00000080"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Pumpkin -->
  <ellipse cx="256" cy="320" rx="120" ry="90" fill="url(#pumpkin)" filter="url(#shadow)"/>
  <ellipse cx="256" cy="280" rx="60" ry="20" fill="#ffffff" opacity="0.15"/>
  <!-- Skunk body -->
  <path d="M256 220 C220 220 190 240 190 280 C190 320 220 340 256 340 C292 340 322 320 322 280 C322 240 292 220 256 220 Z" fill="#000000" filter="url(#shadow)"/>
  <!-- Skunk head -->
  <path d="M256 220 C270 220 280 210 280 190 C280 170 270 160 256 160 C242 160 232 170 232 190 C232 210 242 220 256 220 Z" fill="#000000"/>
  <circle cx="256" cy="180" r="1" fill="#ffffff" opacity="0.05"/>
  <!-- Skunk tail -->
  <path d="M190 280 C160 280 140 260 140 240 C140 220 160 200 190 200 C220 200 240 220 240 240 C240 260 220 280 190 280 Z" fill="#000000"/>
  <!-- Skunk stripe -->
  <path d="M256 240 L256 280 M240 240 L240 280 M272 240 L272 280" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <!-- Straw arms -->
  <path d="M200 260 L160 220 M312 260 L352 220" stroke="#8b4513" stroke-width="12" stroke-linecap="round"/>
  <!-- Hay bundle -->
  <path d="M256 340 L256 380 M240 340 L240 380 M272 340 L272 380" stroke="#daa520" stroke-width="8" stroke-linecap="round"/>
</svg>