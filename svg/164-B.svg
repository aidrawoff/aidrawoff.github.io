<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="pumpkin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect y="180" width="512" height="332" fill="url(#sunset)"/>

  <!-- Stars & Sparkles -->
  <circle cx="80" cy="70" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="160" cy="45" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="420" cy="80" r="2.2" fill="#ffffff" opacity="0.95"/>
  <circle cx="370" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="460" cy="130" r="2" fill="#ffffff" opacity="0.85"/>
  <circle cx="50" cy="140" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Back Glow behind pumpkin -->
  <circle cx="256" cy="235" r="140" fill="url(#glow)"/>

  <!-- Motion Lines -->
  <path d="M 50 355 L 150 355" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 20 375 L 120 375" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 390 345 L 470 345" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Ground -->
  <line x1="20" y1="390" x2="492" y2="390" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Skateboard Shadow -->
  <ellipse cx="256" cy="402" rx="160" ry="15" fill="#000000" opacity="0.65"/>

  <!-- Skateboard -->
  <g transform="translate(0, 30)">
    <!-- Wheels -->
    <circle cx="150" cy="335" r="20" fill="#ef4444" stroke="#b91c1c" stroke-width="4"/>
    <circle cx="150" cy="335" r="7" fill="#f8fafc"/>
    <circle cx="362" cy="335" r="20" fill="#ef4444" stroke="#b91c1c" stroke-width="4"/>
    <circle cx="362" cy="335" r="7" fill="#f8fafc"/>

    <!-- Trucks -->
    <rect x="165" y="312" width="18" height="16" fill="#94a3b8" rx="2"/>
    <rect x="329" y="312" width="18" height="16" fill="#94a3b8" rx="2"/>

    <!-- Deck -->
    <path d="M 110 300 Q 256 265 402 300 Q 425 307 415 318 Q 256 320 97 318 Q 87 307 110 300 Z" fill="url(#deck)" stroke="#581c87" stroke-width="3"/>
    <!-- Grip tape texture hints -->
    <path d="M 140 304 Q 256 280 372 304" fill="none" stroke="#3b0764" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Pumpkin Rider -->
  <g transform="translate(0, -10)">
    <!-- Pumpkin Body / Ridges -->
    <ellipse cx="256" cy="235" rx="105" ry="90" fill="url(#pumpkin)" stroke="#9a3412" stroke-width="4"/>
    <path d="M 256 145 Q 200 235 256 325" fill="none" stroke="#9a3412" stroke-width="3.5" opacity="0.7"/>
    <path d="M 256 145 Q 312 235 256 325" fill="none" stroke="#9a3412" stroke-width="3.5" opacity="0.7"/>
    <path d="M 256 150 Q 150 235 220 305" fill="none" stroke="#9a3412" stroke-width="3" opacity="0.5"/>
    <path d="M 256 150 Q 362 235 292 305" fill="none" stroke="#9a3412" stroke-width="3" opacity="0.5"/>

    <!-- Stem -->
    <path d="M 246 148 Q 235 110 262 100 Q 280 118 268 148 Z" fill="#16a34a" stroke="#15803d" stroke-width="2.5"/>

    <!-- Leaf on Stem -->
    <path d="M 262 120 Q 295 110 300 130 Q 280 135 262 120 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>

    <!-- Face (Excited Jack-o-Lantern Rider) -->
    <!-- Eyes -->
    <polygon points="205,205 230,210 215,185" fill="#0f172a"/>
    <polygon points="307,205 282,210 297,185" fill="#0f172a"/>
    <!-- Nose -->
    <polygon points="256,220 247,242 265,242" fill="#0f172a"/>
    <!-- Big Grin -->
    <path d="M 210 255 Q 256 305 302 255 Q 285 280 256 280 Q 227 280 210 255 Z" fill="#0f172a"/>
    <!-- Teeth -->
    <rect x="236" y="262" width="10" height="10" fill="#fef08a"/>
    <rect x="266" y="262" width="10" height="10" fill="#fef08a"/>
  </g>
</svg>
