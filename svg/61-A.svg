<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="0.55" stop-color="#e08a35"/>
      <stop offset="1" stop-color="#8f4a1c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.72" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffdc8a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffdc8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16283d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2b4a68" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d6ff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#a9d6ff" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="512" height="512" fill="#0e1621"/>
  <!-- warm cafe interior -->
  <rect x="26" y="26" width="460" height="460" fill="url(#warm)"/>
  <ellipse cx="380" cy="150" rx="260" ry="220" fill="url(#lamp)"/>

  <!-- cold rainy street beyond the glass (blurred) -->
  <g filter="url(#softer)">
    <rect x="26" y="26" width="460" height="300" fill="url(#cold)"/>
    <rect x="46" y="120" width="96" height="200" fill="#16283d" opacity="0.8"/>
    <rect x="156" y="86" width="74" height="234" fill="#1d3category" />
  </g>
  <g filter="url(#soft)" opacity="0.9">
    <circle cx="86" cy="200" r="22" fill="#ffcf6b"/>
    <circle cx="150" cy="238" r="13" fill="#7fd3ff"/>
    <circle cx="420" cy="250" r="28" fill="#ffa64d"/>
    <circle cx="466" cy="196" r="15" fill="#ffe6a1"/>
    <circle cx="330" cy="215" r="11" fill="#8ec7ff"/>
  </g>

  <!-- glass sheen + fogged condensation -->
  <rect x="26" y="26" width="460" height="460" fill="url(#sheen)"/>
  <ellipse cx="150" cy="360" rx="150" ry="110" fill="#dceeff" opacity="0.30" filter="url(#softer)"/>
  <ellipse cx="400" cy="420" rx="140" ry="90" fill="#dceeff" opacity="0.22" filter="url(#softer)"/>

  <!-- drawn heart in the fogged glass (finger-traced) -->
  <g stroke="#f7fbff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M330 330 c-26 -30 -62 -6 -46 26 c8 16 30 32 46 46 c16 -14 38 -30 46 -46 c16 -32 -20 -56 -46 -26"/>
  </g>
  <g fill="#eaf6ff" opacity="0.5">
    <circle cx="300" cy="300" r="4"/><circle cx="366" cy="308" r="5"/>
    <circle cx="342" cy="404" r="4"/><circle cx="290" cy="366" r="3"/>
  </g>

  <!-- rain: streaks running down the pane -->
  <g stroke="#cfeaff" stroke-width="4" stroke-linecap="round" opacity="0.8" fill="none">
    <path d="M64 40 q10 60 -4 120 q-8 44 6 88"/>
    <path d="M118 34 q-8 70 6 132"/>
    <path d="M186 60 q12 66 -2 130 q-6 40 4 76"/>
    <path d="M226 30 q-6 50 4 96"/>
    <path d="M292 44 q10 70 -6 138"/>
    <path d="M352 34 q-10 60 4 122 q8 44 -4 84"/>
    <path d="M404 56 q12 66 -2 128"/>
    <path d="M462 36 q-8 74 4 142"/>
    <path d="M84 300 q10 60 -4 120"/>
    <path d="M200 320 q-8 56 6 112"/>
    <path d="M318 306 q12 62 -4 124"/>
    <path d="M440 330 q-10 58 4 116"/>
  </g>
  <!-- fat droplets with highlights -->
  <g>
    <g fill="#e6f4ff" opacity="0.92">
      <circle cx="96" cy="150" r="11"/><circle cx="205" cy="176" r="8"/>
      <circle cx="318" cy="188" r="13"/><circle cx="428" cy="172" r="9"/>
      <circle cx="60" cy="430" r="10"/><circle cx="238" cy="440" r="12"/>
      <circle cx="378" cy="452" r="8"/><circle cx="470" cy="418" r="11"/>
    </g>
    <g fill="#ffffff" opacity="0.9">
      <circle cx="92" cy="146" r="3"/><circle cx="314" cy="183" r="4"/>
      <circle cx="234" cy="435" r="4"/><circle cx="466" cy="413" r="3"/>
    </g>
  </g>

  <!-- window frame: thick close-up wood, mullions -->
  <g fill="#43291a">
    <rect x="0" y="0" width="512" height="30"/>
    <rect x="0" y="482" width="512" height="30"/>
    <rect x="0" y="0" width="30" height="512"/>
    <rect x="482" y="0" width="30" height="512"/>
    <rect x="238" y="30" width="36" height="452"/>
    <rect x="30" y="236" width="452" height="34"/>
  </g>
  <g fill="#5d3b24">
    <rect x="238" y="30" width="10" height="452"/>
    <rect x="30" y="236" width="452" height="9"/>
    <rect x="0" y="482" width="512" height="8"/>
  </g>
  <g fill="#2a1810" opacity="0.6">
    <rect x="264" y="30" width="10" height="452"/>
    <rect x="30" y="261" width="452" height="9"/>
  </g>

  <!-- pendant lamp glowing top-right -->
  <g>
    <rect x="396" y="30" width="5" height="52" fill="#2a1810"/>
    <path d="M352 82 h90 l-18 44 h-56 z" fill="#c2552a"/>
    <path d="M352 82 h90 l-6 14 h-78 z" fill="#e0703c"/>
    <ellipse cx="397" cy="128" rx="28" ry="10" fill="#fff2c0"/>
    <circle cx="397" cy="140" r="12" fill="#fff8d8" opacity="0.9"/>
  </g>

  <!-- BIG foreground latte mug on the sill (zoomed-in twist) -->
  <g>
    <ellipse cx="150" cy="484" rx="118" ry="22" fill="#1d1109" opacity="0.55"/>
    <path d="M96 386 h112 a10 10 0 0 1 10 10 v58 a34 34 0 0 1 -34 34 h-64 a34 34 0 0 1 -34 -34 v-58 a10 10 0 0 1 10 -10 z" fill="#fdf6ea"/>
    <path d="M218 396 a10 10 0 0 1 10 10 v48 a34 34 0 0 1 -34 34 h-6 a34 34 0 0 0 30 -34 v-58 z" fill="#dccbb4"/>
    <ellipse cx="152" cy="390" rx="58" ry="15" fill="#7a4a28"/>
    <ellipse cx="152" cy="389" rx="50" ry="12" fill="#a56a3c"/>
    <!-- latte-art heart -->
    <path d="M152 380 c-14 -14 -32 -2 -22 12 c5 8 14 14 22 20 c8 -6 17 -12 22 -20 c10 -14 -8 -26 -22 -12" fill="#fff4e2"/>
    <path d="M104 404 q-4 40 10 74" stroke="#ffffff" stroke-width="7" fill="none" opacity="0.35" stroke-linecap="round"/>
    <path d="M226 412 q38 6 34 32 q-4 24 -38 22" fill="none" stroke="#fdf6ea" stroke-width="14"/>
  </g>
  <!-- steam -->
  <g stroke="#fff9ee" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M126 362 q-22 -30 4 -56 q22 -24 0 -50"/>
    <path d="M176 360 q20 -28 -4 -54 q-20 -24 6 -48"/>
  </g>
  <!-- tiny sprig / sugar cube detail on sill -->
  <g>
    <rect x="300" y="452" width="30" height="24" rx="4" fill="#f3e6cd" transform="rotate(-10 315 464)"/>
    <g transform="rotate(-7 430 462)">
      <rect x="356" y="446" width="150" height="28" fill="#8c3f5c"/>
      <rect x="356" y="438" width="150" height="10" fill="#f6ecd9"/>
      <rect x="356" y="446" width="8" height="28" fill="#6d2f47"/>
    </g>
  </g>
</svg>
