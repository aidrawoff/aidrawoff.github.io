<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1d33"/>
      <stop offset="50%" stop-color="#4a2e3b"/>
      <stop offset="100%" stop-color="#6b3a2a"/>
    </linearGradient>
    <!-- Table Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c5830"/>
      <stop offset="100%" stop-color="#4e2c14"/>
    </linearGradient>
    <!-- Hen Body Gradient -->
    <radialGradient id="henBody" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e06a3b"/>
      <stop offset="60%" stop-color="#b83b1b"/>
      <stop offset="100%" stop-color="#7a200a"/>
    </radialGradient>
    <!-- Pumpkin Gradient -->
    <radialGradient id="pumpkin" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="70%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </radialGradient>
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Glow / Harvest Moon -->
  <circle cx="256" cy="180" r="150" fill="#f39c12" opacity="0.12"/>
  <circle cx="256" cy="180" r="100" fill="#f1c40f" opacity="0.1"/>

  <!-- Wooden Table / Display Surface -->
  <rect x="0" y="360" width="512" height="152" fill="url(#tableGrad)" filter="url(#dropShadow)"/>
  <line x1="0" y1="365" x2="512" y2="365" stroke="#a0683a" stroke-width="4"/>
  <line x1="0" y1="410" x2="512" y2="410" stroke="#3d220f" stroke-width="2" opacity="0.6"/>

  <!-- Harvest Items (Left: Pumpkin & Apples) -->
  <g transform="translate(80, 415)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="20" rx="40" ry="32" fill="url(#pumpkin)"/>
    <ellipse cx="-18" cy="20" rx="22" ry="30" fill="#d35400" opacity="0.4"/>
    <ellipse cx="18" cy="20" rx="22" ry="30" fill="#e67e22" opacity="0.4"/>
    <path d="M0,-3 Q3,-15 6,-24" stroke="#27ae60" stroke-width="4" fill="none"/>
  </g>

  <!-- Red Apple & Green Pear -->
  <g transform="translate(160, 435)" filter="url(#dropShadow)">
    <circle cx="0" cy="15" r="18" fill="#c0392b"/>
    <circle cx="-5" cy="10" r="6" fill="#e74c3c" opacity="0.5"/>
    <path d="M0,-3 Q3,-12 8,-8" stroke="#27ae60" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(205, 430)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="18" rx="15" ry="20" fill="#27ae60"/>
    <path d="M0,-2 Q2,-10 6,-8" stroke="#145a32" stroke-width="3" fill="none"/>
  </g>

  <!-- Harvest Items (Right: Large Pumpkin & Grapes/Corn) -->
  <g transform="translate(410, 410)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="25" rx="48" ry="40" fill="url(#pumpkin)"/>
    <ellipse cx="-22" cy="25" rx="26" ry="38" fill="#d35400" opacity="0.4"/>
    <ellipse cx="22" cy="25" rx="26" ry="38" fill="#e67e22" opacity="0.4"/>
    <path d="M0,-12 Q-3,-22 -7,-30" stroke="#27ae60" stroke-width="5" fill="none"/>
  </g>

  <!-- Grapes Bunch -->
  <g transform="translate(330, 440)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="10" fill="#8e44ad"/>
    <circle cx="-10" cy="10" r="10" fill="#9b59b6"/>
    <circle cx="10" cy="10" r="10" fill="#8e44ad"/>
    <circle cx="0" cy="16" r="10" fill="#6c3483"/>
    <path d="M0,-10 Q2,-18 8,-15" stroke="#27ae60" stroke-width="3" fill="none"/>
  </g>

  <!-- The Judge Hen (Central Asymmetric Focus) -->
  <g transform="translate(256, 280)" filter="url(#dropShadow)">
    <!-- Hen Body -->
    <ellipse cx="0" cy="25" rx="78" ry="68" fill="url(#henBody)"/>
    <!-- Wings -->
    <path d="M -45,15 Q -75,45 -42,70 Q -28,50 -32,25 Z" fill="#96280b"/>
    <path d="M 45,15 Q 75,45 42,70 Q 28,50 32,25 Z" fill="#b83b1b"/>
    
    <!-- Hen Head & Neck -->
    <circle cx="0" cy="-42" r="46" fill="url(#henBody)"/>
    
    <!-- Comb (Grand Judge Crown) -->
    <path d="M -18,-82 Q -28,-102 -12,-98 Q 0,-115 16,-98 Q 28,-102 18,-82 Z" fill="#e74c3c"/>
    <path d="M -8,-88 Q 0,-105 10,-88 Z" fill="#ff6b6b" opacity="0.6"/>
    
    <!-- Wattle -->
    <path d="M 5,-12 Q 20,-2 14,16 Q 4,2 5,-12 Z" fill="#c0392b"/>

    <!-- Beak (Thoughtful / Discerning) -->
    <polygon points="12,-42 48,-35 18,-25" fill="#f1c40f"/>
    <polygon points="12,-42 42,-38 18,-29" stroke="#d35400" stroke-width="1" fill="#f39c12"/>

    <!-- Judge Spectacles -->
    <circle cx="16" cy="-42" r="15" fill="none" stroke="#f1c40f" stroke-width="3.5"/>
    <path d="M 1,-42 L -16,-46" stroke="#f1c40f" stroke-width="3.5"/>

    <!-- Eye (Sharp / Analytical) -->
    <circle cx="16" cy="-42" r="4.5" fill="#2c3e50"/>
    <circle cx="17.5" cy="-43.5" r="1.8" fill="#fff"/>

    <!-- Pointer Wing pointing at scoreboard -->
    <path d="M -52,35 Q -95,15 -115,45 Q -95,50 -60,42 Z" fill="#b83b1b"/>
  </g>

  <!-- Scorecard / Clipboard Held by Hen -->
  <g transform="translate(115, 295)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="60" height="75" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <rect x="12" y="10" width="36" height="7" rx="2" fill="#bdc3c7"/>
    <line x1="12" y1="28" x2="45" y2="28" stroke="#e74c3c" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="12" y1="42" x2="48" y2="42" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="12" y1="56" x2="38" y2="56" stroke="#34495e" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Gold Stamp / Seal of Approval -->
    <circle cx="42" cy="58" r="8" fill="#f1c40f"/>
  </g>

  <!-- Tiny Wooden Gavel next to Clipboard -->
  <g transform="translate(185, 345) rotate(-25)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="25" height="10" rx="3" fill="#d35400"/>
    <rect x="10" y="-15" width="6" height="25" rx="2" fill="#8c5830"/>
  </g>

  <!-- Excellence Stars & Sparkles -->
  <polygon points="370,110 375,125 390,125 378,135 382,150 370,140 358,150 362,135 350,125 365,125" fill="#f1c40f" opacity="0.9"/>
  <polygon points="140,140 143,150 153,150 145,156 148,166 140,160 132,166 135,156 127,150 137,150" fill="#f39c12" opacity="0.8"/>
  <circle cx="300" cy="100" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="200" cy="120" r="2.5" fill="#fff" opacity="0.6"/>

</svg>
