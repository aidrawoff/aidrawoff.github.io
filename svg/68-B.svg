<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: underwater gradient -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6fc9"/>
      <stop offset="100%" stop-color="#0a3a6b"/>
    </linearGradient>
    <filter id="caustics" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#water)" filter="url(#caustics)"/>
  <!-- Vignette -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.8">
    <stop offset="70%" stop-color="black" stop-opacity="0"/>
    <stop offset="100%" stop-color="black" stop-opacity="0.25"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#vignette)"/>

  <!-- Bubbles (subtle) -->
  <circle cx="120" cy="180" r="8" fill="white" opacity="0.7" filter="url(#glow)"/>
  <circle cx="380" cy="120" r="6" fill="white" opacity="0.7" filter="url(#glow)"/>
  <circle cx="250" cy="280" r="10" fill="white" opacity="0.7" filter="url(#glow)"/>
  <circle cx="80" cy="220" r="7" fill="white" opacity="0.7" filter="url(#glow)"/>
  <circle cx="450" cy="260" r="9" fill="white" opacity="0.7" filter="url(#glow)"/>
  <circle cx="180" cy="140" r="5" fill="white" opacity="0.7" filter="url(#glow)"/>
  <circle cx="320" cy="200" r="6" fill="white" opacity="0.7" filter="url(#glow)"/>
  <circle cx="480" cy="160" r="4" fill="white" opacity="0.7" filter="url(#glow)"/>
  <!-- More bubbles rising -->
  <circle cx="150" cy="320" r="3" fill="white" opacity="0.6"/>
  <circle cx="200" cy="350" r="4" fill="white" opacity="0.6"/>
  <circle cx="350" cy="300" r="5" fill="white" opacity="0.6"/>
  <circle cx="420" cy="340" r="3" fill="white" opacity="0.6"/>

  <!-- Water lines (subtle) -->
  <path d="M0,400 Q128,380 256,400 T512,380 L512,512 L0,512 Z" fill="#0a3a6b" opacity="0.4"/>
  <path d="M0,350 Q128,330 256,350 T512,330 L512,512 L0,512 Z" fill="#1a6fc9" opacity="0.2"/>
  <path d="M0,300 Q128,280 256,300 T512,280 L512,512 L0,512 Z" fill="#1a6fc9" opacity="0.1"/>
  <!-- Additional depth layers -->
  <path d="M0,250 Q128,230 256,250 T512,230 L512,512 L0,512 Z" fill="#1a6fc9" opacity="0.05"/>
  <path d="M0,200 Q128,180 256,200 T512,180 L512,512 L0,512 Z" fill="#1a6fc9" opacity="0.02"/>

  <!-- Troll silhouette: dark blob with hat and trident -->
  <path d="M256,200 C200,200 180,260 180,320 C180,380 220,420 256,420 C292,420 332,380 332,320 C332,260 312,200 256,200 Z" fill="#2a1e18"/>
  <!-- Inner shadow for depth -->
  <path d="M256,200 C200,200 180,260 180,320 C180,380 220,420 256,420 C292,420 332,380 332,320 C332,260 312,200 256,200 Z" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="8"/>
  <!-- Top highlight -->
  <path d="M256,200 C200,200 180,260 180,320 C180,380 220,420 256,420 C292,420 332,380 332,320 C332,260 312,200 256,200 Z" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="12"/>
  <!-- Tall, pointed hat -->
  <path d="M256,120 L220,200 L292,200 Z" fill="#2a1e18"/>
  <!-- Hat highlight -->
  <path d="M256,120 L220,200 L292,200 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  <!-- Trident (sharp white outline) -->
  <path d="M256,320 L256,190 M256,260 L200,240 M256,260 L312,240" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Face hint: eyes and mouth -->
  <circle cx="240" cy="280" r="8" fill="white"/>
  <circle cx="272" cy="280" r="8" fill="white"/>
  <path d="M240,300 Q256,310 272,300" stroke="white" stroke-width="3" fill="none"/>
</svg>