<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Night sky -->
  <rect width="512" height="512" fill="#1a0f2e"/>
  <circle cx="420" cy="80" r="40" fill="#f0e6ff" opacity="0.9"/>
  <circle cx="100" cy="120" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="200" cy="60" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="350" cy="150" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="80" cy="200" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="450" cy="180" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="160" cy="90" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="300" cy="40" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="480" cy="100" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="40" cy="280" r="2" fill="#fff" opacity="0.6"/>

  <!-- Branch -->
  <path d="M-10 380 Q 150 360, 280 390 T 530 370" stroke="#3d2b1f" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M-10 380 Q 150 360, 280 390 T 530 370" stroke="#5c4033" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Owl body -->
  <ellipse cx="256" cy="320" rx="70" ry="85" fill="#6b5b4f"/>
  <ellipse cx="256" cy="320" rx="55" ry="70" fill="#8a7a6e"/>

  <!-- Belly -->
  <ellipse cx="256" cy="340" rx="40" ry="50" fill="#b8a99a"/>

  <!-- Wings -->
  <ellipse cx="186" cy="310" rx="25" ry="55" fill="#5a4d42"/>
  <ellipse cx="326" cy="310" rx="25" ry="55" fill="#5a4d42"/>

  <!-- Feet -->
  <ellipse cx="236" cy="400" rx="12" ry="6" fill="#d4a843"/>
  <ellipse cx="276" cy="400" rx="12" ry="6" fill="#d4a843"/>

  <!-- Face -->
  <circle cx="232" cy="280" r="22" fill="#f5e6d3"/>
  <circle cx="280" cy="280" r="22" fill="#f5e6d3"/>

  <!-- Sleepy eyes -->
  <path d="M222 280 Q 232 288, 242 280" stroke="#2a1f1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M270 280 Q 280 288, 290 280" stroke="#2a1f1a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Beak -->
  <polygon points="256,290 248,305 256,315 264,305" fill="#d4a843"/>

  <!-- Witch hat -->
  <polygon points="256,100 180,240 332,240" fill="#2d1b4e"/>
  <ellipse cx="256" cy="240" rx="90" ry="18" fill="#1a0f2e"/>
  <ellipse cx="256" cy="240" rx="80" ry="14" fill="#3d2b5e"/>

  <!-- Hat band -->
  <path d="M195 230 Q 256 255, 317 230" stroke="#7b3fa0" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Hat buckle -->
  <rect x="246" y="222" width="20" height="20" rx="3" fill="#d4a843"/>
  <rect x="250" y="226" width="12" height="12" rx="2" fill="#7b3fa0"/>

  <!-- Zzz -->
  <text x="320" y="200" font-family="sans-serif" font-size="28" fill="#a0c4ff" opacity="0.9">Z</text>
  <text x="340" y="180" font-family="sans-serif" font-size="22" fill="#a0c4ff" opacity="0.8">z</text>
  <text x="356" y="164" font-family="sans-serif" font-size="16" fill="#a0c4ff" opacity="0.7">z</text>
</svg>