<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- bg with subtle floor -->
  <rect width="512" height="512" fill="#1a1a2e"/>
  <ellipse cx="256" cy="430" rx="180" ry="50" fill="#16213e"/>
  <!-- yoga mat -->
  <ellipse cx="256" cy="420" rx="140" ry="30" fill="#e94560" opacity="0.9"/>
  <!-- ghost body with glow -->
  <path d="M180 380 Q170 200 256 120 Q342 200 332 380 Q306 400 280 380 Q256 410 232 380 Q206 400 180 380" fill="#f0f0f0" filter="url(#glow)"/>
  <!-- ghost inner shadow for volume -->
  <path d="M190 360 Q185 220 256 140 Q327 220 322 360 Q306 380 280 360 Q256 390 232 360 Q206 380 190 360" fill="#e0e0e0" opacity="0.4"/>
  <!-- wobbly eyes -->
  <ellipse cx="234" cy="218" rx="7" ry="10" fill="#1a1a2e"/>
  <ellipse cx="278" cy="222" rx="7" ry="10" fill="#1a1a2e"/>
  <circle cx="232" cy="215" r="2" fill="#fff"/>
  <circle cx="276" cy="219" r="2" fill="#fff"/>
  <!-- strained mouth -->
  <path d="M242 255 Q256 245 270 255 Q256 268 242 255" fill="#1a1a2e"/>
  <!-- blush -->
  <ellipse cx="220" cy="240" rx="10" ry="6" fill="#ff6b6b" opacity="0.3"/>
  <ellipse cx="290" cy="244" rx="10" ry="6" fill="#ff6b6b" opacity="0.3"/>
  <!-- arms flailing with motion lines -->
  <path d="M200 260 Q150 200 120 240" stroke="#f0f0f0" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M312 260 Q370 180 400 210" stroke="#f0f0f0" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M110 230 L105 220" stroke="#87ceeb" stroke-width="2" fill="none"/>
  <path d="M115 245 L108 238" stroke="#87ceeb" stroke-width="2" fill="none"/>
  <path d="M410 200 L418 195" stroke="#87ceeb" stroke-width="2" fill="none"/>
  <!-- legs tangled -->
  <path d="M220 370 Q200 450 180 430" stroke="#f0f0f0" stroke-width="20" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M292 370 Q320 460 340 440" stroke="#f0f0f0" stroke-width="20" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <!-- sweat drops -->
  <circle cx="305" cy="175" r="5" fill="#87ceeb"/>
  <circle cx="320" cy="190" r="3" fill="#87ceeb"/>
  <circle cx="295" cy="195" r="4" fill="#87ceeb"/>
  <!-- yoga block tipping -->
  <rect x="380" y="390" width="40" height="25" fill="#d4a373" transform="rotate(15 400 402)"/>
  <rect x="385" y="395" width="30" height="15" fill="#c6935e" transform="rotate(15 400 402)"/>
  <!-- spilled water -->
  <ellipse cx="420" cy="435" rx="18" ry="6" fill="#87ceeb" opacity="0.6"/>
  <ellipse cx="435" cy="432" rx="8" ry="3" fill="#87ceeb" opacity="0.5"/>
  <!-- water bottle -->
  <rect x="430" y="405" width="14" height="28" rx="3" fill="#4ecdc4" transform="rotate(25 437 419)"/>
  <rect x="433" y="400" width="8" height="6" rx="2" fill="#fff" transform="rotate(25 437 419)"/>
  <!-- "OOF" speech bubble -->
  <ellipse cx="360" cy="135" rx="38" ry="24" fill="#fff" stroke="#1a1a2e" stroke-width="2"/>
  <polygon points="340,152 330,168 350,154" fill="#fff" stroke="#1a1a2e" stroke-width="2"/>
  <polygon points="342,153 334,164 348,154" fill="#fff"/>
  <text x="360" y="143" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a2e">OOF</text>
  <!-- small stars/sparkles for magical ghost vibe -->
  <path d="M100 100 L102 106 L108 108 L102 110 L100 116 L98 110 L92 108 L98 106 Z" fill="#ffd700" opacity="0.6"/>
  <path d="M420 80 L422 86 L428 88 L422 90 L420 96 L418 90 L412 88 L418 86 Z" fill="#ffd700" opacity="0.5"/>
</svg>