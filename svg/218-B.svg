<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030511"/>
      <stop offset="35%" stop-color="#121035"/>
      <stop offset="75%" stop-color="#281747"/>
      <stop offset="100%" stop-color="#1a0b25"/>
    </linearGradient>
    <linearGradient id="hills1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#130b24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#080410"/>
    </linearGradient>
    <linearGradient id="hills2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#190e33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0515"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffae6" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffdf6d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffc107" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="broomGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c170b"/>
      <stop offset="25%" stop-color="#5a3825"/>
      <stop offset="100%" stop-color="#8c583f"/>
    </linearGradient>
    <linearGradient id="witchCape" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#560bad"/>
      <stop offset="50%" stop-color="#3a0ca3"/>
      <stop offset="100%" stop-color="#0b001a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Atmospheric Nebulae -->
  <ellipse cx="180" cy="190" rx="190" ry="100" fill="#7209b7" opacity="0.18" filter="url(#glow)" transform="rotate(-12 180 190)"/>
  <ellipse cx="340" cy="300" rx="150" ry="80" fill="#4361ee" opacity="0.12" filter="url(#glow)" transform="rotate(25 340 300)"/>

  <!-- Stars & Sparkles -->
  <g fill="#ffffff">
    <circle cx="50" cy="70" r="1.5" opacity="0.9"/>
    <circle cx="130" cy="40" r="2.2" opacity="0.8"/>
    <circle cx="240" cy="75" r="1.2" opacity="0.7"/>
    <circle cx="470" cy="60" r="2" opacity="0.9"/>
    <circle cx="70" cy="220" r="2" opacity="0.5"/>
    <circle cx="340" cy="160" r="1.8" opacity="0.8"/>
    <circle cx="460" cy="250" r="2.2" opacity="0.7"/>
    <circle cx="190" cy="360" r="1.5" opacity="0.6"/>
    <!-- Sparkle 1 -->
    <path d="M 130 110 Q 130 125 115 125 Q 130 125 130 140 Q 130 125 145 125 Q 130 125 130 110 Z" fill="#fff" opacity="0.85"/>
    <!-- Sparkle 2 (near witch) -->
    <path d="M 270 115 Q 270 128 257 128 Q 270 128 270 141 Q 270 128 283 128 Q 270 128 270 115 Z" fill="#fffae6" filter="url(#glow)" opacity="0.9"/>
  </g>

  <!-- Giant Glowing Moon -->
  <circle cx="410" cy="115" r="62" fill="url(#moonGlow)"/>
  <circle cx="410" cy="115" r="45" fill="#fffbe6"/>
  <circle cx="394" cy="98" r="9" fill="#f1f0cc" opacity="0.6"/>
  <circle cx="425" cy="132" r="6" fill="#f1f0cc" opacity="0.5"/>
  <circle cx="405" cy="138" r="5" fill="#f1f0cc" opacity="0.4"/>

  <!-- Distant Background Hills / Silhouette -->
  <path d="M 0 440 Q 110 395 250 425 T 512 415 L 512 512 L 0 512 Z" fill="url(#hills1)"/>
  <path d="M 0 465 Q 175 425 330 455 T 512 445 L 512 512 L 0 512 Z" fill="url(#hills2)"/>
  <!-- Little spooky tree on hill -->
  <path d="M 85 435 L 85 405 M 85 418 L 72 408 M 85 415 L 98 405" stroke="#0a0515" stroke-width="3" stroke-linecap="round"/>

  <!-- Broomstick (Diagonal with Rich Details) -->
  <g transform="rotate(-21 250 285)" filter="url(#softShadow)">
    <!-- Bristles background -->
    <path d="M 135 295 L 55 248 C 40 263 40 323 55 338 Z" fill="#b08968" stroke="#4a2e1b" stroke-width="2"/>
    <!-- Bristle texture lines -->
    <path d="M 115 290 L 65 258 M 120 300 L 70 298 M 115 310 L 65 328" stroke="#7f5539" stroke-width="2" stroke-linecap="round"/>
    <path d="M 130 292 L 60 254 C 48 268 48 318 60 332 Z" fill="#e9edc9" opacity="0.35"/>
    <!-- Handle -->
    <rect x="125" y="280" width="315" height="18" rx="9" fill="url(#broomGrad)" stroke="#211108" stroke-width="2"/>
    <!-- Red Leather Binding -->
    <rect x="115" y="274" width="16" height="30" rx="4" fill="#d90429" stroke="#7a0414" stroke-width="2"/>
    <rect x="118" y="277" width="4" height="24" fill="#ef233c" opacity="0.8"/>
    <!-- Wood grain highlight -->
    <line x1="145" y1="285" x2="420" y2="285" stroke="#a47148" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Witch Character -->
  <!-- Cape billowing dramatically back -->
  <path d="M 230 255 C 215 195 165 170 135 205 C 105 240 125 325 205 325 Z" fill="url(#witchCape)" filter="url(#softShadow)" stroke="#1a0033" stroke-width="2"/>
  
  <!-- Collar / Scarf flapping -->
  <path d="M 205 235 Q 190 220 175 235 Q 190 250 205 235 Z" fill="#ffb703" stroke="#b58302" stroke-width="1.5"/>

  <!-- Witch Dress / Torso jolting back -->
  <path d="M 210 245 C 195 225 185 265 205 315 L 255 305 C 265 265 235 250 210 245 Z" fill="#3a0ca3" stroke="#1a0033" stroke-width="2"/>

  <!-- Arms gripping broom -->
  <path d="M 205 275 Q 190 285 185 275" fill="none" stroke="#3a0ca3" stroke-width="8" stroke-linecap="round"/>
  <circle cx="183" cy="273" r="7" fill="#b7e4c7" stroke="#2d6a4f" stroke-width="2"/>
  
  <path d="M 240 260 Q 255 270 265 255" fill="none" stroke="#3a0ca3" stroke-width="8" stroke-linecap="round"/>
  <circle cx="268" cy="251" r="7" fill="#b7e4c7" stroke="#2d6a4f" stroke-width="2"/>

  <!-- Witch Head & Hat (Tilting back dramatically in hiccup) -->
  <g transform="translate(210, 180) rotate(-22)">
    <!-- Wild Hair flying back -->
    <path d="M -15 5 C -35 8 -45 2 -55 10 C -45 18 -25 15 -10 12 Z" fill="#1b1b1b"/>
    <path d="M -12 12 C -32 20 -40 22 -50 32 C -38 32 -22 25 -8 20 Z" fill="#1b1b1b"/>

    <!-- Face (Greenish skin) -->
    <circle cx="0" cy="0" r="26" fill="#b7e4c7" stroke="#40916c" stroke-width="2.5" filter="url(#softShadow)"/>
    
    <!-- Blush / cheek highlight -->
    <ellipse cx="-10" cy="6" rx="5" ry="3" fill="#52b788" opacity="0.4"/>

    <!-- Eyes squeezed shut in intense hiccup -->
    <path d="M -12 -5 Q -7 -10 -2 -5" fill="none" stroke="#1b4332" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 2 -5 Q 7 -10 12 -5" fill="none" stroke="#1b4332" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Eyebrows scrunched hard -->
    <path d="M -14 -14 Q -7 -19 0 -14" fill="none" stroke="#1b4332" stroke-width="2" stroke-linecap="round"/>
    <path d="M 2 -14 Q 9 -19 16 -14" fill="none" stroke="#1b4332" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Nose (witchy hooked) -->
    <path d="M -2 0 L -8 10 L 2 8 Z" fill="#95d5b2" stroke="#40916c" stroke-width="1.5"/>

    <!-- Hiccup Mouth (Wide open O with depth) -->
    <ellipse cx="2" cy="14" rx="8" ry="12" fill="#081c15" stroke="#2d6a4f" stroke-width="2.5"/>
    <ellipse cx="2" cy="14" rx="4" ry="7" fill="#03071e"/>
    <ellipse cx="2" cy="20" rx="3" ry="2" fill="#e05353"/>

    <!-- Pointy Witch Hat -->
    <path d="M -38 -14 L 38 -14 L 18 -66 L -15 -66 Z" fill="#10002b" stroke="#3c096c" stroke-width="2.5" filter="url(#softShadow)"/>
    <!-- Hat Brim -->
    <ellipse cx="0" cy="-14" rx="46" ry="9" fill="#240046" stroke="#5a189a" stroke-width="2.5"/>
    <!-- Hat Gold Band & Buckle -->
    <path d="M 6 -24 L 28 -24 L 22 -19 L 0 -19 Z" fill="#ffb703"/>
    <rect x="10" y="-26" width="10" height="8" rx="1" fill="none" stroke="#d4a373" stroke-width="2"/>
    <!-- Hat fold / wrinkle -->
    <path d="M 5 -38 Q 12 -45 3 -52" fill="none" stroke="#5a189a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Hiccup Magic Burst & Sound FX / Sparks -->
  <g filter="url(#glow)">
    <!-- Shockwave rings -->
    <ellipse cx="240" cy="165" rx="20" ry="15" fill="none" stroke="#9ef01a" stroke-width="3" opacity="0.85" transform="rotate(-15 240 165)"/>
    <ellipse cx="255" cy="150" rx="12" ry="9" fill="none" stroke="#ccff33" stroke-width="2" opacity="0.7"/>
    
    <!-- Magic sparkles bursting from mouth -->
    <circle cx="255" cy="160" r="5" fill="#70e000"/>
    <circle cx="275" cy="140" r="3.5" fill="#38b000"/>
    <circle cx="240" cy="130" r="4" fill="#ccff33"/>
    <circle cx="290" cy="155" r="2.5" fill="#9ef01a"/>

    <!-- Starbursts -->
    <path d="M 275 140 L 275 128 M 275 140 L 275 152 M 275 140 L 263 140 M 275 140 L 287 140" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 240 130 L 240 120 M 240 130 L 240 140 M 240 130 L 230 130 M 240 130 L 250 130" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Floating music notes / hiccup echoes -->
  <g fill="#9ef01a" opacity="0.9" filter="url(#glow)">
    <!-- Note 1 -->
    <circle cx="305" cy="115" r="4"/>
    <path d="M 309 115 L 309 95 L 319 90 L 319 110 Z"/>
    <ellipse cx="315" cy="110" rx="4" ry="3"/>
    <!-- Note 2 -->
    <circle cx="335" cy="90" r="3"/>
    <path d="M 338 90 L 338 77 L 345 74 L 345 87 Z"/>
  </g>

  <!-- Motion speed lines -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="75" y1="350" x2="35" y2="330"/>
    <line x1="90" y1="365" x2="50" y2="345"/>
    <line x1="105" y1="380" x2="65" y2="360"/>
  </g>

</svg>