<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#e6f7ff"/>
  <!-- Raindrops -->
  <g fill="#a0c4ff" opacity="0.6">
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="120" cy="60" r="1.5"/>
    <circle cx="140" cy="100" r="1.5"/>
    <circle cx="160" cy="70" r="1.5"/>
    <circle cx="180" cy="90" r="1.5"/>
    <circle cx="200" cy="50" r="1.5"/>
    <circle cx="220" cy="80" r="1.5"/>
    <circle cx="240" cy="60" r="1.5"/>
    <circle cx="260" cy="100" r="1.5"/>
    <circle cx="280" cy="70" r="1.5"/>
    <circle cx="300" cy="90" r="1.5"/>
    <circle cx="320" cy="50" r="1.5"/>
    <circle cx="340" cy="80" r="1.5"/>
    <circle cx="360" cy="60" r="1.5"/>
    <circle cx="380" cy="100" r="1.5"/>
    <circle cx="400" cy="70" r="1.5"/>
    <circle cx="420" cy="90" r="1.5"/>
    <circle cx="440" cy="50" r="1.5"/>
    <circle cx="460" cy="80" r="1.5"/>
    <circle cx="480" cy="60" r="1.5"/>
  </g>
  <!-- Rainbow after the rain -->
  <path d="M 60 300 Q 128 260 196 300 Q 264 260 332 300 Q 400 260 472 300" stroke="#ff7f00" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 60 310 Q 128 270 196 310 Q 264 270 332 310 Q 400 270 472 310" stroke="#ff0000" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 60 320 Q 128 280 196 320 Q 264 280 332 320 Q 400 280 472 320" stroke="#ff7f00" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 60 330 Q 128 290 196 330 Q 264 290 332 330 Q 400 290 472 330" stroke="#ffff00" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 60 340 Q 128 300 196 340 Q 264 300 332 340 Q 400 300 472 340" stroke="#00ff00" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 60 350 Q 128 310 196 350 Q 264 310 332 350 Q 400 310 472 350" stroke="#0000ff" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 60 360 Q 128 320 196 360 Q 264 320 332 360 Q 400 320 472 360" stroke="#4b0082" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Raindrops catching rainbow -->
  <circle cx="128" cy="260" r="1.2" fill="#a0c4ff" opacity="0.8"/>
  <circle cx="196" cy="260" r="1.2" fill="#a0c4ff" opacity="0.8"/>
  <circle cx="264" cy="260" r="1.2" fill="#a0c4ff" opacity="0.8"/>
  <circle cx="332" cy="260" r="1.2" fill="#a0c4ff" opacity="0.8"/>
  <circle cx="396" cy="260" r="1.2" fill="#a0c4ff" opacity="0.8"/>
  <!-- Samurai cat body -->
  <path d="M 200 280 C 220 260 240 260 260 280 C 280 300 280 320 260 340 C 240 360 220 360 200 340 C 180 320 180 300 200 280 Z" fill="url(#furPattern)" stroke="#000" stroke-width="2"/>
  <!-- Samurai cat head -->
  <path d="M 200 280 C 190 270 180 270 170 280 C 160 290 160 300 170 310 C 180 320 190 320 200 310 C 210 300 220 290 210 280 C 200 280 200 280 200 280 Z" fill="url(#furPattern)" stroke="#000" stroke-width="2"/>
  <!-- Ears -->
  <path d="M 170 280 L 160 260 L 175 270 Z" fill="url(#furPattern)" stroke="#000" stroke-width="1"/>
  <path d="M 230 280 L 240 260 L 225 270 Z" fill="url(#furPattern)" stroke="#000" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="185" cy="290" r="5" fill="#000"/>
  <circle cx="215" cy="290" r="5" fill="#000"/>
  <!-- Mouth -->
  <path d="M 195 305 Q 200 310 205 305" stroke="#000" stroke-width="1" fill="none"/>
  <!-- Katana -->
  <path d="M 260 300 L 320 300" stroke="#c19a6b" stroke-width="6" stroke-linecap="round"/>
  <path d="M 320 300 L 340 280 L 340 320 Z" fill="#c19a6b" stroke="#000" stroke-width="1"/>
  <!-- Tail -->
  <path d="M 180 340 C 160 360 140 380 140 400 C 140 420 160 440 180 420" stroke="url(#furPattern)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Paws -->
  <circle cx="220" cy="360" r="8" fill="url(#furPattern)" stroke="#000" stroke-width="1"/>
  <circle cx="240" cy="360" r="8" fill="url(#furPattern)" stroke="#000" stroke-width="1"/>
  <circle cx="180" cy="380" r="8" fill="url(#furPattern)" stroke="#000" stroke-width="1"/>
  <circle cx="200" cy="380" r="8" fill="url(#furPattern)" stroke="#000" stroke-width="1"/>
  <!-- Belt -->
  <path d="M 190 320 L 210 320" stroke="#000" stroke-width="3" fill="none"/>
  <!-- Belt buckle -->
  <circle cx="200" cy="320" r="3" fill="#ffd700" stroke="#000" stroke-width="1"/>
  <!-- Fur details -->
  <path d="M 200 290 L 205 295" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 195 300 L 200 305" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 205 300 L 210 305" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 215 310 L 220 315" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 190 315 L 195 320" stroke="#000" stroke-width="1" fill="none"/>
  <path d="M 210 320 L 215 325" stroke="#000" stroke-width="1" fill="none"/>
  <!-- Rainbow shine -->
  <path d="M 128 260 L 128 250" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <path d="M 196 260 L 196 250" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <path d="M 264 260 L 264 250" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <path d="M 332 260 L 332 250" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <path d="M 396 260 L 396 250" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <!-- Fur pattern definition -->
  <defs>
    <pattern id="furPattern" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M 0 0 L 8 0 L 8 8 L 0 8 Z" fill="#f5f5dc"/>
      <path d="M 0 0 L 8 8 M 2 0 L 0 2 M 4 0 L 0 4 M 6 0 L 0 6 M 8 0 L 0 8 M 8 2 L 6 0 M 8 4 L 4 0 M 8 6 L 2 0" stroke="#d3d3d3" stroke-width="0.5"/>
    </pattern>
  </defs>
</svg>
