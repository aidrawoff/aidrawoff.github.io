<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    
    <!-- Ocean Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Sand Gradient -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Castle Tower Gradient -->
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Pizza Cheese Gradient -->
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="512" height="240" fill="url(#skyGrad)"/>

  <!-- Fluffy Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="90" cy="65" rx="42" ry="20"/>
    <ellipse cx="122" cy="70" rx="32" ry="16"/>
    <ellipse cx="65" cy="75" rx="26" ry="13"/>

    <ellipse cx="390" cy="100" rx="55" ry="22"/>
    <ellipse cx="435" cy="105" rx="35" ry="16"/>
  </g>

  <!-- Radiant Sun -->
  <circle cx="430" cy="55" r="45" fill="#fef08a" opacity="0.95" filter="url(#shadow)"/>
  <circle cx="430" cy="55" r="62" fill="#fde047" opacity="0.3"/>

  <!-- Ocean -->
  <rect y="220" width="512" height="50" fill="url(#oceanGrad)"/>
  <path d="M 0 220 Q 64 210, 128 220 T 256 220 T 384 220 T 512 220 L 512 270 L 0 270 Z" fill="#0284c7" opacity="0.6"/>
  <!-- Sparkly Wave foam -->
  <path d="M 0 223 Q 42 218, 84 223 T 168 223 T 252 223 T 336 223 T 420 223 T 504 223 L 512 228 L 0 228 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M 0 232 Q 50 228, 100 232 T 200 232 T 300 232 T 400 232 T 500 232 L 512 236 L 0 236 Z" fill="#e0f2fe" opacity="0.75"/>

  <!-- Beach Sand -->
  <rect y="260" width="512" height="252" fill="url(#sandGrad)"/>

  <!-- Sand dunes / Texture highlights -->
  <ellipse cx="160" cy="305" rx="190" ry="35" fill="#fbbf24" opacity="0.45"/>
  <ellipse cx="360" cy="315" rx="170" ry="30" fill="#fbbf24" opacity="0.45"/>
  <ellipse cx="256" cy="485" rx="220" ry="25" fill="#c2410c" opacity="0.25"/>

  <!-- === MAGNIFICENT SAND CASTLE === -->
  <g filter="url(#shadow)">
    <!-- Base Retaining Wall -->
    <rect x="136" y="325" width="240" height="150" rx="12" fill="url(#towerGrad)"/>
    
    <!-- Left Tower -->
    <rect x="100" y="255" width="70" height="220" rx="8" fill="url(#towerGrad)"/>
    <!-- Right Tower -->
    <rect x="342" y="255" width="70" height="220" rx="8" fill="url(#towerGrad)"/>
    <!-- Center Keep -->
    <rect x="206" y="200" width="100" height="275" rx="12" fill="url(#towerGrad)"/>

    <!-- Castle Grand Arch Gate (Pizza Oven style!) -->
    <path d="M 226 475 L 226 415 A 30 30 0 0 1 286 415 L 286 475 Z" fill="#451a03"/>
    <!-- Glowing internal pizza oven light -->
    <path d="M 234 475 L 234 420 A 22 22 0 0 1 278 420 L 278 475 Z" fill="#f59e0b" opacity="0.9"/>
    <!-- Mini pizza inside oven -->
    <circle cx="256" cy="450" r="10" fill="#fef08a"/>
    <circle cx="253" cy="447" r="3" fill="#dc2626"/>
    <circle cx="260" cy="453" r="2.5" fill="#dc2626"/>

    <!-- Crenellations (Battlements) with Cheese Drips -->
    <!-- Left tower battlements -->
    <path d="M 94 255 h 82 v -18 h -16 v -12 h -14 v 12 h -22 v -12 h -14 v 12 h -16 z" fill="#fde047"/>
    <!-- Right tower battlements -->
    <path d="M 336 255 h 82 v -18 h -16 v -12 h -14 v 12 h -22 v -12 h -14 v 12 h -16 z" fill="#fde047"/>
    <!-- Center keep battlements -->
    <path d="M 198 200 h 116 v -20 h -18 v -14 h -16 v 14 h -30 v -14 h -16 v 14 h -18 v 20 z" fill="#fde047"/>

    <!-- === PIZZA CONICAL ROOFS === -->
    <!-- Left Roof -->
    <path d="M 135 150 L 90 240 L 180 240 Z" fill="#dc2626"/>
    <!-- Roof Pepperonis & Cheese -->
    <circle cx="135" cy="190" r="10" fill="#fbbf24"/>
    <circle cx="115" cy="220" r="7" fill="#fbbf24"/>
    <circle cx="150" cy="225" r="8" fill="#fef08a"/>

    <!-- Right Roof -->
    <path d="M 377 150 L 332 240 L 422 240 Z" fill="#dc2626"/>
    <circle cx="377" cy="190" r="10" fill="#fbbf24"/>
    <circle cx="397" cy="220" r="7" fill="#fbbf24"/>
    <circle cx="362" cy="225" r="8" fill="#fef08a"/>

    <!-- Center Roof (Grand Pepperoni Supreme) -->
    <path d="M 256 90 L 196 185 L 316 185 Z" fill="#dc2626"/>
    <circle cx="256" cy="135" r="13" fill="#fbbf24"/>
    <circle cx="230" cy="165" r="9" fill="#fbbf24"/>
    <circle cx="282" cy="165" r="9" fill="#fbbf24"/>
    <circle cx="256" cy="160" r="7" fill="#fef08a"/>

    <!-- === MELTED CHEESE DRIPS ON WALLS === -->
    <path d="M 100 275 Q 115 305, 125 280 Q 135 310, 145 280 Q 155 305, 170 275 Z" fill="url(#cheeseGrad)"/>
    <path d="M 342 275 Q 357 305, 367 280 Q 377 310, 387 280 Q 397 305, 412 275 Z" fill="url(#cheeseGrad)"/>
    <path d="M 206 225 Q 226 255, 246 230 Q 266 260, 286 230 Q 306 255, 306 225 Z" fill="url(#cheeseGrad)"/>

    <!-- Pepperoni Emblems on Walls -->
    <circle cx="135" cy="365" r="16" fill="#dc2626"/>
    <circle cx="135" cy="365" r="11" fill="#ef4444"/>
    <circle cx="130" cy="360" r="3.5" fill="#fbbf24"/>
    <circle cx="140" cy="370" r="2.5" fill="#fbbf24"/>

    <circle cx="377" cy="365" r="16" fill="#dc2626"/>
    <circle cx="377" cy="365" r="11" fill="#ef4444"/>
    <circle cx="372" cy="360" r="3.5" fill="#fbbf24"/>
    <circle cx="382" cy="370" r="2.5" fill="#fbbf24"/>

    <circle cx="256" cy="320" r="20" fill="#dc2626"/>
    <circle cx="256" cy="320" r="15" fill="#ef4444"/>
    <circle cx="248" cy="312" r="4" fill="#fbbf24"/>
    <circle cx="264" cy="328" r="3.5" fill="#fbbf24"/>
    <circle cx="262" cy="312" r="3" fill="#fbbf24"/>

    <!-- Windows (Arched Pizza Windows) -->
    <path d="M 125 310 L 125 330 A 10 10 0 0 0 145 330 L 145 310 Z" fill="#fef08a"/>
    <path d="M 367 310 L 367 330 A 10 10 0 0 0 387 330 L 387 310 Z" fill="#fef08a"/>

    <!-- Pizza Flags on Turrets with waving poles -->
    <line x1="135" y1="150" x2="135" y2="110" stroke="#78350f" stroke-width="3"/>
    <polygon points="135,110 165,120 135,130" fill="#f59e0b"/>
    <circle cx="145" cy="120" r="3.5" fill="#dc2626"/>

    <line x1="377" y1="150" x2="377" y2="110" stroke="#78350f" stroke-width="3"/>
    <polygon points="377,110 407,120 377,130" fill="#f59e0b"/>
    <circle cx="387" cy="120" r="3.5" fill="#dc2626"/>

    <line x1="256" y1="90" x2="256" y2="45" stroke="#78350f" stroke-width="4"/>
    <polygon points="256,45 295,57 256,69" fill="#f59e0b"/>
    <circle cx="270" cy="57" r="4.5" fill="#dc2626"/>
    <circle cx="282" cy="61" r="3" fill="#dc2626"/>
  </g>

  <!-- === BEACH ACCESSORIES & PIZZA BOXES === -->
  <!-- Giant Pizza Box on Sand (Foreground center) -->
  <g transform="translate(180, 420)" filter="url(#shadow)">
    <polygon points="0,35 76,5 152,35 76,65" fill="#fde047"/>
    <polygon points="0,35 76,65 76,85 0,55" fill="#d97706"/>
    <polygon points="76,65 152,35 152,55 76,85" fill="#b45309"/>
    <!-- Pizza slice logo open on box lid -->
    <path d="M 76 20 L 58 48 L 94 48 Z" fill="#dc2626"/>
    <circle cx="76" cy="35" r="6" fill="#fef08a"/>
    <circle cx="68" cy="42" r="3.5" fill="#fef08a"/>
    <circle cx="82" cy="40" r="3" fill="#fef08a"/>
  </g>

  <!-- Beach Umbrella (Pizza themed!) -->
  <g transform="translate(390, 390)" filter="url(#shadow)">
    <line x1="30" y1="0" x2="30" y2="90" stroke="#78350f" stroke-width="6"/>
    <!-- Umbrella Canopy (Pepperoni Pizza Slice pattern) -->
    <path d="M -20 10 Q 30 -20, 80 10 Q 30 25, -20 10 Z" fill="#dc2626"/>
    <ellipse cx="30" cy="12" rx="50" ry="15" fill="#dc2626"/>
    <path d="M -15 15 Q 30 28, 75 15" fill="none" stroke="#fef08a" stroke-width="4"/>
    <circle cx="10" cy="12" r="6" fill="#fef08a"/>
    <circle cx="45" cy="15" r="7" fill="#fef08a"/>
  </g>

  <!-- === CHARACTERS DEEPLY IN LOVE WITH PIZZA === -->
  <!-- Character 1 (Left Beachgoer) -->
  <g transform="translate(45, 380)" filter="url(#shadow)">
    <!-- Beach towel -->
    <ellipse cx="25" cy="70" rx="30" ry="12" fill="#3b82f6"/>
    <!-- Body -->
    <ellipse cx="25" cy="45" rx="16" ry="22" fill="#06b6d4"/>
    <!-- Head -->
    <circle cx="25" cy="16" r="14" fill="#fbcfe8"/>
    <!-- Glowing Heart Eyes -->
    <path d="M 18 13 Q 21 9, 24 13 Q 21 18, 18 13 Z" fill="#dc2626"/>
    <path d="M 28 13 Q 31 9, 34 13 Q 31 18, 28 13 Z" fill="#dc2626"/>
    <circle cx="21" cy="12" r="1.5" fill="#ffffff"/>
    <circle cx="31" cy="12" r="1.5" fill="#ffffff"/>
    <!-- Big Blissful Smile -->
    <path d="M 20 22 Q 25 28, 30 22" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Holding Pizza Slice -->
    <g transform="translate(30, 35) rotate(25)">
      <polygon points="0,0 25,-15 15,25" fill="#fbbf24"/>
      <polygon points="0,0 15,25 12,28 -3,5" fill="#dc2626"/>
      <circle cx="8" cy="10" r="3.5" fill="#ef4444"/>
      <circle cx="14" cy="5" r="2.5" fill="#ef4444"/>
    </g>
  </g>

  <!-- Character 2 (Right Beachgoer) -->
  <g transform="translate(425, 375)" filter="url(#shadow)">
    <!-- Beach towel -->
    <ellipse cx="25" cy="75" rx="32" ry="12" fill="#ec4899"/>
    <!-- Body -->
    <ellipse cx="25" cy="48" rx="16" ry="24" fill="#8b5cf6"/>
    <!-- Head -->
    <circle cx="25" cy="17" r="14" fill="#fbcfe8"/>
    <!-- Glowing Heart Eyes -->
    <path d="M 18 14 Q 21 10, 24 14 Q 21 19, 18 14 Z" fill="#dc2626"/>
    <path d="M 28 14 Q 31 10, 34 14 Q 31 19, 28 14 Z" fill="#dc2626"/>
    <circle cx="21" cy="13" r="1.5" fill="#ffffff"/>
    <circle cx="31" cy="13" r="1.5" fill="#ffffff"/>
    <!-- Big Blissful Smile -->
    <path d="M 20 23 Q 25 29, 30 23" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Raising Giant Pizza Slice High in Adoration -->
    <g transform="translate(-15, 10) rotate(-15)">
      <polygon points="0,15 35,-10 20,40" fill="#fbbf24"/>
      <polygon points="0,15 20,40 17,44 -5,19" fill="#dc2626"/>
      <circle cx="12" cy="18" r="4" fill="#ef4444"/>
      <circle cx="22" cy="10" r="3.5" fill="#ef4444"/>
      <circle cx="8" cy="28" r="3" fill="#ef4444"/>
    </g>
  </g>

  <!-- Floating Pizza Slice in Sky (Magical Aura of Love) -->
  <g transform="translate(230, 50) rotate(15)" filter="url(#shadow)">
    <polygon points="0,0 35,-20 20,40" fill="#fbbf24"/>
    <polygon points="0,0 20,40 16,45 -4,5" fill="#dc2626"/>
    <circle cx="12" cy="15" r="4" fill="#ef4444"/>
    <circle cx="22" cy="5" r="3.5" fill="#ef4444"/>
  </g>

  <!-- Floating Hearts & Sparkles -->
  <g fill="#f43f5e" opacity="0.9">
    <path d="M 180 110 Q 185 100, 190 110 Q 195 120, 180 135 Q 165 120, 170 110 Q 175 100, 180 110 Z" transform="scale(0.8) translate(50, 0)"/>
    <path d="M 330 80 Q 335 70, 340 80 Q 345 90, 330 105 Q 315 90, 320 80 Q 325 70, 330 90 Z" transform="scale(0.9) translate(50, -10)"/>
  </g>

  <g fill="#fef08a">
    <polygon points="100,140 103,148 111,151 103,154 100,162 97,154 89,151 97,148"/>
    <polygon points="410,200 412,205 417,207 412,209 410,214 408,209 403,207 408,205"/>
  </g>
</svg>
