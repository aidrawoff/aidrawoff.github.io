<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#2a1140"/>
      <stop offset="1" stop-color="#0b0614"/>
    </radialGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0c1c"/>
      <stop offset="1" stop-color="#0a0508"/>
    </linearGradient>
  </defs>
  <!-- night sky -->
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
  <!-- stars -->
  <circle cx="60" cy="60" r="2" fill="#fff"/>
  <circle cx="140" cy="110" r="1.5" fill="#fff"/>
  <circle cx="230" cy="50" r="2" fill="#fff"/>
  <circle cx="470" cy="200" r="1.5" fill="#fff"/>
  <circle cx="40" cy="220" r="1.5" fill="#fff"/>
  <!-- moon -->
  <circle cx="400" cy="90" r="46" fill="#f4eed8"/>
  <circle cx="416" cy="78" r="40" fill="#2a1140"/>
  <!-- bats -->
  <path d="M90 150 Q105 130 120 150 Q130 138 140 150 Q125 158 120 168 Q112 156 90 150 Z" fill="#000"/>
  <path d="M330 120 Q342 104 354 120 Q362 110 372 120 Q360 128 354 136 Q346 126 330 120 Z" fill="#000"/>
  <!-- ground -->
  <rect x="0" y="420" width="512" height="92" fill="#120a1c"/>
  <ellipse cx="256" cy="446" rx="150" ry="14" fill="#000" opacity="0.6"/>
  <!-- back legs -->
  <ellipse cx="150" cy="412" rx="30" ry="14" fill="#5fb13f" stroke="#0b1a08" stroke-width="5"/>
  <ellipse cx="362" cy="412" rx="30" ry="14" fill="#5fb13f" stroke="#0b1a08" stroke-width="5"/>
  <!-- cape: flared wings -->
  <path d="M150 262 Q88 300 84 430 L428 430 Q424 300 362 262 Q256 226 150 262 Z" fill="url(#cape)" stroke="#000" stroke-width="5"/>
  <path d="M150 262 Q256 226 362 262 L346 296 Q256 262 166 296 Z" fill="#9b0f22"/>
  <path d="M100 330 Q120 300 150 300 L150 430 L84 430 Z" fill="#14060c" opacity="0.7"/>
  <path d="M96 420 Q94 320 150 272" fill="none" stroke="#5a2a48" stroke-width="4" opacity="0.6"/>
  <!-- frog body -->
  <ellipse cx="256" cy="336" rx="88" ry="76" fill="#7fcf5a" stroke="#0b1a08" stroke-width="6"/>
  <ellipse cx="236" cy="306" rx="30" ry="18" fill="#a6e486" opacity="0.6"/>
  <!-- head -->
  <ellipse cx="256" cy="250" rx="82" ry="60" fill="#8ed86a" stroke="#0b1a08" stroke-width="6"/>
  <!-- widow's peak hair -->
  <path d="M178 216 Q186 180 220 196 Q256 176 292 196 Q326 180 334 216 Q300 194 256 204 Q212 194 178 216 Z" fill="#0c0610" stroke="#000" stroke-width="3"/>
  <!-- collar -->
  <path d="M196 262 L256 304 L316 262 L338 226 L256 282 L174 226 Z" fill="#14060c" stroke="#000" stroke-width="4"/>
  <path d="M256 282 L256 304" stroke="#9b0f22" stroke-width="4"/>
  <!-- clasp -->
  <circle cx="256" cy="330" r="6" fill="#e0b030" stroke="#000" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="210" cy="218" r="26" fill="#fff" stroke="#0b1a08" stroke-width="5"/>
  <circle cx="302" cy="218" r="26" fill="#fff" stroke="#0b1a08" stroke-width="5"/>
  <circle cx="216" cy="222" r="12" fill="#ff1a1a"/>
  <circle cx="296" cy="222" r="12" fill="#ff1a1a"/>
  <circle cx="220" cy="217" r="3" fill="#fff"/>
  <circle cx="300" cy="217" r="3" fill="#fff"/>
  <!-- angled brows -->
  <path d="M182 176 L232 194" stroke="#0b1a08" stroke-width="7" stroke-linecap="round"/>
  <path d="M330 176 L280 194" stroke="#0b1a08" stroke-width="7" stroke-linecap="round"/>
  <!-- grin -->
  <path d="M204 266 Q256 312 308 266 Q256 290 204 266 Z" fill="#3a0a14" stroke="#0b1a08" stroke-width="5"/>
  <!-- fangs -->
  <path d="M222 272 L231 304 L240 272 Z" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M272 272 L281 304 L290 272 Z" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- front legs -->
  <ellipse cx="180" cy="402" rx="28" ry="16" fill="#6cbf4a" stroke="#0b1a08" stroke-width="5"/>
  <ellipse cx="332" cy="402" rx="28" ry="16" fill="#6cbf4a" stroke="#0b1a08" stroke-width="5"/>
</svg>
