<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff00aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="jellyGlow" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#ff66cc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#aa00ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Sky / bg -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Distant stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="40" cy="60" r="1.5"/>
    <circle cx="120" cy="30" r="1"/>
    <circle cx="200" cy="80" r="2"/>
    <circle cx="350" cy="40" r="1.5"/>
    <circle cx="460" cy="70" r="1"/>
    <circle cx="480" cy="150" r="1.5"/>
    <circle cx="80" cy="180" r="1"/>
    <circle cx="420" cy="200" r="2"/>
  </g>

  <!-- Distant moon -->
  <circle cx="400" cy="100" r="35" fill="#ffeeaa" opacity="0.15" filter="url(#blur)"/>

  <!-- Tree trunk (midground) -->
  <path d="M 180 512 L 200 300 Q 210 200 180 120 L 220 120 Q 250 200 240 300 L 280 512 Z" fill="#1a0f05"/>
  <path d="M 210 512 L 225 350 Q 230 250 210 150 L 235 150 Q 255 250 250 350 L 265 512 Z" fill="#2a1a0a"/>

  <!-- Tree branches behind house -->
  <path d="M 180 180 Q 120 160 80 140" stroke="#1a0f05" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 220 150 Q 280 130 340 120" stroke="#1a0f05" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Leaves clusters -->
  <g fill="#0f2a15" opacity="0.8">
    <circle cx="80" cy="140" r="25"/>
    <circle cx="95" cy="125" r="18"/>
    <circle cx="65" cy="155" r="15"/>
  </g>
  <g fill="#0f2a15" opacity="0.7">
    <circle cx="340" cy="120" r="22"/>
    <circle cx="355" cy="105" r="16"/>
    <circle cx="325" cy="135" r="14"/>
  </g>
  <g fill="#0f2a15" opacity="0.6">
    <circle cx="150" cy="100" r="20"/>
    <circle cx="400" cy="160" r="18"/>
    <circle cx="100" cy="220" r="15"/>
  </g>

  <!-- Treehouse platform -->
  <rect x="140" y="280" width="200" height="20" rx="3" fill="#3d2817"/>
  <rect x="135" y="300" width="210" height="8" rx="2" fill="#2a1a0a"/>
  <!-- Platform planks -->
  <line x1="140" y1="285" x2="340" y2="285" stroke="#2a1a0a" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="290" x2="340" y2="290" stroke="#2a1a0a" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="295" x2="340" y2="295" stroke="#2a1a0a" stroke-width="1" opacity="0.5"/>

  <!-- Treehouse walls -->
  <rect x="160" y="200" width="160" height="80" rx="4" fill="#4a3525"/>
  <rect x="165" y="205" width="150" height="70" rx="3" fill="#5c4230"/>
  <!-- Wall planks -->
  <line x1="165" y1="220" x2="315" y2="220" stroke="#3d2817" stroke-width="1" opacity="0.4"/>
  <line x1="165" y1="235" x2="315" y2="235" stroke="#3d2817" stroke-width="1" opacity="0.4"/>
  <line x1="165" y1="250" x2="315" y2="250" stroke="#3d2817" stroke-width="1" opacity="0.4"/>
  <line x1="165" y1="265" x2="315" y2="265" stroke="#3d2817" stroke-width="1" opacity="0.4"/>

  <!-- Window with light -->
  <rect x="200" y="220" width="40" height="35" rx="2" fill="#ffee88" opacity="0.8"/>
  <rect x="203" y="223" width="34" height="29" rx="1" fill="#fff8cc"/>
  <line x1="220" y1="220" x2="220" y2="255" stroke="#4a3525" stroke-width="2"/>
  <line x1="200" y1="237" x2="240" y2="237" stroke="#4a3525" stroke-width="2"/>

  <!-- Door -->
  <rect x="260" y="230" width="30" height="50" rx="2" fill="#3d2817"/>
  <circle cx="283" cy="255" r="2" fill="#ffaa00"/>

  <!-- Ladder -->
  <line x1="150" y1="300" x2="150" y2="512" stroke="#5c4230" stroke-width="4"/>
  <line x1="170" y1="300" x2="170" y2="512" stroke="#5c4230" stroke-width="4"/>
  <line x1="150" y1="340" x2="170" y2="340" stroke="#5c4230" stroke-width="3"/>
  <line x1="150" y1="400" x2="170" y2="400" stroke="#5c4230" stroke-width="3"/>
  <line x1="150" y1="460" x2="170" y2="460" stroke="#5c4230" stroke-width="3"/>

  <!-- Roof -->
  <path d="M 140 200 L 240 140 L 340 200 Z" fill="#2d1f14"/>
  <path d="M 145 200 L 240 145 L 335 200 Z" fill="#3d2817"/>
  <!-- Roof shingles -->
  <path d="M 150 190 L 240 140 L 240 150 L 150 200 Z" fill="#2d1f14" opacity="0.5"/>
  <path d="M 240 140 L 330 190 L 330 200 L 240 150 Z" fill="#2d1f14" opacity="0.5"/>
  <path d="M 170 180 L 240 145 L 240 155 L 170 190 Z" fill="#1a120c" opacity="0.4"/>
  <path d="M 240 145 L 310 180 L 310 190 L 240 155 Z" fill="#1a120c" opacity="0.4"/>

  <!-- Jellyfish (subject, foreground) -->
  <g transform="translate(260, 120)">
    <!-- Outer aura -->
    <ellipse cx="0" cy="5" rx="70" ry="60" fill="#ff00aa" opacity="0.1" filter="url(#blur)"/>
    <!-- Bell glow -->
    <ellipse cx="0" cy="0" rx="55" ry="45" fill="url(#jellyGlow)" opacity="0.7"/>
    <!-- Bell rim light -->
    <path d="M -45 10 Q -45 -40 0 -45 Q 45 -40 45 10" fill="none" stroke="#ffccff" stroke-width="2" opacity="0.9"/>
    <!-- Bell -->
    <path d="M -45 10 Q -45 -40 0 -45 Q 45 -40 45 10 Q 25 5 0 5 Q -25 5 -45 10 Z" fill="#ff66cc" opacity="0.9"/>
    <path d="M -40 5 Q -40 -35 0 -40 Q 40 -35 40 5" fill="none" stroke="#ff99dd" stroke-width="2" opacity="0.8"/>
    <!-- Tentacles -->
    <path d="M -35 5 Q -40 45 -30 85 Q -25 100 -35 120" stroke="#ff66cc" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round"/>
    <path d="M -20 5 Q -25 50 -15 95 Q -10 115 -20 135" stroke="#ff99dd" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M -5 5 Q -10 55 0 100 Q 5 120 -5 140" stroke="#ff66cc" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round"/>
    <path d="M 10 5 Q 5 50 15 90 Q 20 110 10 130" stroke="#ff99dd" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 25 5 Q 20 45 30 80 Q 35 100 25 120" stroke="#ff66cc" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round"/>
    <path d="M 38 5 Q 35 40 42 70" stroke="#ff99dd" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M -42 5 Q -48 35 -38 65" stroke="#ff66cc" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
    <!-- Inner organs -->
    <circle cx="-15" cy="-18" r="5" fill="#ff00aa" opacity="0.7"/>
    <circle cx="10" cy="-22" r="4" fill="#aa00ff" opacity="0.7"/>
    <circle cx="0" cy="-8" r="6" fill="#ff00aa" opacity="0.6"/>
    <circle cx="-5" cy="-25" r="3" fill="#ff99dd" opacity="0.8"/>
    <circle cx="18" cy="-12" r="3" fill="#ff66cc" opacity="0.8"/>
  </g>

  <!-- Video game UI (twist) -->
  <!-- Health bar -->
  <rect x="20" y="20" width="120" height="16" rx="4" fill="#000000" opacity="0.6" stroke="#ffffff" stroke-width="1"/>
  <rect x="24" y="23" width="80" height="10" rx="2" fill="#ff3333"/>
  <text x="28" y="31" font-family="monospace" font-size="9" fill="#ffffff" font-weight="bold">HP</text>

  <!-- Score -->
  <text x="480" y="30" font-family="monospace" font-size="14" fill="#00ff00" text-anchor="end" font-weight="bold">SCORE: 00420</text>

  <!-- Level indicator -->
  <text x="256" y="35" font-family="monospace" font-size="12" fill="#00ffff" text-anchor="middle" font-weight="bold">LEVEL 7: THE CANOPY</text>

  <!-- Mini-map -->
  <rect x="430" y="430" width="70" height="70" rx="4" fill="#000000" opacity="0.5" stroke="#00ff00" stroke-width="1"/>
  <circle cx="465" cy="465" r="3" fill="#ff00aa"/>
  <rect x="450" y="450" width="8" height="6" fill="#00ff00" opacity="0.6"/>

  <!-- CRT scanline overlay -->
  <g opacity="0.08">
    <line x1="0" y1="20" x2="512" y2="20" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="40" x2="512" y2="40" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="60" x2="512" y2="60" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="80" x2="512" y2="80" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="100" x2="512" y2="100" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="120" x2="512" y2="120" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="140" x2="512" y2="140" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="160" x2="512" y2="160" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="180" x2="512" y2="180" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="200" x2="512" y2="200" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="220" x2="512" y2="220" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="240" x2="512" y2="240" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="260" x2="512" y2="260" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="280" x2="512" y2="280" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="300" x2="512" y2="300" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="320" x2="512" y2="320" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="340" x2="512" y2="340" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="360" x2="512" y2="360" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="380" x2="512" y2="380" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="400" x2="512" y2="400" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="420" x2="512" y2="420" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="440" x2="512" y2="440" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="460" x2="512" y2="460" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="480" x2="512" y2="480" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="500" x2="512" y2="500" stroke="#000000" stroke-width="1"/>
  </g>

  <!-- Crosshair -->
  <g opacity="0.4" stroke="#00ff00" stroke-width="1.5">
    <line x1="246" y1="256" x2="254" y2="256"/>
    <line x1="258" y1="256" x2="266" y2="256"/>
    <line x1="256" y1="246" x2="256" y2="254"/>
    <line x1="256" y1="258" x2="256" y2="266"/>
    <circle cx="256" cy="256" r="12" fill="none" stroke="#00ff00" stroke-width="1"/>
  </g>
</svg>