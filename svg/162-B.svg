<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="0.6" stop-color="#4a2352"/>
      <stop offset="1" stop-color="#8a3b46"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="410" cy="90" r="42" fill="#f6e7b0"/>
  <circle cx="392" cy="80" r="10" fill="#e3d199"/>
  <g fill="#ffd94a">
    <circle cx="60" cy="60" r="2"/><circle cx="140" cy="40" r="2"/><circle cx="230" cy="70" r="2"/>
    <circle cx="300" cy="35" r="2"/><circle cx="480" cy="150" r="2"/><circle cx="30" cy="180" r="2"/>
  </g>
  <!-- road -->
  <path d="M0 300 L512 300 L512 512 L0 512 Z" fill="#232331"/>
  <g stroke="#e8e2c8" stroke-width="6" stroke-dasharray="34 26">
    <line x1="0" y1="380" x2="512" y2="380"/>
  </g>
  <!-- cars: queue going right -->
  <g stroke="#0d0d16" stroke-width="4">
    <rect x="330" y="320" width="150" height="52" rx="12" fill="#b03a48"/>
    <rect x="180" y="330" width="140" height="48" rx="12" fill="#2e7d8f"/>
    <rect x="40" y="325" width="135" height="50" rx="12" fill="#c98a2e"/>
  </g>
  <g fill="#101018">
    <circle cx="370" cy="376" r="15"/><circle cx="455" cy="376" r="15"/>
    <circle cx="215" cy="380" r="14"/><circle cx="295" cy="380" r="14"/>
    <circle cx="75" cy="378" r="14"/><circle cx="150" cy="378" r="14"/>
  </g>
  <g fill="#ffe9a8">
    <ellipse cx="478" cy="345" rx="9" ry="6"/><ellipse cx="318" cy="352" rx="8" ry="5"/>
    <ellipse cx="176" cy="348" rx="8" ry="5"/>
  </g>
  <!-- brake glow -->
  <g fill="#ff4a4a" opacity="0.85"><circle cx="332" cy="345" r="7"/><circle cx="182" cy="352" r="6"/><circle cx="42" cy="348" r="6"/></g>
  <!-- witch on broom, hovering above the jam, impatient -->
  <g transform="translate(160,175) rotate(-8) scale(1.28)">
    <path d="M-70 30 Q20 22 96 12" stroke="#7a4a22" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M96 12 l34 -12 M96 12 l36 4 M96 12 l30 16" stroke="#d8b25a" stroke-width="6" stroke-linecap="round"/>
    <!-- dress -->
    <path d="M-6 -18 Q22 -10 20 24 Q0 34 -22 26 Q-16 0 -6 -18 Z" fill="#2a1745" stroke="#0d0d16" stroke-width="4"/>
    <!-- arm pointing forward -->
    <path d="M8 -6 Q34 -14 48 -26" stroke="#2a1745" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="52" cy="-29" r="6" fill="#e8b48a" stroke="#0d0d16" stroke-width="3"/>
    <!-- head -->
    <circle cx="-2" cy="-34" r="16" fill="#e8b48a" stroke="#0d0d16" stroke-width="4"/>
    <path d="M-16 -50 Q-2 -78 16 -52 Q0 -60 -16 -50 Z" fill="#4a1f6b" stroke="#0d0d16" stroke-width="4"/>
    <path d="M-22 -52 L22 -52" stroke="#0d0d16" stroke-width="4" stroke-linecap="round"/>
    <!-- hair -->
    <path d="M-14 -30 Q-30 -20 -26 -2 Q-16 -8 -10 -22 Z" fill="#c2385a" stroke="#0d0d16" stroke-width="3"/>
  </g>
  <!-- steam / exasperation marks -->
  <g stroke="#ffd9c0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M250 120 q8 -12 0 -24"/>
    <path d="M270 128 q10 -14 0 -28"/>
  </g>
  <text x="255" y="100" font-size="34" fill="#ffd94a" font-family="serif">!!</text>
  <!-- exhaust fumes from the idling queue -->
  <g fill="#9a9ab0" opacity="0.45">
    <circle cx="26" cy="360" r="12"/><circle cx="14" cy="344" r="9"/><circle cx="30" cy="330" r="6"/>
    <circle cx="320" cy="368" r="11"/><circle cx="308" cy="352" r="8"/>
    <circle cx="160" cy="366" r="10"/><circle cx="150" cy="350" r="7"/>
  </g>
  <!-- traffic sign: gridlock -->
  <g stroke="#0d0d16" stroke-width="4">
    <rect x="466" y="404" width="34" height="34" rx="5" fill="#e8e2c8"/>
    <line x1="483" y1="438" x2="483" y2="470" stroke-width="6"/>
  </g>
  <path d="M472 421 h22 M483 410 v22" stroke="#b03a48" stroke-width="5" stroke-linecap="round"/>
  <!-- glowing phone in her free hand -->
  <g transform="translate(205,196) rotate(-10)">
    <rect x="-9" y="-14" width="18" height="28" rx="3" fill="#8ff0ff" stroke="#0d0d16" stroke-width="3"/>
    <rect x="-6" y="-10" width="12" height="18" fill="#dffaff"/>
  </g>
  <circle cx="205" cy="196" r="26" fill="#8ff0ff" opacity="0.18"/>
  <!-- curb / lane edge for depth -->
  <rect x="0" y="300" width="512" height="7" fill="#3a3a4d"/>
  <rect x="0" y="470" width="512" height="42" fill="#1a1a24"/>
  <g fill="#4a4a5e"><rect x="40" y="486" width="60" height="5"/><rect x="180" y="492" width="70" height="5"/><rect x="340" y="484" width="55" height="5"/></g>
</svg>
