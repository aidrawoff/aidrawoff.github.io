<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="candleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffeb3b" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ff9800" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ff5722" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="darkness" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#1a0a2e" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0d0218" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#05010a" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Deep dark background -->
  <rect width="512" height="512" fill="#030008"/>

  <!-- Ambient darkness vignette -->
  <rect width="512" height="512" fill="url(#darkness)"/>

  <!-- Vampire silhouette huddled -->
  <g id="vampire">
    <!-- Cape draped around body -->
    <path d="M 180 420 Q 150 300 170 220 Q 180 180 220 170 Q 260 160 290 190 Q 320 220 330 280 Q 340 350 320 420 Z" fill="#0a0014"/>
    <!-- Cape inner fold -->
    <path d="M 200 420 Q 190 320 210 240 Q 230 200 260 210 Q 280 230 290 300 Q 300 370 280 420 Z" fill="#140024"/>
    <!-- Head -->
    <ellipse cx="245" cy="175" rx="28" ry="32" fill="#e8d5f0"/>
    <!-- Hair -->
    <path d="M 215 170 Q 220 130 245 125 Q 270 130 275 170 Q 270 155 245 150 Q 220 155 215 170 Z" fill="#0a0014"/>
    <!-- Pointed ears peeking from hair -->
    <path d="M 218 165 L 208 145 L 225 160 Z" fill="#e8d5f0"/>
    <path d="M 272 165 L 282 145 L 265 160 Z" fill="#e8d5f0"/>
    <!-- Eyes wide with fear -->
    <ellipse cx="235" cy="178" rx="6" ry="7" fill="#ffffff"/>
    <ellipse cx="255" cy="178" rx="6" ry="7" fill="#ffffff"/>
    <circle cx="235" cy="178" r="2.5" fill="#000000"/>
    <circle cx="255" cy="178" r="2.5" fill="#000000"/>
    <!-- Tiny fangs -->
    <path d="M 240 195 L 242 202 L 244 195 Z" fill="#ffffff"/>
    <path d="M 246 195 L 248 202 L 250 195 Z" fill="#ffffff"/>
    <!-- Hands clutching candle -->
    <ellipse cx="230" cy="310" rx="12" ry="18" fill="#e8d5f0"/>
    <ellipse cx="260" cy="310" rx="12" ry="18" fill="#e8d5f0"/>
  </g>

  <!-- Candle -->
  <rect x="240" y="300" width="10" height="30" fill="#f5deb3"/>
  <rect x="238" y="330" width="14" height="4" fill="#8b4513"/>
  <path d="M 245 300 Q 242 285 245 275 Q 248 285 245 300 Z" fill="#ff5722"/>

  <!-- Hero light: candle glow -->
  <circle cx="245" cy="275" r="120" fill="url(#candleGlow)"/>

  <!-- Shadows cast by the cape -->
  <path d="M 180 420 Q 200 350 240 330 Q 260 340 280 380 Q 300 420 320 420 Z" fill="#050008" opacity="0.6"/>

  <!-- Tiny scared shadow creatures in the dark -->
  <circle cx="80" cy="100" r="3" fill="#1a0a2e" opacity="0.5"/>
  <circle cx="450" cy="80" r="4" fill="#1a0a2e" opacity="0.4"/>
  <circle cx="420" cy="400" r="3" fill="#1a0a2e" opacity="0.5"/>
  <circle cx="100" cy="380" r="2" fill="#1a0a2e" opacity="0.4"/>
</svg>