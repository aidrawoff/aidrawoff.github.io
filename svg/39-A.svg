<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9fa"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="splashBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Upside-down squid painter: squid hangs downward, painterly elements upside-down -->
  <g transform="translate(256 384) scale(1 -1) translate(-256 -384)">
    <!-- Mantle and head with refined shape -->
    <path d="M256 320c-36 0-64-28-64-64 0-20 12-38 28-48 16-10 36-16 56-16s40 6 56 16c16 10 28 28 28 48 0 36-28 64-64 64zm-48-64c-8 0-16-8-16-16s8-16 16-16 16 8 16 16-8 16-16 16zm96 0c-8 0-16-8-16-16s8-16 16-16 16 8 16 16-8 16-16 16z" fill="#212529"/>
    <!-- Eye with subtle highlight -->
    <circle cx="256" cy="288" r="10" fill="#000"/>
    <circle cx="256" cy="284" r="3" fill="#fff" opacity="0.6"/>
    <!-- Tentacles (pointing up due to transform) -->
    <path d="M200 320c-16-24-28-52-28-84 0-32 8-60 24-80 16-20 36-32 56-32s40 12 56 32c16 20 24 48 24 80 0 32-8 60-24 80-16 20-36 32-56 32s-40-12-56-32zm0-56c-8 0-16-8-16-16s8-16 16-16 16 8 16 16-8 16-16 16zm40-48c-8 0-16-8-16-16s8-16 16-16 16 8 16 16-8 16-16 16zm-80 0c-8 0-16-8-16-16s8-16 16-16 16 8 16 16-8 16-16 16z" fill="#212529"/>
    <!-- Palette and brush strokes -->
    <ellipse cx="256" cy="208" rx="52" ry="28" fill="#6f42c1" opacity="0.8"/>
    <rect x="228" y="200" width="56" height="16" rx="6" fill="#dc3545"/>
    <circle cx="220" cy="192" r="7" fill="#fd7e14"/>
    <circle cx="238" cy="188" r="6" fill="#ffc107"/>
    <circle cx="256" cy="184" r="6" fill="#28a745"/>
    <circle cx="274" cy="188" r="6" fill="#17a2b8"/>
    <circle cx="292" cy="192" r="7" fill="#6f42c1"/>
    <!-- Brush stroke accents -->
    <path d="M208 160c10-14 20-24 30-28 10-4 20-4 30 0 10 4 20 14 30 28 10 14 15 32 15 48 0 18-5 34-15 48-10 14-20 24-30 28-10 4-20 4-30 0-10-4-20-14-30-28-10-14-15-32-15-48 0-18 5-34 15-48z" fill="#007bff" opacity="0.6"/>
    <path d="M304 160c-10-14-20-24-30-28-10-4-20-4-30 0s-20 14-30 28c-10 14-15 32-15 48 0 18 5 34 15 48 10 14 20 24 30 28 10 4 20 4 30 0s20-14 30-28c10-14 15-32 15-48 0-18-5-34-15-48z" fill="#28a745" opacity="0.6"/>
    <!-- Paint splashes and drips (upside-down) -->
    <path d="M180 120c-6 12-10 24-10 36 0 12 4 22 10 30 6 8 14 14 22 16 8 2 16 2 24 0 8-2 14-8 16-16 2-8-2-16-8-22-6-8-14-14-22-16-8-2-16-2-24 0-8 2-14 8-16 16 0 12-4 22-10 30-6 8-14 14-22 16-8 2-16 2-24 0-8-2-14-8-16-16-2-8 2-16 8-22 6-8 14-14 22-16 8-2 16-2 24 0" fill="#dc3545" filter="url(#splashBlur)"/>
    <path d="M324 120c6 12 10 24 10 36 0 12-4 22-10 30-6 8-14 14-22 16-8 2-16 2-24 0-8-2-14-8-16-16-2-8 2-16 8-22 6-8 14-14 22-16 8-2 16-2 24 0 8 2 14 8 16 16 0 12 4 22 10 30 6 8 14 14 22 16 8 2 16 2 24 0" fill="#007bff" filter="url(#splashBlur)"/>
    <!-- Studio backdrop hints (upside-down) -->
    <rect x="60" y="80" width="392" height="40" rx="8" fill="#ced4da" opacity="0.3"/>
    <rect x="80" y="90" width="352" height="20" rx="4" fill="#adb5bd" opacity="0.4"/>
  </g>
</svg>
