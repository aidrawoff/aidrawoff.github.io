<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: deep atmospheric base -->
  <rect width="512" height="512" fill="#0a1e3c"/>

  <!-- Comic panel border (soft inner glow) -->
  <rect x="48" y="48" width="416" height="416" rx="16" fill="none" stroke="#4a6baf" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Worm firefighter: bold geometric silhouette, centered -->
  <g transform="translate(256,256)">
    <!-- Head (expressive eye-spot placement) -->
    <circle cx="0" cy="-80" r="24" fill="#f9c784"/>
    <circle cx="-8" cy="-84" r="4" fill="#2a2a2a"/>
    <circle cx="8" cy="-84" r="4" fill="#2a2a2a"/>
    <!-- Helmet (slight tilt for dynamism) -->
    <path d="M-20,-80 L-32,-64 L-24,-56 L-16,-72 Z" fill="#e57373"/>
    <path d="M20,-80 L32,-64 L24,-56 L16,-72 Z" fill="#e57373"/>
    <rect x="-12" y="-88" width="24" height="16" rx="4" fill="#e57373"/>

    <!-- Body (primary geometric primitive) -->
    <rect x="-40" y="-40" width="80" height="80" rx="40" fill="#f9c784"/>

    <!-- Fire hose (dynamic line) -->
    <path d="M-40,0 Q-80,-40 -120,-80" stroke="#ff6b6b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M-120,-80 L-140,-100" stroke="#ff6b6b" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Glowing accent (vibrant contrast) -->
    <circle cx="-120" cy="-80" r="16" fill="#ffeb3b" filter="url(#glow)"/>

    <!-- Rescue scene: flames and ladder -->
    <!-- Small flames near hose tip -->
    <circle cx="-140" cy="-100" r="8" fill="#ff5722" filter="url(#glow)"/>
    <circle cx="-150" cy="-90" r="6" fill="#ff9800" filter="url(#glow)"/>
    <circle cx="-130" cy="-95" r="5" fill="#ffeb3b" filter="url(#glow)"/>

    <!-- Ladder leaning against a tiny building -->
    <rect x="-180" y="-20" width="20" height="60" rx="4" fill="#8d6e63"/>
    <rect x="-190" y="40" width="40" height="20" rx="4" fill="#8d6e63"/>
    <!-- Rungs -->
    <line x1="-170" y1="-10" x2="-170" y2="30" stroke="#6d4c41" stroke-width="3"/>
    <line x1="-180" y1="0" x2="-180" y2="40" stroke="#6d4c41" stroke-width="3"/>
    <line x1="-160" y1="10" x2="-160" y2="50" stroke="#6d4c41" stroke-width="3"/>
    <line x1="-190" y1="20" x2="-190" y2="60" stroke="#6d4c41" stroke-width="3"/>

    <!-- Motion lines behind worm for dynamism -->
    <path d="M-60,-60 Q-90,-80 -120,-100" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M-30,-40 Q-60,-60 -90,-80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M0,-20 Q-30,-40 -60,-60" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Extra "whoosh" arcs around hose -->
    <path d="M-80,-40 Q-100,-60 -120,-80" stroke="#ffeb3b" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M-60,-20 Q-90,-50 -120,-80" stroke="#ffeb3b" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Soft ambient backlighting -->
  <rect x="0" y="0" width="512" height="512" fill="url(#backlight)"/>

  <!-- Comic panel caption (minimal text) -->
  <text x="256" y="460" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">A WORM’S BRAVE CALL</text>

  <!-- Filters -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="backlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0a1e3c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a1e3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
