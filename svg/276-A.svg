<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#87CEEB"/>
    <stop offset="100%" stop-color="#E0F6FF"/>
  </linearGradient>
  <pattern id="flannel" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="20" height="20" fill="#B22222"/>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#8B0000" stroke-width="2"/>
    <line x1="10" y1="0" x2="10" y2="20" stroke="#8B0000" stroke-width="2"/>
    <line x1="0" y1="0" x2="20" y2="20" stroke="#CD5C5C" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="0" y2="20" stroke="#CD5C5C" stroke-width="1.5"/>
  </pattern>
</defs>

<!-- Sky -->
<rect width="512" height="512" fill="url(#sky)"/>

<!-- Ground -->
<ellipse cx="256" cy="460" rx="220" ry="40" fill="#4A7C2A"/>
<ellipse cx="256" cy="455" rx="180" ry="25" fill="#5A8C3A"/>

<!-- Sheep body (flannel jacket) -->
<ellipse cx="256" cy="300" rx="130" ry="110" fill="url(#flannel)"/>
<ellipse cx="256" cy="300" rx="130" ry="110" fill="none" stroke="#5A1A1A" stroke-width="3"/>

<!-- Sleeves -->
<ellipse cx="140" cy="280" rx="35" ry="55" fill="url(#flannel)" transform="rotate(-20 140 280)"/>
<ellipse cx="372" cy="280" rx="35" ry="55" fill="url(#flannel)" transform="rotate(20 372 280)"/>

<!-- Collar -->
<path d="M 190 220 Q 256 250 322 220" fill="none" stroke="#5A1A1A" stroke-width="6"/>

<!-- Sheep head -->
<ellipse cx="256" cy="170" rx="60" ry="55" fill="#F5F5DC"/>
<ellipse cx="256" cy="170" rx="60" ry="55" fill="none" stroke="#D2B48C" stroke-width="2"/>

<!-- Ears -->
<ellipse cx="190" cy="165" rx="22" ry="12" fill="#F5F5DC" transform="rotate(-15 190 165)"/>
<ellipse cx="322" cy="165" rx="22" ry="12" fill="#F5F5DC" transform="rotate(15 322 165)"/>

<!-- Face details -->
<ellipse cx="240" cy="160" rx="6" ry="8" fill="#333"/>
<ellipse cx="272" cy="160" rx="6" ry="8" fill="#333"/>
<ellipse cx="242" cy="158" rx="2" ry="3" fill="white"/>
<ellipse cx="274" cy="158" rx="2" ry="3" fill="white"/>
<ellipse cx="256" cy="185" rx="10" ry="7" fill="#FFB6C1"/>

<!-- Buttons -->
<circle cx="256" cy="260" r="6" fill="#DAA520"/>
<circle cx="256" cy="300" r="6" fill="#DAA520"/>
<circle cx="256" cy="340" r="6" fill="#DAA520"/>

<!-- Legs -->
<rect x="200" y="380" width="22" height="60" rx="8" fill="#333"/>
<rect x="290" y="380" width="22" height="60" rx="8" fill="#333"/>

<!-- Hooves -->
<rect x="198" y="430" width="26" height="14" rx="4" fill="#222"/>
<rect x="288" y="430" width="26" height="14" rx="4" fill="#222"/>

<!-- Shadow -->
<ellipse cx="256" cy="445" rx="100" ry="15" fill="#000" opacity="0.2"/>

<!-- Wool tufts peeking out -->
<circle cx="200" cy="250" r="12" fill="#F5F5DC"/>
<circle cx="312" cy="245" r="14" fill="#F5F5DC"/>
<circle cx="180" cy="310" r="10" fill="#F5F5DC"/>
<circle cx="330" cy="320" r="11" fill="#F5F5DC"/>
<circle cx="256" cy="210" r="8" fill="#F5F5DC"/>
</svg>