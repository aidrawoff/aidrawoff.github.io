<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <radialGradient id="glow" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#fff8e7"/>
    <stop offset="100%" stop-color="#2a1a0a"/>
  </radialGradient>
  <linearGradient id="mug" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e74c3c"/>
    <stop offset="100%" stop-color="#c0392b"/>
  </linearGradient>
</defs>

<!-- background -->
<rect width="512" height="512" fill="url(#glow)"/>

<!-- warm lamp light on wall -->
<circle cx="380" cy="120" r="60" fill="#fff3e0" opacity="0.08"/>
<circle cx="380" cy="120" r="40" fill="#fff3e0" opacity="0.12"/>

<!-- window with snow -->
<rect x="40" y="40" width="200" height="200" rx="8" fill="#1a2a3a" stroke="#5a4a3a" stroke-width="6"/>
<rect x="138" y="40" width="4" height="200" fill="#5a4a3a"/>
<rect x="40" y="138" width="200" height="4" fill="#5a4a3a"/>
<circle cx="80" cy="80" r="2" fill="#fff" opacity="0.8"/>
<circle cx="120" cy="110" r="2" fill="#fff" opacity="0.6"/>
<circle cx="180" cy="70" r="2" fill="#fff" opacity="0.7"/>
<circle cx="200" cy="160" r="2" fill="#fff" opacity="0.5"/>
<circle cx="90" cy="180" r="2" fill="#fff" opacity="0.9"/>

<!-- floor -->
<rect x="0" y="380" width="512" height="132" fill="#3e2723"/>
<rect x="0" y="380" width="512" height="8" fill="#5d4037"/>

<!-- rug -->
<ellipse cx="256" cy="430" rx="160" ry="40" fill="#8d6e63"/>
<ellipse cx="256" cy="430" rx="140" ry="32" fill="#795548" stroke="#5d4037" stroke-width="2"/>

<!-- bear shadow on rug -->
<ellipse cx="256" cy="445" rx="100" ry="18" fill="#2a1a0a" opacity="0.4"/>

<!-- bear body -->
<ellipse cx="256" cy="340" rx="90" ry="110" fill="#5d4037"/>
<ellipse cx="256" cy="340" rx="80" ry="100" fill="#6d4c41"/>

<!-- bear head -->
<circle cx="256" cy="210" r="70" fill="#5d4037"/>
<circle cx="256" cy="210" r="62" fill="#6d4c41"/>

<!-- ears -->
<circle cx="196" cy="160" r="22" fill="#5d4037"/>
<circle cx="316" cy="160" r="22" fill="#5d4037"/>
<circle cx="196" cy="160" r="14" fill="#8d6e63"/>
<circle cx="316" cy="160" r="14" fill="#8d6e63"/>

<!-- muzzle -->
<ellipse cx="256" cy="230" rx="28" ry="22" fill="#a1887f"/>
<ellipse cx="256" cy="222" rx="12" ry="8" fill="#3e2723"/>
<path d="M256 230 Q248 242 256 248 Q264 242 256 230" fill="#3e2723"/>

<!-- eyes -->
<ellipse cx="236" cy="200" rx="6" ry="8" fill="#1a1a1a"/>
<ellipse cx="276" cy="200" rx="6" ry="8" fill="#1a1a1a"/>
<circle cx="234" cy="198" r="2" fill="#fff"/>
<circle cx="274" cy="198" r="2" fill="#fff"/>

<!-- blush -->
<ellipse cx="220" cy="218" rx="10" ry="6" fill="#e57373" opacity="0.5"/>
<ellipse cx="292" cy="218" rx="10" ry="6" fill="#e57373" opacity="0.5"/>

<!-- arms -->
<ellipse cx="180" cy="300" rx="28" ry="50" fill="#5d4037" transform="rotate(20 180 300)"/>
<ellipse cx="332" cy="300" rx="28" ry="50" fill="#5d4037" transform="rotate(-20 332 300)"/>
<ellipse cx="180" cy="300" rx="22" ry="42" fill="#6d4c41" transform="rotate(20 180 300)"/>
<ellipse cx="332" cy="300" rx="22" ry="42" fill="#6d4c41" transform="rotate(-20 332 300)"/>

<!-- paws holding mug -->
<circle cx="236" cy="310" r="16" fill="#a1887f"/>
<circle cx="276" cy="310" r="16" fill="#a1887f"/>

<!-- mug -->
<rect x="232" y="280" width="48" height="40" rx="6" fill="url(#mug)"/>
<rect x="232" y="280" width="48" height="8" rx="3" fill="#e74c3c"/>
<path d="M280 290 Q295 290 295 300 Q295 310 280 310" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>

<!-- steam -->
<path d="M248 275 Q252 265 248 255 Q244 245 248 235" fill="none" stroke="#fff" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
<path d="M264 275 Q268 265 264 255 Q260 245 264 235" fill="none" stroke="#fff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

<!-- legs -->
<ellipse cx="210" cy="420" rx="30" ry="40" fill="#5d4037"/>
<ellipse cx="302" cy="420" rx="30" ry="40" fill="#5d4037"/>
<ellipse cx="210" cy="420" rx="22" ry="32" fill="#6d4c41"/>
<ellipse cx="302" cy="420" rx="22" ry="32" fill="#6d4c41"/>

<!-- paw pads -->
<ellipse cx="210" cy="435" rx="10" ry="14" fill="#a1887f"/>
<ellipse cx="302" cy="435" rx="10" ry="14" fill="#a1887f"/>
<circle cx="210" cy="422" r="3" fill="#a1887f"/>
<circle cx="302" cy="422" r="3" fill="#a1887f"/>

<!-- scarf -->
<path d="M200 260 Q256 290 312 260" fill="none" stroke="#e74c3c" stroke-width="14" stroke-linecap="round"/>
<path d="M280 270 L290 330 L310 325 L300 268" fill="#c0392b"/>
<path d="M280 270 L290 330 L310 325 L300 268" fill="none" stroke="#e74c3c" stroke-width="3"/>

<!-- marshmallow in cocoa -->
<rect x="244" y="282" width="8" height="6" rx="2" fill="#fff" opacity="0.9"/>
<rect x="258" y="284" width="6" height="5" rx="2" fill="#fff" opacity="0.8"/>

</svg>