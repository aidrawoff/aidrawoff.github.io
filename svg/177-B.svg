<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <radialGradient id="sky" cx="50%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#87CEEB"/>
    <stop offset="100%" stop-color="#E6C288"/>
  </radialGradient>
</defs>
<!-- Sky -->
<rect width="512" height="512" fill="url(#sky)"/>
<!-- Sun -->
<circle cx="420" cy="80" r="45" fill="#FFD700" opacity="0.9"/>
<!-- Distant hills -->
<path d="M0 320 Q120 280 256 310 Q380 340 512 300 L512 512 L0 512 Z" fill="#8B7355"/>
<!-- Field -->
<path d="M0 360 Q150 340 256 370 Q380 390 512 350 L512 512 L0 512 Z" fill="#DAA520"/>
