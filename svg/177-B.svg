<circle cx="256" cy="170" r="35" fill="#F4A460"/>
<!-- Hat -->
<ellipse cx="256" cy="145" rx="55" ry="12" fill="#654321"/>
<path d="M231 145 L241 95 L271 95 L281 145 Z" fill="#5D3A1A"/>
