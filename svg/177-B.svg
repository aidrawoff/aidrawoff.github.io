<line x1="302" y1="215" x2="320" y2="210" stroke="#DAA520" stroke-width="3"/>
<line x1="248" y1="200" x2="245" y2="185" stroke="#DAA520" stroke-width="3"/>
<!-- Shadow under scarecrow -->
<ellipse cx="256" cy="420" rx="50" ry="10" fill="#8B6914" opacity="0.5"/>
<!-- Motion lines for wave -->
<path d="M120 120 Q100 110 90 130" stroke="#FFF" stroke-width="2" fill="none" opacity="0.7"/>
<path d="M125 135 Q105 125 95 145" stroke="#FFF" stroke-width="2" fill="none" opacity="0.7"/>
<path d="M115 150 Q95 140 85 160" stroke="#FFF" stroke-width="2" fill="none" opacity="0.5"/>
<!-- Crows -->
<path d="M80 100 Q90 85 100 100 Q110 85 120 100" stroke="#111" stroke-width="3" fill="none"/>
<path d="M150 70 Q158 58 166 70 Q174 58 182 70" stroke="#111" stroke-width="2.5" fill="none"/>
<path d="M380 120 Q390 105 400 120 Q410 105 420 120" stroke="#111" stroke-width="3" fill="none"/>
<path d="M320 90 Q328 78 336 90 Q344 78 352 90" stroke="#111" stroke-width="2.5" fill="none"/>
<path d="M200 60 Q208 48 216 60 Q224 48 232 60" stroke="#111" stroke-width="2" fill="none"/>
<path d="M280 50 Q288 38 296 50 Q304 38 312 50" stroke="#111" stroke-width="2" fill="none"/>
<path d="M420 160 Q428 148 436 160 Q444 148 452 160" stroke="#111" stroke-width="2" fill="none"/>
<!-- Crow looking at scarecrow -->
<path d="M170 110 Q178 98 186 110 Q194 98 202 110" stroke="#111" stroke-width="2.5" fill="none"/>
<circle cx="186" cy="112" r="1.5" fill="#111"/>
