<path d="M40 400 L35 380 L45 400 L50 375 L55 400" stroke="#556B2F" stroke-width="2" fill="none"/>
<path d="M460 420 L455 400 L465 420 L470 395 L475 420" stroke="#556B2F" stroke-width="2" fill="none"/>
<path d="M120 450 L115 430 L125 450 L130 425 L135 450" stroke="#556B2F" stroke-width="2" fill="none"/>
