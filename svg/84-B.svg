  <circle cx="326" cy="225" r="3.5" fill="#ffffff"/>

  <!-- Mouth -->
  <path d="M 216 332 Q 256 372 296 332" stroke="#2e7d32" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- Witch Hat -->
  <!-- Brim -->
