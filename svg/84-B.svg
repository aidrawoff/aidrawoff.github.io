  <circle cx="85" cy="280" r="16" fill="url(#glow)"/>
  <path d="M 85 240 L 92 268 L 120 275 L 92 282 L 85 310 L 78 282 L 50 275 L 78 268 Z" fill="#ffeb3b"/>
