<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3d9"/>
      <stop offset="1" stop-color="#b9e4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#fff6c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="210" r="190" fill="url(#glow)"/>
  <!-- distant hills -->
  <path d="M0 400 Q120 360 250 392 T512 380 L512 512 L0 512 Z" fill="#8fd3a8"/>
  <!-- hair back -->
  <path d="M150 200 Q140 90 256 80 Q372 90 362 200 L372 360 Q256 390 140 360 Z" fill="#5a3bb0"/>
  <!-- body -->
  <path d="M200 300 Q256 285 312 300 L330 470 L182 470 Z" fill="#ff5c8a"/>
  <!-- collar and body highlight -->
  <path d="M206 300 Q256 322 306 300 L306 312 Q256 334 206 312 Z" fill="#fff"/>
  <path d="M222 340 L226 440" stroke="#ff9cbc" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- eyelashes -->
  <path d="M202 214 Q206 206 214 208" fill="none" stroke="#2b1a4a" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 214 Q306 206 312 210" fill="none" stroke="#2b1a4a" stroke-width="3" stroke-linecap="round"/>
  <!-- sparkle accents near the ribbon -->
  <path d="M372 140 l5 0 l-2.5 -8 l-2.5 8 z" fill="#fff"/>
  <!-- lip highlight and cheek light -->
  <ellipse cx="256" cy="262" rx="5" ry="2" fill="#ffffff" opacity="0.6"/>
  <!-- hair shine -->
  <path d="M190 150 Q200 118 236 116" fill="none" stroke="#a88cff" stroke-width="6" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="236" y="270" width="40" height="30" fill="#ffe0cc"/>
  <!-- face -->
  <ellipse cx="256" cy="220" rx="78" ry="86" fill="#ffe6d6"/>
  <!-- hair fringe -->
  <path d="M176 200 Q180 120 256 124 Q336 120 338 200 Q300 160 256 158 Q210 160 176 200 Z" fill="#7b55d6"/>
  <!-- eyes (big anime eyes, bright and happy) -->
  <ellipse cx="220" cy="226" rx="16" ry="20" fill="#2b1a4a"/>
  <ellipse cx="292" cy="226" rx="16" ry="20" fill="#2b1a4a"/>
  <ellipse cx="220" cy="236" rx="9" ry="10" fill="#6a4fd8"/>
  <ellipse cx="292" cy="236" rx="9" ry="10" fill="#6a4fd8"/>
  <circle cx="226" cy="218" r="6" fill="#ffffff"/>
  <circle cx="298" cy="218" r="6" fill="#ffffff"/>
  <circle cx="216" cy="240" r="2.5" fill="#ffffff"/>
  <circle cx="288" cy="240" r="2.5" fill="#ffffff"/>
  <!-- hair ribbon -->
  <path d="M340 150 Q362 136 352 160 Q364 176 340 166 Z" fill="#ffd23f"/>
  <circle cx="344" cy="158" r="5" fill="#ff9f1c"/>
  <!-- blush -->
  <ellipse cx="200" cy="248" rx="12" ry="7" fill="#ff7aa8" opacity="0.7"/>
  <ellipse cx="312" cy="248" rx="12" ry="7" fill="#ff7aa8" opacity="0.7"/>
  <!-- smile -->
  <path d="M236 256 Q256 272 276 256" fill="none" stroke="#c2185b" stroke-width="5" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M90 130 l8 0 l-4 -14 l-4 14 z" fill="#fff"/>
  <path d="M410 120 l6 0 l-3 -10 l-3 10 z" fill="#fff"/>
  <path d="M400 420 l7 0 l-3 -12 l-4 12 z" fill="#fff"/>
  <!-- ground shadow -->
  <ellipse cx="256" cy="472" rx="130" ry="14" fill="#23402f" opacity="0.4"/>
  <!-- foreground grass -->
  <path d="M0 490 Q150 470 300 486 T512 480 L512 512 L0 512 Z" fill="#5fb88a"/>
</svg>
