      <stop offset="0" stop-color="#5fc4f2"/>
      <stop offset="1" stop-color="#d9f4ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8fc4"/>
