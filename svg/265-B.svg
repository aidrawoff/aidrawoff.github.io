<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1440"/>
      <stop offset="0.5" stop-color="#4a2b63"/>
      <stop offset="1" stop-color="#c96a3d"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a8c"/>
      <stop offset="1" stop-color="#08203a"/>
    </linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="150" r="180" fill="url(#flash)"/>

  <!-- storm clouds -->
  <g fill="#2a1d4a" opacity="0.85">
    <ellipse cx="80" cy="60" rx="90" ry="34"/>
    <ellipse cx="200" cy="40" rx="80" ry="26"/>
    <ellipse cx="420" cy="55" rx="95" ry="32"/>
    <ellipse cx="320" cy="80" rx="60" ry="22"/>
  </g>

  <!-- sea -->
  <path d="M0 300 Q128 280 256 300 T512 300 L512 512 L0 512 Z" fill="url(#sea)"/>

  <!-- rising wave under Poseidon -->
  <path d="M300 512 Q310 380 360 300 Q400 240 452 250 Q500 262 512 320 L512 512 Z" fill="#12506b"/>
  <path d="M330 512 Q345 400 385 320 Q415 265 455 268 Q492 278 505 330 L505 512 Z" fill="#1b7fa0"/>
  <path d="M360 300 Q400 238 452 250 Q470 254 478 268 Q430 262 400 300 Q378 330 368 360 Z" fill="#8fe3f2"/>
  <path d="M452 250 Q480 258 494 282 Q470 268 448 266 Z" fill="#e8fbff"/>

  <!-- spray crests -->
  <g fill="#cdf6ff">
    <circle cx="470" cy="238" r="7"/><circle cx="492" cy="252" r="5"/>
    <circle cx="448" cy="222" r="5"/><circle cx="500" cy="278" r="6"/>
    <circle cx="420" cy="235" r="4"/>
  </g>

  <!-- dark cliff left -->
  <path d="M0 512 L0 330 Q40 300 80 320 Q120 336 150 380 Q180 424 200 512 Z" fill="#241a33"/>
  <path d="M0 512 L0 360 Q45 340 85 362 Q125 384 150 430 Q168 470 178 512 Z" fill="#3a2a4d"/>

  <!-- POSEIDON (right, in the wave) -->
  <g>
    <!-- trident shaft -->
    <path d="M300 470 L430 120" stroke="#6b4a2a" stroke-width="11" stroke-linecap="round"/>
    <!-- trident head -->
    <g stroke="#d9e6ef" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M430 120 L446 62"/>
      <path d="M412 128 Q400 92 408 66"/>
      <path d="M448 112 Q466 88 470 66"/>
    </g>
    <path d="M404 132 L456 108" stroke="#d9e6ef" stroke-width="9" stroke-linecap="round"/>
    <!-- torso -->
    <path d="M330 400 Q318 330 350 292 Q372 268 398 280 Q420 292 418 330 Q414 372 396 402 Q362 416 330 400 Z" fill="#2f6f86"/>
    <path d="M352 300 Q372 288 392 300 Q398 330 386 356 Q366 362 354 344 Z" fill="#4b93aa"/>
    <!-- left arm raised -->
    <path d="M398 300 Q432 286 448 258" stroke="#2f6f86" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- beard + head -->
    <path d="M356 258 Q344 300 366 318 Q390 322 398 292 Q400 268 388 252 Z" fill="#cfd9df"/>
    <circle cx="374" cy="246" r="26" fill="#4b93aa"/>
    <path d="M350 240 Q346 208 374 202 Q404 206 400 240 Q388 226 374 226 Q358 226 350 240 Z" fill="#cfd9df"/>
    <!-- seaweed crown -->
    <g stroke="#2f7a4a" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M352 214 Q344 196 352 184"/>
      <path d="M374 206 Q374 188 382 178"/>
      <path d="M396 214 Q404 196 398 184"/>
    </g>
    <circle cx="366" cy="246" r="3.5" fill="#0b1a24"/>
    <circle cx="386" cy="246" r="3.5" fill="#0b1a24"/>
  </g>

  <!-- ZEUS (left, on the cliff) -->
  <g>
    <!-- robe -->
    <path d="M40 470 Q34 380 62 336 Q84 306 116 316 Q146 328 150 380 Q152 430 146 472 Q92 486 40 470 Z" fill="#f2e8d5"/>
    <path d="M62 340 Q86 322 112 332 Q128 344 130 380 Q100 366 74 372 Z" fill="#d8c9ac"/>
    <!-- sash -->
    <path d="M52 400 Q96 386 146 402 L144 424 Q96 410 54 424 Z" fill="#a8322d"/>
    <!-- arm throwing bolt -->
    <path d="M120 336 Q160 312 190 296" stroke="#e8cfae" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="104" cy="272" r="27" fill="#e8cfae"/>
    <path d="M80 276 Q76 316 104 328 Q130 320 132 282 Q118 296 104 296 Q88 294 80 276 Z" fill="#efe7dc"/>
    <path d="M78 266 Q74 232 104 226 Q134 232 130 266 Q116 250 104 250 Q88 250 78 266 Z" fill="#efe7dc"/>
    <!-- laurel -->
    <g fill="#c9a227">
      <ellipse cx="84" cy="250" rx="8" ry="4" transform="rotate(-30 84 250)"/>
      <ellipse cx="104" cy="243" rx="8" ry="4"/>
      <ellipse cx="124" cy="250" rx="8" ry="4" transform="rotate(30 124 250)"/>
    </g>
    <circle cx="96" cy="272" r="3.5" fill="#3a2a1a"/>
    <circle cx="116" cy="272" r="3.5" fill="#3a2a1a"/>
    <path d="M92 262 Q98 258 104 262" stroke="#cbbcae" stroke-width="3" fill="none"/>
  </g>

  <!-- LIGHTNING BOLT striking across -->
  <path d="M196 292 L262 258 L244 286 L316 254 L292 288 L360 262 L300 320 L318 316 L258 348 L274 336 L206 350 Z" fill="#fff29a" stroke="#ffd21f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M196 292 L262 258 L244 286 L316 254" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- impact sparks at trident -->
  <g stroke="#fff6c0" stroke-width="4" stroke-linecap="round">
    <path d="M330 250 L346 236"/><path d="M340 268 L362 262"/><path d="M318 236 L322 216"/>
  </g>

  <!-- foreground water foam -->
  <path d="M0 470 Q80 450 170 476 Q260 500 340 478 Q430 452 512 480 L512 512 L0 512 Z" fill="#0a2f47"/>
  <path d="M0 482 Q90 464 180 488 Q270 510 360 490 Q440 470 512 492 L512 512 L0 512 Z" fill="#062033"/>
  <g fill="#8fe3f2" opacity="0.8">
    <ellipse cx="120" cy="478" rx="34" ry="6"/>
    <ellipse cx="250" cy="492" rx="42" ry="6"/>
    <ellipse cx="420" cy="480" rx="30" ry="5"/>
  </g>
</svg>
