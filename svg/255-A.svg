<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed8f5"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0433a"/>
      <stop offset="1" stop-color="#b52a25"/>
    </linearGradient>
  </defs>
  <!-- sky and ground -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <path d="M0 400 Q256 370 512 400 L512 512 L0 512 Z" fill="#8cc765"/>
  <ellipse cx="256" cy="470" rx="150" ry="14" fill="#5c9a43" opacity="0.5"/>
  <!-- tail feathers -->
  <path d="M170 280 Q90 180 130 110 Q160 170 190 240 Z" fill="#6b3f22"/>
  <path d="M175 285 Q100 230 95 160 Q140 210 200 265 Z" fill="#2f7a4a"/>
  <!-- legs -->
  <path d="M236 370 L228 445" stroke="#e8a33d" stroke-width="10" stroke-linecap="round"/>
  <path d="M290 370 L298 445" stroke="#e8a33d" stroke-width="10" stroke-linecap="round"/>
  <path d="M215 448 L240 452 M285 448 L312 452" stroke="#e8a33d" stroke-width="7" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="256" cy="310" rx="105" ry="75" fill="#c4572a"/>
  <path d="M190 300 Q250 270 320 300 Q290 350 230 355 Z" fill="#dd7a3f" opacity="0.8"/>
  <!-- wing -->
  <path d="M200 300 Q250 250 300 300 Q255 330 200 300 Z" fill="#8a3b1c"/>
  <!-- neck and head -->
  <path d="M290 260 Q300 220 320 200 L350 230 Q330 260 320 280 Z" fill="#c4572a"/>
  <circle cx="335" cy="185" r="48" fill="#d9633a"/>
  <!-- comb and wattle -->
  <path d="M312 150 Q325 120 335 145 Q345 118 356 146 Q368 130 372 158 Q345 150 330 160 Z" fill="#e02a2a"/>
  <path d="M352 220 Q362 240 348 245 Q340 230 352 220 Z" fill="#e02a2a"/>
  <!-- beak and eye -->
  <path d="M378 180 L404 192 L378 202 Z" fill="#f2b33d"/>
  <circle cx="346" cy="178" r="7" fill="#1d1d1d"/>
  <circle cx="348" cy="176" r="2.2" fill="#ffffff"/>
  <path d="M332 166 Q344 160 356 166" stroke="#3a1a0c" stroke-width="3" fill="none"/>
  <!-- scarf wrapped around neck -->
  <path d="M278 255 Q310 240 345 252 Q352 268 336 276 Q300 268 272 280 Z" fill="url(#scarf)"/>
  <path d="M296 262 Q330 252 360 262" stroke="#ffd166" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
  <!-- loose tail of scarf dangling -->
  <path d="M300 272 Q282 300 300 330 Q312 310 306 290 Z" fill="url(#scarf)"/>
  <path d="M326 266 Q352 290 336 320 L350 322 Q368 290 348 260 Z" fill="url(#scarf)"/>
  <!-- tangle loop over head -->
  <path d="M300 170 Q335 120 375 165 Q352 140 330 150 Q312 158 300 170 Z" fill="url(#scarf)"/>
  <path d="M300 170 Q340 128 382 178" stroke="#b52a25" stroke-width="7" fill="none"/>
  <!-- tangle wraps: crossing bands around neck and head -->
  <path d="M282 232 Q312 218 340 230" stroke="url(#scarf)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M268 262 Q300 286 336 268" stroke="url(#scarf)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M305 215 Q320 200 352 212" stroke="#e0433a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- feather detail on tail and wing -->
  <path d="M190 300 Q230 270 268 292" stroke="#5a2a12" stroke-width="3" fill="none"/>
  <path d="M160 200 L150 140 M175 220 L172 160" stroke="#4a2a14" stroke-width="3"/>
  <!-- rim light on body and cast shadow -->
  <path d="M290 245 Q360 290 350 330" stroke="#ffe3a8" stroke-width="4" fill="none" opacity="0.8"/>
  <ellipse cx="256" cy="452" rx="62" ry="9" fill="#3d7a2e" opacity="0.45"/>
  <path d="M120 300 Q140 290 150 300 M130 320 Q150 312 160 322" stroke="#9c4a22" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M262 236 Q290 214 318 240" stroke="#ffd166" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
  <path d="M340 290 Q356 300 372 288" stroke="url(#scarf)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="420" cy="455" rx="30" ry="6" fill="#3d7a2e" opacity="0.3"/>
  <path d="M340 214 L346 200 M352 212 L358 198" stroke="#e0433a" stroke-width="2" fill="none"/>
  <circle cx="334" cy="180" r="2.5" fill="#ffffff"/>
  <!-- sparkle of mischief -->
  <circle cx="420" cy="120" r="5" fill="#fff6c2"/>
  <circle cx="450" cy="150" r="3" fill="#fff6c2"/>
</svg>
