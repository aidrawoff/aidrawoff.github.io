<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark gradient -->
  <rect width="512" height="512" fill="#0a0a1a"/>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
    <stop offset="0%" stop-color="#0a0a1a"/>
    <stop offset="100%" stop-color="#1a1a2a"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Soft cozy glow behind owl -->
  <radialGradient id="glow" cx="256" cy="288" r="96" fx="256" fy="288">
    <stop offset="0%" stop-color="#d4a017" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="288" r="96" fill="url(#glow)"/>

  <!-- Owl body: main silhouette with feather texture -->
  <path id="owlBody" d="M256 320c-32 0-56-24-56-56 0-20 12-36 28-48 16-12 36-20 56-20s40 8 56 20c16 12 28 28 28 48 0 32-24 56-56 56zm0-64c-16 0-28-12-28-28s12-28 28-28 28 12 28 28-12 28-28 28z
        M224 288c-8 0-14 6-14 14s6 14 14 14 14-6 14-14-6-14-14-14zm64 0c-8 0-14 6-14 14s6 14 14 14 14-6 14-14-6-14-14-14zm-48-32c-8 0-14 6-14 14s6 14 14 14 14-6 14-14-6-14-14-14zm32-32c-8 0-14 6-14 14s6 14 14 14 14-6 14-14-6-14-14-14z"
        fill="#4a3222" stroke="#2a1a12" stroke-width="2"/>

  <!-- Witch hat: tall, slightly tilted -->
  <path id="witchHat" d="M256 160l-40-60h80l-40 60z" fill="#2a1a12" stroke="#1a0f08" stroke-width="1"/>
  <path id="hatBrim" d="M216 160h80v8l-80-8z" fill="#2a1a12" stroke="#1a0f08" stroke-width="1"/>
  <!-- Hat tip highlight -->
  <circle cx="256" cy="128" r="3" fill="#fff" opacity="0.5"/>

  <!-- Owl eyes: sleepy, half-closed with lids -->
  <circle cx="240" cy="280" r="12" fill="#f8f8f8"/>
  <circle cx="272" cy="280" r="12" fill="#f8f8f8"/>
  <circle cx="240" cy="280" r="6" fill="#1a1a2a"/>
  <circle cx="272" cy="280" r="6" fill="#1a1a2a"/>
  <!-- Upper eyelids -->
  <path d="M228 272c6 0 12 4 12 12s-6 12-12 12-12-4-12-12 6-12 12-12z" fill="#4a3222" opacity="0.4"/>
  <path d="M260 272c6 0 12 4 12 12s-6 12-12 12-12-4-12-12 6-12 12-12z" fill="#4a3222" opacity="0.4"/>

  <!-- Owl beak: small triangle -->
  <path d="M256 304l8-4h-8z" fill="#d4a017"/>

  <!-- Scarf in talons: cozy knit, looped with stitches -->
  <path d="M200 360c0-16 12-28 28-28s28 12 28 28v16c0 16-12 28-28 28s-28-12-28-28v-16z" fill="#d4a017" stroke="#b8860b" stroke-width="1"/>
  <path d="M200 360c0-8 6-14 14-14s14 6 14 14v8c0 8-6 14-14 14s-14-6-14-14v-8z" fill="#b8860b"/>
  <!-- Stitches: small crosses -->
  <path d="M208 352l4 4m-4-4l4-4m-4 4l-4-4m4 4l4 4" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M224 352l4 4m-4-4l4-4m-4 4l-4-4m4 4l4 4" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M240 352l4 4m-4-4l4-4m-4 4l-4-4m4 4l4 4" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Talons holding scarf loop -->
  <path d="M200 360l-8 8h8zM264 360l8 8h-8z" stroke="#2a1a12" stroke-width="3" fill="none"/>

  <!-- Soft highlight on scarf tip -->
  <circle cx="256" cy="368" r="4" fill="#fff" opacity="0.6"/>
  <!-- Tiny sparkle on scarf tip -->
  <path d="M256 368l2-4 2 4-2 4-2-4z" fill="#fff" opacity="0.8"/>

  <!-- Owl body shadow for depth -->
  <ellipse cx="256" cy="384" rx="64" ry="16" fill="#00000060"/>
  <!-- Feather tufts on head -->
  <path d="M240 200l-6-10h12l-6 10z" fill="#2a1a12" opacity="0.6"/>
  <path d="M272 200l-6-10h12l-6 10z" fill="#2a1a12" opacity="0.6"/>

  <!-- Soft ground shadow -->
  <ellipse cx="256" cy="480" rx="80" ry="16" fill="#00000040"/>

  <!-- Rim light on hat brim -->
  <path d="M216 160h80v2l-80-2z" fill="#4a3222" opacity="0.3"/>
</svg>
