<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#2e4a63"/>
  <circle cx="400" cy="110" r="46" fill="#f4eccb"/>
  <circle cx="416" cy="98" r="40" fill="#2e4a63" opacity="0.9"/>
  <circle cx="60" cy="70" r="2" fill="#fff"/>
  <circle cx="110" cy="40" r="1.5" fill="#fff"/>
  <circle cx="470" cy="210" r="1.5" fill="#fff"/>
  <rect x="0" y="430" width="512" height="82" fill="#8b6b4a"/>
  <ellipse cx="256" cy="442" rx="170" ry="14" fill="#000" opacity="0.25"/>
  <!-- tail -->
  <path d="M340 410 Q430 420 420 330 Q415 285 448 262" fill="none" stroke="#111" stroke-width="22" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="256" cy="330" rx="118" ry="105" fill="#111"/>
  <!-- paws -->
  <ellipse cx="208" cy="426" rx="30" ry="14" fill="#111"/>
  <ellipse cx="304" cy="426" rx="30" ry="14" fill="#111"/>
  <!-- ears -->
  <polygon points="180,140 196,58 240,120" fill="#111"/>
  <polygon points="272,120 316,58 332,140" fill="#111"/>
  <!-- head -->
  <circle cx="256" cy="190" r="86" fill="#111"/>
  <!-- muzzle -->
  <ellipse cx="256" cy="232" rx="40" ry="26" fill="#2b2b2b"/>
  <!-- eyes -->
  <ellipse cx="220" cy="196" rx="18" ry="11" fill="#ffd23f"/>
  <ellipse cx="292" cy="196" rx="18" ry="11" fill="#ffd23f"/>
  <rect x="218" y="186" width="4" height="20" fill="#111"/>
  <rect x="290" y="186" width="4" height="20" fill="#111"/>
  <!-- fur rim light -->
  <path d="M190 130 Q220 98 262 106" fill="none" stroke="#4a4a4a" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 300 Q160 250 200 240" fill="none" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>
  <!-- brow shelves so the angry brows read -->
  <path d="M190 178 Q214 158 244 170 L240 186 Z" fill="#2c2c2c"/>
  <path d="M322 178 Q298 158 268 170 L272 186 Z" fill="#2c2c2c"/>
  <!-- angry brows -->
  <line x1="196" y1="168" x2="240" y2="184" stroke="#000" stroke-width="9" stroke-linecap="round"/>
  <line x1="316" y1="168" x2="272" y2="184" stroke="#000" stroke-width="9" stroke-linecap="round"/>
  <!-- front legs -->
  <path d="M222 380 L220 420" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round"/>
  <path d="M290 380 L292 420" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round"/>
  <!-- grumpy frown -->
  <path d="M236 246 Q256 230 276 246" fill="none" stroke="#ffd23f" stroke-width="5" stroke-linecap="round"/>
  <polygon points="250,226 262,226 256,234" fill="#e88a8a"/>
  <!-- eye glints -->
  <circle cx="213" cy="192" r="2.5" fill="#fff6c8"/>
  <circle cx="285" cy="192" r="2.5" fill="#fff6c8"/>
  <!-- whiskers -->
  <g stroke="#9a9a9a" stroke-width="2" stroke-linecap="round">
    <line x1="232" y1="236" x2="176" y2="226"/>
    <line x1="232" y1="244" x2="176" y2="248"/>
    <line x1="280" y1="236" x2="336" y2="226"/>
    <line x1="280" y1="244" x2="336" y2="248"/>
  </g>
  <!-- paw toes -->
  <path d="M190 426 L192 436 M200 428 L201 438 M218 428 L217 438" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M286 426 L287 436 M296 428 L297 438 M314 428 L313 438" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
