<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a0d42"/>
      <stop offset="50%" stop-color="#140626"/>
      <stop offset="100%" stop-color="#05010a"/>
    </radialGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde6"/>
      <stop offset="70%" stop-color="#ffe699"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </radialGradient>
    <radialGradient id="pumpkin" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="70%" stop-color="#e65c00"/>
      <stop offset="100%" stop-color="#992600"/>
    </radialGradient>
    <radialGradient id="magicOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80ffea" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00bfff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Stars & Sparkles -->
  <circle cx="70" cy="80" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="140" cy="40" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="260" cy="90" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="430" cy="100" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="470" cy="40" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="90" cy="170" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="200" cy="130" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Big Glowing Moon with Crater Details -->
  <circle cx="390" cy="120" r="75" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="365" cy="90" r="10" fill="#f2d985" opacity="0.6"/>
  <circle cx="420" cy="140" r="14" fill="#f2d985" opacity="0.5"/>
  <circle cx="390" cy="160" r="8" fill="#f2d985" opacity="0.4"/>

  <!-- Spooky Dead Tree Silhouette (Left) -->
  <path d="M 0 512 L 0 350 Q 30 330, 40 280 Q 20 250, 10 220 Q 40 240, 60 270 Q 70 230, 85 200 Q 60 190, 45 160 Q 75 180, 95 210 Q 110 170, 120 130 Q 100 200, 80 250 Q 60 300, 50 350 L 512 512 Z" fill="#0c0414"/>

  <!-- Distant Bats -->
  <path d="M 220 100 Q 228 92, 236 100 Q 230 104, 220 100 Z" fill="#1a0b2e"/>
  <path d="M 236 100 Q 244 92, 252 100 Q 242 104, 236 100 Z" fill="#1a0b2e"/>
  <path d="M 300 70 Q 306 63, 312 70 Q 308 74, 300 70 Z" fill="#1a0b2e"/>
  <path d="M 312 70 Q 318 63, 324 70 Q 316 74, 312 70 Z" fill="#1a0b2e"/>

  <!-- Ground / Rolling Hills -->
  <path d="M0 390 Q 150 360, 300 380 T 512 370 L 512 512 L 0 512 Z" fill="#180b24"/>
  <path d="M0 420 Q 200 400, 370 430 T 512 410 L 512 512 L 0 512 Z" fill="#0d0416"/>

  <!-- Party Bunting / Fairy Lights -->
  <path d="M 30 150 Q 256 250, 480 140" fill="none" stroke="#2c1b3d" stroke-width="2"/>
  <circle cx="90" cy="183" r="8" fill="#ff4d4d" filter="url(#glow)"/>
  <circle cx="170" cy="208" r="8" fill="#ffcc00" filter="url(#glow)"/>
  <circle cx="256" cy="215" r="8" fill="#33cc33" filter="url(#glow)"/>
  <circle cx="342" cy="204" r="8" fill="#3399ff" filter="url(#glow)"/>
  <circle cx="420" cy="172" r="8" fill="#ff33cc" filter="url(#glow)"/>

  <!-- Floating Magic Orbs (Party Atmosphere) -->
  <circle cx="150" cy="280" r="16" fill="url(#magicOrb)" filter="url(#glow)"/>
  <circle cx="370" cy="280" r="20" fill="url(#magicOrb)" filter="url(#glow)"/>
  <circle cx="270" cy="330" r="12" fill="url(#magicOrb)" filter="url(#glow)"/>

  <!-- Werewolf Character (Howling at Moon) -->
  <!-- Tail -->
  <path d="M 200 430 Q 140 420, 120 380 Q 145 400, 190 425 Z" fill="#3d384f"/>
  <!-- Body & Torso -->
  <path d="M 195 440 L 185 350 L 210 295 L 225 265 L 245 285 L 235 335 L 255 440 Z" fill="#3d384f"/>
  <!-- Ripped Flannel Party Shirt / Vest -->
  <path d="M 192 370 L 210 330 L 238 350 L 248 440 L 195 440 Z" fill="#b30000"/>
  <path d="M 210 330 L 225 365 L 240 340" fill="none" stroke="#ffcccc" stroke-width="2"/>
  <path d="M 205 380 L 220 395 L 235 385" fill="none" stroke="#ff9999" stroke-width="1.5"/>
  <!-- Head & Snout pointing up -->
  <path d="M 205 295 Q 185 275, 175 250 L 195 240 L 225 280 Z" fill="#3d384f"/>
  <!-- Ears -->
  <polygon points="175,250 160,225 185,235" fill="#3d384f"/>
  <polygon points="205,240 215,215 220,245" fill="#3d384f"/>
  <polygon points="172,246 165,232 178,238" fill="#ff9999"/>
  <!-- Glowing Eye -->
  <circle cx="193" cy="261" r="3.5" fill="#00ffcc" filter="url(#glow)"/>
  <!-- Sharp Fangs at mouth -->
  <path d="M 175 250 L 180 258 L 185 250" fill="#ffffff"/>
  <!-- Paws & Claws -->
  <path d="M 235 440 L 230 395 L 248 395 L 252 440 Z" fill="#2d293b"/>
  <path d="M 185 440 L 180 395 L 198 395 L 202 440 Z" fill="#2d293b"/>
  <!-- Raised Arm holding a glowing cocktail/party cup -->
  <path d="M 230 290 Q 260 270, 275 240 L 285 255 Q 265 280, 240 305 Z" fill="#3d384f"/>
  <polygon points="272,232 292,225 295,250 275,255" fill="#ff33cc" filter="url(#glow)"/>
  <path d="M 284 220 Q 284 205, 290 195" fill="none" stroke="#ffff33" stroke-width="2" filter="url(#glow)"/>

  <!-- Pumpkin 1 (Foreground Left with Party Hat) -->
  <g transform="translate(80, 395)">
    <ellipse cx="40" cy="40" rx="38" ry="32" fill="url(#pumpkin)"/>
    <ellipse cx="40" cy="40" rx="24" ry="32" fill="#ff8000"/>
    <ellipse cx="40" cy="40" rx="11" ry="32" fill="#ff6600"/>
    <rect x="37" y="4" width="6" height="10" fill="#2e5a17"/>
    <!-- Jack Face -->
    <polygon points="24,30 32,30 28,23" fill="#0a030d"/>
    <polygon points="48,30 56,30 52,23" fill="#0a030d"/>
    <polygon points="40,36 35,43 45,43" fill="#0a030d"/>
    <path d="M 26 48 Q 40 57, 54 48" stroke="#0a030d" stroke-width="3.5" fill="none"/>
  </g>
  <!-- Party Hat on Pumpkin 1 -->
  <polygon points="105,370 130,330 142,375" fill="#00ffcc" filter="url(#glow)"/>
  <circle cx="130" cy="330" r="5" fill="#ff33cc"/>
  <path d="M 105 370 Q 123 378, 142 375" fill="none" stroke="#ff33cc" stroke-width="2"/>

  <!-- Pumpkin 2 (Foreground Right - Super Glowing) -->
  <g transform="translate(310, 365)">
    <ellipse cx="55" cy="55" rx="48" ry="40" fill="url(#pumpkin)" filter="url(#glow)"/>
    <ellipse cx="55" cy="55" rx="30" ry="40" fill="#ff8000"/>
    <ellipse cx="55" cy="55" rx="14" ry="40" fill="#ff6600"/>
    <rect x="52" y="10" width="6" height="14" fill="#2e5a17"/>
    <!-- Wicked Grin Face -->
    <polygon points="35,40 44,40 39,31" fill="#ffff33" filter="url(#glow)"/>
    <polygon points="66,40 75,40 71,31" fill="#ffff33" filter="url(#glow)"/>
    <polygon points="55,47 49,56 61,56" fill="#ffff33" filter="url(#glow)"/>
    <path d="M 36 62 Q 55,75 74 62" stroke="#ffff33" stroke-width="4.5" fill="none" filter="url(#glow)"/>
  </g>

  <!-- Pumpkin 3 (Midground Center) -->
  <g transform="translate(230, 420)">
    <ellipse cx="32" cy="32" rx="28" ry="24" fill="url(#pumpkin)"/>
    <rect x="30" y="6" width="4" height="8" fill="#2e5a17"/>
    <polygon points="21,23 27,23 24,17" fill="#0a030d"/>
    <polygon points="37,23 43,23 40,17" fill="#0a030d"/>
    <path d="M 23 34 Q 32 40, 41 34" stroke="#0a030d" stroke-width="3" fill="none"/>
  </g>

  <!-- Streamers / Confetti -->
  <path d="M 180 200 Q 200 230, 190 260" fill="none" stroke="#ff33cc" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 330 180 Q 310 210, 325 250" fill="none" stroke="#00ffcc" stroke-width="2.5" stroke-dasharray="5,5"/>
  <path d="M 230 160 Q 250 190, 240 230" fill="none" stroke="#ffff33" stroke-width="2.5" stroke-dasharray="4,4"/>

</svg>