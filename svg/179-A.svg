<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#2d1b2d"/>
      <stop offset="60%" stop-color="#1a111b"/>
      <stop offset="100%" stop-color="#0f0910"/>
    </radialGradient>
    
    <!-- Hearth Glow -->
    <radialGradient id="fireGlow" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff3300" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a111b" stop-opacity="0"/>
    </radialGradient>

    <!-- Dragon Body Gradient -->
    <linearGradient id="dragonSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Dragon Belly Gradient -->
    <linearGradient id="dragonBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Countertop Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Pancake Gradient -->
    <linearGradient id="pancakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#fireGlow)"/>

  <!-- Background Kitchen Details / Shelves -->
  <g opacity="0.4">
    <rect x="60" y="80" width="160" height="12" rx="6" fill="#78350f"/>
    <rect x="290" y="80" width="160" height="12" rx="6" fill="#78350f"/>
    <!-- Jar 1 -->
    <path d="M 90 80 L 95 55 Q 100 50 105 55 L 110 80 Z" fill="#38bdf8" opacity="0.8"/>
    <rect x="92" y="53" width="16" height="4" rx="2" fill="#facc15"/>
    <!-- Jar 2 -->
    <path d="M 130 80 L 134 50 Q 140 45 146 50 L 150 80 Z" fill="#f43f5e" opacity="0.8"/>
    <rect x="132" y="48" width="16" height="4" rx="2" fill="#facc15"/>
    <!-- Extra Flour Sack on Shelf -->
    <path d="M 320 80 Q 325 50 340 50 Q 355 50 360 80 Z" fill="#f8fafc" opacity="0.8"/>
  </g>

  <!-- Wooden Countertop -->
  <rect x="0" y="380" width="512" height="132" fill="url(#counterGrad)" filter="url(#shadow)"/>
  <rect x="0" y="380" width="512" height="16" fill="#92400e"/>

  <!-- Hot Griddle on Counter -->
  <ellipse cx="256" cy="400" rx="140" ry="25" fill="#334155" filter="url(#shadow)"/>
  <ellipse cx="256" cy="398" rx="120" ry="18" fill="#1e293b"/>
  <ellipse cx="256" cy="396" rx="100" ry="12" fill="#ef4444" filter="url(#glow)" opacity="0.85"/>
  <ellipse cx="256" cy="396" rx="90" ry="9" fill="#f97316" opacity="0.95"/>
  <!-- Griddle steam -->
  <path d="M 220 380 Q 225 360 215 340" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 290 380 Q 285 360 295 340" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Stack of Pancakes on Plate -->
  <g transform="translate(100, 310)" filter="url(#shadow)">
    <!-- Plate -->
    <ellipse cx="60" cy="75" rx="70" ry="20" fill="#f8fafc"/>
    <ellipse cx="60" cy="72" rx="55" ry="14" fill="#e2e8f0"/>
    
    <!-- Pancake 1 (Bottom) -->
    <ellipse cx="60" cy="65" rx="50" ry="16" fill="url(#pancakeGrad)"/>
    <path d="M 15 65 Q 60 78 105 65 Q 60 82 15 65" fill="#a16207"/>
    
    <!-- Pancake 2 -->
    <ellipse cx="60" cy="50" rx="46" ry="15" fill="url(#pancakeGrad)"/>
    <path d="M 14 50 Q 60 62 106 50 Q 60 66 14 50" fill="#a16207"/>

    <!-- Pancake 3 (Top) -->
    <ellipse cx="60" cy="35" rx="42" ry="14" fill="url(#pancakeGrad)"/>
    <path d="M 18 35 Q 60 47 102 35 Q 60 51 18 35" fill="#a16207"/>

    <!-- Butter Pat & Syrup Drip -->
    <rect x="50" y="24" width="20" height="8" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M 56 32 Q 58 45 53 55 Q 52 58 55 58 Q 59 58 60 52 Q 63 42 64 32 Z" fill="#b45309" opacity="0.95"/>
    <path d="M 68 38 Q 75 48 72 56 Q 71 58 74 58 Q 77 57 76 52 Q 74 44 70 38 Z" fill="#b45309" opacity="0.9"/>
  </g>

  <!-- Dragon Character -->
  <g id="dragon" filter="url(#shadow)">
    <!-- Tail with Fire Spark -->
    <path d="M 380 400 Q 450 420 440 330 Q 435 290 410 310 Q 390 330 400 370" fill="url(#dragonSkin)"/>
    <circle cx="440" cy="320" r="16" fill="#f97316" filter="url(#glow)"/>
    <circle cx="440" cy="320" r="10" fill="#fef08a"/>

    <!-- Dragon Neck connecting Head to Torso -->
    <path d="M 285 230 Q 310 250 335 230 L 350 290 L 270 290 Z" fill="url(#dragonSkin)"/>

    <!-- Dragon Body / Torso -->
    <path d="M 270 280 Q 240 340 270 410 L 360 410 Q 390 350 360 280 Z" fill="url(#dragonSkin)"/>
    <!-- Dragon Belly -->
    <path d="M 285 300 Q 265 350 285 395 L 345 395 Q 365 350 345 300 Z" fill="url(#dragonBelly)"/>
    <!-- Belly Ridges -->
    <path d="M 290 320 L 340 320 M 285 345 L 345 345 M 290 370 L 340 370" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Cute Small Wings -->
    <path d="M 340 290 Q 390 250 370 230 Q 350 240 330 270 Z" fill="#15803d" stroke="#166534" stroke-width="3"/>
    <path d="M 280 290 Q 230 250 250 230 Q 270 240 290 270 Z" fill="#15803d" stroke="#166534" stroke-width="3"/>

    <!-- Dragon Head -->
    <g transform="translate(310, 185)">
      <!-- Head Base -->
      <ellipse cx="0" cy="0" rx="55" ry="48" fill="url(#dragonSkin)"/>
      
      <!-- Snout -->
      <path d="M -20 10 Q 0 25 35 15 Q 45 10 35 -5 Q 0 5 -20 -5 Z" fill="url(#dragonSkin)"/>
      <!-- Nostrils / Smoke -->
      <circle cx="28" cy="5" r="4" fill="#14532d"/>
      <path d="M 32 5 Q 45 2 52 -8 Q 42 -12 35 -2 Z" fill="#cbd5e1" opacity="0.6"/>

      <!-- Chef Hat -->
      <g transform="translate(0, -65)">
        <path d="M -30 25 Q -40 10 -25 -5 Q -35 -25 -10 -30 Q 0 -40 15 -30 Q 35 -25 25 -5 Q 40 10 30 25 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
        <rect x="-32" y="22" width="64" height="12" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
        <!-- Red Chef Band -->
        <rect x="-32" y="26" width="64" height="4" fill="#ef4444"/>
      </g>

      <!-- Horns -->
      <path d="M -35 -30 Q -55 -55 -40 -65 Q -30 -45 -20 -35 Z" fill="#fde047"/>
      <path d="M 25 -30 Q 45 -55 30 -65 Q 20 -45 10 -35 Z" fill="#fde047"/>

      <!-- Expressive Eyes (Asymmetric & Alive) -->
      <!-- Left Eye -->
      <ellipse cx="-18" cy="-5" rx="12" ry="14" fill="#ffffff" stroke="#14532d" stroke-width="3"/>
      <circle cx="-15" cy="-4" r="6" fill="#1e293b"/>
      <circle cx="-13" cy="-7" r="2.5" fill="#ffffff"/> <!-- Specular highlight -->
      <!-- Right Eye (Slightly larger, wink/happy expression) -->
      <ellipse cx="12" cy="-5" rx="13" ry="15" fill="#ffffff" stroke="#14532d" stroke-width="3"/>
      <circle cx="14" cy="-4" r="6.5" fill="#1e293b"/>
      <circle cx="16" cy="-7" r="2.5" fill="#ffffff"/> <!-- Specular highlight -->

      <!-- Playful Eyebrows -->
      <path d="M -32 -22 Q -18 -28 -5 -18" stroke="#14532d" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 0 -22 Q 15 -28 28 -20" stroke="#14532d" stroke-width="4" stroke-linecap="round" fill="none"/>

      <!-- Cheerful Smile -->
      <path d="M -10 12 Q 10 28 25 12" stroke="#14532d" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- Rosy Cheeks -->
      <ellipse cx="-25" cy="8" r="7" fill="#f43f5e" opacity="0.4"/>
      <ellipse cx="20" cy="8" r="7" fill="#f43f5e" opacity="0.4"/>
    </g>

    <!-- Arms & Spatula Flipping Pancake -->
    <!-- Left Arm holding Spatula -->
    <path d="M 270 300 Q 200 280 180 230" fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round"/>
    <g transform="translate(160, 210) rotate(-25)">
      <!-- Spatula Handle -->
      <rect x="-8" y="0" width="16" height="70" rx="8" fill="#b45309"/>
      <!-- Spatula Blade -->
      <rect x="-20" y="-55" width="40" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <!-- Slots in blade -->
      <line x1="-10" y1="-40" x2="10" y2="-40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="-25" x2="10" y2="-25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Flying Pancake in Mid-Air -->
    <g transform="translate(200, 140) rotate(-15)" filter="url(#shadow)">
      <ellipse cx="0" cy="0" rx="35" ry="14" fill="url(#pancakeGrad)"/>
      <path d="M -35 0 Q 0 12 35 0 Q 0 16 -35 0" fill="#a16207"/>
      <!-- Motion Sparkles & Steam -->
      <circle cx="-45" cy="-20" r="5" fill="#fef08a" filter="url(#glow)"/>
      <circle cx="45" cy="-10" r="3" fill="#fef08a" filter="url(#glow)"/>
      <path d="M -10 -20 Q 0 -35 -15 -50" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M 10 -25 Q 20 -40 10 -55" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- Right Arm pointing happily -->
    <path d="M 360 300 Q 410 280 430 250" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round"/>
    <circle cx="435" cy="245" r="10" fill="#15803d"/>
  </g>

  <!-- Sparks and Magic Stars around kitchen -->
  <g fill="#fde047" opacity="0.9">
    <path d="M 120 160 L 123 170 L 133 173 L 123 176 L 120 186 L 117 176 L 107 173 L 117 170 Z"/>
    <path d="M 390 120 L 392 126 L 398 128 L 392 130 L 390 136 L 388 130 L 382 128 L 388 126 Z"/>
    <path d="M 230 70 L 232 75 L 237 77 L 232 79 L 230 84 L 228 79 L 223 77 L 228 75 Z"/>
  </g>
</svg>
