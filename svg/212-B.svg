<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f38"/>
      <stop offset="1" stop-color="#5a3580"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e4fd0"/>
      <stop offset="1" stop-color="#3a1f5c"/>
    </linearGradient>
  </defs>
  <!-- sky, moon glow, stars -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="390" cy="105" r="110" fill="url(#moon)"/>
  <circle cx="390" cy="105" r="46" fill="#fff3a6"/>
  <circle cx="378" cy="95" r="7" fill="#f2e394"/>
  <circle cx="402" cy="122" r="5" fill="#f2e394"/>
  <circle cx="90" cy="70" r="3" fill="#fff"/>
  <circle cx="150" cy="140" r="2.5" fill="#fff"/>
  <circle cx="60" cy="200" r="2" fill="#fff"/>
  <!-- floor with mid-ground and shadow -->
  <path d="M0 400 Q256 380 512 400 L512 512 L0 512 Z" fill="#33224d"/>
  <rect y="430" width="512" height="82" fill="#211733"/>
  <ellipse cx="270" cy="462" rx="200" ry="16" fill="#0d0819" opacity="0.7"/>
  <!-- vacuum canister -->
  <rect x="150" y="300" width="190" height="130" rx="50" fill="#e0523b"/>
  <rect x="150" y="300" width="190" height="30" rx="15" fill="#f0786a"/>
  <circle cx="210" cy="420" r="22" fill="#1d1d1d"/>
  <circle cx="210" cy="420" r="8" fill="#888"/>
  <circle cx="290" cy="420" r="22" fill="#1d1d1d"/>
  <circle cx="290" cy="420" r="8" fill="#888"/>
  <rect x="270" y="360" width="50" height="22" rx="8" fill="#ffd34d"/>
  <rect x="165" y="330" width="12" height="70" rx="6" fill="#ffb3a6" opacity="0.7"/>
  <circle cx="300" cy="220" r="2" fill="#fff"/>
  <circle cx="60" cy="300" r="2" fill="#fff"/>
  <circle cx="140" cy="60" r="2" fill="#fff"/>
  <circle cx="440" cy="250" r="2" fill="#fff"/>
  <!-- cape tail streaming back -->
  <path d="M212 330 Q150 300 140 340 Q175 325 205 345 Z" fill="#3a1f5c"/>
  <!-- hose curling up to the nozzle -->
  <path d="M160 340 Q60 350 80 240 Q100 150 170 120" fill="none" stroke="#2a2a2a" stroke-width="16" stroke-linecap="round"/>
  <path d="M170 120 L190 70" stroke="#999" stroke-width="12" stroke-linecap="round"/>
  <!-- witch cape and body -->
  <path d="M210 330 Q180 230 230 170 L310 170 Q345 230 320 330 Z" fill="url(#cape)"/>
  <path d="M250 180 Q300 240 330 330 L340 300 Q310 220 280 175 Z" fill="#b57be6" opacity="0.6"/>
  <!-- arms: one gripping the handle -->
  <path d="M235 230 Q200 250 185 290" fill="none" stroke="#9be38a" stroke-width="14" stroke-linecap="round"/>
  <path d="M290 230 Q310 260 300 300" fill="none" stroke="#9be38a" stroke-width="14" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="265" cy="160" r="40" fill="#9be38a"/>
  <!-- hair -->
  <path d="M228 150 Q225 185 240 195" fill="none" stroke="#e8e0ff" stroke-width="6" stroke-linecap="round"/>
  <!-- hat -->
  <path d="M212 150 Q265 142 318 150 L312 140 Q265 132 220 140 Z" fill="#1a1030"/>
  <path d="M226 148 L255 36 L300 148 Z" fill="#1a1030"/>
  <rect x="226" y="134" width="74" height="12" fill="#e0523b"/>
  <!-- big eyes with glints -->
  <circle cx="250" cy="158" r="10" fill="#fff"/>
  <circle cx="282" cy="158" r="10" fill="#fff"/>
  <circle cx="252" cy="160" r="5" fill="#111"/>
  <circle cx="284" cy="160" r="5" fill="#111"/>
  <circle cx="254" cy="158" r="1.8" fill="#fff"/>
  <circle cx="286" cy="158" r="1.8" fill="#fff"/>
  <!-- brows -->
  <path d="M240 142 L260 147" stroke="#1a1030" stroke-width="4" stroke-linecap="round"/>
  <path d="M272 147 L292 142" stroke="#1a1030" stroke-width="4" stroke-linecap="round"/>
  <!-- grin with teeth -->
  <path d="M244 180 Q266 205 290 180 Z" fill="#3a0f2a"/>
  <path d="M250 182 L282 182 L280 188 L252 188 Z" fill="#fff"/>
  <!-- nose -->
  <path d="M266 170 L262 178 L270 178" fill="none" stroke="#4f8a45" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
