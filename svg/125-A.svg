<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ghostGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="70%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#f0f8ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0e2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="maizeDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a5c2a"/>
      <stop offset="100%" stop-color="#1a3d1a"/>
    </linearGradient>
    <linearGradient id="maizeLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a9c6a"/>
      <stop offset="100%" stop-color="#4a7d4a"/>
    </linearGradient>
    <pattern id="stalkPattern" patternUnits="userSpaceOnUse" width="16" height="16">
      <path d="M 4 0 L 4 16 M 8 0 L 8 16 M 12 0 L 12 16" stroke="#1a3d1a" stroke-width="1.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#moonGlow)"/>
  <rect width="512" height="512" fill="#0a0e2a"/>
  <!-- Maze: concentric rings of maize stalks -->
  <g fill="url(#maizeDark)">
    <!-- Ring 1 (outermost) -->
    <path d="M 64 64 L 448 64 L 448 128 L 64 128 Z" opacity="0.8" fill="url(#stalkPattern)"/>
    <path d="M 64 384 L 448 384 L 448 448 L 64 448 Z" opacity="0.8" fill="url(#stalkPattern)"/>
    <path d="M 64 128 L 128 128 L 128 384 L 64 384 Z" opacity="0.8" fill="url(#stalkPattern)"/>
    <path d="M 384 128 L 448 128 L 448 384 L 384 384 Z" opacity="0.8" fill="url(#stalkPattern)"/>
    <!-- Ring 2 -->
    <path d="M 96 96 L 416 96 L 416 160 L 96 160 Z" opacity="0.9" fill="url(#stalkPattern)"/>
    <path d="M 96 352 L 416 352 L 416 416 L 96 416 Z" opacity="0.9" fill="url(#stalkPattern)"/>
    <path d="M 96 160 L 160 160 L 160 352 L 96 352 Z" opacity="0.9" fill="url(#stalkPattern)"/>
    <path d="M 352 160 L 416 160 L 416 352 L 352 352 Z" opacity="0.9" fill="url(#stalkPattern)"/>
    <!-- Ring 3 -->
    <path d="M 128 128 L 384 128 L 384 192 L 128 192 Z" opacity="1" fill="url(#stalkPattern)"/>
    <path d="M 128 320 L 384 320 L 384 384 L 128 384 Z" opacity="1" fill="url(#stalkPattern)"/>
    <path d="M 128 192 L 192 192 L 192 320 L 128 320 Z" opacity="1" fill="url(#stalkPattern)"/>
    <path d="M 320 192 L 384 192 L 384 320 L 320 320 Z" opacity="1" fill="url(#stalkPattern)"/>
    <!-- Ring 4 (innermost) -->
    <path d="M 160 160 L 352 160 L 352 224 L 160 224 Z" opacity="0.9" fill="url(#stalkPattern)"/>
    <path d="M 160 288 L 352 288 L 352 352 L 160 352 Z" opacity="0.9" fill="url(#stalkPattern)"/>
    <path d="M 160 224 L 224 224 L 224 288 L 160 288 Z" opacity="0.9" fill="url(#stalkPattern)"/>
    <path d="M 288 224 L 352 224 L 352 288 L 288 288 Z" opacity="0.9" fill="url(#stalkPattern)"/>
  </g>
  <!-- Ghost: semi-transparent white, soft edges -->
  <circle cx="256" cy="256" r="52" fill="url(#ghostGlow)" stroke="white" stroke-opacity="0.2" stroke-width="2.5"/>
  <!-- Ghost face hint: eyes/mouth as subtle indentations -->
  <circle cx="240" cy="248" r="4" fill="#0a0e2a" fill-opacity="0.45"/>
  <circle cx="272" cy="248" r="4" fill="#0a0e2a" fill-opacity="0.45"/>
  <path d="M 248 272 Q 256 280 264 272" fill="none" stroke="#0a0e2a" stroke-opacity="0.45" stroke-width="2"/>
</svg>