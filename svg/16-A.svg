<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <radialGradient id="halo"><stop offset="0" stop-color="#fff5b8" stop-opacity=".9"/><stop offset="1" stop-color="#fff5b8" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- cozy glowing interview studio -->
  <rect width="512" height="512" fill="#101936"/>
  <path d="M0 370 Q120 330 245 365 T512 350 V512 H0Z" fill="#182650" stroke="#5ee7ff" stroke-width="5"/>
  <circle cx="260" cy="175" r="150" fill="url(#halo)" filter="url(#soft)"/>
  <path d="M55 76 Q256 18 457 76" fill="none" stroke="#ffc857" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="95" cy="91" r="9" fill="#fff8bd" filter="url(#glow)"/><circle cx="150" cy="68" r="7" fill="#70f5ff" filter="url(#glow)"/>
  <circle cx="362" cy="68" r="8" fill="#fff8bd" filter="url(#glow)"/><circle cx="420" cy="99" r="6" fill="#70f5ff" filter="url(#glow)"/>
  <!-- interviewer chair -->
  <path d="M389 225 Q438 220 452 255 L447 362 L382 362 L375 257 Q377 232 389 225Z" fill="#d96b58" stroke="#081126" stroke-width="8"/>
  <path d="M389 359 L376 447 M438 359 L454 447" stroke="#ffc857" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <!-- dinosaur silhouette -->
  <path d="M92 330 Q82 281 110 241 Q129 215 164 203 L157 164 Q152 133 174 109 Q192 91 214 112 L225 146 Q258 137 291 150 Q329 165 342 197 Q352 221 338 245 L316 264 Q292 283 273 321 L268 356 L138 356 Q103 354 92 330Z" fill="#52d6b5" stroke="#071227" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- dinosaur neck and friendly face -->
  <path d="M178 211 Q173 170 190 143" fill="none" stroke="#86ffe0" stroke-width="12" stroke-linecap="round"/>
  <circle cx="204" cy="151" r="10" fill="#fff7a8" stroke="#071227" stroke-width="5"/>
  <circle cx="207" cy="151" r="3" fill="#071227"/>
  <path d="M221 178 Q242 190 260 179" fill="none" stroke="#071227" stroke-width="6" stroke-linecap="round"/>
  <path d="M187 119 L176 91 M204 115 L207 86 M222 121 L235 95" stroke="#ffc857" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <!-- tie and hopeful applicant badge -->
  <path d="M245 219 L267 219 L275 297 L256 320 L237 297Z" fill="#ffc857" stroke="#071227" stroke-width="7"/>
  <rect x="270" y="232" width="64" height="39" rx="8" fill="#fff5c4" stroke="#071227" stroke-width="6" transform="rotate(-8 270 232)"/>
  <circle cx="286" cy="249" r="7" fill="#ff8f70"/>
  <!-- interview desk -->
  <path d="M54 300 Q205 282 378 304 L386 351 Q224 369 48 350Z" fill="#8a5cff" stroke="#071227" stroke-width="10"/>
  <path d="M73 351 L62 451 M361 350 L379 451" stroke="#70f5ff" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M108 318 Q170 303 224 316" fill="none" stroke="#ffc857" stroke-width="7" stroke-linecap="round"/>
  <!-- glowing mug and papers -->
  <path d="M105 282 L143 282 L139 307 Q123 316 108 307Z" fill="#fff5c4" stroke="#071227" stroke-width="6"/>
  <path d="M143 289 Q160 287 157 301 Q153 309 140 304" fill="none" stroke="#fff5c4" stroke-width="7"/>
  <path d="M285 295 L344 292 L347 320 L288 321Z" fill="#fff5c4" stroke="#071227" stroke-width="5" transform="rotate(5 285 295)"/>
  <path d="M298 303 L330 305 M296 311 L322 313" stroke="#ff8f70" stroke-width="4"/>
  <path d="M302 317 L319 318" stroke="#8a5cff" stroke-width="3"/>
  <text x="291" y="303" font-family="sans-serif" font-size="8" font-weight="bold" fill="#8a5cff">RESUME</text>
  <!-- warm interview prompt -->
  <path d="M366 121 Q366 105 382 105 L470 105 Q486 105 486 121 L486 154 Q486 170 470 170 L414 170 L395 190 L397 170 L382 170 Q366 170 366 154Z" fill="#fff5c4" stroke="#071227" stroke-width="7" filter="url(#glow)"/>
  <text x="382" y="137" font-family="sans-serif" font-size="17" font-weight="bold" fill="#8a5cff">TELL US!</text>
  <text x="378" y="158" font-family="sans-serif" font-size="11" fill="#ff8f70">about your dreams</text>
  <path d="M439 185 c-12-12-29 4 0 22 29-18 12-34 0-22Z" fill="#ff8f70" stroke="#071227" stroke-width="4" filter="url(#glow)"/>
  <!-- little stage stars, all glowing -->
  <g fill="#fff7a8" filter="url(#glow)"><path d="M39 178 l5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/><path d="M457 172 l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z"/><circle cx="68" cy="226" r="5"/><circle cx="447" cy="235" r="5"/></g>
</svg>
