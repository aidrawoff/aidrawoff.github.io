<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Studio background -->
  <rect width="512" height="380" fill="#1a1a2e"/>
  
  <!-- Backdrop screen -->
  <rect x="40" y="40" width="432" height="180" rx="8" fill="#16213e" stroke="#e94560" stroke-width="4"/>
  <text x="256" y="110" font-family="Arial Black, sans-serif" font-size="36" fill="#e94560" text-anchor="middle">DINO NEWS</text>
  <line x1="80" y1="130" x2="432" y2="130" stroke="#e94560" stroke-width="3"/>
  <circle cx="100" cy="160" r="24" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <ellipse cx="100" cy="160" rx="12" ry="8" fill="#e94560"/>
  <circle cx="100" cy="160" r="4" fill="black"/>

  <!-- Floor -->
  <rect x="0" y="380" width="512" height="132" fill="#2d4059"/>
  <line x1="0" y1="380" x2="512" y2="380" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Desk shadow -->
  <ellipse cx="256" cy="445" rx="190" ry="20" fill="#1a1a2e" opacity="0.4"/>

  <!-- News desk -->
  <rect x="80" y="330" width="352" height="110" rx="10" fill="#8B4513"/>
  <rect x="90" y="340" width="332" height="25" rx="4" fill="#A0522D"/>
  <rect x="110" y="375" width="292" height="50" rx="4" fill="#6B3410"/>
  <!-- Desk front screen -->
  <rect x="130" y="385" width="252" height="30" rx="4" fill="#1C3A5F" stroke="#e94560" stroke-width="2"/>
  <text x="256" y="406" font-family="Arial, sans-serif" font-size="14" fill="#e94560" text-anchor="middle" font-weight="bold">LIVE</text>

  <!-- Dinosaur body shadow -->
  <ellipse cx="256" cy="325" rx="55" ry="15" fill="#1a1a2e" opacity="0.3"/>

  <!-- Dinosaur body (suit) -->
  <ellipse cx="256" cy="285" rx="65" ry="80" fill="#2E8B57"/>
  <!-- Suit jacket -->
  <rect x="200" y="245" width="112" height="90" rx="18" fill="#1C3A5F"/>
  <!-- Lapels -->
  <polygon points="256,250 280,300 256,315" fill="#0F2B4A"/>
  <polygon points="256,250 232,300 256,315" fill="#0F2B4A"/>
  <!-- White shirt area -->
  <polygon points="256,250 265,290 256,300 247,290" fill="white"/>

  <!-- Tie -->
  <polygon points="256,285 262,295 256,300 248,295" fill="#DC143C"/>
  <polygon points="256,298 272,345 256,358 240,345" fill="#DC143C"/>

  <!-- Arms -->
  <ellipse cx="175" cy="315" rx="20" ry="14" fill="#2E8B57"/>
  <ellipse cx="337" cy="315" rx="20" ry="14" fill="#2E8B57"/>

  <!-- Dinosaur head -->
  <ellipse cx="256" cy="165" rx="52" ry="48" fill="#2E8B57"/>
  <!-- Snout -->
  <ellipse cx="256" cy="190" rx="34" ry="24" fill="#3CB371"/>
  <!-- Nostrils -->
  <ellipse cx="245" cy="185" rx="4" ry="2.5" fill="#1B5E2D"/>
  <ellipse cx="267" cy="185" rx="4" ry="2.5" fill="#1B5E2D"/>

  <!-- Eyes -->
  <circle cx="236" cy="150" r="9" fill="white"/>
  <circle cx="276" cy="150" r="9" fill="white"/>
  <circle cx="236" cy="150" r="5" fill="black"/>
  <circle cx="276" cy="150" r="5" fill="black"/>
  <circle cx="238" cy="148" r="2" fill="white"/>
  <circle cx="278" cy="148" r="2" fill="white"/>
  <!-- Eyebrows -->
  <path d="M 225 138 Q 236 132 247 138" stroke="#1B5E2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 265 138 Q 276 132 287 138" stroke="#1B5E2D" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Mouth with teeth -->
  <path d="M 232 210 Q 256 225 280 210" stroke="black" stroke-width="2.5" fill="none"/>
  <polygon points="242,212 245,218 248,212" fill="white"/>
  <polygon points="252,213 256,219 260,213" fill="white"/>
  <polygon points="264,212 267,218 270,212" fill="white"/>

  <!-- Microphone -->
  <rect x="244" y="215" width="8" height="65" fill="#333" rx="2"/>
  <circle cx="248" cy="215" r="12" fill="#555"/>
  <circle cx="248" cy="215" r="7" fill="#777"/>
  <circle cx="248" cy="215" r="3" fill="#aaa"/>

  <!-- Sun with sunglasses -->
  <circle cx="430" cy="75" r="36" fill="#FFD700"/>
  <line x1="395" y1="38" x2="375" y2="18" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
  <line x1="465" y1="38" x2="485" y2="18" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
  <line x1="430" y1="18" x2="430" y2="0" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
  <line x1="395" y1="75" x2="365" y2="75" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
  <line x1="465" y1="75" x2="495" y2="75" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
  <line x1="405" y1="105" x2="395" y2="125" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
  <line x1="455" y1="105" x2="465" y2="125" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>

  <!-- Sunglasses on sun -->
  <rect x="405" y="65" width="20" height="14" rx="3" fill="black" opacity="0.85"/>
  <rect x="435" y="65" width="20" height="14" rx="3" fill="black" opacity="0.85"/>
  <line x1="425" y1="72" x2="435" y2="72" stroke="black" stroke-width="2.5"/>

  <!-- News ticker at bottom -->
  <rect x="0" y="480" width="512" height="32" fill="#B22222"/>
  <text x="256" y="502" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">BREAKING: DINO ANCHOR TAKES OVER</text>
</svg>