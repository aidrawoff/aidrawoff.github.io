<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: gradient sky to sea -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00aaff"/>
      <stop offset="1" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0066cc"/>
      <stop offset="1" stop-color="#003366"/>
    </linearGradient>
    <pattern id="sand" patternUnits="userSpaceOnUse" width="32" height="32">
      <rect width="32" height="32" fill="#f4e8c1"/>
      <path d="M 0 0 L 32 32 M 8 0 L 32 24 M 0 8 L 24 32" stroke="#d9c7a7" stroke-width="1.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Sky and sea -->
  <rect x="0" y="0" width="512" height="256" fill="url(#sky)"/>
  <rect x="0" y="256" width="512" height="256" fill="url(#sea)"/>

  <!-- Sand strip -->
  <rect x="0" y="420" width="512" height="92" fill="url(#sand)"/>

  <!-- Sea turtle: refined silhouette with motion -->
  <g transform="translate(320 360)">
    <!-- Body and shell with subtle texture -->
    <path d="M -60 -40 C -80 -60 -100 -80 -120 -60 C -140 -40 -160 -20 -160 0 C -160 20 -140 40 -120 60 C -100 80 -80 100 -60 120 C -40 140 -20 160 0 160 C 20 160 40 140 60 120 C 80 100 100 80 120 60 C 140 40 160 20 160 0 C 160 -20 140 -40 120 -60 C 100 -80 80 -60 60 -40 C 40 -20 20 0 0 0 C -20 0 -40 -20 -60 -40 Z" fill="#00dd00" stroke="#000" stroke-width="3"/>
    <!-- Shell scute details -->
    <path d="M -100 -20 L -80 -40 L -60 -20 L -80 0 Z" fill="#00aa00" opacity="0.4"/>
    <path d="M -60 -60 L -40 -80 L -20 -60 L -40 -40 Z" fill="#00aa00" opacity="0.4"/>
    <path d="M 0 -80 L 20 -100 L 40 -80 L 20 -60 Z" fill="#00aa00" opacity="0.4"/>
    <!-- Head and neck with eye -->
    <path d="M -60 -40 C -80 -60 -100 -80 -120 -60 C -140 -40 -160 -20 -160 0 C -160 20 -140 40 -120 60 C -100 80 -80 100 -60 120" fill="none" stroke="#000" stroke-width="3"/>
    <circle cx="-160" cy="0" r="10" fill="#000"/>
    <!-- Flippers with motion arcs -->
    <path d="M 0 0 L 40 -20 L 60 0 L 40 20 Z" fill="#00dd00" stroke="#000" stroke-width="3"/>
    <path d="M 0 0 L -40 -20 L -60 0 L -40 20 Z" fill="#00dd00" stroke="#000" stroke-width="3"/>
    <!-- Tail -->
    <path d="M 160 0 L 200 20 L 220 0 L 200 -20 Z" fill="#00dd00" stroke="#000" stroke-width="3"/>
    <!-- Motion lines behind flippers -->
    <path d="M 20 -10 L 80 -30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M -20 -10 L -80 -30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Cake: refined on the sand with sand interaction -->
  <g transform="translate(380 440)">
    <!-- Cake layers with subtle shading -->
    <rect x="-40" y="-40" width="80" height="20" fill="#ff66cc" stroke="#000" stroke-width="3"/>
    <rect x="-50" y="-20" width="100" height="20" fill="#ff99cc" stroke="#000" stroke-width="3"/>
    <rect x="-60" y="0" width="120" height="20" fill="#ff3399" stroke="#000" stroke-width="3"/>
    <!-- Frosting swirl with highlight -->
    <path d="M -30 -40 C -20 -50 0 -50 10 -40 C 20 -30 30 -30 40 -20 C 50 -10 50 0 40 10 C 30 20 10 20 -10 10 C -30 0 -40 -10 -30 -20 Z" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <path d="M -20 -35 C -15 -40 -5 -40 0 -35 C 5 -30 10 -30 15 -25" fill="#ffccff" opacity="0.7"/>
    <!-- Candle with flame glow -->
    <rect x="-4" y="-60" width="8" height="20" fill="#ffff00" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="-70" r="3" fill="#ff0000"/>
    <circle cx="0" cy="-70" r="6" fill="#ffaa00" opacity="0.4"/>
    <!-- Cake sits on sand: slight indent -->
    <ellipse cx="0" cy="0" rx="70" ry="15" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Bubbles with motion arcs -->
  <circle cx="100" cy="320" r="7" fill="#ffffff" opacity="0.8"/>
  <circle cx="130" cy="300" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="160" cy="280" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="190" cy="310" r="9" fill="#ffffff" opacity="0.8"/>
  <circle cx="220" cy="290" r="5" fill="#ffffff" opacity="0.8"/>
  <path d="M 110 310 L 150 290" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 140 290 L 180 270" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 170 270 L 210 250" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>  

  <!-- Sea surface texture -->
  <path d="M 0 256 Q 60 240 120 256 T 240 256 T 360 256 T 480 256 L 480 512 L 0 512 Z" fill="#0088cc" opacity="0.3"/>
</svg>
