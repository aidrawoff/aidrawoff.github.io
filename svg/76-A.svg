<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="256" cy="256" r="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#1a3a5a"/>
    </radialGradient>
    <linearGradient id="ghostBody" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="100%" stop-color="#a0e0ff"/>
    </linearGradient>
    <linearGradient id="referee" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingColor">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="50%" stop-color="#ffc107"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Ghost body (silhouette) -->
  <g opacity="0.8">
    <circle cx="256" cy="200" r="40" fill="url(#ghostBody)"/>
    <circle cx="256" cy="240" r="50" fill="url(#ghostBody)"/>
    <circle cx="256" cy="280" r="40" fill="url(#ghostBody)"/>
  </g>
  <g opacity="0.3">
    <circle cx="256" cy="200" r="20" fill="#fff"/>
    <circle cx="256" cy="240" r="25" fill="#fff"/>
    <circle cx="256" cy="280" r="20" fill="#fff"/>
  </g>

  <!-- Birthday party elements (minimal) -->
  <circle cx="256" cy="360" r="24" fill="#ffeb3b"/>
  <circle cx="280" cy="340" r="16" fill="#ff9800"/>
  <circle cx="232" cy="340" r="16" fill="#ff9800"/>

  <!-- Underwater referee silhouette -->
  <g transform="translate(220 160)">
    <!-- Hat -->
    <circle cx="32" cy="24" r="24" fill="#ff5722"/>
    <!-- Body -->
    <circle cx="32" cy="64" r="24" fill="url(#referee)"/>
    <!-- Whistle -->
    <circle cx="32" cy="64" r="4" fill="#333"/>
    <!-- Bubbles -->
    <circle cx="16" cy="48" r="4" fill="#fff" opacity="0.8"/>
    <circle cx="32" cy="32" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="40" cy="56" r="2" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Seaweed hints -->
  <path d="M120 400c0-60 20-100 60-100s60 40 60 100" stroke="#4caf50" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M380 420c0-60-20-100-60-100s-60 40-60 100" stroke="#4caf50" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>