<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#1a1a3a"/>
      <stop offset="100%" stop-color="#2a1a4a"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeeaa"/>
      <stop offset="100%" stop-color="#ffcc44"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8cc" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffcc44" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffcc44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bolt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ccffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ccffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Far city layer -->
  <rect x="10" y="340" width="30" height="100" fill="#0a0a18"/>
  <rect x="50" y="320" width="25" height="120" fill="#080816"/>
  <rect x="90" y="300" width="35" height="140" fill="#0a0a18"/>
  <rect x="140" y="280" width="28" height="160" fill="#080816"/>
  <rect x="180" y="310" width="40" height="130" fill="#0a0a18"/>
  <rect x="230" y="290" width="32" height="150" fill="#080816"/>
  <rect x="280" y="270" width="45" height="170" fill="#0a0a18"/>
  <rect x="340" y="300" width="30" height="140" fill="#080816"/>
  <rect x="390" y="320" width="38" height="120" fill="#0a0a18"/>
  <rect x="440" y="300" width="28" height="140" fill="#080816"/>
  <rect x="480" y="330" width="22" height="110" fill="#080816"/>

  <!-- Mid city silhouette -->
  <rect x="20" y="320" width="40" height="120" fill="#12122a"/>
  <rect x="70" y="280" width="50" height="160" fill="#0f0f24"/>
  <rect x="130" y="300" width="35" height="140" fill="#12122a"/>
  <rect x="180" y="260" width="45" height="180" fill="#0d0d1e"/>
  <rect x="240" y="290" width="55" height="150" fill="#101028"/>
  <rect x="310" y="270" width="40" height="170" fill="#0e0e22"/>
  <rect x="370" y="310" width="50" height="130" fill="#12122a"/>
  <rect x="440" y="285" width="45" height="155" fill="#0f0f24"/>

  <!-- City windows -->
  <rect x="25" y="330" width="6" height="8" fill="#ffeeaa" opacity="0.6"/>
  <rect x="40" y="350" width="6" height="8" fill="#ffeeaa" opacity="0.4"/>
  <rect x="80" y="300" width="8" height="10" fill="#ffcc44" opacity="0.5"/>
  <rect x="100" y="320" width="8" height="10" fill="#ffcc44" opacity="0.7"/>
  <rect x="190" y="280" width="7" height="9" fill="#ffeeaa" opacity="0.5"/>
  <rect x="210" y="310" width="7" height="9" fill="#ffeeaa" opacity="0.3"/>
  <rect x="250" y="310" width="8" height="10" fill="#ffcc44" opacity="0.6"/>
  <rect x="280" y="330" width="8" height="10" fill="#ffcc44" opacity="0.4"/>
  <rect x="320" y="290" width="6" height="8" fill="#ffeeaa" opacity="0.5"/>
  <rect x="340" y="320" width="6" height="8" fill="#ffeeaa" opacity="0.6"/>
  <rect x="380" y="330" width="8" height="10" fill="#ffcc44" opacity="0.4"/>
  <rect x="410" y="350" width="8" height="10" fill="#ffcc44" opacity="0.5"/>
  <rect x="450" y="300" width="7" height="9" fill="#ffeeaa" opacity="0.6"/>
  <rect x="470" y="330" width="7" height="9" fill="#ffeeaa" opacity="0.4"/>
  <rect x="30" y="340" width="5" height="6" fill="#ffcc44" opacity="0.3"/>
  <rect x="55" y="360" width="5" height="6" fill="#ffeeaa" opacity="0.2"/>
  <rect x="95" y="320" width="6" height="8" fill="#ffeeaa" opacity="0.25"/>
  <rect x="145" y="300" width="5" height="7" fill="#ffcc44" opacity="0.2"/>
  <rect x="235" y="310" width="6" height="8" fill="#ffeeaa" opacity="0.3"/>
  <rect x="290" y="290" width="7" height="9" fill="#ffcc44" opacity="0.25"/>
  <rect x="345" y="320" width="5" height="7" fill="#ffeeaa" opacity="0.2"/>
  <rect x="395" y="340" width="6" height="8" fill="#ffcc44" opacity="0.3"/>
  <rect x="445" y="320" width="5" height="7" fill="#ffeeaa" opacity="0.25"/>

  <!-- Tree trunk -->
  <rect x="236" y="200" width="40" height="220" rx="4" fill="#3a2518"/>
  <rect x="230" y="240" width="12" height="80" rx="3" fill="#2e1b10"/>
  <rect x="270" y="260" width="10" height="60" rx="3" fill="#2e1b10"/>

  <!-- Tree canopy behind house -->
  <ellipse cx="256" cy="180" rx="90" ry="50" fill="#1a3a1a"/>
  <ellipse cx="200" cy="200" rx="50" ry="35" fill="#142e14"/>
  <ellipse cx="310" cy="190" rx="55" ry="40" fill="#142e14"/>
  <ellipse cx="256" cy="150" rx="60" ry="30" fill="#0f240f"/>
  <ellipse cx="150" cy="210" rx="35" ry="25" fill="#0f240f"/>
  <ellipse cx="360" cy="205" rx="40" ry="28" fill="#0f240f"/>

  <!-- Treehouse platform -->
  <rect x="180" y="260" width="152" height="12" rx="2" fill="#5c3a1e"/>
  <rect x="180" y="272" width="152" height="4" fill="#3a2518"/>

  <!-- Treehouse body -->
  <rect x="200" y="190" width="112" height="70" rx="4" fill="#6b4226"/>
  <rect x="205" y="195" width="102" height="60" rx="2" fill="#7a4e2e"/>
  <polygon points="190,190 256,140 322,190" fill="#4a2e18"/>
  <polygon points="200,190 256,150 312,190" fill="#5c3a1e"/>

  <!-- Treehouse window -->
  <rect x="230" y="210" width="24" height="24" rx="2" fill="url(#window)"/>
  <rect x="234" y="214" width="16" height="16" rx="1" fill="#ffdd66"/>
  <line x1="242" y1="210" x2="242" y2="234" stroke="#4a2e18" stroke-width="2"/>
  <line x1="230" y1="222" x2="254" y2="222" stroke="#4a2e18" stroke-width="2"/>

  <!-- Door -->
  <rect x="270" y="215" width="22" height="45" rx="2" fill="#3a2518"/>
  <circle cx="286" cy="238" r="2" fill="#ffcc44"/>

  <!-- Warm light glow from window -->
  <circle cx="242" cy="222" r="40" fill="url(#light)"/>

  <!-- Rope ladder -->
  <line x1="210" y1="272" x2="210" y2="380" stroke="#8b5a2b" stroke-width="2"/>
  <line x1="225" y1="272" x2="225" y2="380" stroke="#8b5a2b" stroke-width="2"/>
  <line x1="210" y1="290" x2="225" y2="290" stroke="#6b4226" stroke-width="3"/>
  <line x1="210" y1="310" x2="225" y2="310" stroke="#6b4226" stroke-width="3"/>
  <line x1="210" y1="330" x2="225" y2="330" stroke="#6b4226" stroke-width="3"/>
  <line x1="210" y1="350" x2="225" y2="350" stroke="#6b4226" stroke-width="3"/>
  <line x1="210" y1="370" x2="225" y2="370" stroke="#6b4226" stroke-width="3"/>

  <!-- Lightning bolt -->
  <polygon points="380,60 360,120 390,120 350,200 400,130 370,130 410,60" fill="#ccffff" opacity="0.9"/>
  <polygon points="380,60 365,110 388,110 358,180 390,125 375,125 405,60" fill="#ffffff" opacity="0.95"/>

  <!-- Lightning glow -->
  <circle cx="380" cy="120" r="60" fill="url(#bolt)"/>

  <!-- Rain -->
  <line x1="50" y1="80" x2="30" y2="140" stroke="#88aacc" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="60" x2="100" y2="120" stroke="#88aacc" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="90" x2="180" y2="150" stroke="#88aacc" stroke-width="1" opacity="0.5"/>
  <line x1="280" y1="50" x2="260" y2="110" stroke="#88aacc" stroke-width="1" opacity="0.4"/>
  <line x1="360" y1="80" x2="340" y2="140" stroke="#88aacc" stroke-width="1" opacity="0.3"/>
  <line x1="440" y1="70" x2="420" y2="130" stroke="#88aacc" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="180" x2="60" y2="240" stroke="#88aacc" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="160" x2="140" y2="220" stroke="#88aacc" stroke-width="1" opacity="0.5"/>
  <line x1="320" y1="170" x2="300" y2="230" stroke="#88aacc" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="190" x2="380" y2="250" stroke="#88aacc" stroke-width="1" opacity="0.3"/>
  <line x1="480" y1="150" x2="460" y2="210" stroke="#88aacc" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="260" x2="10" y2="320" stroke="#88aacc" stroke-width="1" opacity="0.3"/>
  <line x1="110" y1="280" x2="90" y2="340" stroke="#88aacc" stroke-width="1" opacity="0.4"/>
  <line x1="250" y1="300" x2="230" y2="360" stroke="#88aacc" stroke-width="1" opacity="0.5"/>
  <line x1="370" y1="270" x2="350" y2="330" stroke="#88aacc" stroke-width="1" opacity="0.3"/>
  <line x1="460" y1="290" x2="440" y2="350" stroke="#88aacc" stroke-width="1" opacity="0.4"/>

  <!-- Foreground wet street reflection -->
  <rect x="0" y="420" width="512" height="92" fill="#0f0f1a"/>
  <rect x="0" y="420" width="512" height="4" fill="#1a1a2e"/>

  <!-- Reflection of window light on wet street -->
  <ellipse cx="242" cy="440" rx="30" ry="6" fill="#ffcc44" opacity="0.15"/>
  <ellipse cx="242" cy="455" rx="20" ry="4" fill="#ffcc44" opacity="0.1"/>

  <!-- Puddle ripples -->
  <ellipse cx="150" cy="460" rx="40" ry="8" fill="none" stroke="#223355" stroke-width="1" opacity="0.4"/>
  <ellipse cx="350" cy="470" rx="50" ry="10" fill="none" stroke="#223355" stroke-width="1" opacity="0.3"/>
  <ellipse cx="80" cy="480" rx="30" ry="6" fill="none" stroke="#223355" stroke-width="1" opacity="0.3"/>

  <!-- Foreground rain streaks -->
  <line x1="60" y1="350" x2="45" y2="420" stroke="#aabbdd" stroke-width="1.5" opacity="0.5"/>
  <line x1="180" y1="340" x2="165" y2="410" stroke="#aabbdd" stroke-width="1.5" opacity="0.6"/>
  <line x1="300" y1="360" x2="285" y2="430" stroke="#aabbdd" stroke-width="1.5" opacity="0.5"/>
  <line x1="420" y1="350" x2="405" y2="420" stroke="#aabbdd" stroke-width="1.5" opacity="0.6"/>
  <line x1="500" y1="380" x2="485" y2="450" stroke="#aabbdd" stroke-width="1.5" opacity="0.4"/>
</svg>