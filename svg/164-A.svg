<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a4a"/>
      <stop offset="0.6" stop-color="#c2573a"/>
      <stop offset="1" stop-color="#f29a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pump" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffb35a"/>
      <stop offset="0.6" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#d2540c"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="250" r="200" fill="url(#glow)"/>
