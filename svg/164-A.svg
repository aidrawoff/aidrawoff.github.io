  <path d="M256 166 Q256 262 256 352" fill="none" stroke="#b8430a" stroke-width="6" opacity="0.7"/>
  <path d="M300 170 Q306 262 300 348" fill="none" stroke="#b8430a" stroke-width="6" opacity="0.7"/>
