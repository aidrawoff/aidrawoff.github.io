  <path d="M170 232 Q180 190 228 172" fill="none" stroke="#ffe2a8" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <!-- stem -->
  <path d="M246 170 Q250 138 270 128 L276 144 Q262 156 260 172 Z" fill="#4f7a2a" stroke="#1d2e10" stroke-width="5"/>
