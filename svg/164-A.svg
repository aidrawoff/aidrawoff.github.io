  <circle cx="142" cy="380" r="4" fill="#0d0d12"/>
  <circle cx="370" cy="380" r="4" fill="#0d0d12"/>
  <ellipse cx="256" cy="346" rx="96" ry="8" fill="#1a0f1e" opacity="0.35"/>
