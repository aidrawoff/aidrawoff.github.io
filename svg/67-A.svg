<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="card"><rect x="26" y="16" width="460" height="480" rx="30"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#1b1a26"/>
  <g clip-path="url(#card)">
    <rect x="26" y="16" width="460" height="480" fill="#f7efdc"/>
    <rect x="26" y="16" width="460" height="480" fill="none" stroke="#c8a24a" stroke-width="10"/>
    <!-- inner frame -->
    <rect x="66" y="60" width="380" height="392" fill="#efe0bd" stroke="#8e2b2f" stroke-width="4"/>
    <!-- revolving door, centered in frame -->
    <g transform="translate(256,256)">
      <circle r="150" fill="#dfe7ee" stroke="#2c3a4a" stroke-width="6"/>
      <circle r="118" fill="#f7efdc" stroke="#2c3a4a" stroke-width="4"/>
      <g stroke="#2c3a4a" stroke-width="9" stroke-linecap="round">
        <line x1="-112" y1="0" x2="112" y2="0"/>
        <line x1="0" y1="-112" x2="0" y2="112"/>
      </g>
      <circle r="14" fill="#8e2b2f" stroke="#2c3a4a" stroke-width="4"/>
      <!-- motion arcs -->
      <g fill="none" stroke="#8e2b2f" stroke-width="6" stroke-linecap="round" opacity="0.85">
        <path d="M -96 -70 A 118 118 0 0 1 -30 -114"/>
        <path d="M 96 70 A 118 118 0 0 1 30 114"/>
        <path d="M -70 96 A 118 118 0 0 1 -114 30"/>
        <path d="M 70 -96 A 118 118 0 0 1 114 -30"/>
      </g>
      <!-- the stuck bunny, tumbling -->
      <g transform="translate(58,-56) rotate(30) scale(1.45)">
        <ellipse cx="0" cy="30" rx="25" ry="28" fill="#fdfaf3" stroke="#2c3a4a" stroke-width="4.5"/>
        <ellipse cx="-15" cy="48" rx="8" ry="11" fill="#fdfaf3" stroke="#2c3a4a" stroke-width="3.5"/>
        <ellipse cx="15" cy="48" rx="8" ry="11" fill="#fdfaf3" stroke="#2c3a4a" stroke-width="3.5"/>
        <ellipse cx="26" cy="26" rx="7" ry="9" fill="#fdfaf3" stroke="#2c3a4a" stroke-width="3.5"/>
        <circle cx="0" cy="-8" r="23" fill="#fdfaf3" stroke="#2c3a4a" stroke-width="4.5"/>
        <g stroke="#2c3a4a" stroke-width="4" fill="#fdfaf3">
          <ellipse cx="-12" cy="-44" rx="8" ry="23" transform="rotate(-18 -12 -44)"/>
          <ellipse cx="13" cy="-45" rx="8" ry="22" transform="rotate(26 13 -45)"/>
        </g>
        <ellipse cx="-12" cy="-44" rx="3.4" ry="13" fill="#e8a3a8" transform="rotate(-18 -12 -44)"/>
        <ellipse cx="13" cy="-45" rx="3.4" ry="12" fill="#e8a3a8" transform="rotate(26 13 -45)"/>
        <g fill="none" stroke="#2c3a4a" stroke-width="2.6">
          <circle cx="-8" cy="-12" r="5"/>
          <circle cx="8" cy="-12" r="5"/>
        </g>
        <circle cx="-8" cy="-11" r="2.2" fill="#2c3a4a"/>
        <circle cx="8" cy="-11" r="2.2" fill="#2c3a4a"/>
        <circle cx="0" cy="-2" r="2.8" fill="#e8788a"/>
        <path d="M -6 4 q 6 5 12 0" fill="none" stroke="#2c3a4a" stroke-width="2.2"/>
        <circle cx="-15" cy="-1" r="5" fill="#f2c1c6" opacity="0.85"/>
        <circle cx="15" cy="-1" r="5" fill="#f2c1c6" opacity="0.85"/>
      </g>
      <!-- dizzy stars orbiting the head -->
      <g fill="#d9a226" stroke="#2c3a4a" stroke-width="1.6">
        <path d="M 108 -128 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
        <path d="M 132 -84 l 4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
        <path d="M 62 -142 l 3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
      </g>
      <!-- suit pips in the frame corners -->
      <g fill="#8e2b2f">
        <path transform="translate(96,92) scale(1.0)" d="M0 12 C-12 0 -8 -10 0 -4 C8 -10 12 0 0 12 L0 18 L-4 18 L0 12 Z"/>
        <path transform="translate(416,92) scale(1.0)" d="M0 12 C-12 0 -8 -10 0 -4 C8 -10 12 0 0 12 L0 18 L-4 18 L0 12 Z"/>
        <path transform="translate(96,420) scale(-1,-1)" d="M0 12 C-12 0 -8 -10 0 -4 C8 -10 12 0 0 12 L0 18 L-4 18 L0 12 Z"/>
        <path transform="translate(416,420) scale(-1,-1)" d="M0 12 C-12 0 -8 -10 0 -4 C8 -10 12 0 0 12 L0 18 L-4 18 L0 12 Z"/>
      </g>
    </g>
    <!-- corner indices -->
    <g fill="#8e2b2f" font-family="Georgia,serif" font-weight="bold" text-anchor="middle">
      <text x="52" y="52" font-size="34">J</text>
      <text x="460" y="472" font-size="34">J</text>
    </g>
  </g>
</svg>
