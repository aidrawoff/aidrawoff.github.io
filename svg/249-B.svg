<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="30%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="superGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" fill="url(#spaceGrad)"/>
  
  <!-- Subtle geometric grid (recursion theme) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Star field -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="70" cy="100" r="1.5" />
    <circle cx="440" cy="70" r="2" />
    <circle cx="460" cy="280" r="1" />
    <circle cx="90" cy="380" r="1.5" />
    <circle cx="250" cy="40" r="2" />
    <circle cx="340" cy="460" r="1" />
    <circle cx="50" cy="230" r="1.2" />
    <circle cx="430" cy="420" r="1.8" />
  </g>

  <!-- Vertical Energy Beam -->
  <rect x="234" y="10" width="44" height="454" fill="url(#beamGrad)" filter="url(#glow)"/>

  <!-- Ground Platform -->
  <ellipse cx="256" cy="464" rx="190" ry="16" fill="#0f172a" opacity="0.9" filter="url(#glow)"/>
  <rect x="66" y="448" width="380" height="18" rx="9" fill="#1e293b" stroke="#475569" stroke-width="2" filter="url(#glow)"/>
  <rect x="86" y="453" width="340" height="6" rx="3" fill="#38bdf8" opacity="0.7"/>

  <!-- 15 Recursive Squares Stack (Every square paints a square above it) -->
  <g id="recursive-tower" filter="url(#superGlow)">
    <rect x="206" y="360" width="100" height="100" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="2.5" rx="6"/>
    <rect x="209" y="318" width="94" height="94" fill="rgba(79, 70, 229, 0.22)" stroke="#4f46e5" stroke-width="2.3" rx="5"/>
    <rect x="212" y="278" width="88" height="88" fill="rgba(99, 102, 241, 0.24)" stroke="#6366f1" stroke-width="2.2" rx="5"/>
    <rect x="215" y="241" width="82" height="82" fill="rgba(129, 140, 248, 0.26)" stroke="#818cf8" stroke-width="2.1" rx="4"/>
    <rect x="218" y="207" width="76" height="76" fill="rgba(168, 85, 247, 0.28)" stroke="#a855f7" stroke-width="2" rx="4"/>
    <rect x="221" y="176" width="70" height="70" fill="rgba(192, 132, 252, 0.3)" stroke="#c084fc" stroke-width="2" rx="4"/>
    <rect x="224" y="148" width="64" height="64" fill="rgba(217, 70, 239, 0.32)" stroke="#d946ef" stroke-width="1.8" rx="3"/>
    <rect x="227" y="123" width="58" height="58" fill="rgba(244, 114, 182, 0.35)" stroke="#f472b6" stroke-width="1.8" rx="3"/>
    <rect x="230" y="100" width="52" height="52" fill="rgba(251, 146, 60, 0.38)" stroke="#fb923c" stroke-width="1.6" rx="3"/>
    <rect x="233" y="80" width="46" height="46" fill="rgba(251, 191, 36, 0.42)" stroke="#fbbf24" stroke-width="1.5" rx="2"/>
    <rect x="235" y="62" width="42" height="42" fill="rgba(52, 211, 153, 0.46)" stroke="#34d399" stroke-width="1.5" rx="2"/>
    <rect x="237" y="46" width="38" height="38" fill="rgba(45, 212, 191, 0.5)" stroke="#2dd4bf" stroke-width="1.4" rx="2"/>
    <rect x="239" y="32" width="34" height="34" fill="rgba(34, 211, 238, 0.55)" stroke="#22d3ee" stroke-width="1.3" rx="2"/>
    <rect x="241" y="20" width="30" height="30" fill="rgba(56, 189, 248, 0.6)" stroke="#38bdf8" stroke-width="1.2" rx="2"/>
    <rect x="243" y="10" width="26" height="26" fill="rgba(255, 255, 255, 0.7)" stroke="#ffffff" stroke-width="1.2" rx="2"/>
  </g>
  
  <!-- Central Sparklets -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="256" cy="400" r="2"/>
    <circle cx="256" cy="300" r="1.8"/>
    <circle cx="256" cy="200" r="1.6"/>
    <circle cx="256" cy="100" r="1.4"/>
    <circle cx="256" cy="30" r="1.2"/>
  </g>
</svg>
